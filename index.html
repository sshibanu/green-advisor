温床になるため、清潔・無肥料が原則。"},{"type":"mc","q":"梅雨ざしで主に使う挿し穂はどれか。","choices":["前年に伸びて充実した枝（熟枝）","その年伸びて少し固まった新梢（緑枝）","掘り上げた根を切ったもの"],"a":1,"why":"梅雨ざしは当年枝を使う緑枝ざし。高温多湿で発根条件がそろい、最も成功しやすい時期である。"},{"type":"mc","q":"斑入りのサンセベリアを、斑入りのままふやす方法はどれか。","choices":["葉ざし","根ざし","株分け"],"a":2,"why":"斑入りサンセベリアは葉ざしすると斑のない緑葉に戻ってしまう。斑を残すには株分けを選ぶ。"},{"type":"mc","q":"接ぎ木の成功に最も重要な条件はどれか。","choices":["台木と穂木の髄を合わせること","台木と穂木の形成層を合わせること","台木と穂木の太さを完全に一致させること"],"a":1,"why":"形成層どうしが接するとカルスを出して癒合し活着する。太さが違うときは中心ではなく片側の形成層をそろえる。"},{"type":"mc","q":"芽接ぎの一般的な適期はどれか。","choices":["1〜2月の厳寒期","3月の芽が動き出すころ","8〜9月"],"a":2,"why":"芽接ぎは8〜9月に行う。3月ごろが適期なのは切り接ぎである。"},{"type":"mc","q":"取り木の環状剥皮で、削り取らずに残すのはどの部分か。","choices":["木部（材）","樹皮（師部）","形成層"],"a":0,"why":"水を運ぶ道管は木部にある。木部を残すから枝は枯れず、師部を断つことで同化産物が上に溜まる。"},{"type":"mc","q":"取り木で剥皮部の上から根が出るのはなぜか。","choices":["水が上がらなくなり、乾燥を感じた枝が根を出そうとするから","葉でつくられた同化産物とオーキシンが剥皮部の上に溜まるから","樹皮を剥がれた刺激で葉が落ち、蒸散が止まるから"],"a":1,"why":"師部が断たれると下降する糖とオーキシンが剥皮部の上端で行き止まりになり、そこで発根が起こる。"},{"type":"mc","q":"宿根草を株分けするとき、一株に残す芽の数の目安はどれか。","choices":["3芽以上","1芽ずつ","芽の数は気にしなくてよい"],"a":0,"why":"3芽以上が目安。細かく割りすぎると回復に時間がかかり、その年は開花しない。"},{"type":"mc","q":"むかご（珠芽）でふえる代表的な植物はどれか。","choices":["オニユリ","チューリップ","グラジオラス"],"a":0,"why":"むかごは葉のつけ根などにできる小球で、オニユリやヤマノイモが代表。チューリップは分球、グラジオラスは木子。"},{"type":"mc","q":"ユリの鱗茎をばらして小球をつくる繁殖法はどれか。","choices":["木子ざし","鱗片ざし","葉芽ざし"],"a":1,"why":"鱗片ざし（りん片繁殖）。鱗片を挿すとその基部に小球ができ、数年育てて開花球にする。"},{"type":"mc","q":"交配における「除雄」とは何か。","choices":["交配後に袋をかけて他の花粉を防ぐ作業","母本にする花のおしべを開花前に取り除く作業","雄株を畑から抜き取る作業"],"a":1,"why":"除雄は自家受粉を防ぐため、つぼみのうちにおしべを取り除く作業。袋かけはその後の混入防止である。"},{"type":"mc","q":"人工授粉に最も適した条件はどれか。","choices":["曇りの日の夜間","雨上がりの湿度が高い夕方","よく晴れた日の午前中"],"a":2,"why":"晴れた日の午前中は葯がよく裂けて花粉の活力が高い。雨や高湿度では花粉が流れたり発芽しなかったりする。"},{"type":"mc","q":"雌雄異株で、実をならせるには雄株が必要な植物はどれか。","choices":["キュウリ","トウモロコシ","キウイフルーツ"],"a":2,"why":"キウイフルーツは雌雄異株。キュウリとトウモロコシは一株に雄花と雌花が付く雌雄異花（同株）である。"},{"type":"mc","q":"F1（一代雑種）の説明として正しいものはどれか。","choices":["雑種強勢で生育がそろうが、採種した種子では形質が分離する","何代でも同じ形質が受け継がれる、性質の固定した品種のこと","組織培養でつくられたウイルスフリー苗のこと"],"a":0,"why":"F1は異なる系統を掛け合わせた雑種第一代。そろいのよさは一代限りで、次代では形質が分離する。"},{"type":"mc","q":"茎頂培養（メリクロン）の主な利点はどれか。","choices":["実生より遺伝的な変異が出やすく、新品種が生まれやすい","ウイルスフリーの苗を、同一個体から大量に得られる","接ぎ木の活着率が高まり、台木が不要になる"],"a":1,"why":"生長点付近はウイルスが入り込みにくい。そこを無菌培養することでウイルスフリー苗を大量増殖でき、洋ランで普及した。"},{"type":"mc","q":"種苗法の登録品種の自家増殖について正しいものはどれか。","choices":["種子でまくときだけ許諾が必要で、挿し木や株分けは自由である","家庭で楽しむ範囲であれば、許諾なしに自由に増殖できる","育成者権者の許諾が必要で、無断の挿し木・株分け・採種はできない"],"a":2,"why":"2020年の種苗法改正で自家増殖は許諾制になった。増殖方法を問わず、登録品種は権利者の許諾が必要である。"}]},{"id":9,"title":"土を読む","subtitle":"用土の性質を読み、植物に合う土を配合できる","minutes":50,"goals":["三相・団粒構造・物理性／化学性／生物性から「よい土」を自分の言葉で説明できる","pH・CEC・ECの意味を理解し、石灰や改良材で土を狙った状態に調整できる","基本用土と改良用土の性質を覚え、植物に合わせて培養土を配合・選択し、古い土も再生できる"],"sections":[{"heading":"土の三相 ― 根は呼吸している","dialogue":[{"who":"客","text":"水は毎日ちゃんとあげているんです。それなのに鉢のゼラニウムが下葉から黄色くなって、しおれてきて。"},{"who":"ハナ","text":"毎日……あの、土はいま濡れていますか。"},{"who":"客","text":"濡れています。だからよけいに不思議で。"},{"who":"緑川","text":"濡れているのにしおれる。それが答えです。足りないのは水ではなく空気。根は光合成をしません。呼吸だけをしている器官です。"}],"body":"<p>土は三つの相からできています。<strong>固相</strong>（土の粒と有機物）、<strong>液相</strong>（水）、<strong>気相</strong>（空気）。畑の作土で理想とされるのは体積比でおよそ<strong>固相40％・液相30％・気相30％</strong>です。つまり土の約半分は「すきま」で、そのすきまを水と空気がほぼ半分ずつ分け合っている状態が良い土だということになります。</p><p>なぜ空気の部屋が要るのか。<strong>根は光合成をせず、呼吸だけをしている器官</strong>だからです。根は土のすきまから酸素を取り込み、二酸化炭素を出し、そこで得たエネルギーを使って水と養分を吸い上げます。水やりすぎや踏み固めで気相が水や粒で埋まると、根はまず酸欠になり、<em>吸水という仕事そのものが止まります</em>。「土は濡れているのにしおれる」という矛盾したサインはここから生まれます。根腐れの正体は水のやりすぎというより、空気の与えなさすぎです。</p><h4>土は三つの目で見る</h4><p>この章では土を三つの性質で読みます。<strong>物理性</strong>（通気性・排水性・保水性＝三相のバランス）、<strong>化学性</strong>（pH・保肥力＝CEC・EC）、<strong>生物性</strong>（微生物や土壌動物の多様さ）。優先順位は物理性が第一です。空気が通らない土では、肥料も微生物も仕事ができません。</p>","why":"根は呼吸しかしていないので、気相（土のすきまの空気）が失われた瞬間に吸水も養分吸収も止まるから。","keypoints":["土の三相は固相（粒）・液相（水）・気相（空気）。作土の理想はおよそ固相40％・液相30％・気相30％","根は光合成をせず呼吸のみ。酸素がないと吸水も養分吸収も止まる","「土は濡れているのにしおれる」は根の酸欠のサイン。水を足すと悪化する","土を見る3つの目は物理性（通気・排水・保水）／化学性（pH・CEC・EC）／生物性（微生物相）","優先順位は物理性が第一。空気が通らない土では肥料も微生物も働かない","踏圧・過湿・粒の崩れはいずれも気相を減らす方向に働く"],"table":{"caption":"三相のバランスと根に起きること","headers":["土の状態","固相","液相","気相","根に起きること","現場に出るサイン"],"rows":[["理想の作土","約40％","約30％","約30％","呼吸と吸水が両立し、根が伸びる","水を与えるとすっと吸い込み、翌日には表面が乾く"],["過湿・締まった土","多い","多い","ほぼゼロ","酸欠で根が窒息、やがて腐敗菌が入る","土が濡れたままなのに葉がしおれる、いやなにおい"],["乾きすぎ・粗すぎ","少ない","少ない","多い","水切れで細根が枯れ、肥料も届かない","水がすぐ抜ける、葉先が枯れ込む"],["古い鉢土（粒が崩れた）","多い","多い","少ない","微塵が目詰まりして酸欠と根詰まりが同時に進む","水がなかなかしみ込まず表面にたまる"]]},"mnemonic":"「固4・液3・気3」。土の半分はすきま、そのすきまの半分は空気の部屋。"},{"heading":"単粒と団粒 ― 水はけと水もちの両立","dialogue":[{"who":"ハナ","text":"お客さまによく『腐葉土を混ぜるといいですよ』と言うんですが、なぜいいのかと聞かれると答えに詰まります。ふかふかになる、では説明になっていませんよね。"},{"who":"緑川","text":"ふかふかの正体には名前があります。団粒構造です。小さな粒が集まって、数ミリの塊になっている状態。"},{"who":"ハナ","text":"塊になると、何がいいんですか。水はけがよくなるだけなら、砂を混ぜても同じでは。"},{"who":"緑川","text":"砂は水はけだけ。団粒は水はけと水もちの両方が手に入ります。塊の中と外で、すきまの大きさが違うからです。"}],"body":"<p><strong>単粒構造</strong>は、土の粒が一つずつばらばらに積み重なった状態です。粘土質なら細かい粒がぎっしり詰まって水も空気も通らず、砂質なら大きなすきまばかりで水も肥料も素通りしてしまう。どちらに転んでも欠点が出ます。</p><p><strong>団粒構造</strong>は、粒子が寄り集まって数ミリの小さな塊になり、その塊が積み重なった二階建ての構造です。<strong>塊の内部の細かいすきまが水を毛管力で抱え込み（水もち）、塊と塊の間の大きなすきまが余分な水を落として空気を入れる（水はけ・通気）</strong>。すきまに大小二種類あることが、本来は両立しにくい二つの性質を同時に成り立たせています。</p><h4>団粒は生き物がつくる</h4><p>団粒は勝手にはできません。腐葉土や堆肥などの<strong>有機物</strong>を微生物が分解する過程で生じる<strong>腐植</strong>や、微生物が出す粘着性の物質、菌糸、根、ミミズなどの土壌動物が粒子を接着してつくります。逆に踏圧、耕しすぎ、雨滴の打撃、有機物を入れずに化学肥料だけを続けることは団粒を壊します。</p><p>だから土の表面を守る<strong>マルチング</strong>が効きます。裸の地面は雨粒に叩かれて表面の団粒が壊れ、目の詰まった皮膜になって水がしみ込まなくなる。バークチップ・わら・腐葉土などの<em>有機マルチ</em>、砂利やフィルムなどの<em>無機マルチ</em>で覆えば、蒸発の抑制、地温の変動の緩和、泥はねによる病気の防止、雑草の抑制が同時に得られます。</p>","why":"団粒は塊の内側に小さなすきま、塊の外側に大きなすきまをつくるので、水を保つ場所と水を捨てる場所が土の中に同居するから。","keypoints":["単粒構造＝粒がばらばら。粘土質なら通気・排水不良、砂質なら保水・保肥不良になる","団粒構造＝粒子が集まった小さな塊。内部の細かいすきまで保水、塊の間の大きなすきまで排水と通気","団粒をつくるのは有機物・微生物・腐植・根・土壌動物。化学肥料だけでは団粒はできない","団粒を壊すのは踏圧、耕しすぎ、雨滴の打撃、有機物の不足","マルチングの効果は蒸発抑制・地温の緩和・泥はね（病気）防止・雑草抑制・表土の保護","有機マルチ（バークチップ、わら、腐葉土）は分解して団粒の材料になる。無機マルチ（砂利、フィルム）は分解せず長持ちする"],"table":{"caption":"単粒構造と団粒構造の比較","headers":["項目","単粒構造","団粒構造"],"rows":[["すきまの大きさ","ほぼ一種類（大きいか小さいかのどちらか）","大小二種類が同居する"],["水もち","砂質では乏しい","塊の内部に水を保持できる"],["水はけ・通気","粘質では極端に悪い","塊の間から水が抜け空気が入る"],["保肥力","低くなりやすい","腐植を含むため高くなりやすい"],["根の張り","浅く、太い根しか伸びない","細根が塊の間に深く広がる"],["つくり方・壊れ方","耕しすぎ・踏圧・有機物不足で戻る","有機物と微生物で育ち、マルチで守る"]]},"mnemonic":"団粒は二階建て。中の小さなすきまで水を持ち、外の大きなすきまで水を捨てる。"},{"heading":"土性 ― 砂・シルト・粘土の配合比","dialogue":[{"who":"客","text":"新築の庭に花壇をつくったんですが、雨が降ると水たまりが二日消えません。土が悪いんでしょうか。"},{"who":"緑川","text":"少し湿らせて、手のひらで握ってみてください。棒状に伸ばせますか。"},{"who":"客","text":"伸びます。ひも状にくるっと。"},{"who":"緑川","text":"それは粘土がかなり多い土です。悪い土ではありませんが、そのままでは根が息をできません。足すものは砂ではなく、まず堆肥です。"}],"body":"<p>土をつくる鉱物の粒は、大きさで名前が変わります。<strong>礫は2mm以上、砂は0.02〜2mm、シルトは0.002〜0.02mm、粘土は0.002mm未満</strong>。この砂・シルト・粘土の混ざり具合を<strong>土性</strong>といい、粘土の割合が少ない順に<strong>砂土・砂壌土・壌土・埴壌土・埴土</strong>の5つに区分します。園芸で扱いやすいのは中間の<strong>壌土から砂壌土</strong>です。</p><p>粒が小さいほど表面積が大きく、水も養分も引きつける力が強くなります。だから粘土は保水力も保肥力（CEC）も高い。ところが粒が細かすぎるとすきまも細かくなり、水が抜けず空気が入らない。<em>粘土は「養分の倉庫」であると同時に「息苦しさの原因」でもある</em>という二面性を持っています。砂はその逆で、水も空気も通すが何も蓄えません。</p><h4>判定と改良</h4><p>判定は湿らせて握るのが早道です。握っても固まらなければ砂土、固まるが指で押すと崩れれば壌土、ひも状に伸びてぬるぬるすれば埴土に近い。改良の方向は単純で、<strong>砂質には堆肥・腐葉土（保水と保肥を足す）、粘質には堆肥・腐葉土に加えて粗い砂や軽石、そして高畝や排水路（水の逃げ道をつくる）</strong>。どちらの土でも共通して効くのが有機物です。粘土質に砂だけを混ぜると、かえってコンクリートのように締まることがあります。</p>","why":"粒径が小さいほど表面積が大きく水と養分を抱えるが、同時にすきまも小さくなるため、保水力と通気性は粒径に対して逆向きに動くから。","keypoints":["粒径は礫2mm以上、砂0.02〜2mm、シルト0.002〜0.02mm、粘土0.002mm未満","土性は粘土の割合で砂土・砂壌土・壌土・埴壌土・埴土の5区分。園芸向きは壌土〜砂壌土","粘土は保水力・保肥力（CEC）が高いが、通気性・排水性が悪い","砂は通気性・排水性が高いが、保水力・保肥力が低い","判定は湿らせて握る。固まらない＝砂土、崩れる＝壌土、ひも状に伸びる＝埴土に近い","改良の基本は砂質にも粘質にも有機物。粘土質に砂だけを足すと締まって逆効果になることがある"],"table":{"caption":"土性の5区分と性質","headers":["土性","粘土の割合の目安","手ざわり・握った感じ","性質","改良の方向"],"rows":[["砂土","12.5％未満","ざらざらして固まらない","水はけ抜群、保水・保肥は最低","堆肥・腐葉土・粘土質の客土で保水保肥を足す"],["砂壌土","12.5〜25％程度","ざらつきがあるが弱く固まる","水はけよく扱いやすい","有機物を継続的に補う"],["壌土","25〜37.5％程度","固まるが指で押すと崩れる","保水と排水のバランスが最もよい","有機物で団粒を維持するだけでよい"],["埴壌土","37.5〜50％程度","粘りがあり形が残る","保肥力は高いが乾くと固い","堆肥＋粗砂や軽石、深耕"],["埴土","50％以上","ひも状に伸び、ぬるぬるする","保水・保肥は高いが通気・排水が悪い","堆肥・腐葉土を多量に、高畝や排水路で水を逃がす"]]},"mnemonic":"「砂・砂壌・壌・埴壌・埴」。粘土が増えるほど倉庫は大きく、息は苦しくなる。"},{"heading":"pH ― 日本の土が酸性に傾く理由","dialogue":[{"who":"客","text":"去年からホウレンソウがうまく育たなくて。肥料は例年どおり入れているのに、葉が黄色くなって大きくならないんです。"},{"who":"ハナ","text":"肥料が足りないわけではなさそうですね……。"},{"who":"緑川","text":"肥料はあるのに効かない、という状態かもしれません。土が酸性に傾くと、入れた養分が土に固定されて根が取り出せなくなります。ホウレンソウは特に酸性に弱い作物です。"}],"body":"<p>日本の土は放っておくと<strong>酸性</strong>に傾きます。理由は二つ。第一に<strong>雨が多い</strong>ため、アルカリ性のもとになるカルシウム・マグネシウム・カリウムといった塩基が水と一緒に流れ出る（溶脱する）こと。第二に<strong>肥料</strong>で、硫安や塩化カリのような生理的酸性肥料を使い続けると酸性化が進みます。多くの植物が好むのは<strong>pH6.0〜6.5の弱酸性</strong>です。</p><p>なぜpHが効くのか。pHは養分の<em>溶けやすさ</em>を変えるからです。強い酸性では<strong>リン酸が鉄やアルミニウムと結びついて不溶化（固定）</strong>され、いくら施しても効きません。同時にアルミニウムイオンが溶け出して根を傷め、根粒菌や硝化菌の働きも鈍ります。逆にアルカリに寄りすぎると、今度は<strong>鉄・マンガン・ホウ素・亜鉛などの微量要素が溶けにくくなり欠乏症</strong>が出て、リン酸もカルシウムと結びついて効かなくなる。<strong>主要養分と微量要素の両方がそこそこ溶けている中間点が、pH6前後</strong>というわけです。</p><h4>上げる・下げる</h4><p>酸性を矯正するのが<strong>石灰資材</strong>です。効きの強さと速さが違うので使い分けます。注意点は二つ。<strong>まきすぎ</strong>るとpHが上がりすぎて微量要素欠乏を招き、カルシウム過剰が他の養分の吸収を邪魔します。また<strong>アンモニア態窒素を含む肥料と同時に混ぜない</strong>こと。アルカリと反応して窒素がアンモニアガスとして揮散し、肥料が無駄になります。石灰は元肥の1〜2週間前に入れるのが原則です。逆に酸性にしたいときは<strong>無調整のピートモス</strong>、<strong>硫黄華</strong>、酸性の<strong>鹿沼土</strong>を使います。</p>","why":"pHは養分が水に溶けるかどうかを決めるので、量ではなく「効くかどうか」を左右するから。","keypoints":["日本の土が酸性化する原因は、雨による塩基の溶脱と、硫安など生理的酸性肥料の連用","多くの植物の適正はpH6.0〜6.5の弱酸性","強酸性ではリン酸が鉄・アルミニウムと結合して固定され、アルミニウムイオンが根を傷める","アルカリ性に傾くと鉄・マンガン・ホウ素などの微量要素が不溶化し欠乏症が出る","石灰のまきすぎは微量要素欠乏と養分の吸収阻害を招く。土は硬く締まりやすくなる","石灰とアンモニア態窒素肥料の同時施用は避ける（窒素がアンモニアとして揮散する）。石灰は元肥の1〜2週間前"],"table":{"caption":"石灰資材と酸性化資材の使い分け","headers":["資材","主成分・性格","効き方","使いどころ・注意"],"rows":[["消石灰","水酸化カルシウム。アルカリ分が強い","速効・強力","広い面積を早く矯正したいとき。まきすぎの害が出やすく、施用後は日数をおいてから植える"],["苦土石灰","炭酸カルシウム＋炭酸マグネシウム","緩効","家庭園芸の標準。マグネシウム（苦土）も補える"],["有機石灰（カキ殻・貝化石）","炭酸カルシウム主体、微量要素も含む","ゆるやか","効きが穏やかでまきすぎの害が出にくく、施用直後でも植え付けやすい"],["草木灰","炭酸カリウムなど。アルカリ性","速効","カリ分の補給を兼ねる。窒素質肥料との同時施用は避ける"],["無調整ピートモス","強い酸性（pH3.5〜4.5程度）","混ぜた分だけ","ブルーベリーなど酸性を好む植物の用土に。調整済み品は酸性化には使えない"],["硫黄華・鹿沼土","硫黄は微生物の働きでゆっくり酸性化、鹿沼土は酸性の用土","ゆるやか","土を酸性側へ動かしたいとき。硫黄は効果が出るまで時間がかかる"]]},"mnemonic":"「消石灰は強く速く、苦土石灰はほどよく、有機石灰はやさしく」。石灰と窒素は同時に混ぜない。"},{"heading":"CECとEC ― 保肥力と塩類集積","dialogue":[{"who":"客","text":"去年使ったプランターの土をそのまま使ったら、植えた苗がみんな根元から茶色くなってしまって。土は乾いてもいなかったのに。"},{"who":"ハナ","text":"鉢の縁に白いものがついていませんでしたか。"},{"who":"客","text":"ついていました。カビかと思って拭き取りました。"},{"who":"緑川","text":"それは肥料の残りが結晶になったものです。土の中の塩類が濃くなると、根は水を吸うどころか、逆に水を吸い取られてしまいます。"}],"body":"<p>化学性の残り二つが保肥力と塩類濃度です。<strong>CEC（陽イオン交換容量）</strong>は、土がプラスの電気を帯びた養分（アンモニウム、カリウム、カルシウム、マグネシウムなど）を静電気的に吸着して保持できる量、つまり<strong>保肥力</strong>そのものです。CECを担うのは<strong>粘土鉱物と腐植</strong>で、砂は低く、ゼオライト・バーミキュライト・堆肥や腐葉土由来の腐植は高い。<em>CECの低い土（砂質、赤玉土や軽石中心の鉢土）は、肥料を一度に多く入れても流れ去るだけ</em>なので、少量を回数多く与えるのが理にかなっています。</p><p><strong>EC（電気伝導度）</strong>は、土の水に溶けているイオン＝<strong>塩類の濃度</strong>の目安です。単位はmS/cmで、市販の培養土は1.0以下に収めている製品が多く、種まき用土はさらに低く抑えられています。ECが高すぎると<strong>土の水の浸透圧が根の中より高くなり、根から水が奪われて水を吸えなくなる</strong>。これが濃度障害で、発芽不良、葉先枯れ、下葉の枯れ上がりとして現れます。</p><h4>塩類集積と、疲れた土</h4><p>雨の当たらない鉢やハウスでは、水やりのたびに供給された肥料成分が抜け出さずにたまります（塩類集積）。<strong>鉢底から流れ出るまでたっぷり水を与える</strong>のは、酸素を送り込むためであると同時に、余分な塩類を洗い流すためです。古い土で根が傷むのは、粒が崩れて気相が減り、なおかつ肥料が残ってECが高いという二重苦だからです。畑では同じ科を続けることで土壌病害やセンチュウが増え、養分が偏る<strong>連作障害</strong>が起きます。対策は<strong>輪作</strong>、マリーゴールドなどの<strong>緑肥</strong>、真夏の<strong>太陽熱消毒</strong>、そして堆肥による微生物相の多様化です。</p>","why":"ECが高い土は浸透圧が根の内側より高くなるため、根は吸水ができず、水があるのに乾く状態に陥るから。","keypoints":["CEC（陽イオン交換容量）＝保肥力。担うのは粘土鉱物と腐植で、砂は低い","CECを高める資材はゼオライト、バーミキュライト、堆肥・腐葉土（腐植）","CECの低い土では肥料は薄く回数を多く。一度に大量に与えても流亡する","EC（電気伝導度）＝土に溶けた塩類の濃度の目安。単位はmS/cm","ECが高いと浸透圧で根から水が奪われる（濃度障害）。発芽不良・葉先枯れが典型","鉢底から流すたっぷりの水やりは、酸素の供給と余分な塩類の洗い流しを兼ねる","連作障害の対策は輪作・緑肥・太陽熱消毒・堆肥による微生物相の多様化"],"table":{"caption":"土の化学性トラブル早見表","headers":["状態","起きていること","現れるサイン","対処"],"rows":[["強い酸性（pH5以下）","リン酸の固定、アルミニウム害、微生物の不活性化","生育不良、肥料が効かない、酸性に弱い作物ほど顕著","苦土石灰などで矯正。元肥の1〜2週間前に施用"],["アルカリ過多（石灰のまきすぎ）","微量要素の不溶化、カルシウム過剰による吸収阻害","新葉が黄化する（クロロシス）、土が締まる","有機物やピートモスを補い、石灰の追加をやめる"],["EC過多（塩類集積）","浸透圧で根から水が奪われる","鉢縁の白い結晶、発芽不良、葉先枯れ、生育停止","たっぷり潅水して洗い流す、施肥を止める、用土を更新する"],["CEC不足（砂質・無機質中心）","肥料が保持されず流亡する","施肥してもすぐ肥切れ、葉色が薄い","堆肥・腐葉土・ゼオライトを補い、薄く回数多く施肥"]]},"mnemonic":"CECは「入れておける量」、ECは「いま溶けている濃さ」。倉庫の大きさと、水の塩辛さ。"},{"heading":"基本用土 ― 土の骨格をつくる","dialogue":[{"who":"ハナ","text":"用土のコーナーで、赤玉土と鹿沼土のどちらがいいですかと聞かれました。似た顔をしているのに、何が違うんでしょう。"},{"who":"緑川","text":"いちばん大きな違いはpHです。赤玉土は弱酸性でくせがない。鹿沼土ははっきり酸性で、ツツジやブルーベリーの側の土です。"},{"who":"ハナ","text":"見た目で見分けるコツはありますか。"},{"who":"緑川","text":"水をかけてごらんなさい。鹿沼土は濡れると色が濃くなります。水やりの目安に使えるので、それ自体が長所です。"}],"body":"<p>用土は<strong>基本用土</strong>と<strong>改良用土</strong>に分けて考えます。基本用土は配合の土台になる土で、多くは火山灰や岩石が起源の<strong>無機質</strong>。肥料分をほとんど含まず、雑草の種や病原菌も少ないのが利点です。市販の培養土の原料表示を見ても、赤玉土・鹿沼土・軽石・日向土といった名前が先頭に並びます。</p><p>中心は<strong>赤玉土</strong>です。火山灰が積もった赤土をふるい分けた粒状の土で、pHは弱酸性、通気性・保水性・保肥力のバランスがよく、無肥料・ほぼ無菌。大粒は鉢底や下層、中粒は樹木や大鉢、小粒は一般の草花に使います。弱点は<em>使ううちに粒が崩れて微塵になり、目詰まりを起こす</em>こと。焼成した<strong>硬質赤玉土</strong>は崩れにくく、山野草や長く植え替えない鉢に向きます。使う前にふるって微塵を落とすだけで、鉢の寿命は明らかに延びます。</p><h4>選び方の軸は二つ</h4><p>基本用土を選ぶ軸は<strong>pH</strong>と<strong>粒の硬さ（＝排水性の持続）</strong>です。酸性を好む植物なら鹿沼土、排水を最優先するなら軽石・日向土・桐生砂、保水と保肥を稼ぎたいなら黒土や荒木田土。重さも実務では効いてきます。ベランダなら軽い軽石系、風で倒れやすい鉢なら重い富士砂や桐生砂、というように、置き場所から逆に決めることもあります。</p>","why":"基本用土は無肥料・無菌で土台になる骨格なので、pHと粒の硬さ（排水性がいつまで続くか）で選べば配合の設計が決まるから。","keypoints":["基本用土は無機質・無肥料が基本。配合の土台になる","赤玉土は弱酸性でバランス型。大粒は鉢底、中粒は樹木、小粒は草花。硬質品は崩れにくい","鹿沼土は酸性。多孔質で軽く、湿ると色が濃くなるので水やりの目安になる","黒土（黒ボク土）は保水・保肥が高いが排水が悪く固まりやすい。単用しない","軽石・日向土（ボラ土）・桐生砂・富士砂は排水と通気が持ち味。崩れにくい","荒木田土は粘質で保水・保肥が高く、スイレンなど水生植物向き","使う前にふるって微塵を除くと、目詰まりを防げる"],"table":{"caption":"基本用土のカタログ","headers":["用土","由来・見た目","pHの傾向","性質","主な用途"],"rows":[["赤玉土","火山灰起源の赤土の粒。褐色","弱酸性","通気・保水・保肥のバランスがよい。無肥料・ほぼ無菌。粒が崩れやすい","配合の主体。大粒＝鉢底、中粒＝樹木、小粒＝草花"],["硬質赤玉土・焼成赤玉土","赤玉土を焼き固めたもの","弱酸性","崩れにくく排水性が長持ちする","山野草、盆栽、長く植え替えない鉢"],["鹿沼土","軽石質の火山灰。黄色","酸性（pH4〜5程度）","多孔質で軽く通気・保水良、保肥力は低い。湿ると色が濃くなる","ツツジ・サツキ、ブルーベリー、山野草、挿し木"],["黒土（黒ボク土）","火山灰起源の腐植に富む表土。黒色","弱酸性","保水・保肥は高いが排水が悪く固まりやすい。リン酸が固定されやすい","庭土・畑土。鉢では改良材と併用"],["真砂土","花崗岩が風化した砂質の土","中性〜弱酸性","水はけはよいが雨で表面が締まりやすく、保肥力は低い","庭の造成土、グラウンド。有機物の補給が前提"],["荒木田土","水田や河川の堆積粘土","中性付近","重く、保水・保肥が非常に高い","スイレン・ハスなど水生植物、一部の盆栽"],["日向土（ボラ土）","宮崎産の軽石","弱酸性〜中性","多孔質で硬く崩れにくい。排水・通気に優れる","山野草、洋ラン、多肉植物、鉢底石"],["軽石","火山噴出物。非常に軽い","中性付近","多孔質で排水・通気が抜群。保肥力はない","鉢底石、排水改善、多肉・サボテン"],["川砂","河川の砂","中性付近","排水性が高く清潔。保肥力はない","挿し木用土、排水改善"],["桐生砂","群馬産の火山砂礫。鉄分を含み重い","弱酸性","硬く崩れにくい。排水良好","山野草、東洋ラン、盆栽"],["富士砂","黒色の火山砂礫。重い","中性付近","排水がよく、鉢が安定する","山野草、盆栽、鉢土の化粧"]]},"mnemonic":"軸は二つ。「pHで選ぶ（赤玉＝弱酸性、鹿沼＝酸性）」「硬さで選ぶ（硬いほど排水が長持ち）」。"},{"heading":"改良用土と土壌改良材 ― 性質を足す","dialogue":[{"who":"客","text":"培養土の袋の裏に、ピートモスとかバーミキュライトとか書いてあるでしょう。あれは何のために入っているんですか。"},{"who":"緑川","text":"足りない性質を足すためです。基本用土だけでは、軽さも保水も保肥も微生物も足りない。改良用土はその不足を埋める部品です。"},{"who":"ハナ","text":"部品ごとに役割が決まっているんですね。"},{"who":"緑川","text":"そうです。だから原料名を読めば、その袋がどんな性格の土か、開ける前にわかります。"}],"body":"<p><strong>改良用土・土壌改良材</strong>は、基本用土に足りない性質を補う部品です。役割は大きく四つ。<strong>(1)保水を足す</strong>（ピートモス、ココピート、バーミキュライト、水苔）、<strong>(2)通気と排水を足す</strong>（パーライト、くん炭、木炭、バーク）、<strong>(3)保肥力＝CECを足す</strong>（ゼオライト、バーミキュライト、腐植）、<strong>(4)有機物と微生物を足す</strong>（腐葉土、バーク堆肥、牛ふん堆肥）。市販培養土の原料表示は、この部品表を読んでいるのと同じことです。</p><p>注意すべき性格の違いを押さえます。<strong>ピートモス</strong>は無調整品が強い酸性、pHを調整した製品は中性寄りで、酸性化の目的には無調整品でなければ意味がありません。<strong>パーライト</strong>は黒曜石系が排水・通気向き、真珠岩系は保水性も持ちます。<strong>くん炭</strong>と<strong>木炭</strong>はアルカリ性なので入れすぎるとpHが上がります。<strong>堆肥や腐葉土は完熟品</strong>を使うこと。未熟なものは土中で分解が進む際に窒素を奪い（窒素飢餓）、ガスや虫の害も出ます。</p><h4>古い土を再生する</h4><p>使い終わった鉢土は捨てずに戻せます。手順は、<strong>根やゴミを取り除いてふるいにかけ微塵を落とす → 消毒する（黒いポリ袋に湿らせて入れ、真夏の直射日光下に数週間置く太陽熱消毒、または熱湯をかける） → 腐葉土や堆肥、くん炭、ゼオライトなどの再生材を混ぜ、pHを整えて元肥を入れる</strong>。市販の再生材の原料もバーク堆肥・腐植・ゼオライト・くん炭が中心です。ただし前作と同じ科を続けないこと。物理性と化学性は戻せても、特定の病原菌までは消えないことがあります。</p>","why":"改良材はそれぞれ「保水・通気・保肥・微生物」のどれを足すかが決まっているので、原料名を読めば土の性格を推定できるから。","keypoints":["腐葉土は落ち葉の堆積発酵物。通気・保水・保肥を高め、微生物を供給して団粒化を促す","バーク堆肥は分解が遅く効果が長持ち、牛ふん堆肥は繊維質で土壌改良向き。未熟品は窒素飢餓やガス障害を招くので完熟品を使う","ピートモスは無調整品が酸性（pH3.5〜4.5程度）、調整済み品は中性寄り。酸性化には無調整品","ココピート（ヤシガラ）は保水・通気に優れほぼ中性。製品により塩分（EC）に注意","バーミキュライトは軽く保水・保肥（CEC）が高く無菌。パーライトは黒曜石系＝排水、真珠岩系＝保水も","くん炭・木炭はアルカリ性で多孔質。ゼオライトはCECが高く、鉢底に入れて根腐れ防止にも使う","古土の再生はふるい→消毒（太陽熱・熱湯）→再生材とpH調整・元肥。前作と同じ科は避ける"],"table":{"caption":"改良用土・土壌改良材のカタログ","headers":["資材","主なはたらき","pHの傾向","注意点・使いどころ"],"rows":[["腐葉土","通気・保水・保肥、微生物の供給、団粒化","弱酸性〜中性","完熟品を。葉の形が残り、土のにおいがするものがよい"],["バーク堆肥","通気改善と有機物の長期供給","中性付近","分解が遅く長持ち。未熟品は窒素飢餓を招く"],["牛ふん堆肥","有機物の補給と土壌改良、緩やかな肥料効果","中性〜弱アルカリ","完熟品を。塩類が多い製品はECに注意"],["ピートモス（無調整）","保水力を大きく高め、土を酸性にする","強酸性（3.5〜4.5程度）","ブルーベリーやツツジ用。乾ききると水をはじく"],["ピートモス（調整済み）","保水力を高める","中性寄りに調整済み","酸性化の目的には使えない"],["ココピート（ヤシガラ）","保水と通気を同時に補う","中性〜弱酸性","軽く扱いやすい。製品により塩分（EC）を確認"],["バーミキュライト","保水・保肥（CEC）・通気、軽量化","中性付近","無菌で種まき・挿し木に最適。単用では構造が潰れやすい"],["パーライト（黒曜石系）","排水・通気の改善、軽量化","中性付近","水に浮くため表土に出やすい"],["パーライト（真珠岩系）","保水性と通気の両方","中性付近","多孔質で水を抱える。用途で系統を選ぶ"],["くん炭（もみがら炭）","通気・保水、微生物のすみか、カリの補給","アルカリ性","入れすぎるとpHが上がる。酸性土の緩和にも使う"],["ゼオライト（沸石）","CECを大きく高め、余分な塩類やアンモニアを吸着","中性〜弱アルカリ","鉢底に入れて根腐れ防止に。水耕やハイドロにも"],["水苔","非常に高い保水力と適度な通気","酸性","ラン、着生植物、寄せ植えの化粧。詰めすぎると過湿"],["木炭","通気、微生物のすみか、根腐れ防止","アルカリ性","多孔質。盆栽や鉢底に少量"],["バーク（樹皮チップ）","洋ランの植え込み材、マルチング材","弱酸性〜中性","分解が遅い。植え込み材としては保水しにくい"]]},"mnemonic":"改良材は4つの部品箱。「水を持つ」「空気を通す」「肥料を抱える」「生き物を呼ぶ」。"},{"heading":"配合と鉢 ― 培養土を設計する","dialogue":[{"who":"客","text":"花にも野菜にも観葉にも使える培養土、というのを買えばそれで足りますよね。"},{"who":"緑川","text":"多くの場合は足ります。ただ、多肉植物と山野草だけは別の話になります。あの土は水はけの水準がまったく違うので。"},{"who":"ハナ","text":"袋のどこを見れば見分けられますか。"},{"who":"緑川","text":"原料表示とpH、元肥の有無です。原料の先頭に軽石や日向土が来ていれば水はけ重視、ピートモスが来ていれば保水重視。種まき用は元肥が入っていないものを選びます。"}],"body":"<p>配合の設計は三つの部品を組み合わせるだけです。<strong>骨格（赤玉土・軽石など基本用土）＋保水保肥（腐葉土・ピートモス・バーミキュライト）＋通気（パーライト・くん炭）</strong>。この比率を、その植物が原産地で経験してきた水環境に合わせて動かします。乾燥地の植物ほど骨格を粗く、林床の植物ほど有機物を厚く、と考えれば表は覚えるものではなく導けるものになります。</p><p>市販の培養土を選ぶときは三点を確認します。<strong>(1)原料表示</strong>（先頭に来る原料がその土の性格）、<strong>(2)pH</strong>（多くは6.0〜7.0に調整済み。ブルーベリー用は4.5前後）、<strong>(3)元肥の有無とEC</strong>。元肥入りなら植え付け直後の追肥は不要ですが、<em>種まきや挿し木には元肥のない、ECの低い清潔な用土</em>を選びます。幼い根は濃い肥料に弱いからです。</p><h4>鉢が変われば水やりも変わる</h4><p>同じ土でも鉢で乾き方が変わります。<strong>素焼き鉢</strong>は器壁が多孔質で側面からも水が蒸発するため最も乾きやすく、過湿を嫌う植物向き。<strong>駄温鉢</strong>はやや乾きにくく、<strong>プラスチック鉢</strong>は軽くて安価な反面乾きが遅いので水やりを控えめにします。<strong>スリット鉢</strong>は側面の切れ込みで根が空気に触れ、鉢内をぐるぐる回る根巻きを防ぎます。<strong>鉢底石</strong>は大粒の軽石などで排水層をつくり、鉢底の過湿を防ぐためのもの。根が鉢底穴から出る、水がしみ込まない、乾きが異常に早いは<strong>根詰まり</strong>のサインで、草花や観葉植物なら1〜2年に一度、生育が始まる前に一回り大きな鉢へ植え替えます。</p>","why":"培養土は「骨格・保水保肥・通気」の三部品の比率にすぎず、その比率は植物の原産地の水環境から逆算できるから。","keypoints":["配合の骨組みは、基本用土（骨格）＋保水保肥材＋通気材の3部品","市販培養土の確認点は原料表示・pH・元肥の有無とEC。原料は使用量の多い順に書かれる","種まきや挿し木の用土は無肥料・清潔・ECが低く粒が細かいものを選ぶ","素焼き鉢は乾きやすく過湿を嫌う植物向き、プラスチック鉢は乾きにくいので水やりを控えめに","スリット鉢は根が空気に触れることで根巻きを防ぐ","鉢底石は排水層をつくり鉢底の過湿を防ぐ。大粒軽石などを用いる","根が鉢底から出る・水がしみ込まない・乾きが早いは根詰まりのサイン。草花や観葉は1〜2年に一度、生育開始前に植え替える"],"table":{"caption":"植物のタイプ別 用土配合の例","headers":["植物のタイプ","配合の例（容量比）","ねらい"],"rows":[["一般の草花・鉢花","赤玉土小粒6：腐葉土3：パーライトまたはくん炭1","保水と排水の標準形。元肥を加えて使う"],["観葉植物（室内）","赤玉土小粒5：ピートモスまたはココピート3：パーライト2","室内では虫を避けたいので有機物は控えめ、軽さも確保"],["多肉植物・サボテン","赤玉土小粒または日向土4：軽石・川砂4：くん炭または腐葉土2","排水最優先。粒を粗くして水が残らないようにする"],["山野草","硬質赤玉土3：鹿沼土3：日向土2：軽石2","崩れにくい粒で通気を長く保ち、根の蒸れを防ぐ"],["洋ラン（着生種）","バークチップ主体、または水苔単用","根が空気にさらされる自生環境を再現する"],["酸性を好む植物（ブルーベリー、ツツジ類）","無調整ピートモス5：鹿沼土3：赤玉土小粒2","pHを4.5〜5.5程度の酸性に保つ"],["種まき・挿し木","バーミキュライト、ピートモス、パーライトなどの無肥料用土","清潔で粒が細かく、ECが低い。幼根を肥料で傷めない"],["野菜のプランター","市販の野菜用培養土、または赤玉土6：腐葉土3：くん炭1に元肥","根量が多く肥料を食うため、保肥力と元肥を確保する"]]},"mnemonic":"配合は「骨格・水もち・空気」の三点セット。乾燥地の植物ほど骨格を粗く、林床の植物ほど有機物を厚く。"}],"quiz":[{"type":"ox","q":"作土の理想的な三相分布は、おおよそ固相40％・液相30％・気相30％である。","a":true,"why":"土の約半分がすきまで、そのすきまを水と空気がほぼ半分ずつ分け合う状態が理想とされる。"},{"type":"ox","q":"根は光合成をしないため、酸素を必要としない。","a":false,"why":"逆である。根は呼吸だけをしている器官なので酸素が必須。酸欠になると吸水そのものが止まる。"},{"type":"ox","q":"単粒構造の土は、団粒構造の土よりも通気性と排水性に優れる。","a":false,"why":"逆である。大小のすきまが同居する団粒構造こそが、通気・排水と保水を同時に成立させる。"},{"type":"ox","q":"団粒構造は、有機物を微生物が分解する過程で生じる腐植や分泌物が土の粒子を結びつけてできる。","a":true,"why":"団粒は生き物の作品である。化学肥料だけを与え続けても団粒はできない。"},{"type":"ox","q":"粒径は、粘土のほうが砂よりも大きい。","a":false,"why":"粘土は0.002mm未満、砂は0.02〜2mm。粘土のほうがはるかに小さい。"},{"type":"ox","q":"埴土は粘土の割合が高く、保水力・保肥力は高いが通気性と排水性が悪い。","a":true,"why":"粒が細かいほど表面積が大きく養分と水を抱えるが、すきまも細かくなるため空気が入らない。"},{"type":"ox","q":"日本の土壌が酸性に傾きやすい主な理由は、降雨によってカルシウムなどの塩基が溶脱するためである。","a":true,"why":"雨の多さによる塩基の溶脱に加え、硫安などの生理的酸性肥料の連用も酸性化を進める。"},{"type":"ox","q":"消石灰は有機石灰より効き方が穏やかで、まきすぎの害が出にくい。","a":false,"why":"逆である。消石灰はアルカリ分が強く速効的でまきすぎの害が出やすい。穏やかなのは有機石灰。"},{"type":"ox","q":"石灰資材とアンモニア態窒素を含む肥料を同時に混ぜると、窒素がアンモニアとして揮散して失われやすい。","a":true,"why":"アルカリと反応してガス化するため。石灰は元肥の1〜2週間前に施すのが原則。"},{"type":"ox","q":"ECは土の酸性・アルカリ性の強さを表す指標である。","a":false,"why":"酸性・アルカリ性を表すのはpH。ECは土に溶けている塩類の濃度の目安である。"},{"type":"ox","q":"CECが大きい土ほど、肥料成分を保持する力（保肥力）が強い。","a":true,"why":"CECは陽イオンを吸着して保持できる量そのもの。粘土鉱物と腐植が担う。"},{"type":"ox","q":"鹿沼土はアルカリ性なので、酸性を嫌う植物の用土に向く。","a":false,"why":"鹿沼土は酸性の用土であり、ツツジ類やブルーベリーなど酸性を好む植物に使う。"},{"type":"ox","q":"くん炭はアルカリ性で、多量に混ぜると用土のpHが上がる。","a":true,"why":"もみ殻を炭化させたくん炭はアルカリ性。酸性土の緩和には役立つが入れすぎには注意する。"},{"type":"ox","q":"赤玉土は有機質に富み、微生物のすみかとして働く。","a":false,"why":"赤玉土は火山灰起源の無機質の土で、無肥料でほぼ無菌。微生物を供給するのは腐葉土や堆肥。"},{"type":"ox","q":"素焼き鉢はプラスチック鉢より土が乾きやすい。","a":true,"why":"器壁が多孔質で側面からも水が蒸発するため。過湿を嫌う植物に向く。"},{"type":"ox","q":"太陽熱消毒は、地温が下がる真冬に行うと効果が高い。","a":false,"why":"太陽熱消毒は真夏に十分潅水してから透明フィルムなどで覆い、地温を上げて行う方法である。"},{"type":"mc","q":"土の三相のうち、水やりのしすぎや踏み固めによって真っ先に失われるのはどれか。","choices":["固相","液相","気相"],"a":2,"why":"すきまが水や粒で埋まると気相が消える。根は酸欠になり、吸水が止まって根腐れに至る。"},{"type":"mc","q":"団粒構造が「水もち」と「水はけ」を同時に成立させる理由として正しいのはどれか。","choices":["塊の内部の小さなすきまが水を保ち、塊の間の大きなすきまが水を落とすから","粒子がすべて同じ大きさにそろっているから","粘土の割合が非常に高いから"],"a":0,"why":"すきまに大小二種類あることが要点。単一の粒径ではどちらか一方の性質しか得られない。"},{"type":"mc","q":"粒径の小さい順に正しく並んでいるものはどれか。","choices":["砂＜シルト＜粘土","シルト＜砂＜粘土","粘土＜シルト＜砂"],"a":2,"why":"粘土は0.002mm未満、シルトは0.002〜0.02mm、砂は0.02〜2mm。"},{"type":"mc","q":"粘土の割合が最も高い土性区分はどれか。","choices":["砂壌土","埴壌土","埴土"],"a":2,"why":"砂土＜砂壌土＜壌土＜埴壌土＜埴土の順に粘土が増える。埴土はおよそ50％以上。"},{"type":"mc","q":"多くの植物にとってpH6.0〜6.5が適する理由として最も適切なのはどれか。","choices":["土がもっとも柔らかくなる範囲だから","主要養分も微量要素もともに溶けやすく、根が吸収できる範囲だから","病原菌がすべて死滅する範囲だから"],"a":1,"why":"強酸性ではリン酸が固定され、アルカリ性では微量要素が不溶化する。その中間がpH6前後。"},{"type":"mc","q":"強い酸性の土壌で起きる現象として正しいのはどれか。","choices":["リン酸が鉄やアルミニウムと結合して効きにくくなる","鉄やマンガンが過剰に不溶化して欠乏する","カルシウムが過剰になり土が締まる"],"a":0,"why":"リン酸の固定とアルミニウムイオンによる根の障害が酸性土の代表的な害。後の2つはアルカリ側・石灰過多の害。"},{"type":"mc","q":"効き方が最も穏やかで、施用直後でも植え付けに移りやすい石灰資材はどれか。","choices":["消石灰","生石灰","有機石灰（カキ殻・貝化石）"],"a":2,"why":"有機石灰は反応が緩やかでまきすぎの害が出にくい。消石灰・生石灰はアルカリ分が強い。"},{"type":"mc","q":"土を酸性側に傾けたいときに使う資材はどれか。","choices":["苦土石灰","無調整ピートモス","くん炭"],"a":1,"why":"無調整ピートモスはpH3.5〜4.5程度の強酸性。苦土石灰とくん炭はどちらもアルカリ側へ動かす。"},{"type":"mc","q":"ECが高い土で根が傷む理由として正しいのはどれか。","choices":["土の水の浸透圧が高くなり、根から水が奪われるから","pHが急激に下がって根が溶けるから","土に酸素が入りすぎて根が乾くから"],"a":0,"why":"塩類濃度が高いと浸透圧の関係が逆転し、根は吸水できずむしろ水を奪われる（濃度障害）。"},{"type":"mc","q":"CEC（保肥力）を高める資材の組み合わせはどれか。","choices":["川砂と軽石","黒曜石系パーライトと桐生砂","ゼオライトと腐葉土・堆肥"],"a":2,"why":"CECを担うのは粘土鉱物と腐植。ゼオライトやバーミキュライト、腐植を含む堆肥類が効く。"},{"type":"mc","q":"鉢底から流れ出るまでたっぷり水を与えることの意味として正しいのはどれか。","choices":["古い空気を押し出して新しい空気を入れ、余分な塩類を洗い流す","土のpHを下げて酸性にする","鉢土のCECを高める"],"a":0,"why":"潅水は酸素の入れ替えと、たまった塩類の洗い流し（塩類集積の解消）を兼ねている。"},{"type":"mc","q":"水を含むと色が濃く変わり、水やりの目安に使える基本用土はどれか。","choices":["赤玉土","鹿沼土","富士砂"],"a":1,"why":"鹿沼土は乾くと白っぽく、湿ると濃い黄色になる。酸性である点も併せて覚える。"},{"type":"mc","q":"多肉植物・サボテンの用土として最も適切な配合はどれか。","choices":["荒木田土8：腐葉土2","無調整ピートモス6：バーミキュライト4","赤玉土小粒または日向土4：軽石・川砂4：くん炭2"],"a":2,"why":"排水最優先で粒を粗くする。荒木田土は水生植物向きの粘質土、ピートモス主体は保水しすぎる。"},{"type":"mc","q":"種まき用土に求められる性質として最も適切なものはどれか。","choices":["元肥がたっぷり入り、ECが高いこと","無肥料で清潔、粒が細かくECが低いこと","粗い軽石が主体で水がすぐ抜けること"],"a":1,"why":"幼い根は濃い肥料に弱く、細かい種は粗い用土では根が乾く。市販の種まき用土は元肥なしが基本。"},{"type":"mc","q":"スリット鉢の主な利点はどれか。","choices":["側面の切れ込みで根が空気に触れ、根巻きを防げる","器壁が多孔質で側面から水が蒸発する","保肥力（CEC）が高い"],"a":0,"why":"根巻き（ルーピング）を防ぎ、根鉢が均一に育つ。側面から蒸発するのは素焼き鉢の特徴。"},{"type":"mc","q":"連作障害への対策として適切でないものはどれか。","choices":["科の異なる作物への輪作","マリーゴールドなどの緑肥の導入","毎年同じ科の作物を同じ場所に植え続ける"],"a":2,"why":"同じ科の連作こそが土壌病害やセンチュウ、養分の偏りを招く原因。輪作・緑肥・太陽熱消毒が対策となる。"}]},{"id":10,"title":"肥料と施肥","subtitle":"足りない一つを見つけ、正しい量と時期で与えられるようになる","minutes":55,"goals":["必須元素17種と三要素の働きを、植物の体づくりから説明できる","欠乏症を「古い葉から出るか、新しい葉から出るか」で切り分けられる","肥料袋の数字を読み、必要量・希釈・施す時期を自分で決められる"],"sections":[{"heading":"必須元素17種 ── 足りない一つが上限を決める","dialogue":[{"who":"客","text":"うちのミニトマト、いい肥料を毎週欠かさずやってるんです。それなのに葉の色が抜けてきて、実も止まってしまって。肥料が足りないってことですよね。"},{"who":"ハナ","text":"毎週与えているのに足りない……。逆に多すぎるということでしょうか。"},{"who":"緑川","text":"どちらでもないかもしれません。肥料は総量ではなく、一番少ない元素で頭打ちになる。ここに窒素を百杯注いでも、マグネシウムが空なら株はマグネシウムの分しか育たないんです。"}],"body":"<p>植物が体をつくり、生きて子孫を残すために欠かせない元素を<strong>必須元素</strong>という。現在<strong>17種類</strong>が認められている。必須と呼ぶ条件は厳しい。第一にそれが欠けると生育を完了できないこと、第二にほかの元素で代わりがきかないこと、第三に植物の体内で直接はたらいていることだ。</p><p>17種のうち<strong>炭素（C）・水素（H）・酸素（O）</strong>の3つは特別で、空気中の二酸化炭素と根から吸う水でまかなえる。乾いた植物体の九割以上はこの3つでできているのに、私たちが肥料として与えることはない。だから園芸で「肥料の成分」として意識するのは、残る14種類ということになる。</p><p>その14種は必要量で三段に分けられる。<strong>多量要素</strong>のうち肥料で補う代表が<strong>窒素（N）・リン酸（P）・カリ（K）</strong>で、これが<strong>肥料の三要素</strong>。次に必要量が多い<strong>カルシウム（Ca）・マグネシウム（Mg）・硫黄（S）</strong>が<strong>中量要素</strong>。三要素にCaとMgを足して<strong>肥料の五要素</strong>と呼ぶこともある。残る<strong>鉄（Fe）・マンガン（Mn）・ホウ素（B）・亜鉛（Zn）・銅（Cu）・モリブデン（Mo）・塩素（Cl）・ニッケル（Ni）</strong>の8種が<strong>微量要素</strong>だ。</p><p>ここで最重要の原理が出てくる。<strong>リービッヒの最小律</strong>である。植物の生育は、供給が最も不足している一つの要素によって決まる。よく使われるたとえが<strong>ドベネックの桶</strong>だ。桶の板を各元素に見立てると、水は一番短い板の高さまでしか溜まらない。ほかの板をいくら伸ばしても無駄で、短い板を継ぎ足した瞬間に水位が上がる。「微量要素は少しでいい」は「重要度が低い」という意味ではない。<strong>量が少なくても、それが最短の板なら上限を決めるのはそいつだ</strong>。</p>","why":"生育は要素の合計ではなく、最も不足している一要素で頭打ちになる（最小律）ため、多く与えることより足りない一つを見つけることが効く。","keypoints":["必須元素は17種類。欠けると生育を完了できず、他元素で代替できない","C・H・Oは空気と水からまかなえるため肥料では与えない","多量要素のうち肥料で補う三要素はN・P・K、中量要素はCa・Mg・S","微量要素8種はFe・Mn・B・Zn・Cu・Mo・Cl・Ni","リービッヒの最小律＝生育は最も不足する要素で決まる。模型はドベネックの桶","三要素にCa・Mgを加えて肥料の五要素という"],"table":{"caption":"必須元素17種の分類","headers":["区分","元素","供給源・位置づけ"],"rows":[["多量要素（非肥料）","炭素C、水素H、酸素O","空気中の二酸化炭素と水。乾物の9割以上を占めるが施肥はしない"],["多量要素（三要素）","窒素N、リン酸P、カリK","消費量が多く、必ず肥料で補う。袋のN-P-K表示の対象"],["中量要素","カルシウムCa、マグネシウムMg、硫黄S","三要素の次に必要量が多い。CaとMgを加えて五要素"],["微量要素","鉄Fe、マンガンMn、ホウ素B、亜鉛Zn、銅Cu、モリブデンMo、塩素Cl、ニッケルNi","必要量はごく少ないが、欠ければ生育は止まる"]]},"mnemonic":"微量要素8種は「鉄マン、ホウ亜鉛、銅モリ、塩ニッケル」。多量・中量は「CHO（チョー）ＮＰＫ、カル・マグ・硫黄」"},{"heading":"三要素の働き ── 葉肥・花肥・根肥","dialogue":[{"who":"客","text":"枝も葉もすごく茂って、緑も濃くて元気なんです。でも花がひとつも咲かなくて。肥料が足りないんでしょうか。"},{"who":"ハナ","text":"元気なのに咲かない……。緑川さん、これはどう読むんですか。"},{"who":"緑川","text":"茂りすぎ、が答えです。窒素は葉と茎をつくる元素で、多すぎると株は「まだ育つ時期だ」と判断して、花や実に切り替えない。窒素を減らして、リン酸とカリを効かせる番です。"}],"body":"<p>三要素にはそれぞれ体内での担当がある。役割で覚えると、過不足の症状まで理屈でつながる。</p><p><strong>窒素（N）＝葉肥（はごえ）</strong>。タンパク質と葉緑素の材料で、葉・茎・枝をつくる。不足すれば葉は淡く小さく、株全体が伸び悩む。逆に多すぎると細胞が水っぽく大きくなり、色は濃いが<strong>軟弱徒長</strong>になる。組織がやわらかいのでアブラムシや病気を招き、栄養生長ばかり続いて花芽がつかない。ウリ類やサツマイモでいう<strong>つるぼけ</strong>、果樹の木ボケがこれだ。</p><p><strong>リン酸（P）＝花肥・実肥（はなごえ・みごえ）</strong>。核酸やATP、細胞膜の材料で、細胞分裂と<strong>エネルギーの受け渡し</strong>を担う。分裂が盛んな場所ほど要る。つまり根の伸びはじめ、花芽の形成、開花結実だ。元肥用の肥料でリン酸が突出して高いものがあるのは、リン酸が土の中を動きにくく根元に留まる性質のためで、あらかじめ根の届く場所に置いておく必要があるからである。</p><p><strong>カリ（K）＝根肥（ねごえ）</strong>。ほかの二つと違い、体の部品にはならない。イオンのまま細胞液に溶け、<strong>気孔の開閉、水分調節、光合成産物の転流</strong>を仕切る調整役だ。だから不足すると根やイモが太らず、乾燥・低温・病気に弱くなる。イモ類や根菜でカリが重視されるのはこのためだ。</p><p>中量要素も一言でつかめる。<strong>カルシウムは細胞壁を固めて丈夫にし、マグネシウムは葉緑素の中心にある金属</strong>、<strong>硫黄はタンパク質（含硫アミノ酸）</strong>の材料でアブラナ科やネギ類の香りのもとになる。</p>","why":"窒素は体をつくる材料、リン酸はエネルギーと分裂、カリは体内の調整役という担当の違いが、そのまま過不足の症状の違いになる。","keypoints":["窒素＝葉肥。葉緑素とタンパク質の材料。過剰で軟弱徒長・つるぼけ、病害虫を招く","リン酸＝花肥・実肥。細胞分裂とエネルギー。土中を動きにくいので元肥向き","カリ＝根肥。体の部品にならず、気孔・水分・転流を調整。耐病性・耐寒性を高める","カルシウムは細胞壁、マグネシウムは葉緑素の中心元素、硫黄はタンパク質の材料","花が咲かない原因が「肥料不足」ではなく「窒素過多」であることは珍しくない"],"table":{"caption":"三要素と中量要素 ── 働き・不足・過剰","headers":["要素","別名","主な働き","不足すると","多すぎると"],"rows":[["窒素 N","葉肥","葉緑素・タンパク質の材料。葉と茎を茂らせる","葉が淡く小さい、株が育たない（下葉から黄化）","軟弱徒長、濃緑、花芽がつかない、病害虫を招く"],["リン酸 P","花肥・実肥","核酸・ATP。細胞分裂、根の伸長、開花結実","生育停滞、葉が暗緑〜赤紫、花・実がつかない","鉄・亜鉛など微量要素の吸収を妨げる"],["カリ K","根肥","気孔の開閉、水分調節、光合成産物の転流","葉縁が黄化して褐変、根やイモが太らない","カルシウム・マグネシウムの吸収を妨げる"],["カルシウム Ca","","細胞壁を強くする。土壌の酸度矯正にも関与","生長点が傷む。トマトの尻腐れ、ハクサイの芯腐れ","土がアルカリに傾き、鉄・マンガンが効かなくなる"],["マグネシウム Mg","苦土","葉緑素の中心元素。リン酸の移動を助ける","古い葉の葉脈間が黄化（葉脈は緑のまま）","カルシウム・カリとの吸収バランスが崩れる"],["硫黄 S","","含硫アミノ酸・タンパク質の材料、香り成分","新しい葉が淡くなる（欠乏はまれ）","実害は出にくい"]]},"mnemonic":"「葉・花実・根」で N-P-K の順。袋の数字の並びと同じ順に、葉→花実→根と体を上から下へ下りていく"},{"heading":"欠乏症は古い葉か、新しい葉か","dialogue":[{"who":"客","text":"同じ黄色でも、この鉢は下の葉から、こっちの鉢は先端の新しい葉から黄色くなってるんです。原因は同じですか。"},{"who":"ハナ","text":"見た目は似ているのに、出る場所が正反対ですね。"},{"who":"緑川","text":"その「どこから出るか」が診断の決め手です。株は足りない元素を体の中で融通しようとする。動かせる元素なら古い葉から抜き取って新芽へ送るので、古い葉が犠牲になる。動かせない元素は送れないから、新芽の側が先に困る。"}],"body":"<p>欠乏症の見分けは、色や形の暗記より先に<strong>一つの原理</strong>を押さえるほうが速い。植物は不足を感じると、体内で<strong>再転流</strong>を行う。すなわち古い葉に蓄えた元素を分解して新芽へ送る。この移動ができるかどうかで、症状の出る場所が決まる。</p><p><strong>移動しやすい元素（易動性）は N・P・K・Mg</strong>。これらが不足すると、株は古い葉から回収して新芽を守る。したがって<strong>症状は下葉・古い葉から</strong>出て、上へ広がる。<strong>移動しにくい元素は Ca・Fe・B</strong>（Mn・Znなども）。いったん組織に組み込まれると動かせないので送りようがなく、<strong>症状は新葉・生長点から</strong>出る。古い葉は平気な顔をしているのに芽先だけおかしい、というときはこちらだ。</p><p>この軸で並べると整理がつく。<strong>窒素欠乏</strong>は下葉が全体に淡く黄化し株が小さい。<strong>リン酸欠乏</strong>は生育が止まり、下葉が暗緑〜<strong>赤紫</strong>を帯びる（糖が使われず色素がたまるため）。<strong>カリ欠乏</strong>は下葉の<strong>葉縁から黄化して褐変</strong>し、縁が焼けたようになる。<strong>マグネシウム欠乏</strong>は下葉の<strong>葉脈間が黄化し、葉脈だけ緑で残る</strong>（葉脈間クロロシス）。</p><p>新葉側では、<strong>鉄欠乏</strong>が新葉の葉脈間を<strong>黄白色</strong>に抜き、進むと葉全体が白っぽくなる。土がアルカリに傾いたときやリン酸過剰のときに鉄が溶けず起こりやすい。<strong>カルシウム欠乏</strong>は生長点や実の先端が壊れ、<strong>トマト・ピーマンの尻腐れ果、ハクサイ・キャベツの芯腐れ、レタスの葉先枯れ</strong>として現れる。乾燥や窒素・カリの与えすぎでも誘発される。<strong>ホウ素欠乏</strong>は芽が萎縮して枯れ、ダイコン・カブの根の内部が褐変する。ホウ素は適量の幅が狭く、過剰害も出やすい。</p>","why":"植物は不足した元素を古い葉から回収して新芽に送るため、動かせる元素は古い葉から、動かせない元素は新芽から症状が出る。","keypoints":["移動しやすい N・P・K・Mg の欠乏は古い葉（下葉）から出る","移動しにくい Ca・Fe・B の欠乏は新しい葉・生長点から出る","リン酸欠乏は葉が赤紫、カリ欠乏は葉縁の褐変、マグネシウム欠乏は葉脈間クロロシス","鉄欠乏は新葉が黄白化。アルカリ性土壌やリン酸過剰で起こりやすい","カルシウム欠乏＝トマトの尻腐れ果、ハクサイの芯腐れ。乾燥でも起こる","ホウ素は不足も過剰も害が出やすく、適量の幅が狭い"],"table":{"caption":"欠乏症の見分け方 ── 出る場所で切る","headers":["出る場所","元素","症状","起こりやすい条件"],"rows":[["古い葉（下葉）から","窒素 N","全体に淡い黄化、株が小さく葉も小さい","施肥不足、雨や水やりでの流亡、未熟有機物の投入"],["古い葉（下葉）から","リン酸 P","生育停滞、葉が暗緑から赤紫を帯びる","低温期、酸性またはアルカリ性に傾いた土"],["古い葉（下葉）から","カリ K","葉縁が黄化しやがて褐変、縁が焼けたようになる","砂質土での流亡、着果・肥大期の消耗"],["古い葉（下葉）から","マグネシウム Mg","葉脈間が黄化し葉脈だけ緑で残る","カリの与えすぎ、酸性土壌"],["新しい葉・生長点から","鉄 Fe","新葉の葉脈間が黄白化、進むと白くなる","土のアルカリ化、リン酸過剰、過湿"],["新しい葉・生長点から","カルシウム Ca","尻腐れ果、芯腐れ、葉先枯れ、生長点が傷む","乾燥・水分ムラ、窒素やカリの過剰"],["新しい葉・生長点から","ホウ素 B","芽の萎縮・枯死、根や茎の内部が褐変・空洞化","乾燥、アルカリ性土壌。過剰害も出やすい"]]},"mnemonic":"「古いのは N・P・K・Mg、新しいのは Ca・Fe・B」。動かせるものは古い葉から抜き取られる、と因果で覚える"},{"heading":"袋の数字を読む ── N-P-K表示と肥料の分類","dialogue":[{"who":"客","text":"8-8-8って書いてある袋と、6-40-6って書いてある袋があって。数字が大きいほうが良い肥料ということですか。"},{"who":"ハナ","text":"40というのはずいぶん飛び抜けていますね。"},{"who":"緑川","text":"良し悪しではなく用途の違いです。数字は保証成分量のパーセント。8-8-8は万能型、リン酸だけ40という配合は元肥専用で、根と花芽のために置いておく設計なんです。"}],"body":"<p>肥料袋の<strong>8-8-8</strong>のような数字は、左から<strong>窒素・リン酸・カリの保証成分量（重量％）</strong>だ。100g中に窒素が8g、リン酸が8g、カリが8g含まれることを意味する。ここで大事な約束事がある。<strong>窒素はN（元素）そのもので表すが、リン酸はP₂O₅、カリはK₂Oという酸化物に換算して表示する</strong>。だから「リン酸8％」はリン単体が8％という意味ではない。慣行としてこの形で統一されているので、袋どうしの比較はそのまま行ってよい。</p><p>ここから施肥量が計算できる。<strong>8-8-8を1平方メートルに100g施す</strong>と、窒素成分は100×0.08＝<strong>8g</strong>、リン酸8g、カリ8gが入る計算だ。もし窒素成分で12g／㎡必要なら、12÷0.08＝<strong>150g</strong>の施用となる。袋の「1㎡あたり100g」という指示は、この換算の結果として書かれている。</p><p>分類も数字で決まる。1成分だけを保証する<strong>単肥</strong>に対し、2成分以上を含むものが<strong>複合肥料</strong>。複合肥料はさらに、原料を混ぜ合わせただけの<strong>配合肥料（ブレンド）</strong>と、化学的操作を加えて粒に仕立てた<strong>化成肥料</strong>に分かれる。化成肥料は<strong>三要素の合計が30％以上のものを高度化成、30％未満を普通化成</strong>という。8-8-8は合計24％なので普通化成、14-14-14なら合計42％で高度化成である。</p><p>制度上は、公定規格に基づき登録を受ける<strong>普通肥料</strong>と、堆肥・米ぬか・魚かす・草木灰・鶏ふんなど農林水産大臣が指定し届出で流通する<strong>特殊肥料</strong>に分かれる。石灰資材は三要素ではなく<strong>アルカリ分（％）</strong>で中和力が表示され、数値が大きいほど少量で酸性を矯正できる。</p>","why":"袋の数字は保証成分量のパーセントであり、施用量に掛け算すればそのまま与えた成分のグラム数になる。","keypoints":["N-P-Kの数字は保証成分量（重量％）。リン酸はP₂O₅、カリはK₂Oとして表示","8-8-8を1㎡に100g→N・P・Kが各8g。必要成分量÷含有率で施用量が出る","単肥＝1成分、複合肥料＝2成分以上。配合肥料は混合、化成肥料は化学的操作で造粒","高度化成は三要素合計30％以上、普通化成は30％未満","普通肥料は登録制、堆肥・米ぬか・魚かす・草木灰などの特殊肥料は届出制","石灰資材はアルカリ分（％）で中和力を表示する"],"table":{"caption":"代表的な単肥・有機質肥料のおおよその成分値（N-P-K、％）","headers":["肥料名","N","P₂O₅","K₂O","性格"],"rows":[["硫安（硫酸アンモニウム）","21","-","-","速効性の窒素単肥。連用で土が酸性に傾く"],["尿素","46","-","-","窒素含量が最も高い部類。速効性、葉面散布にも"],["過リン酸石灰","-","17.5","-","水溶性リン酸。土中で動きにくく元肥向き"],["熔成リン肥（ようりん）","-","20前後","-","く溶性でゆっくり効き、アルカリ分も持つ"],["硫酸カリ","-","-","50前後","速効性のカリ単肥"],["油かす","5","2","1","有機質。窒素主体で遅効性、土づくり効果あり"],["魚粉（魚かす）","7","6","-","有機質。窒素とリン酸をあわせ持つ"],["骨粉","2〜3","18〜20","-","有機質。リン酸が主体で効きは非常にゆっくり"],["草木灰","-","少量","含む","カリと石灰分を含みアルカリ性。特殊肥料"],["化成肥料（普通化成）","8","8","8","万能型。合計24％で普通化成"]]},"mnemonic":"単肥の数字は「硫安21・尿素46・過石17.5・硫酸カリ50」。尿素が最大、と押さえると取り違えない"},{"heading":"有機質肥料と無機質肥料 ── なぜ効き方が違うのか","dialogue":[{"who":"客","text":"体に良さそうだから有機肥料にしたんです。でも二週間たっても葉の色が戻らなくて。効かない肥料だったんでしょうか。"},{"who":"ハナ","text":"有機だから安心、と思っていました。効き方まで違うんですね。"},{"who":"緑川","text":"有機質肥料は植物が直接吸えないんです。微生物が食べて分解して、はじめて根が吸える形になる。だから気温が低ければ微生物も働かず、効くのはもっと先になります。"}],"body":"<p>根が吸収できる養分の形は決まっている。窒素なら<strong>アンモニウムイオンや硝酸イオン</strong>といった無機のイオンだ。ここが有機質肥料と無機質（化学）肥料を分ける根本になる。</p><p><strong>無機質肥料</strong>は、はじめから吸収できるイオンの形で与える。だから水に溶ければすぐ効く。成分量が明確で計算しやすく、価格あたりの成分も安い。反面、効きが早い分だけ与えすぎの事故を起こしやすく、土の中の微生物を増やす働きはない。</p><p><strong>有機質肥料</strong>は油かす・魚粉・骨粉・鶏ふんなど、生き物由来の材料である。窒素はタンパク質の形で入っているので、そのままでは吸えない。<strong>土壌微生物に分解されて無機化してから、はじめて効く</strong>。この「ワンクッション」が有機質肥料の性格をすべて決めている。効きはじめが遅く（遅効性）、しかしじわじわ長く続く。分解にともなって微生物が増え、その代謝物が土の粒をくっつけて<strong>団粒構造</strong>を育てるので、土づくり効果がある。一方で分解には温度と水分が要るため<strong>低温期は効かない</strong>。分解途中でにおいが出たり、コバエやハエを呼んだりもする。成分量は低めで、同じ成分を入れるには量が要り、割高になりやすい。</p><p>この理屈から、使い分けは自然に決まる。<strong>土に混ぜ込み、時間をかけて効かせる元肥は有機質が得意</strong>。<strong>いま出ている症状をすぐ直したい追肥は無機質・液肥が得意</strong>。鉢やプランターなど室内に近い場所は、においと虫の点で無機質が扱いやすい。なお有機質肥料でも未熟なものを株元に埋めると、分解時のガスや発熱で根を傷める。<strong>植え付けの直前に生の有機物を根に触れさせない</strong>のが鉄則である。</p>","why":"有機質肥料の窒素はタンパク質の形で入っており、土壌微生物に分解されて無機イオンにならないと根が吸えないため、遅効性で温度に左右される。","keypoints":["根が吸えるのは無機のイオン。有機質肥料は微生物の分解を経てから効く","有機質＝遅効性・持続的・土づくり効果あり。低温期は効かず、におい・虫の欠点","無機質＝速効性・成分が明確・安価。土づくり効果はなく、与えすぎの事故が起きやすい","元肥は有機質が得意、即効性を求める追肥は無機質・液肥が得意","未熟な有機物を根の近くに埋めるとガスと発熱で根を傷める"],"table":{"caption":"有機質肥料と無機質（化学）肥料の比較","headers":["観点","有機質肥料","無機質（化学）肥料"],"rows":[["原料","油かす、魚粉、骨粉、鶏ふん、米ぬかなど生物由来","鉱物・化学合成による無機塩類"],["効きはじめ","遅い（微生物の分解が必要）","速い（水に溶けてすぐ吸収）"],["持続","長い","短い〜中程度（緩効性加工品を除く）"],["温度の影響","受ける。低温期は分解が進まず効かない","ほとんど受けない"],["土づくり効果","あり。微生物が増え団粒構造が育つ","なし"],["成分量と計算","低め・変動あり。設計しにくい","明確で計算しやすい"],["におい・虫","出やすい","ほとんどない"],["向く使い方","元肥、寒肥、土づくりを兼ねた施用","追肥、症状の応急処置、鉢物・室内"]]}},{"heading":"効き方の時間軸 ── 速効性・緩効性・遅効性","dialogue":[{"who":"客","text":"元肥に混ぜたつぶつぶの肥料が、秋になっても土の中に残ってるんです。溶けてないってことは効いてないんじゃ。"},{"who":"ハナ","text":"たしかに、粒がそのまま残っていますね。"},{"who":"緑川","text":"それは殻です。中身は出ています。被覆肥料は樹脂の膜から少しずつ養分を出す仕組みで、出し終えると膜だけが残る。むしろ設計どおりに働いた証拠ですよ。"}],"body":"<p>肥料は成分だけでなく<strong>効く速さ</strong>で選ぶ。同じ窒素でも、明日効かせたいのか三か月かけたいのかで選ぶ品目が変わる。</p><p><strong>速効性</strong>は、水に溶けてすぐ吸収される。液体肥料、硫安、尿素、過リン酸石灰などが代表で、効果は数日から一、二週間。追肥や症状の応急処置に使う。裏を返せば持続しないので、繰り返し与えないと切れる。<strong>遅効性</strong>は有機質肥料や骨粉、熔リンなど、分解や溶解に時間がかかるもの。寒肥や土づくりの元肥に向く。その中間が<strong>緩効性</strong>で、成分そのものは無機でも、加工によって溶け出す速度を落としてある。</p><p>緩効性のつくり方は主に二つだ。ひとつが<strong>被覆肥料（コーティング肥料）</strong>。粒を樹脂などの膜で包み、膜を通して少しずつ溶出させる。膜の厚さと材質で溶出期間を設計でき、<strong>七十日、百日といったタイプ</strong>が作り分けられている。ここに注意点がある。<strong>溶出は地温が高いほど速い</strong>。夏の高温期は設計より早く出きってしまうことがあり、逆に低温期はほとんど出ない。溶け終わった殻は土に残る。</p><p>もうひとつが<strong>IB化成</strong>。イソブチルアルデヒドと尿素を結合させた窒素（IB窒素）を使い、水と反応して<strong>加水分解</strong>しながら少しずつ尿素に戻る。粒が大きいほど表面積が小さく、ゆっくり長く効く。粒の大きさが持続期間そのものだと考えてよい。</p><p>そもそも化成肥料が<strong>粒</strong>に成形されているのも同じ理屈で、粉より表面積が小さく、急激に溶けず、まきやすく、土になじみやすい。粒の大きさ・膜の厚さ・分解のしやすさ、この三つが「効く時間」を決めている。</p>","why":"養分が根に届く速度は、水に溶ける速さ（膜・粒径・分解の必要性）で決まるため、加工によって効き方の時間軸を設計できる。","keypoints":["速効性＝液肥・硫安・尿素など。数日〜2週間で効き、持続しない","緩効性＝被覆肥料、IB化成など。効きはじめが早めで長く続く","遅効性＝有機質肥料、骨粉、熔リンなど。分解を待つため遅く長い","被覆肥料は樹脂膜からの溶出。地温が高いほど溶出が速く、溶け終わると殻が残る","IB化成は加水分解でゆっくり尿素に戻る。粒が大きいほど長く効く","粒状に成形するのは表面積を減らし、急激な溶出を防ぐため"],"table":{"caption":"効き方の時間軸と使いどころ","headers":["区分","代表例","効きはじめ","持続","主な使い方"],"rows":[["速効性","液体肥料、硫安、尿素、過リン酸石灰","数時間〜数日","1〜2週間程度","追肥、症状の応急処置、生育最盛期"],["緩効性（被覆）","樹脂被覆の粒状肥料","数日","設計により70日・100日など","元肥、鉢物の長期管理"],["緩効性（IB）","IB化成","数日","1〜3か月程度","元肥、置き肥、追肥の手間を減らしたいとき"],["遅効性","油かす、骨粉、魚粉、熔リン","数週間","数か月","元肥、寒肥、土づくり"]]},"mnemonic":"被覆肥料は「温度が上がると出が速くなる水筒」。IB化成は「大粒ほど長持ちする飴玉」"},{"heading":"施肥法と時期 ── 元肥・追肥をどこに、いつ","dialogue":[{"who":"客","text":"肥料は根に届いたほうがいいと思って、株のすぐ根元にたっぷり置いたんです。そうしたら次の日にしおれてしまって。"},{"who":"ハナ","text":"近いほど効きそうなのに、逆なんですね。"},{"who":"緑川","text":"水と養分を吸っているのは根の先端側で、株元の太い根はほとんど吸いません。しかも濃い肥料が接すれば根が焼ける。届けたい相手は株元ではなく、枝先の真下なんです。"}],"body":"<p>施肥は<strong>いつ与えるか</strong>と<strong>どこに置くか</strong>の二つで決まる。時期でいえば、植え付け前に土に施す<strong>元肥（もとごえ）</strong>と、生育途中に補う<strong>追肥（ついひ）</strong>だ。元肥は緩効性・遅効性を土に混ぜ、追肥は速効性を必要な時期に置く。</p><p>置き方には型がある。<strong>全層施肥</strong>は作土全体に混ぜ込む方法で、根が広く張る野菜の元肥の基本。<strong>溝施肥（すじ施肥）</strong>は畝の下や条間に溝を切って施す方法で、根が伸びる先に養分を置ける。<strong>穴施肥（点施肥）</strong>は株を植える位置の下に集中させる。鉢物では、固形肥料を土の上に置く<strong>置き肥</strong>と、水やり代わりに与える<strong>液肥</strong>が中心になる。</p><p>共通する原則が<strong>株元から離す</strong>ことだ。理由は二つある。第一に、養水分を吸うのは<strong>根の先端付近の根毛</strong>であり、株元の太い根は通り道でしかない。樹木なら<strong>枝先の真下（樹冠の外周）</strong>あたりに細根が集まる。第二に、濃い肥料が根や茎に直接触れると<strong>肥料やけ</strong>を起こす。置き肥も鉢の縁寄りに置く。</p><p>時期の呼び名も覚えておきたい。開花や収穫で消耗した株を回復させ、翌年の花芽をつくらせるために花後・収穫後に施すのが<strong>お礼肥（おれいごえ）</strong>。落葉樹の休眠期（おおむね12〜2月）に有機質肥料を株のまわりに施し、春の芽出しに間に合わせるのが<strong>寒肥（かんごえ）</strong>。春の萌芽期に速効性を効かせるのが<strong>芽出し肥</strong>だ。寒肥に遅効性の有機質を使うのは、分解に数か月かかることを見越して逆算しているからである。</p><p>基本は<strong>生育サイクルに合わせる</strong>。生育が旺盛な時期に与え、休眠期には与えない。</p>","why":"養水分を吸うのは根の先端の根毛であり、株元の太い根は吸収しないため、肥料は根が伸びていく先に置く必要がある。","keypoints":["元肥＝植え付け前に土へ。緩効性・遅効性。追肥＝生育途中に速効性を補う","全層施肥・溝施肥（すじ施肥）・穴施肥・置き肥・液肥を場面で使い分ける","株元から離す理由は、吸収するのが根の先端の根毛であることと、肥料やけの回避","樹木は枝先の真下（樹冠の外周）付近に施す","お礼肥＝花後・収穫後の回復。寒肥＝落葉樹の休眠期に有機質。芽出し肥＝春の萌芽期に速効性"],"table":{"caption":"施肥法の使い分け","headers":["方法","やり方","向く場面"],"rows":[["全層施肥","作土全体に肥料を混ぜ込んでから植える","根が広く張る野菜・草花の元肥"],["溝施肥（すじ施肥）","畝の下や条間に溝を切り、施してから土を戻す","根が伸びる方向に養分を置きたい元肥"],["穴施肥（点施肥）","株を植える位置の下に集中して施す","株間が広い作物、肥料を節約したいとき"],["置き肥","固形・粒状肥料を鉢土の表面に置く","鉢物の追肥。鉢の縁寄りに置く"],["液肥","規定倍率に薄めて水やり代わりに与える","速効性の追肥、生育最盛期、応急処置"]]},"mnemonic":"「お礼は終わってから、寒肥は寒いうちに、芽出しは芽の出る前」。名前がそのまま施す時期を語っている"},{"heading":"濃度の事故と、肥料を切る判断 ── 活力剤は肥料ではない","dialogue":[{"who":"客","text":"弱っていたので、液肥を濃いめに作って毎日あげたんです。そうしたら葉の先が茶色くなって、余計にぐったりして。"},{"who":"ハナ","text":"弱っているときこそ栄養、ではないんですね。"},{"who":"緑川","text":"逆なんです。土の水が濃くなると、根は水を吸うどころか水を奪われる。弱った株はまず肥料を切って、水と休養を与える。売り場の活力剤は、まさにそういう場面のためのものです。"}],"body":"<p>根が水を吸えるのは、<strong>根の細胞液のほうが土壌溶液より濃い</strong>からだ。水は薄いほうから濃いほうへ移動する（浸透圧）。ところが肥料をやりすぎて土壌溶液の濃度が細胞液を上回ると、流れが逆転して<strong>根から水が抜けていく</strong>。これが<strong>肥料やけ</strong>で、水を切らしていないのにしおれ、葉先や葉縁から褐変し、根が茶色く傷む。土の塩類濃度は<strong>EC（電気伝導度）</strong>で測れ、施肥過多では上昇する。</p><p>だから希釈は守る。<strong>1000倍希釈は、水1Lに原液1mL</strong>。500倍なら水1Lに2mL、2000倍なら水2Lに1mLである。キャップやスポイトで正確に量ること。「濃いほうがよく効く」は成り立たない。薄めのものを回数多く、が鉢物の安全策だ。</p><p>施肥過多の症状は、葉が異様に濃緑で厚い、軟弱徒長、花が咲かない、葉先の枯れ込み、株元のカビや藻。疑ったら<strong>施肥をやめ、鉢底から流れ出るまで灌水して流す</strong>のが応急処置だ。</p><p>むしろ<strong>肥料を切る</strong>べき場面がある。<strong>植え付け・植え替え直後</strong>（根が傷んで吸えない）、<strong>弱った株・病気の株</strong>、<strong>休眠期</strong>、そして<strong>開花中の花木</strong>だ。観葉植物は冬に生育が止まるので施肥を止め、多肉植物は種類ごとの休眠期に与えない。逆に<strong>球根は花後、葉が枯れるまで肥料と光を切らさない</strong>。あの葉が光合成して翌年の球根を太らせているからで、早く切ると翌年咲かない。</p><p>最後に<strong>活力剤（活力材）</strong>。これは肥料ではない。肥料の品質の確保等に関する法律（旧・肥料取締法）で定める保証成分の水準に満たないため、肥料として登録されない製品である。中身は微量要素、アミノ酸、ビタミン、糖類など。<strong>三要素を補わないので肥料の代わりにはならない</strong>。差し込むアンプル型も成分はごく薄く、これだけで育つという理解は誤りである。</p>","why":"土壌溶液が根の細胞液より濃くなると水の移動が逆転して根から水が奪われるため、濃すぎる肥料は栄養ではなく脱水を招く。","keypoints":["肥料やけの正体は浸透圧の逆転。根から水が奪われ、しおれ・葉先褐変が起こる","1000倍希釈＝水1Lに原液1mL。500倍は1Lに2mL","施肥過多は濃緑・軟弱徒長・花が咲かない・葉先枯れ。ECの上昇として測れる","肥料を切る場面＝植え付け直後、弱った株、休眠期、開花中の花木","観葉植物は冬、多肉は休眠期に施肥しない。球根は葉が枯れるまで切らさない","活力剤は肥料の保証成分に満たず肥料には該当しない。三要素の代わりにならない"],"table":{"caption":"肥料を与える／切る の判断","headers":["場面","判断","理由"],"rows":[["生育最盛期（春〜初夏、秋）","与える","吸収と生長が盛んで、与えた分が使われる"],["植え付け・植え替え直後","切る","根が傷み吸収できない。濃度障害になりやすい"],["弱った株・病気の株","切る","吸えないうえ濃度障害を重ねる。まず水と休養"],["開花中の花木","控える","開花にエネルギーを向けている時期。花後にお礼肥"],["観葉植物の冬・熱帯性植物の低温期","切る","生育が止まり吸収しない。土に残って濃度障害"],["多肉植物の休眠期","切る","種類ごとに夏または冬に休眠し、吸収しない"],["球根の花後（葉が緑のうち）","与える","葉の光合成で翌年の球根を太らせる。葉が枯れたら終了"],["真夏の高温期","控えめ","高温で生育が鈍る植物が多く、濃度障害を招きやすい"]]},"mnemonic":"「濃く一回より、薄く何回」。そして肥料を切る四場面は「植えた直後・弱った株・眠っている間・咲いている最中」"}],"quiz":[{"type":"ox","q":"植物の必須元素は17種類とされている。","a":true,"why":"C・H・Oと、N・P・K、Ca・Mg・S、微量要素8種を合わせて17種。欠ければ生育を完了できず、他元素で代替できないものを指す。"},{"type":"ox","q":"微量要素は必要量がごくわずかなので、不足しても生育に大きな支障はない。","a":false,"why":"必要量が少ないだけで重要度は同じ。最小律のとおり、不足した一要素が生育の上限を決める。"},{"type":"ox","q":"炭素・水素・酸素は必須元素だが、肥料として与える必要はない。","a":true,"why":"空気中の二酸化炭素と根から吸う水でまかなえる。乾物の9割以上を占めるが施肥の対象にはならない。"},{"type":"ox","q":"肥料の三要素にカルシウムとマグネシウムを加えて、肥料の五要素という。","a":true,"why":"N・P・Kが三要素、これにCa・Mgを加えたものが五要素。CaとMgは中量要素である。"},{"type":"ox","q":"窒素を多く与えるほど花つきがよくなる。","a":false,"why":"逆。窒素過多は軟弱徒長を招き、栄養生長が続いて花芽がつかない。つるぼけ・木ボケがその例。"},{"type":"ox","q":"マグネシウム欠乏は、まず新しい葉の葉脈間から現れる。","a":false,"why":"マグネシウムは体内を移動しやすいので古い葉から回収される。症状は下葉の葉脈間クロロシスとして出る。"},{"type":"ox","q":"鉄欠乏は新しい葉が葉脈間から黄白色になる形で現れる。","a":true,"why":"鉄は移動しにくく古い葉から融通できないため、新葉に症状が出る。アルカリ性土壌やリン酸過剰で起こりやすい。"},{"type":"ox","q":"トマトの尻腐れ果は、カルシウム欠乏によって起こる。","a":true,"why":"カルシウムは移動しにくく、実の先端など新しい組織で不足する。乾燥や窒素・カリの過剰でも誘発される。"},{"type":"ox","q":"リン酸欠乏では、葉が赤紫色を帯びることがある。","a":true,"why":"リン酸不足で糖が使われず色素がたまるため。生育停滞とともに古い葉から現れる。"},{"type":"ox","q":"肥料袋のリン酸はP₂O₅、カリはK₂Oに換算して表示される。","a":true,"why":"窒素はN（元素）そのもので表すが、リン酸とカリは酸化物換算で表示するのが決まりである。"},{"type":"ox","q":"三要素の合計が20％以上の化成肥料を高度化成という。","a":false,"why":"高度化成の基準は三要素合計30％以上。8-8-8は合計24％なので普通化成である。"},{"type":"ox","q":"尿素の窒素含有量はおよそ21％である。","a":false,"why":"尿素は約46％。約21％は硫安（硫酸アンモニウム）の数値で、取り違えやすい。"},{"type":"ox","q":"有機質肥料は、土壌微生物に分解されてから根に吸収される。","a":true,"why":"窒素はタンパク質の形で入っており、無機イオンに分解されないと吸えない。だから遅効性で、低温期は効きにくい。"},{"type":"ox","q":"被覆肥料（コーティング肥料）は、地温が低いほど溶出が速くなる。","a":false,"why":"逆で、地温が高いほど溶出が速い。夏は設計より早く効き切ることがあり、低温期はほとんど出ない。"},{"type":"ox","q":"1000倍希釈の液肥は、水1Lに対して原液1mLで作る。","a":true,"why":"1L＝1000mLを1000で割ると1mL。500倍なら2mL、2000倍なら水2Lに1mLとなる。"},{"type":"ox","q":"球根植物は花が終わったらすぐ葉を切り、施肥もやめてよい。","a":false,"why":"花後の葉が光合成して翌年の球根を太らせる。葉が自然に枯れるまで葉を残し、肥料を切らさない。"},{"type":"mc","q":"次のうち、微量要素ではないものはどれか。","choices":["ホウ素","モリブデン","マグネシウム"],"a":2,"why":"マグネシウムはカルシウム・硫黄とともに中量要素。ホウ素とモリブデンは微量要素8種に含まれる。"},{"type":"mc","q":"葉緑素（クロロフィル）の中心に位置する元素はどれか。","choices":["カルシウム","鉄","マグネシウム"],"a":2,"why":"葉緑素の中心金属はマグネシウム。だから欠乏すると葉が黄化する。鉄は葉緑素の合成に関わるが中心元素ではない。"},{"type":"mc","q":"気孔の開閉や水分調節、光合成産物の転流を担い「根肥」と呼ばれるのはどれか。","choices":["窒素","リン酸","カリ"],"a":2,"why":"カリは体の部品にならずイオンのまま調整役を務める。だから根やイモの肥大、耐病性・耐寒性に効く。"},{"type":"mc","q":"欠乏症が古い葉（下葉）から現れやすい元素はどれか。","choices":["カリ","鉄","カルシウム"],"a":0,"why":"カリは移動しやすいので古い葉から回収され、下葉の葉縁が褐変する。鉄とカルシウムは移動しにくく新葉に出る。"},{"type":"mc","q":"古い葉の葉脈間が黄化し、葉脈だけ緑で残る症状の原因はどれか。","choices":["窒素欠乏","マグネシウム欠乏","ホウ素欠乏"],"a":1,"why":"葉脈間クロロシスはマグネシウム欠乏の典型。窒素欠乏は葉全体が一様に淡く黄化する点で区別できる。"},{"type":"mc","q":"リービッヒの最小律を説明するのに用いられる模型はどれか。","choices":["ドベネックの桶","パスカルの三角形","メンデルの格子"],"a":0,"why":"板の長さを各元素に見立てた桶。最も短い板の高さまでしか水が溜まらない＝最も不足する要素が生育を決める。"},{"type":"mc","q":"過リン酸石灰のリン酸成分量として最も近いものはどれか。","choices":["約5％","約17.5％","約46％"],"a":1,"why":"過リン酸石灰は水溶性リン酸を約17.5％含む。約46％は尿素の窒素、約5％は油かすの窒素の数値。"},{"type":"mc","q":"窒素の単肥で、含有量が約21％のものはどれか。","choices":["尿素","硫安","硫酸カリ"],"a":1,"why":"硫安（硫酸アンモニウム）が約21％。尿素は約46％、硫酸カリはカリ約50％でそもそも窒素肥料ではない。"},{"type":"mc","q":"油かすのおおよその三要素（N-P-K）に最も近いものはどれか。","choices":["5-2-1","2-20-0","8-8-8"],"a":0,"why":"油かすは窒素主体でおおむね5-2-1程度。2-20-0前後は骨粉、8-8-8は普通化成の代表値である。"},{"type":"mc","q":"リン酸を特に多く含む有機質肥料はどれか。","choices":["油かす","草木灰","骨粉"],"a":2,"why":"骨粉はリン酸18〜20％前後を含み、効きは非常にゆっくり。油かすは窒素主体、草木灰はカリと石灰分が主体。"},{"type":"mc","q":"8-8-8の化成肥料を1平方メートルに150g施したとき、窒素成分量はいくらか。","choices":["8g","12g","24g"],"a":1,"why":"150g×8％＝12g。保証成分量は重量パーセントなので、施用量に含有率を掛ければ成分量が出る。"},{"type":"mc","q":"化成肥料と配合肥料の違いの説明として正しいものはどれか。","choices":["化成肥料は原料を混ぜただけ、配合肥料は化学的操作で造粒したもの","化成肥料は化学的操作を加えて造粒したもの、配合肥料は原料を混ぜ合わせたもの","どちらも同義で、有機質を含むか含まないかの違いである"],"a":1,"why":"化学的操作を加えて粒に仕立てるのが化成肥料、原料をブレンドしただけが配合肥料。どちらも複合肥料に含まれる。"},{"type":"mc","q":"IB化成の効き方の説明として正しいものはどれか。","choices":["水に触れると一気に溶けて速効性を示す","微生物に完全分解されないと効かない遅効性である","水と反応して加水分解し、粒が大きいほど長く効く緩効性である"],"a":2,"why":"IB窒素は加水分解でゆっくり尿素に戻る。粒径が大きいほど表面積が小さく、持続が長くなる。"},{"type":"mc","q":"果樹や花木で、開花・収穫後に施して株の消耗を回復させる肥料の呼び名はどれか。","choices":["お礼肥","寒肥","芽出し肥"],"a":0,"why":"お礼肥は花後・収穫後の回復と翌年の花芽づくりのため。寒肥は休眠期、芽出し肥は春の萌芽期に施す。"},{"type":"mc","q":"肥料やけが起こる仕組みとして正しいものはどれか。","choices":["土壌溶液の濃度が根の細胞液より高くなり、根から水が奪われる","肥料の発熱で根が焼けて炭化する","肥料が根の表面をふさいで酸素が届かなくなる"],"a":0,"why":"浸透圧の逆転が本質。水が薄いほうから濃いほうへ移動するため、濃い土壌溶液は根から水を引き抜く。"},{"type":"mc","q":"活力剤（活力材）の位置づけとして正しいものはどれか。","choices":["三要素を高濃度で含み、肥料より速く効く","肥料の保証成分の水準に満たないため肥料には該当せず、肥料の代わりにはならない","特殊肥料に分類され、届出をすれば肥料として流通できる"],"a":1,"why":"活力剤は微量要素やアミノ酸などが中心で、法律上の肥料の保証成分に満たない。三要素の補給にはならない。"}]},{"id":11,"title":"病害虫と薬剤","subtitle":"見分けて、遅らせて、必要なだけ使えるようになる","minutes":55,"goals":["症状を見て、病気・虫害・生理障害のどれかを切り分け、原因に合った手当てを選べる","主な病気と害虫を症状と発生条件から推理し、環境・物理・生物・化学の手段を組み合わせて防げる","農薬のラベル（適用作物・適用病害虫・希釈倍数・使用時期・総使用回数・使用方法）を読み、安全に使い、保管・廃棄まで説明できる"],"sections":[{"heading":"犯人は三人いる — 病気・虫・生理障害","dialogue":[{"who":"客","text":"観葉植物の葉先が茶色く枯れてきて。病気ですよね。いい薬ありますか。"},{"who":"緑川","text":"その前に一つだけ。茶色いのは葉ぜんぶですか。それとも、あちこちに点々と出ていますか。"},{"who":"客","text":"言われてみれば、全部の葉が同じように先だけです。"},{"who":"緑川","text":"なら薬は要りません。肥料の効かせすぎか、水の切らしすぎです。薬をまいても、原因はそのままでお金だけ減ります。"}],"body":"<p>植物の不調の犯人は三人います。<strong>病気（病原体）・虫害（食害や吸汁）・生理障害（環境や栄養の不適）</strong>です。ここを取り違えると、手当てが全部むだになります。殺菌剤は水切れを治しませんし、殺虫剤は日焼けを元に戻しません。</p><p>そこで診断は<strong>逆順</strong>で行います。まず生理障害を疑い、次に虫を探し、最後に病気を考える。理由は単純で、生理障害は「原因が今も続いている」からです。放置すれば必ず再発します。</p><h4>切り分けの4つの問い</h4><ol><li><strong>広がるか</strong> — 病気と虫は隣の葉、隣の株へ移る。生理障害は広がらない。</li><li><strong>一斉か</strong> — 同じ鉢の同じ高さの葉に、そろって同じ症状なら環境要因。</li><li><strong>境目はどうか</strong> — 病気の斑点は健全部との境がはっきりし、輪紋やカビ、周囲の黄変を伴うことが多い。</li><li><strong>痕跡はあるか</strong> — 食べ跡、糞、脱皮殻、光る粘液。葉裏と株元と土の中を必ず見る。</li></ol><p>生理障害でよく出会うのは、水切れ、根詰まり、肥料の濃度障害、日焼け、寒害、そして果菜の尻腐れです。とくに<strong>尻腐れは病気ではありません</strong>。果実の先端までカルシウムが届かず組織が壊れる生理障害で、殺菌剤では止まりません。</p><p>誤診の代償は大きい。生理障害に薬をまけば、原因は残ったまま費用と手間と薬剤の使用回数だけが増えます。逆に、本当は病気なのに「水のやりすぎかな」と放置すれば、伝染性のものは隣の株まで巻き込む。<em>だから、薬に手を伸ばす前の3分間の観察が、いちばん効率のいい防除</em>になります。葉裏、株元、土の中、そして「いつから、どんな順で出たか」を必ず確認してください。</p>","why":"生理障害は原因が今も継続している不調なので、原因を取り除かないかぎり薬剤では絶対に治らない。","keypoints":["診断は「環境（生理障害）→ 虫 → 病気」の順に疑う。逆順にすると原因を残したまま薬をまくことになる","広がる／一斉に出る／境目がはっきりする／痕跡がある、の4点で切り分ける","同じ条件の葉や株に一斉に同じ症状が出て広がらないなら、まず環境か肥料を疑う","尻腐れはカルシウムの移行不足による生理障害で、殺菌剤では治らない","日焼け（葉焼け）は急に強い光へ出したときに起き、白～褐色に抜ける。すでに焼けた組織は元に戻らない","生理障害を病気と誤診して薬剤を使うのは、農薬の不要な使用にあたる"],"table":{"caption":"よくある生理障害と、まぎらわしい症状の見分け","headers":["生理障害","主な症状","本当の原因","見分けの手がかり","手当て"],"rows":[["水切れ","日中しおれる、下葉から枯れ上がる、葉先が茶色","吸水が蒸散に追いつかない／根詰まり","涼しい時間に回復する。株全体に均一","たっぷり潅水、鉢増し・根の整理、置き場所の見直し"],["肥料過多（濃度障害）","葉先・葉縁が茶色く枯れる、生育が止まる、土に白い粉","土壌溶液の濃度が高く根から水を奪う","施肥の直後、全葉に一斉。斑点にならない","水をたっぷり流して肥料分を抜く、施肥を止める"],["日焼け（葉焼け）","葉の日の当たる面が白～褐色に抜ける","急な強光と葉温上昇","光の当たる側だけ。日陰側は健全","徐々に慣らす、遮光。焼けた葉は戻らない"],["寒害・凍害","葉が水浸状になり、のちに褐変・黒変","細胞内の凍結や低温障害","冷え込んだ翌朝に一斉に出る","耐寒温度を守る、防寒、傷んだ部分は暖かくなってから切る"],["尻腐れ","トマト・ピーマンなどの果実の先端が黒くくぼむ","カルシウムの移行不足（水分ムラ・窒素過多が誘因）","果実の先端に限られ、他へ伝染しない","潅水を安定させる、窒素を控える、マルチで乾湿差を減らす"],["鉄・マグネシウム欠乏","葉脈を残して葉が黄化","土壌pHの不適や養分不足","鉄は新葉から、マグネシウムは下葉から出る","pHの矯正、不足要素の補給"]]},"mnemonic":"診断の順は「かん・むし・びょう」＝環境・虫・病気。薬に手を伸ばす前に、まず環境を疑う。"},{"heading":"病原は三タイプ — 治せるもの、治せないもの","dialogue":[{"who":"客","text":"キュウリの葉がまだらに黄緑になって、縮れてきました。効く薬をください。"},{"who":"緑川","text":"……モザイク病かもしれません。もしそうなら、効く薬はありません。"},{"who":"ハナ","text":"ないんですか。殺菌剤でも？"},{"who":"緑川","text":"ウイルスだからです。カビや細菌と違って、植物の細胞の中に入り込んで増える。薬で叩けば植物も一緒に死んでしまう。だから対策は、抜き取ることと、運び屋のアブラムシを止めることになります。"}],"body":"<p>植物の病気を起こす病原は、大きく三つです。<strong>糸状菌（カビ）・細菌・ウイルス</strong>。この三つは、伝染のしかたも、薬が効くかどうかも違います。</p><p><strong>糸状菌</strong>は植物病害の大半を占めます。胞子をつくり、風、雨のはね上がり、水、土、種子を通じて広がる。多くは多湿で活発になります（うどんこ病は例外で、乾き気味を好みます）。殺菌剤という武器があり、予防にも、初期なら治療にも使えます。</p><p><strong>細菌</strong>は自力で植物に穴を開けられません。<em>傷口や気孔、水孔から水と一緒に入り込む</em>のが特徴です。したがって高温多湿と、風雨・作業でついた傷が引き金になります。使える薬剤は糸状菌用より限られ、防除の主役は「傷をつけない・水はねさせない・排水をよくする」になります。</p><p><strong>ウイルス</strong>は生きた細胞の中でしか増えません。運び屋はアブラムシ、アザミウマ、コナジラミなどの吸汁性害虫、そして<strong>汁液（手・はさみ・作業）</strong>です。治療薬は存在しません。発病株はためらわず抜いて処分し、道具を消毒し、媒介虫を減らす。それが唯一の対策です。</p><p>現場での見分け方も覚えておくと役に立ちます。糸状菌はルーペで見ると病斑の上に胞子やカビが見えることが多い。細菌病は組織が水浸状に崩れ、軟腐病では強い悪臭がします。青枯病では、しおれた茎を切って水に浸すと白い菌の泥が糸を引いて出てきます。ウイルスは葉の模様（モザイク・縮れ・萎縮）が中心で、病斑にカビも腐りも伴いません。</p>","why":"病原の種類が伝染経路と薬剤の有無を決めるので、まず「カビか、細菌か、ウイルスか」を決めれば打つ手が自動的に決まる。","keypoints":["植物の病気の大半は糸状菌（カビ）によるもので、胞子が風・水はね・土で伝染する","細菌は傷口や気孔から水とともに侵入する。高温多湿と傷が引き金になり、有効薬剤は限られる","ウイルスに治療薬はない。発病株の抜き取り処分、道具の消毒、媒介虫（アブラムシ・アザミウマ・コナジラミ）の防除が対策","ウイルスは汁液でも伝染するので、発病株を触った手やはさみで健全株を扱わない","うどんこ病は糸状菌だが乾燥気味で多発する例外。多湿＝カビと単純化しない","すす病のように、害虫の排せつ物を栄養にして二次的に発生するカビもある"],"table":{"caption":"病原三タイプの比較","headers":["病原","代表的な病気","主な伝染経路","多発しやすい条件","薬剤で治せるか"],"rows":[["糸状菌（カビ）","うどんこ病、灰色かび病、べと病、さび病、炭疽病、黒星病、疫病、白絹病、立枯病","胞子が風で飛ぶ、雨や潅水の水はね、土壌、種子、被害残さ","多湿・過繁茂（うどんこ病は乾燥気味）","殺菌剤が有効。予防剤が基本、初期なら治療剤も効く"],["細菌","軟腐病、青枯病、かいよう病、根頭がんしゅ病","傷口・気孔・水孔から水とともに侵入、土壌、汚染水","高温多湿、風雨や作業でついた傷、排水不良","有効薬剤は限られる。予防と環境改善が中心"],["ウイルス","モザイク病、萎縮病、えそ症状","アブラムシ・アザミウマ・コナジラミなどの媒介虫、汁液（手・器具）、種子や栄養繁殖体","媒介虫の多い時期、連作・持ち越し","治療薬はない。抜き取り処分と媒介虫防除のみ"]]},"mnemonic":"「カビは薬あり、細菌は限られ、ウイルスは抜く」。三段階で覚える。"},{"heading":"病気図鑑 — 湿って出る病気、乾いて出る病気、土から来る病気","dialogue":[{"who":"ハナ","text":"うどんこ病とべと病、名前は似ているのに対策が逆だと聞きました。"},{"who":"緑川","text":"そう。どちらも葉に白っぽいものが出ますが、うどんこ病は表面に白い粉、べと病は葉裏に霜のようなカビで、表は葉脈で区切られた角ばった黄色い斑。そして出る条件が逆です。"},{"who":"ハナ","text":"うどんこは乾き気味、べとは多湿……。"},{"who":"緑川","text":"だから梅雨に慌てて水を控えたらうどんこが増えた、なんてことも起きる。病名より、発生条件で覚えるほうが現場では役に立ちます。"}],"body":"<p>病名を丸暗記する必要はありません。<strong>症状の見た目・発生条件・どこから来るか</strong>の三点で束ねると、対処はほぼ共通になります。</p><p><strong>多湿で出る病気</strong>が最大グループです。べと病、疫病、灰色かび病、炭疽病、黒星病、軟腐病。共通の対策は、風通しをよくする、株を混ませない、水はねを防ぐマルチ、雨よけ、そして<em>傷んだ花や葉を早く取り除く</em>ことです。灰色かび病がまず花がらから出るのは、弱った組織が最良の入口だからです。</p><p><strong>乾いて出る病気</strong>の代表がうどんこ病。日照不足、窒素過多、昼夜の温度差でも増えます。同じ条件で増えるハダニと合わせて「乾燥コンビ」で覚えると便利です。</p><p><strong>土から来る病気</strong>は最も厄介です。根こぶ病、青枯病、立枯病・苗立枯病、白絹病。病原が土に残るため、地上部に薬をかけても届きません。<strong>連作を避け、清潔な用土を使い、水はけを直し、被害株と残さを畑の外へ持ち出す</strong>。これが本筋になります。</p><p>そして<strong>すす病</strong>。これは葉が黒くすすけますが、原因はアブラムシやカイガラムシの排せつ物（甘露）で、そこにカビが繁殖したものです。<em>害虫を退治すれば、新しい発生は止まります</em>。</p><p>こうして並べると、対策が三つに集約されるのが見えてきます。<strong>空気から来るものには風通しと予防散布、水はねで来るものにはマルチと雨よけ、土に残るものには輪作と清潔な用土</strong>。病名が増えても、打つ手はこの三つの組み合わせから外れません。</p>","why":"病原が「空気から来るか、水はねで来るか、土に残るか」で伝染経路が決まり、経路を断つ場所が対策そのものになるから。","keypoints":["うどんこ病は葉の表面に白い粉、乾燥気味・日照不足・窒素過多で多発。べと病は多湿で、葉裏に霜状のカビ・表は葉脈で区切られた角形の斑","すす病はアブラムシ・カイガラムシ・コナジラミの排せつ物にカビが生えたもの。原因害虫の防除が根本対策","モザイク病はウイルス病でアブラムシが媒介する。治らないので抜き取りと媒介虫防除","根こぶ病はアブラナ科に出る土壌伝染性の病気で、酸性土壌で多発しやすい。石灰によるpH矯正と連作回避が有効","青枯病は細菌病で、ナス科が高温期に葉の色を保ったまま急にしおれる。土壌伝染するので連作を避け接ぎ木苗を使う","苗立枯病は育苗期に地際がくびれて倒れる。清潔な用土、過湿と過密を避けることが予防になる"],"table":{"caption":"主な病気の早見表","headers":["病名","病原","特徴的な症状","多発条件","対策の要点"],"rows":[["うどんこ病","糸状菌","葉や茎の表面に白い粉をふいたようになる","乾燥気味、日照不足、窒素過多、昼夜の温度差","風通し、窒素を控える、早期に薬剤（予防・治療）"],["灰色かび病（ボトリチス）","糸状菌","花や果実、葉が褐変し灰色のカビに覆われる","低温多湿、傷んだ花がらや傷口","花がら摘み、換気、過湿回避"],["べと病","糸状菌","葉脈で区切られた角形の黄～褐色斑、葉裏に霜状のカビ","多湿、雨続き、水はね","水はね防止、排水、密植回避、予防散布"],["さび病","糸状菌","葉に橙～褐色の粉状の小さな盛り上がり","多湿と適温、窒素過多","被害葉の除去処分、風通し"],["炭疽病","糸状菌","円形～不整形の褐色斑、中央がくぼみ灰白色になる","高温多湿、雨のはね上がり","マルチ、雨よけ、被害部の除去"],["黒星病","糸状菌","バラなどの葉に黒い斑点、周囲が黄変し落葉","梅雨など雨の多い時期、水はね","雨よけ、落葉の処分、予防散布の継続"],["すす病","糸状菌（二次的）","葉や枝が黒いすすで覆われたようになる","アブラムシ・カイガラムシ・コナジラミの発生","原因となる害虫を防除する（これが根本対策）"],["モザイク病","ウイルス","葉に濃淡のモザイク模様、縮れ、萎縮","媒介するアブラムシの多発、汁液伝染","抜き取り処分、媒介虫防除、器具の消毒"],["立枯病・苗立枯病","糸状菌","育苗期に地際がくびれ、苗が倒れて枯れる","過湿、過密、汚れた用土や古い用土","清潔な用土、播種量を控える、換気と排水"],["根こぶ病","糸状菌","アブラナ科の根に大小のこぶができ生育不良","酸性土壌、多湿、連作","石灰でpHを矯正、連作回避、排水改善"],["青枯病","細菌","ナス科などが葉の緑を保ったまま急激にしおれる","高温期、土壌伝染、連作","連作回避、接ぎ木苗、排水改善、発病株の抜き取り"],["軟腐病","細菌","組織が水浸状に崩れて腐り、悪臭がする","高温多湿、傷口、排水不良","傷をつけない、排水、密植回避、被害株の処分"],["白絹病","糸状菌","株元に白い絹糸状の菌糸、菜種状の褐色の菌核","高温期、有機物の未熟な土、多湿","被害株と周囲の土を処分、排水と日当たり"],["疫病","糸状菌","葉や茎、果実が水浸状に暗褐色となり急速に広がる","多雨・多湿、低め～適温、水はね","マルチ、雨よけ、排水、早期の予防散布"]]},"mnemonic":"「うどんこは乾き、べとは湿り」。白いものが表なら乾燥、裏なら多湿。"},{"heading":"害虫図鑑 — 食べ跡から犯人を推理する","dialogue":[{"who":"客","text":"朝見たら、植えたばかりの苗が根元からポキッと倒れていて。犯人が見当たらないんです。"},{"who":"ハナ","text":"鳥……ですか？"},{"who":"緑川","text":"地際でスパッと切れていたなら、ネキリムシです。夜に出てきて茎を切り、昼は株元の土に潜っている。倒れた苗のまわりの土を、指で2〜3センチ掘ってごらんなさい。丸まった幼虫が出てきます。"},{"who":"ハナ","text":"現場に犯人が残っているんですね。"}],"body":"<p>害虫は「口の形」で二つに分かれます。<strong>かじって食べる食害性</strong>（チョウやガの幼虫、甲虫）と、<strong>針で刺して汁を吸う吸汁性</strong>（アブラムシ、ハダニ、コナジラミ、カイガラムシ、アザミウマ）です。この違いが被害の見た目を決めます。</p><p>食害性は穴やかじり跡を残す。吸汁性は穴を開けず、色が抜けたり、かすれたり、縮れたりします。さらに吸汁性の一部は<strong>ウイルスを媒介し、排せつ物ですす病を招く</strong>ので、被害は見た目以上に大きくなります。</p><h4>覚えておきたい例外と危険</h4><p><strong>ハダニは昆虫ではありません</strong>。クモの仲間で、脚は8本。だから多くの殺虫剤が効きにくく、<em>殺ダニ剤</em>を使います。高温乾燥を好み葉裏に付くので、葉裏への葉水が予防になります。世代が短く抵抗性がつきやすい代表格でもあります。</p><p><strong>チャドクガには絶対に触らない</strong>こと。毒針毛が無数に抜け落ちて風で飛び、触れなくても皮膚炎を起こします。脱皮殻や死んだ幼虫にも毒針毛は残ります。見つけたら葉ごと枝を切り取り、袋に密封して処分します。イラガも刺されると激痛が走ります。</p><p>もうひとつ忘れがちなのが<strong>見えない場所の犯人</strong>です。ネキリムシとコガネムシの幼虫は土の中、センチュウは根の中、カミキリムシの幼虫（テッポウムシ）は幹の中にいます。地上部にいくら薬をかけても届きません。<em>しおれ・ぐらつき・株元のおがくず</em>という間接的なサインから、土と幹を疑う習慣をつけてください。</p>","why":"口の形（かじるか吸うか）と生活場所（葉裏・土中・幹の中）が被害の見え方と有効な薬剤を決めるので、痕跡から逆算できる。","keypoints":["ハダニはクモの仲間で高温乾燥に多発し、葉裏に付く。殺虫剤ではなく殺ダニ剤を使い、葉裏への葉水が予防になる","アブラムシは新芽に群生して吸汁し、ウイルスを媒介し、甘露ですす病とアリを招く","ハモグリバエ（エカキムシ）の幼虫は葉の内部を食べるため接触剤が届きにくく、浸透移行性の薬剤や潜っている先端の捕殺が有効","ヨトウムシは若齢のうちは集団で葉裏にいて表皮を残してかすり状に食べる。大きくなると夜行性で土に隠れ、薬剤も効きにくくなる","カイガラムシは殻やロウ質に覆われて薬剤が効きにくく、ふ化直後の歩き回る幼虫期が防除の好機。冬季にはマシン油剤も使われる","チャドクガの毒針毛は抜け落ちて飛散し、脱皮殻や死骸にも残る。素手で扱わず枝ごと切り取り密封処分する"],"table":{"caption":"被害の跡から犯人を推理する","headers":["見えている症状","疑うべき犯人","どこを探すか","対処の方向"],"rows":[["葉に大きな穴、輪郭のはっきりした食べ跡と黒い糞","アオムシ、ヨトウムシなどチョウ・ガの幼虫","葉裏、新芽、糞の落ちている真上","捕殺、若齢期にBT剤やチョウ目に有効な薬剤"],["葉脈だけ残して網目状、株が丸坊主","ヨトウムシの多発、ハムシ類","夜間の株元、昼は土中","夕方～夜の見回りと捕殺、若齢のうちに防除"],["表皮を残して薄皮のようにかすれる","コナガ、若齢のヨトウムシ","葉裏","早期発見、防虫ネット、系統を替えた薬剤"],["白く曲がりくねった線が葉に描かれる","ハモグリバエ（エカキムシ）","線の先端（幼虫がいる）","先端を指でつぶす、浸透移行性の薬剤"],["葉が白くかすれ、葉裏に細かい点。ひどいとクモの巣状","ハダニ","葉裏","葉裏に葉水、殺ダニ剤を系統を替えて"],["葉や花弁が銀白色にこすれたようになる、花が傷む","アザミウマ（スリップス）","花の中、新芽の隙間","青色粘着トラップ、防虫ネット（細目）"],["新芽がベタベタし、やがて黒くすすける。アリが往復","アブラムシ、カイガラムシ、コナジラミ","新芽、葉裏、枝の分かれ目","害虫を退治すればすす病も止まる"],["白い小さな虫が葉を揺らすと舞い上がる","コナジラミ","葉裏","黄色粘着トラップ、細目の防虫ネット"],["苗が地際でスパッと切られて倒れる","ネキリムシ","株元の土中2〜3cm","掘って捕殺、株元に誘引殺虫粒剤"],["鉢植えが急にしおれ、株を持つとぐらつく","コガネムシの幼虫","鉢の土の中、根のまわり","植え替えて捕殺、土壌用の薬剤"],["不規則な穴と、光る粘液の筋","ナメクジ","夜間の株元、鉢底やレンガのすき間など湿った暗所","誘引殺虫粒剤、隠れ場所をなくす"],["株元におがくず状の木くずが盛り上がる","カミキリムシの幼虫（テッポウムシ）","幹の根元の穴","穴に登録のある薬剤を注入し、穴をふさぐ"],["根にこぶ状のふくらみ、生育不良（アブラナ科以外でも）","ネコブセンチュウ","根","輪作、対抗植物の利用、土壌の管理"],["食べ跡がないのに株が急にしおれる","害虫ではなく病気（青枯病など）や根の障害","株元、根、水はけ","病気か生理障害かを切り分けてから対処"]]},"mnemonic":"「穴はかじる虫、かすれは吸う虫」。穴が開いていなければ吸汁性かダニを疑う。"},{"heading":"出させない防除 — 耕種・物理・生物、そしてIPM","dialogue":[{"who":"客","text":"毎年きまってアブラムシがすごくて。もっと強い薬はありませんか。"},{"who":"緑川","text":"強くする前に、肥料の量を教えてください。よく効かせているでしょう。"},{"who":"客","text":"元気に育つように、多めにやっています。"},{"who":"緑川","text":"そこです。窒素が多いと株は軟弱に伸びて組織が柔らかくなり、汁の中のアミノ酸も増える。虫にとってはごちそうの看板が立っている状態です。薬を強くするより、肥料を減らすほうがよく効きます。"}],"body":"<p>防除には四つの手があります。<strong>耕種的・物理的・生物的・化学的</strong>。上の三つで発生そのものを減らし、それでも足りないときだけ薬剤を使う。この組み立て方を<strong>IPM（総合的病害虫・雑草管理）</strong>といいます。</p><p>IPMの要点は目標設定にあります。<em>病害虫をゼロにするのではなく、被害が実害にならない水準に抑える</em>。ゼロを狙うと散布回数が増え、抵抗性を育て、天敵まで殺してしまうからです。</p><h4>耕種的防除は「育て方で防ぐ」</h4><p>適地適作、健全な苗、密植を避けて風通しを確保する、水はけを直す、<strong>窒素過多を避ける</strong>、連作を避けて輪作する、清潔な用土を使う、被害葉や残さを畑の外へ持ち出す。地味ですが、効果はいちばん大きい。窒素過多が虫と病気を同時に呼ぶのは、軟弱徒長して組織が柔らかくなるからです。</p><h4>物理的・生物的防除</h4><p>防虫ネットは<strong>目合いが命</strong>で、相手の体の大きさより細かくないと素通りされます。粘着トラップは色で誘引します。天敵にはテントウムシ、ヒラタアブやクサカゲロウの幼虫、アブラムシに卵を産む寄生バチなどがあり、BT剤や微生物農薬は農薬として登録された生物由来の資材です。</p><p>そして全体を支えるのが<strong>見回り</strong>です。週に一度でも葉裏をめくって数を把握しておけば、少ないうちに手で取れる。手遅れになってから強い薬に頼るより、はるかに安く、確実で、天敵も残ります。IPMとは要するに、観察を防除の一部として組み込む考え方です。</p>","why":"発生してから叩くより、発生条件（過湿・過繁茂・窒素過多・連作）を消すほうが確実で、薬剤の使用回数そのものを減らせるから。","keypoints":["IPMは病害虫をゼロにするのではなく、被害が問題にならない水準に抑える考え方。予防・観察・多手段の組み合わせが柱","窒素過多は軟弱徒長を招き、アブラムシなどの吸汁性害虫とうどんこ病を同時に増やす","防虫ネットは目合いが相手より細かくなければ効かない。アザミウマやコナジラミには細目が必要","粘着トラップは黄色がアブラムシ・コナジラミ・ハモグリバエ、青色がアザミウマに誘引効果が高い","シルバーマルチは光の反射で有翅アブラムシの飛来を妨げ、同時に水はねによる病気の伝染も抑える","BT剤はチョウ目の幼虫に選択的に働く微生物農薬で、天敵や人畜への影響が小さい"],"table":{"caption":"防除の4分類と具体策","headers":["分類","考え方","具体的な手段","長所と限界"],"rows":[["耕種的防除","育て方と環境で発生条件をなくす","適地適作、健全な種苗、接ぎ木苗、密植回避、風通し、排水改善、窒素過多を避ける、輪作・連作回避、清潔な用土、残さと被害葉の持ち出し処分、コンパニオンプランツ","効果は根本的で費用も小さいが、効き目が出るまで時間がかかる"],["物理的防除","近づけない・取り除く","防虫ネット（目合いを相手に合わせる）、黄色／青色の粘着トラップ、シルバーマルチ、袋かけ、捕殺、水で洗い流す、雨よけ","薬剤に頼らず即効性もあるが、手間がかかり規模に限界がある"],["生物的防除","生きものの力を借りる","テントウムシ・ヒラタアブ・クサカゲロウ・寄生バチなどの天敵、BT剤、微生物農薬","環境負荷が小さいが効果は穏やかで、広く効く殺虫剤と併用すると天敵ごと失う"],["化学的防除","薬剤で直接減らす","登録農薬の適正使用、系統を替えたローテーション散布","即効性と確実性が高いが、抵抗性・薬害・飛散のリスクを伴う。最後の手段に置く"]]},"mnemonic":"防除は「こう・ぶつ・せい・か」＝耕種・物理・生物・化学。化学は最後に置く。"},{"heading":"農薬という制度 — 登録番号とラベルがすべて","dialogue":[{"who":"客","text":"家にある虫よけスプレー、庭のアリに使うやつなんですけど、キャベツのアオムシにも使えますよね。虫は虫でしょう。"},{"who":"緑川","text":"使えません。それは農薬ではないからです。"},{"who":"ハナ","text":"同じ殺虫成分でも、ですか？"},{"who":"緑川","text":"成分の問題ではなく、制度の問題です。植物にかけてよいのは、農林水産省の登録を受けた農薬だけ。登録には『どの植物に、どの病害虫に、どれだけ、いつまで』という試験の裏づけが要る。裏づけのないものを野菜にかけたら、食べる人の安全を誰も保証できません。"}],"body":"<p>日本で農薬は<strong>農薬取締法</strong>で管理されています。作物や樹木を害する菌・虫・ダニ・線虫・ねずみ・雑草などの防除に使う薬剤に加え、<strong>植物成長調整剤や展着剤</strong>も農薬に含まれます。</p><p>販売されている農薬には必ず<strong>農林水産省登録第○○○○号</strong>の表示があります。登録は「この植物に、この病害虫に、この濃度と回数なら、効果があり、薬害が出ず、残留も安全」という試験結果に対して与えられたものです。だから<em>登録の範囲を一歩出た瞬間、その保証は消えます</em>。</p><h4>ラベルで必ず確認する6項目</h4><ol><li><strong>適用作物</strong>（適用植物）— かけてよい植物。書いていない作物には使えない</li><li><strong>適用病害虫</strong> — 効果が確認された相手</li><li><strong>希釈倍数・使用量</strong> — 濃くすれば薬害、薄すぎれば効かず抵抗性を招く</li><li><strong>使用時期</strong> — 「収穫○日前まで」。残留を安全な範囲に収めるための線</li><li><strong>総使用回数</strong> — その作物に使える上限回数（成分ごとに数える）</li><li><strong>使用方法</strong> — 散布、株元散布、灌注など</li></ol><p>なお重曹や食酢のように、原材料に照らして安全性が明らかとして指定された<strong>特定農薬（特定防除資材）</strong>もありますが、指定されたもの以外を自作して農薬代わりに使うことはできません。</p><p>店頭に並ぶ「家庭園芸用」の小さなボトルも、<strong>れっきとした農薬</strong>です。少量で希釈がいらず扱いやすい規格というだけで、ラベルを守る義務は業務用とまったく同じ。<em>使い切れる量だけ買い、使った日・場所・作物・薬剤名を記録しておく</em>と、総使用回数の管理が楽になります。</p>","why":"登録は「この植物・この病害虫・この使い方」という条件つきの安全保証なので、条件を外れた使用は効果も安全性も裏づけを失うから。","keypoints":["農薬は農薬取締法に基づく登録制度で管理され、容器に農林水産省登録番号が表示されている","ラベルで確認する6項目は、適用作物・適用病害虫・希釈倍数・使用時期（収穫前日数）・総使用回数・使用方法","適用作物に書かれていない植物に使ってはいけない。効果も薬害も残留の安全性も確認されておらず、法にも違反する","家庭園芸用農薬は少量で使いやすい規格というだけで、ラベル遵守の義務は業務用とまったく同じ","植物成長調整剤や展着剤も農薬に含まれ、登録を受けている","特定農薬（特定防除資材）は重曹や食酢など安全性が明らかとして指定されたもので、指定外の自家製資材は農薬として使えない"],"table":{"caption":"「虫の薬」に見える4つの区分 — 植物に使えるのはどれか","headers":["区分","根拠となる制度","主な対象","植物に使えるか","主な内容"],"rows":[["農薬として登録されている製品","農薬取締法（農林水産省登録）","作物・花木・芝生の病害虫と雑草、野ねずみ","使える（ラベルの適用範囲内に限る）","殺虫殺菌剤、殺虫剤（エアゾール・ハンドスプレー・粒剤・粉剤・水で希釈する製品）、殺菌剤、除草剤、農薬肥料、植物成長調整剤、展着剤、殺鼠剤"],["生活害虫防除剤協議会に登録されている製品","業界団体の自主基準","住まいまわりの不快害虫（アリ、ムカデ、ハチ、クモ、シロアリ、カメムシ、ナメクジ、コバエなど）","使えない","接触剤・誘引剤・忌避剤。粉剤、スプレー、エアゾール、粒剤、ボックス型など"],["医薬部外品として登録されている製品","医薬品医療機器等法（薬機法）","人の保健衛生上の害虫（ヤブ蚊など）、屋内のねずみ","使えない","ヤブ蚊用のエアゾール・スプレー、忌避剤、殺鼠剤（食毒剤）"],["忌避剤・資材類","薬剤として殺すことを目的としない資材","のら猫・のら犬、ねずみ、鳥、モグラ、ヘビ、ヤモリ、コケなど","植物の病害虫防除には使えない","忌避粒剤・スプレー、粘着シート、捕獲用資材、コケ用の駆除資材など"]]},"mnemonic":"「植物にかけていいのは、登録番号のあるものだけ」。番号がなければ、その製品は植物用ではない。"},{"heading":"剤型と効き方 — なぜ同じ薬を続けてはいけないのか","dialogue":[{"who":"客","text":"去年よく効いた薬を今年も同じように使っているのに、だんだん効かなくなってきて。古くなったんでしょうか。"},{"who":"緑川","text":"薬より、相手が変わったんです。同じ効き方の薬を続けると、たまたまその効き方に耐えられる個体だけが生き残って子孫を残す。数年でその子孫ばかりになる。"},{"who":"ハナ","text":"薬が弱ったんじゃなくて、虫が強くなった……。"},{"who":"緑川","text":"だから対策は『違う効き方の薬に替える』。商品名を替えても、同じ系統なら意味がありません。ラベルの成分と系統を見るんです。"}],"body":"<p>同じ有効成分でも、<strong>剤型</strong>が違えば使い方も向き不向きも変わります。そのまま使えるエアゾールやスプレー、株元にまく粒剤や粉剤、水に希釈する水和剤・乳剤・液剤・フロアブル、密閉空間で使うくん煙剤。粒剤は飛散が少なく、浸透移行性のものは根から吸われて株全体に回ります。</p><p><strong>効き方</strong>は三つの軸で整理します。第一に<strong>接触剤か浸透移行性か</strong>。接触剤はかかったところだけ効くので葉裏まで丁寧にかける必要があり、浸透移行性は植物に吸収されて内部から効くのでかけムラや葉に潜む虫に強い。第二に<strong>予防剤（保護殺菌剤）か治療剤か</strong>。予防剤は葉の表面に膜を作り侵入を防ぐので<em>発病前</em>に。治療剤は侵入後の菌にも働きますが、進んだ病気を元に戻すわけではありません。第三に<strong>選択性か非選択性か</strong>。</p><p>そして<strong>薬剤抵抗性</strong>。世代の短いハダニ、コナガ、アザミウマ、アブラムシや病原菌で起きやすく、同じ<strong>作用機構（系統）</strong>の連用が原因です。RACコードなど作用機構の分類を手がかりに、<em>系統の異なる薬剤をローテーション</em>します。薄すぎる散布も抵抗性を助長します。</p><p><strong>展着剤</strong>は薬液の表面張力を下げ、はじきやすい葉や虫の体に薬液をぬれ広がらせる補助剤です。入れすぎは薬害の原因になります。</p><p>なお乳剤やフロアブルには界面活性剤があらかじめ含まれていることが多く、その場合は展着剤を加える必要がありません。<em>迷ったらラベルの「使用方法」に従う</em>。足すか足さないかも、そこに書かれています。</p>","why":"抵抗性は「効かない個体だけが選抜されて増える」進化の結果なので、選抜の圧力そのもの（同じ作用機構の連用）を分散させるしかない。","keypoints":["接触剤はかかった部分だけに効くので葉裏まで丁寧に。浸透移行性は植物体内に吸収され、吸汁性害虫や葉に潜る虫に有効","予防（保護）殺菌剤は発病前に葉面を覆って侵入を防ぐ。発病後にまいても効果は限られる","抵抗性対策は作用機構（系統）の異なる薬剤のローテーション。商品名を替えても同じ系統なら意味がない","規定より薄い濃度での散布は効果不足のうえ抵抗性の発達を助長する。希釈倍数は必ず守る","粒剤は飛散が少なく株元処理に向き、浸透移行性のものは根から吸収されて株全体に効く","展着剤は薬液の付着・ぬれ広がりを高める補助剤で、それ自体も農薬として登録されている"],"table":{"caption":"主な剤型と使い方","headers":["剤型","形状・状態","使い方","特徴と注意"],"rows":[["粉剤","細かい粉末","そのまま散布","希釈不要で手軽だが粒子が細かく飛散しやすい"],["粒剤","小さな粒","そのまま株元や土壌に散布","飛散が少なく扱いやすい。浸透移行性のものは根から吸収され持続する"],["水和剤","水に溶けない粉末","水に懸濁させて散布","よくかき混ぜて使う。沈殿しやすいので散布中も撹拌する"],["乳剤","油に溶かし乳化剤を加えた液","水で希釈すると白濁","付着性が高い一方、薬害が出やすい植物もあるので濃度を厳守"],["液剤・水溶剤","水に溶ける液体・粉末","水で希釈して散布","溶けるので均一。計量しやすい"],["フロアブル（懸濁剤）","微粒子を液体に懸濁","水で希釈して散布","粉立ちがなく計量が容易"],["エアゾール","ガス圧で噴射","そのまま噴射","近づけすぎると低温で薬害（凍害）が出る。適切な距離を保つ"],["ハンドスプレー","希釈済みの液","そのまま散布","少量・手軽。広い面積には向かない"],["くん煙剤・くん蒸剤","煙やガス","密閉空間で使用","温室など閉鎖空間向け。使用中は人が入らない"]]},"mnemonic":"「接触は表面、浸透は内側」「予防は前、治療は初期」。効き方を先に決めてから薬を選ぶ。"},{"heading":"除草剤の選び方と、安全にまく・しまう・捨てる","dialogue":[{"who":"客","text":"空き地用に買った強い除草剤が余ったので、家庭菜園の通路にもまこうと思って。"},{"who":"緑川","text":"それは止めてください。その製品には作物のある場所で使う登録がありません。畑の通路にまけば、根は土の中でつながっています。作物が枯れるだけでなく、法にも触れます。"},{"who":"ハナ","text":"同じ『除草剤』でも、まく場所で別物なんですね。"},{"who":"緑川","text":"そう。除草剤はまず『どこにまくか』で選ぶ。次に『生えている草を枯らすのか、これから生える草を抑えるのか』です。"}],"body":"<p>除草剤は二つの軸で決まります。ひとつは<strong>処理のしかた</strong>。生えている草の葉茎にかけて吸収させる<strong>茎葉処理型</strong>と、土の表面に処理して発芽してくる雑草を抑える<strong>土壌処理型</strong>です。土壌処理型は大きく育った草には効きにくく、逆に効果が長く続きます。もうひとつは<strong>選択性</strong>。イネ科だけ、あるいは広葉雑草だけに効く<strong>選択性</strong>と、かかった緑をすべて枯らす<strong>非選択性</strong>があります。芝生用は、日本芝（イネ科）を残して広葉雑草を枯らす選択性を利用したものです。芝の種類によって適用が違うので、日本芝用を西洋芝に使えば薬害が出ます。</p><h4>安全に使うための約束</h4><ul><li>気温の高い日中を避け、風のない早朝か夕方に。必要な量だけ作り、作り置きしない</li><li>マスク・手袋・長袖長ズボン・ゴーグル・帽子。散布中は飲食も喫煙もしない</li><li>洗濯物や布団、隣家、通行人、ペット、池や水槽の魚、開花中の花に来るミツバチへの飛散に配慮する</li><li>終わったら手・顔を洗いうがいをし、衣類は別に洗う。器具はその場で洗い、洗浄水は散布した場所に処理する</li><li>保管は元の容器のまま、食品と分け、子どもの手の届かない鍵のかかる冷暗所へ</li><li>空容器はよく洗い、地域のルールに従って処分。再利用しない</li></ul><p>とくに除草剤は<strong>飛散事故の多い薬剤</strong>です。非選択性のものは霧が数メートル流れただけで隣家の草花や自分の庭木を枯らします。風の弱い日を選び、ノズルを絞って低い位置から、必要な範囲だけに。散布した場所には、しばらく人やペットを入れないようにします。</p>","why":"除草剤は「まく場所」に対して登録されており、非農耕地用には作物への適用がないため、作物のある場所で使えば薬害と法令違反の両方が起こる。","keypoints":["茎葉処理型は生えている雑草にかけて枯らす。土壌処理型は土の表面を処理して発芽してくる雑草を抑え、効果が長く続く","非選択性除草剤はかかった植物をすべて枯らす。選択性はイネ科だけ、広葉だけなど対象が限られる","芝生用除草剤は日本芝と西洋芝で適用が異なり、適用外の芝に使えば薬害が出る","家の周り・空き地用（非農耕地用）の除草剤は、作物や樹木のある場所には使えない","散布は高温の日中を避け、無風の早朝か夕方に。防護具を着け、飛散（洗濯物、隣家、ペット、魚、ミツバチ）に配慮する","保管は元の容器のまま食品と分け、子どもの手の届かない鍵のかかる冷暗所。余った薬液は持ち越さず、空容器は洗って地域のルールで処分する"],"table":{"caption":"除草剤の分け方","headers":["分け方","タイプ","働き方","使いどころと注意"],"rows":[["処理の方法","茎葉処理型","生えている草の葉や茎から吸収されて枯らす","草が伸びてから。処理後に植え付けできるものもあるが、必ずラベルで確認する"],["処理の方法","土壌処理型","土壌表面に層を作り、発芽してくる雑草を抑える","草の生える前に。効果が長く続くため、樹木の根の下や作物のある場所では使えないものが多い"],["効く相手","選択性","イネ科だけ、または広葉雑草だけに効く","芝生の中の雑草を抜かずに枯らせる。芝の種類（日本芝／西洋芝）で適用が異なる"],["効く相手","非選択性","かかった植物をすべて枯らす","残したい植物にかけない。風のある日は散布しない"],["使う場所","作物のある場所に使える製品","農作物・樹木・芝生などへの適用登録がある","適用作物と使用時期を守る"],["使う場所","家の周り・空き地用（非農耕地用）","宅地、駐車場、空き地などが使用場所","畑、家庭菜園、庭木の下などには使えない。使用は法令違反となる"]]},"mnemonic":"除草剤は「どこに・いつ・何を残すか」の3問で選ぶ。場所の登録が最優先。"}],"quiz":[{"type":"ox","q":"すす病は、アブラムシやカイガラムシの排せつ物を栄養にしてカビが繁殖する病気なので、原因となる害虫を防除すれば新たな発生は止まる。","a":true,"why":"すす病は害虫の甘露に発生する二次的な病気である。したがって根本対策は殺菌剤ではなく、原因となる吸汁性害虫の防除になる。"},{"type":"ox","q":"うどんこ病は多湿の条件で最も多発するため、乾いた晴天が続く時期は心配しなくてよい。","a":false,"why":"うどんこ病は糸状菌の病気だが例外的に乾燥気味の条件で多発する。多湿で出るのはべと病、疫病、灰色かび病などである。"},{"type":"ox","q":"ハダニは昆虫ではなくクモの仲間で、高温乾燥の条件で葉裏に多発する。","a":true,"why":"ハダニは脚が8本のダニの仲間なので一般の殺虫剤が効きにくく、殺ダニ剤を用いる。葉裏への葉水が予防になる。"},{"type":"ox","q":"モザイク病はウイルスによる病気で治療薬がないため、発病株の抜き取りと媒介するアブラムシの防除が対策の中心になる。","a":true,"why":"ウイルスは植物の細胞内で増えるため薬剤で叩けない。伝染源を断ち、運び屋を減らすことしか手がない。"},{"type":"ox","q":"農薬ラベルの使用時期に「収穫7日前まで」とある場合、収穫の7日前を過ぎてからは散布してはいけない。","a":true,"why":"収穫前日数は残留を安全な範囲に収めるための期限で、これより収穫に近い時期の散布は認められない。"},{"type":"ox","q":"家庭園芸用農薬は少量で扱いやすい規格なので、ラベルの適用作物に書かれていない野菜に使ってもかまわない。","a":false,"why":"規格が小さいだけで農薬であることに変わりはない。適用作物以外への使用は効果も薬害も残留の安全性も裏づけがなく、法にも違反する。"},{"type":"ox","q":"薬剤抵抗性を避けるには、商品名の異なる薬剤を交互に使えばそれで十分である。","a":false,"why":"重要なのは作用機構（系統）が異なることである。商品名が違っても同じ系統ならローテーションにならない。"},{"type":"ox","q":"展着剤は、薬液の表面張力を下げて葉や害虫の体への付着とぬれ広がりをよくするために加える補助剤である。","a":true,"why":"はじきやすい葉や毛のある葉で効果が上がる。ただし入れすぎは薬害の原因になる。展着剤も農薬として登録されている。"},{"type":"ox","q":"家の周り・空き地用として登録された除草剤は、庭の家庭菜園や庭木の下にも使うことができる。","a":false,"why":"非農耕地用の製品には作物や樹木への適用登録がない。作物のある場所での使用は薬害を招くうえ法令違反になる。"},{"type":"ox","q":"土壌処理型の除草剤は、すでに大きく育った雑草の茎葉にかけて枯らすタイプである。","a":false,"why":"説明が逆である。土壌処理型は土の表面に処理して発芽してくる雑草を抑える。生えている草にかけるのは茎葉処理型。"},{"type":"ox","q":"青枯病や軟腐病は細菌による病気で、糸状菌の病気に比べて有効な薬剤が限られるため、発病させない環境づくりが防除の中心になる。","a":true,"why":"細菌は傷口や気孔から水とともに侵入する。傷をつけない、水はねさせない、排水をよくすることが要になる。"},{"type":"ox","q":"農薬の散布は、薬害と作業者への影響を避けるため、気温の高い日中を避けて風のない早朝や夕方に行う。","a":true,"why":"高温時は薬害が出やすく、作業者の体調悪化も招く。風のある日は飛散するため散布しない。"},{"type":"ox","q":"散布して余った薬液は、次回のためにペットボトルなどに移し替えて保管しておくとよい。","a":false,"why":"薬液は必要な量だけ調製し、持ち越さない。別容器への移し替えは誤飲事故のもとで、保管は必ず元の容器のまま行う。"},{"type":"ox","q":"ネキリムシの被害を受けた苗は地際で切られて倒れ、犯人は昼間、株元の土の中に潜んでいることが多い。","a":true,"why":"夜間に地際を食害し、日中は株元の土中2〜3cmに隠れる。倒れた苗のまわりを掘れば見つかることが多い。"},{"type":"ox","q":"尻腐れは果実に糸状菌が侵入して起こる病気なので、殺菌剤の散布で治すことができる。","a":false,"why":"尻腐れは果実の先端までカルシウムが行き渡らないことで起こる生理障害である。潅水の安定と窒素の控えめな施用が対策になる。"},{"type":"ox","q":"IPM（総合的病害虫・雑草管理）は、栽培している場所から病害虫を完全にゼロにすることを目標とする考え方である。","a":false,"why":"IPMの目標は被害が実害にならない水準に抑えることである。ゼロを狙うと散布が増え、抵抗性の発達と天敵の減少を招く。"},{"type":"mc","q":"葉の表面に、白く曲がりくねった線がだんだん伸びていく被害が出た。犯人として最も疑わしいのは。","choices":["ハモグリバエの幼虫","ハダニ","うどんこ病"],"a":0,"why":"葉の内部を食べ進む食害痕で、エカキムシとも呼ばれる。葉の中にいるので接触剤が届きにくく、線の先端を指でつぶすか浸透移行性の薬剤を使う。"},{"type":"mc","q":"次のうち、乾燥気味の条件で多発しやすい病気はどれか。","choices":["べと病","うどんこ病","疫病"],"a":1,"why":"べと病と疫病は多湿で広がる。うどんこ病は糸状菌の病気だが乾き気味で多発し、日照不足や窒素過多も誘因になる。"},{"type":"mc","q":"生物的防除にあたるものはどれか。","choices":["防虫ネットで覆う","シルバーマルチを敷く","BT剤を散布する"],"a":2,"why":"BT剤はチョウ目幼虫に選択的に働く微生物農薬で、生物的防除にあたる。防虫ネットとシルバーマルチは物理的防除である。"},{"type":"mc","q":"アザミウマの誘殺に最も効果が高いとされる粘着トラップの色は。","choices":["青色","黄色","白色"],"a":0,"why":"アザミウマは青色に、アブラムシ・コナジラミ・ハモグリバエは黄色に誘引されやすい。色の使い分けが観察と捕殺の精度を上げる。"},{"type":"mc","q":"農薬のラベルにある「総使用回数」の意味として正しいのは。","choices":["1日のうちに散布してよい回数","その作物の栽培期間中に使用できる上限の回数","希釈液を作り直してよい回数"],"a":1,"why":"作物ごとに、収穫までに使える回数の上限を示す。成分ごとに数えるため、同じ成分を含む別製品との合計で判断する。"},{"type":"mc","q":"浸透移行性の薬剤の特徴として正しいのは。","choices":["かかった部分の表面だけで効くため葉裏まで丁寧にかける必要がある","病原菌の侵入前に葉面を覆う膜を作る","植物に吸収されて体内を移行するため、かけムラや葉に潜む虫にも効きやすい"],"a":2,"why":"植物体内に取り込まれて全体に回るので、吸汁性害虫や葉に潜る虫に有効。1つ目は接触剤、2つ目は予防（保護）殺菌剤の説明である。"},{"type":"mc","q":"鉢植えの草花が急にしおれ、株を持ち上げるとぐらつく。まず疑うべきものは。","choices":["うどんこ病","アザミウマ","コガネムシの幼虫による根の食害"],"a":2,"why":"土中で根が食べられているため、水をやってもしおれ、株が固定されずぐらつく。植え替えて幼虫を捕殺する。"},{"type":"mc","q":"根こぶ病への対策として適切なのは。","choices":["土壌を酸性に保ち、アブラナ科を毎年同じ場所で栽培する","石灰でpHを矯正し、アブラナ科の連作を避ける","殺虫剤を株元に散布する"],"a":1,"why":"根こぶ病は酸性土壌と多湿、連作で多発する土壌伝染性の糸状菌病である。pHの矯正、輪作、排水改善が基本になる。"},{"type":"mc","q":"カイガラムシの薬剤防除で、最も効果が上がりやすい時期は。","choices":["ふ化して歩き回っている幼虫の時期","殻を厚くまとった成虫の時期","卵が産みつけられる前"],"a":0,"why":"成虫は殻やロウ質に覆われて薬剤が届きにくい。ふ化直後の移動期がねらい目で、成虫はブラシでこすり落とすのが確実である。"},{"type":"mc","q":"剤型のうち、微粒子が液体に懸濁していて粉立ちがなく、計量しやすいものは。","choices":["水和剤","粉剤","フロアブル（懸濁剤）"],"a":2,"why":"フロアブルは液状で粉が舞わず扱いやすい。水和剤は水に溶けない粉末で沈殿しやすく、粉剤はそのまま散布する粉である。"},{"type":"mc","q":"日本芝の芝生に生えた広葉雑草だけを枯らしたい。選ぶべきものは。","choices":["非選択性の茎葉処理型除草剤","適用のある選択性の芝生用除草剤","空き地用の長期持続型土壌処理剤"],"a":1,"why":"選択性を利用すれば芝を残して広葉雑草を枯らせる。ただし日本芝用と西洋芝用で適用が異なるため、芝の種類を必ず確認する。"},{"type":"mc","q":"特定農薬（特定防除資材）として指定されているものはどれか。","choices":["食酢","灯油","台所用洗剤"],"a":0,"why":"重曹や食酢などが、原材料に照らして安全性が明らかなものとして指定されている。指定外の自家製資材を農薬として使うことはできない。"},{"type":"mc","q":"生活害虫防除剤協議会に登録された不快害虫用の薬剤について、正しい説明は。","choices":["農薬より弱いので野菜にも安心して使える","農林水産省の登録番号がついている","植物の病害虫防除に使う登録はなく、作物や草花には使えない"],"a":2,"why":"住まいまわりの不快害虫を対象とした製品で、植物への適用はない。植物に使えるのは農林水産省の登録を受けた農薬だけである。"},{"type":"mc","q":"窒素肥料を効かせすぎると害虫がつきやすくなる主な理由は。","choices":["土壌が酸性になり根が傷むから","軟弱徒長して組織が柔らかくなり、体内の養分組成も虫に好まれるものになるから","葉の色が濃くなり虫から見つかりやすくなるから"],"a":1,"why":"窒素過多は徒長と組織の軟弱化を招き、吸汁性害虫とうどんこ病を同時に増やす。施肥量の見直しは立派な防除である。"},{"type":"mc","q":"ミツバチへの影響を避けるために、農薬散布で特に避けるべき場面は。","choices":["作物の開花中の散布","曇りの日の夕方の散布","収穫の1か月前の散布"],"a":0,"why":"花に飛来する時期の散布は訪花昆虫への影響が大きい。開花中の散布を避け、周辺の養蜂にも配慮する。"},{"type":"mc","q":"防虫ネットの目合いについて正しいのは。","choices":["目合いが粗くても害虫は物理的に入れないので効果は変わらない","目合いが細かいほど風通しがよくなり株が健全に育つ","アザミウマやコナジラミのような微小害虫には、より細かい目合いが必要になる"],"a":2,"why":"ネットは相手の体の大きさより細かくなければ素通りされる。一方で細かいほど通気は悪くなるため、対象と時期に合わせて選ぶ。"}]},{"id":12,"title":"園芸用具と一年の作業","subtitle":"道具の選び方から水やり・剪定・芝生まで、作業の理屈がわかる","minutes":50,"goals":["用具・はさみ・支柱・被覆資材を、目的から逆算して選び分けられる","水やりと剪定を「なぜそうするか」の理屈つきで説明でき、忌み枝と切る位置を判断できる","芝生・生垣・冬の管理と年間の作業カレンダーを組み立て、安全に作業できる"],"sections":[{"heading":"手道具の基本 ― 掘る・削る・ならす・まく","dialogue":[{"who":"客","text":"花壇を始めたいんですけど、道具って何をそろえればいいんですか。売り場に似たようなものが多くて。"},{"who":"ハナ","text":"私も『スコップ』と『シャベル』の違いが説明できなくて、いつも言葉を濁しちゃうんです。"},{"who":"緑川","text":"道具は名前で覚えると混乱する。『土に何をする道具か』で並べ直すと、一気に整理がつくよ。掘る、削る、ならす、まく、の4つだ。"}],"body":"<p>園芸用具は名称から覚えると混乱する。<strong>土に対して何をするか</strong>で分類すると迷わない。</p><h4>掘る・すくう道具</h4><p><strong>移植ごて</strong>（ハンドスコップ）は苗の植え付けや鉢への用土入れに使う基本の道具。刃に目盛りが刻まれたものは植え穴の深さの目安になる。大型のものが<strong>スコップ・シャベル</strong>で、先のとがった<strong>剣先型</strong>は硬い土や根に食い込ませて掘るのに、平らな<strong>角形</strong>は土や堆肥をすくって運ぶ・表面をならすのに向く。なお呼び名は地域差があり、東日本と西日本で「スコップ」「シャベル」が指すものが入れ替わる傾向があるため、接客では形を確認してから話すとよい。</p><p><strong>くわ</strong>は打ち下ろして土を起こす道具。刃が一枚の<strong>平ぐわ</strong>は畝立てや土寄せに、刃が三本に分かれた<strong>備中ぐわ</strong>は粘土質の硬い土に刃が入りやすく、土塊を砕くのに向く。</p><h4>削る・ならす道具</h4><p><strong>ねじり鎌</strong>は刃を寝かせて土の表面を薄く削り、雑草を根元から切る道具。草を引き抜かず削るので、土を大きく動かさずに済む。柄の長い<strong>三角ホー</strong>（草削り）なら立ったまま広い面積を削れ、腰への負担が小さい。<strong>レーキ（熊手）</strong>は整地と、落ち葉・小石・刈りかすの集草に使う。<strong>ふるい</strong>は用土の粒をそろえる道具で、細かい<strong>みじん（微塵）</strong>を抜くと排水と通気がよくなる。</p><h4>水と薬液をまく道具</h4><p><strong>ジョウロ</strong>の<strong>ハス口</strong>は向きで水の出方が変わる。<strong>上向き</strong>にすると水がいったん上へ散ってから落ちるため、雨のようにやわらかく降り、まき床や幼苗を崩さない。<strong>下向き</strong>にすると勢いと水量が増し、株元や広い面へたっぷり与えられる。ハス口を外せばピンポイントの潅注になる。<strong>噴霧器</strong>は、ポンプで空気を圧縮しておく<strong>蓄圧式</strong>と、モーターで連続散布できる<strong>電動式</strong>があり、面積と作業時間で選ぶ。</p>","why":"道具は形が作業を決めるので、「土に何をするか」から逆算すれば名称に頼らず正しく選べるから。","keypoints":["移植ごて＝植え付け・用土入れの基本。目盛り付きは深さの目安になる","剣先型は硬い土を掘る、角形はすくう・ならす。呼称は東西で入れ替わる地域差がある","備中ぐわ（三本ぐわ）は硬い土・粘土質を砕くのに向く","ねじり鎌は土の表面を削って除草、三角ホーは柄が長く立ったまま作業できる","ふるいは用土のみじんを抜いて排水・通気を確保する","ハス口は上向き＝やわらかく細かい水、下向き＝勢いよく多量","噴霧器は蓄圧式（手押しで加圧）と電動式（連続散布）"],"table":{"caption":"作業目的から選ぶ手道具","headers":["やりたいこと","適した道具","選ぶ理由"],"rows":[["苗を植える・鉢に土を入れる","移植ごて","片手で扱え、植え穴の深さを測れる"],["硬い土を掘り起こす","剣先スコップ／備中ぐわ","とがった刃・分かれた刃が土に食い込む"],["土や堆肥をすくって運ぶ","角形スコップ","平らな刃で量をすくえ、表面もならせる"],["畝を立てる・土寄せする","平ぐわ","一枚刃で土を寄せて形をつくれる"],["立ったまま除草する","三角ホー（草削り）","柄が長く、表土を削って草を切れる"],["用土の粒をそろえる","ふるい","みじんを除いて排水・通気を確保"],["種まき後にやさしく水をやる","ジョウロ（ハス口上向き）","水が散ってから落ち、床を崩さない"],["薬液を広い面積に散布","蓄圧式・電動噴霧器","圧力で霧が均一になり付着がよい"]]},"mnemonic":"ハス口は「上向きやさしく、下向き強く」。種まきの後は必ず上を向ける。"},{"heading":"はさみ類の使い分けと刃の手入れ","dialogue":[{"who":"客","text":"この剪定ばさみ、枯れ枝はよく切れるのに、生きた枝を切ると切り口がつぶれちゃって。"},{"who":"ハナ","text":"あ、それアンビル式ですね。……緑川さん、なんでアンビル式だと切り口がつぶれるんですか。"},{"who":"緑川","text":"刃が『受け台に押しつける』構造だからだよ。まな板に包丁を当てるのと同じ。生きた枝はすれ違う刃で切るほうがいい。"}],"body":"<p>はさみは<strong>切る対象の太さと組織</strong>で選ぶ。同じ「切る」でも構造が違えば切り口が変わり、切り口の状態が枝の回復を左右する。</p><h4>剪定ばさみの二つの方式</h4><p><strong>バイパス式</strong>は二枚の刃がすれ違って切る、はさみと同じ構造。切り口が平滑で組織のつぶれが小さいため、<strong>生きた枝</strong>に向く。<strong>アンビル式</strong>は片方の刃を金属の受け台（アンビル）に押しつけて切る構造で、小さい力で太いものを切れるが、枝を押しつぶす方向に力がかかる。<strong>枯れ枝や硬い枝</strong>向きと覚える。切り口がつぶれると乾燥や腐朽菌の侵入を招くので、生きた枝ではバイパス式が基本になる。</p><h4>用途別のはさみ</h4><ul><li><strong>園芸ばさみ</strong>：草花の茎、細い枝、ひもなど万能に使う</li><li><strong>植木ばさみ</strong>：握りの輪が大きく、指を入れて細かく操作できる。庭木の細枝向き</li><li><strong>刈込ばさみ</strong>：両手で使う長い刃。生垣や玉物の<strong>面</strong>をそろえる</li><li><strong>芽切りばさみ</strong>：刃先が細く、込み入った場所の芽や細枝を摘む</li><li><strong>高枝切りばさみ</strong>：脚立に登らずに高所の枝を切れ、転落事故を減らせる</li><li><strong>剪定のこぎり</strong>：はさみで切れない太枝用。引くときに切れる構造で、力任せに押さない</li></ul><h4>刃の手入れと消毒</h4><p>使用後は樹液・ヤニ・土を落とし、<strong>水気を完全に拭き取って乾かし</strong>、可動部と刃に油をさす。切れない刃は組織をつぶすので、道具の手入れは植物の健康の問題でもある。さらに重要なのが<strong>消毒</strong>で、病株を切ったはさみをそのまま次の株に使うと病原体を運んでしまう。とくにウイルス病は汁液で伝染するため、株ごと・作業ごとにアルコールなどで刃を拭う習慣をつける。</p>","why":"刃の構造が切り口の状態を決め、切り口の平滑さと清潔さが枝の回復と伝染の有無を左右するから。","keypoints":["バイパス式＝刃がすれ違う。切り口がきれいで生きた枝向き","アンビル式＝受け台に押しつける。力は要らないがつぶれやすく枯れ枝・硬い枝向き","刈込ばさみは面をそろえる道具、植木ばさみ・芽切りばさみは枝や芽を選んで切る道具","太枝はのこぎり。引くときに切れるので押しつけない","高枝切りばさみは脚立作業を減らし、転落事故の予防になる","手入れは洗浄→乾燥→注油。切れ味の低下は切り口をつぶす","病気の伝染を防ぐため、株ごとに刃をアルコール等で消毒する"],"table":{"caption":"はさみ類の使い分け","headers":["名称","主な対象","特徴・注意"],"rows":[["園芸ばさみ","草花の茎・細枝・ひも","万能型。太枝には使わない"],["剪定ばさみ（バイパス式）","生きた枝（目安2cm程度まで）","刃がすれ違い切り口が平滑"],["剪定ばさみ（アンビル式）","枯れ枝・硬い枝","受け台方式。押しつぶすので生枝に不向き"],["刈込ばさみ","生垣・玉物の表面","両手で持ち面をそろえる。枝を選ばない"],["植木ばさみ","庭木の細枝","大きな輪で細かい操作ができる"],["芽切りばさみ","芽・込み入った細枝","刃先が細く狭い場所に入る"],["剪定のこぎり","太枝（2〜3cm以上）","引き切り。押すと刃が曲がる"],["高枝切りばさみ","高所の枝","脚立を使わずに済み安全性が高い"]]},"mnemonic":"「バイパスは生、アンビルは枯れ」。生きた枝はすれ違わせて切る。"},{"heading":"支柱・誘引と被覆資材","dialogue":[{"who":"客","text":"アサガオを鉢で育てたら、つるが行き場をなくして絡まってしまって。"},{"who":"ハナ","text":"鉢なら「あんどん仕立て」ですね。……あと、去年うちのキュウリ、ひもで縛ったら茎に食い込んじゃったんです。"},{"who":"緑川","text":"茎は太るからね。ひもは『8の字』で、支柱側をきつく、茎側をゆるく。これだけで食い込みは起きない。"}],"body":"<p>植物を支える資材と、環境を調整する被覆資材は、どちらも<strong>足りない条件を人が補う</strong>ための道具である。</p><h4>支柱と誘引</h4><p>支柱は倒伏を防ぎ、葉を立体的に配置して受光量を増やす。鉢のつる性植物には3〜4本の支柱に輪状にひもを回す<strong>あんどん仕立て</strong>、庭では塔状の<strong>オベリスク</strong>、壁面には格子状の<strong>トレリス</strong>や<strong>フェンス</strong>を使う。誘引には<strong>麻ひも</strong>（自然に分解するので放任でも締めつけが残りにくい）や<strong>ビニタイ</strong>（着脱しやすい）を用いる。</p><p>結び方の基本が<strong>8の字がけ</strong>である。ひもを支柱と茎の間で交差させ、支柱側は固く、茎側は指1本入る余裕をもたせて結ぶ。こうすると<strong>茎が肥大しても締めつけず</strong>、風で揺れても茎が支柱に擦れて傷つかない。ぐるりと一重に巻いて締めると、生長した茎に食い込んで水と養分の通り道をふさいでしまう。</p><h4>被覆資材</h4><p><strong>寒冷紗</strong>は粗く織った布で、白は防虫・防霜・弱い遮光、黒は遮光に使う。<strong>遮光ネット</strong>は遮光率で選び、夏の強光による葉焼けと地温上昇を抑える。<strong>不織布</strong>は軽く、作物に直接かける<strong>べたがけ</strong>ができ、保温と防霜、初期の防虫に有効。<strong>ビニールトンネル</strong>は保温力が大きい反面、晴天日は内部が高温になるため<strong>換気（すそ上げ）が必須</strong>である。<strong>防虫ネット</strong>は<strong>目合い</strong>で効果が決まり、目的の害虫より細かい目を選ぶ。<strong>マルチフィルム</strong>は地温・雑草・水分を同時に管理でき、<strong>鉢底ネット</strong>は用土の流出と、鉢底からの害虫侵入を防ぐ。</p>","why":"茎は生長とともに太るため、締めつけない結び方でなければ自分の生長で自分を絞めてしまうから。","keypoints":["8の字がけ＝支柱側は固く、茎側はゆるく。茎の肥大と擦れ傷を防ぐ","鉢のつる性はあんどん仕立て、庭はオベリスク、壁面はトレリス・フェンス","麻ひもは分解する、ビニタイは着脱が容易","寒冷紗は白＝防虫・防霜、黒＝遮光。不織布はべたがけできる","ビニールトンネルは高温障害を避けるため換気が必須","防虫ネットは目合いが命。対象害虫より細かい目を選ぶ","マルチは色で働きが違い、鉢底ネットは用土流出と害虫侵入を防ぐ"],"table":{"caption":"被覆資材とマルチの働き","headers":["資材","主な目的","使い方・注意"],"rows":[["寒冷紗（白）","防虫・防霜・弱い遮光","トンネル状に張る。風でめくれないよう裾を留める"],["寒冷紗（黒）・遮光ネット","遮光・地温上昇の抑制","遮光率で選ぶ。かけっぱなしは徒長の原因"],["不織布","保温・防霜・初期の防虫","軽いので作物に直接べたがけできる"],["ビニールトンネル","保温（早出し・寒さ除け）","晴天日は必ず換気。高温障害に注意"],["防虫ネット","害虫の侵入遮断","目合いを対象害虫に合わせる。すき間を作らない"],["黒マルチ","雑草抑制＋地温上昇","光を通さず雑草が育たない"],["透明マルチ","地温上昇（保温力が最大）","光が通るのでマルチ下に雑草が生える"],["シルバー（銀色）マルチ","アブラムシ忌避・地温上昇の抑制","反射光を虫が嫌う。夏の高温対策にも"],["敷きわら","乾燥・泥はね・土の固結防止","夏の地温上昇も和らげる"]]},"mnemonic":"誘引は「支柱きつく、茎ゆるく、間で8の字」。"},{"heading":"水やり3年 ― 灌水の技術","dialogue":[{"who":"客","text":"毎日欠かさず水をあげていたのに、葉がしおれて枯れました。水が足りなかったんでしょうか。"},{"who":"ハナ","text":"毎日……あ、もしかして逆ですか。"},{"who":"緑川","text":"そう、根腐れだ。しおれる症状は水不足と同じに見えるから、みんなさらに水をやってとどめを刺してしまう。『水やり3年』と言われるのはここが難しいからだよ。"}],"body":"<p>水やりの原則はひとつ、<strong>「乾いたらたっぷり」</strong>である。乾く前にやるのでも、少量をこまめにやるのでもない。</p><h4>なぜ「たっぷり」なのか</h4><p>鉢底から流れ出るまで与えるのには理由がある。水が土の隙間を通り抜けるとき、<strong>古い空気と老廃物・余分な塩類を押し出し、後から新しい空気を引き込む</strong>。つまりたっぷりの水やりは<strong>土の換気</strong>でもある。表面だけ湿らせる少量の水やりでは、下層が乾いたままで根が深く伸びず、肥料成分も溜まりやすい。</p><h4>なぜ「乾いたら」なのか</h4><p>常に湿っていると土の隙間が水で埋まり、<strong>酸素が欠乏して根が呼吸できなくなる</strong>。根は機能を失い、やがて腐敗菌が増えて<strong>根腐れ</strong>に至る。根が吸えなくなるので地上部はしおれる。これが水切れと同じ姿に見えるのが厄介で、追い水をすると悪化する。<strong>しおれたら、まず鉢の重さと土の湿り具合を確かめる</strong>のが鉄則だ。</p><h4>乾き具合の見分けと時刻</h4><p>鉢を<strong>持ち上げて軽い</strong>、表土が白っぽく乾く、<strong>指を第一関節まで挿して湿りがない</strong>、割り箸を挿して確認する、水分計を使う――複数の手がかりで判断する。時刻は<strong>夏は早朝と夕方</strong>（日中は鉢内の水温と地温が上がり根を傷める）、<strong>冬は暖かい午前中</strong>（夕方は夜間に凍結する恐れ）が基本。<strong>地植え</strong>は根が張れば降雨でほぼ足りるが、植え付け1年目と夏の乾燥期は必要。<strong>鉢植え</strong>は土量が限られ乾きやすいので毎日確認する。</p>","why":"土の隙間は水と空気が奪い合う場所であり、常に水で満たすと根が酸素を得られず呼吸できなくなるから。","keypoints":["原則は「乾いたらたっぷり」。鉢底から流れ出るまで与える","たっぷりの水やりは古い空気と老廃物・塩類を押し出し、新しい空気を引き込む","常時湿った土は酸素欠乏を招き、根腐れの原因になる","根腐れのしおれは水切れと見分けがつきにくい。まず鉢の重さと土の湿りを確認","夏は早朝と夕方、冬は暖かい午前中","地植えは根が張れば降雨中心、鉢植えは土量が少なく毎日確認が必要","留守中は腰水・給水キャップ・自動潅水などで対応するが、常時腰水は根腐れを招く"],"table":{"caption":"留守にするときの水やり対策","headers":["方法","仕組み","向く期間・注意"],"rows":[["日陰にまとめて置く","蒸散と乾燥を抑える","1〜2日。風の当たらない半日陰へ"],["腰水（受け皿に水）","鉢底から吸い上げる","短期のみ。常時腰水は酸素欠乏で根腐れ"],["給水キャップ・給水器","容器の水が少しずつ供給される","数日。土質で出方が変わるので事前に試す"],["吸水ひも（毛細管現象）","水を張った容器から布ひもで導く","数日〜1週間。ひもの太さで量が変わる"],["自動潅水タイマー","設定時刻に一定量を送る","長期。電池切れとノズル詰まりを事前点検"]]},"mnemonic":"「乾いたらたっぷり、乾かぬうちはやらぬ」。しおれたらまず鉢を持ち上げる。"},{"heading":"剪定の目的・適期・忌み枝","dialogue":[{"who":"客","text":"去年の秋にツツジをきれいに刈り込んだんです。そうしたら今年、花がほとんど咲かなくて。"},{"who":"ハナ","text":"刈り込みすぎ……ではなく、時期ですか。"},{"who":"緑川","text":"そう。ツツジは花のあとすぐ、夏には翌年の花芽ができている。秋に刈るというのは、花芽を全部切り落とすということなんだ。"}],"body":"<p>剪定の目的は、<strong>採光・通風の確保、樹形の維持、樹勢の更新、花つき・実つきの調整、大きさの制限</strong>である。とくに枝が混むと内部が暗く風が通らず、病害虫の温床になる。透かすこと自体が防除でもある。</p><h4>適期は「体力」と「花芽」で決まる</h4><p><strong>落葉樹</strong>は葉を落とした<strong>休眠期</strong>が基本。枝ぶりが見えて骨格を作りやすく、養分が根と幹に蓄えられているため切っても負担が小さい。ただし厳寒期の強い切り込みは避ける。<strong>常緑樹</strong>は寒さで傷むため冬の強剪定を避け、<strong>芽出し前の春</strong>と、伸びが落ち着く<strong>梅雨明け前後から初秋</strong>に行う。<strong>花木</strong>は<strong>花が終わったらすぐ</strong>が原則。多くの花木は初夏から夏にかけて翌年の花芽を作るので、それ以降に切ると花芽ごと落としてしまう。</p><h4>二つの切り方</h4><p><strong>間引き剪定（枝抜き・透かし）</strong>は枝を<strong>付け根から</strong>切り除く方法。全体の大きさや樹形を変えずに密度だけを下げられ、強い萌芽を誘発しにくい。<strong>切り返し剪定（切り詰め）</strong>は枝の<strong>途中で</strong>切る方法で、切り口近くの芽が動いて枝数が増え、勢いが強くなる。強く切り詰める<strong>強剪定</strong>は樹形を作り直せる反面、徒長枝が多発し花つきが落ちやすい。<strong>弱剪定</strong>は樹への負担が小さく、形を保つ手入れ向き。</p><h4>忌み枝</h4><p>樹形を乱し、光と風をさえぎる枝を<strong>忌み枝</strong>と呼び、優先して取り除く。まず忌み枝を抜き、それでも混んでいれば透かす、という順で進めると切りすぎを防げる。</p>","why":"多くの花木は前年の夏までに翌年の花芽を作るため、剪定の適期は樹の体力と花芽形成の時期の両方で決まるから。","keypoints":["剪定の目的は採光・通風・樹形・更新・花つきと大きさの調整","落葉樹は落葉後の休眠期、常緑樹は芽出し前の春と梅雨明け前後〜初秋","花木は花後すぐ。花芽分化後に切ると翌年咲かない","間引き剪定＝付け根から切る。大きさを変えず密度を下げる","切り返し剪定＝途中で切る。芽が動いて枝数が増え勢いが強くなる","強剪定は徒長枝を招きやすく、花つきが落ちることがある","忌み枝を先に抜いてから全体を透かす"],"table":{"caption":"代表的な忌み枝","headers":["名称","どんな枝か","困ること"],"rows":[["徒長枝","真上に長く強く伸びた枝","樹形を乱し養分を独占、花がつきにくい"],["からみ枝","他の枝に絡む・交差する枝","擦れて傷つき、内部が混む"],["逆さ枝","樹の内側へ向かって伸びる枝","ふところが混み、通風と採光を妨げる"],["平行枝","同じ方向に重なって並ぶ枝","一方が余分。下の枝が日陰になる"],["車枝","1か所から放射状に3本以上出た枝","その部分だけ太り、樹形が不自然になる"],["胴吹き枝","幹の途中から直接出る細い枝","樹形を乱す（樹勢回復に使う場合を除く）"],["ひこばえ","根元から出る枝","養分を奪い、株元が混む"],["下がり枝（垂れ枝）","下向きに垂れる枝","樹形を乱し、下枝を暗くする"]]},"mnemonic":"花木は「咲いたらすぐ切る」。夏を越したはさみは翌年の花を切る。"},{"heading":"切る位置と、摘む作業のすべて","dialogue":[{"who":"客","text":"パンジーの花がら、面倒だから放っておいてもいいですよね。どうせ次の花が咲くんでしょう。"},{"who":"ハナ","text":"……あ、それ、咲かなくなるやつです。理由、緑川さん!"},{"who":"緑川","text":"花のあとには種ができる。種を作るのは植物にとって最大の仕事で、そこへ養分が全部流れる。花がらを摘むのは『まだ種の季節じゃないよ』と伝える作業なんだ。"}],"body":"<p>枝や茎をどこで切るかは、<strong>次にどの芽を動かしたいか</strong>で決まる。切ったあとに伸びるのは、切り口のすぐ下にある芽だからである。</p><h4>外芽と内芽、そして切る位置</h4><p>枝の外側を向いた芽が<strong>外芽</strong>、内側を向いた芽が<strong>内芽</strong>。<strong>外芽の上で切る</strong>と枝は外向きに伸び、樹冠が広がって内部が混まない。内芽で切ると枝が内側へ向かい、ふところが暗くなる。切る位置は<strong>芽（節）の5mm〜1cmほど上</strong>で、芽と反対側へわずかに傾けて切るのが基本。芽に近すぎると芽が乾いて枯れ、遠すぎると残った部分が枯れ込んで腐朽の入口になる。太い枝はまず下側から浅く切り込み、次に外側から上を切り落として<strong>裂けを防ぐ</strong>。切り口が大きい場合は<strong>癒合剤（保護剤）</strong>を塗り、乾燥と腐朽菌の侵入を防ぐ。</p><h4>摘む作業は「行き先を変える」操作</h4><p><strong>摘心（ピンチ）</strong>は茎の先端を摘む作業。先端は<strong>頂芽優勢</strong>によって下のわき芽の伸長を抑えているので、先端を取れば抑制が解けてわき芽が動き、枝数と花数が増える。<strong>摘芽（芽かき）</strong>は逆に不要なわき芽を取り、養分を残した部分へ集中させる。<strong>摘蕾・摘花</strong>はつぼみや花を減らし、残したものを大きく充実させる。<strong>花がら摘み</strong>は咲き終わった花を取り除く作業で、<strong>種子形成へ養分が転換されるのを防ぐ</strong>とともに、腐った花弁から出る灰色かび病の発生源を断つ意味もある。<strong>切り戻し</strong>は伸びて乱れた株を短く刈り、新しい芽を吹かせて咲き直させる更新作業である。</p>","why":"先端の芽がわき芽を抑え、花のあとの種子形成が養分を独占するので、摘む作業は養分と生長の行き先を切り替える操作になるから。","keypoints":["外芽の上で切ると外向きに伸び、樹冠が広がって内部が混まない","切る位置は芽の5mm〜1cm上、芽と反対側へ軽く斜めに","太枝は下から切り込んでから落とし、樹皮の裂けを防ぐ","大きな切り口には癒合剤を塗り、乾燥と腐朽菌の侵入を防ぐ","摘心は頂芽優勢を解除してわき芽を伸ばし、枝数・花数を増やす","摘芽は不要なわき芽を除いて養分を集中させる（摘心とは逆の操作）","花がら摘みの主目的は種子形成への養分転換を防ぐこと。病気予防にもなる","切り戻しは株を短く刈って新芽を吹かせ、咲き直させる更新"],"table":{"caption":"「摘む」作業の使い分け","headers":["作業","何を取るか","ねらい"],"rows":[["摘心（ピンチ）","茎の先端の生長点","頂芽優勢を解いてわき芽を伸ばし、枝数・花数を増やす"],["摘芽（芽かき）","不要なわき芽","養分を残す枝に集中させ、混みを防ぐ"],["摘蕾","余分なつぼみ","残したつぼみを大きく充実させる"],["摘花","咲いている花","株の消耗を防ぎ、株づくりを優先する"],["花がら摘み","咲き終わった花","種子形成への養分転換を防ぎ、次の花を咲かせる。病気予防"],["切り戻し","伸びて乱れた茎の上部","新しい芽を吹かせて草姿を整え、咲き直させる"]]},"mnemonic":"「先を摘めば横が出る、花がらを摘めば次が咲く」。摘む＝行き先の切り替え。"},{"heading":"芝生の管理 ― 日本芝と西洋芝","dialogue":[{"who":"客","text":"芝生が冬に茶色くなるんです。枯れたと思って、去年張り替えてしまいました。"},{"who":"ハナ","text":"えっ、それ、休眠していただけでは……。"},{"who":"緑川","text":"日本芝は暖地型だから、冬は地上部が枯れたようになって休むんだ。春になれば地下茎からまた出てくる。冬も緑がほしいなら寒地型の西洋芝という選択になるけれど、今度は夏に弱い。"}],"body":"<p>芝生は<strong>生育温度帯</strong>で二つに分かれる。ここを外すと、管理も張り替えの判断も全部ずれる。</p><h4>暖地型と寒地型</h4><p><strong>日本芝</strong>（コウライシバ、ノシバなど）は<strong>暖地型</strong>で、夏に旺盛に伸び、冬は地上部が褐色になって<strong>休眠</strong>する。枯死ではないので、春に地下茎から萌芽する。コウライシバは葉が細かく密で観賞性が高く、ノシバは葉が粗いが丈夫で踏圧に強い。<strong>西洋芝</strong>の多くは<strong>寒地型</strong>（ケンタッキーブルーグラス、ベントグラス、ペレニアルライグラス、トールフェスクなど）で、冷涼な春秋によく育ち冬も緑を保つ反面、高温多湿の夏に弱り<strong>夏枯れ</strong>を起こしやすい。ティフトンなどバミューダグラス系は西洋芝でも暖地型に属する。</p><h4>刈り込みと更新作業</h4><p>刈り込みは<strong>生育期にこまめに</strong>行い、<strong>一度に葉の3分の1以上を刈らない</strong>のが原則。深く刈って生長点まで切ってしまうと<strong>軸刈り</strong>となり、葉が再生せず回復が非常に遅れる。伸ばしてから一気に刈るのが最も危険である。刈りかすや枯れ葉が層になって溜まったものを<strong>サッチ</strong>といい、通気と透水を妨げ病害の原因になるので<strong>サッチング</strong>で掻き出す。踏圧で土が固まったら<strong>エアレーション（穴あけ）</strong>で通気と排
