<style>
:root{
  --bg:#f6f4ee; --card:#fffdf8; --ink:#22301f; --ink2:#5c6b57; --ink3:#8a9683;
  --green:#2f6b45; --green-d:#1f4a2f; --green-l:#e6f0e5; --leaf:#6aa84f;
  --copper:#b5713a; --copper-l:#f6ece2; --gold:#c9a227;
  --red:#b23b3b; --red-l:#fbeceb; --blue:#3a6b8f;
  --line:#e2ddd0; --shadow:0 2px 10px rgba(34,48,31,.07);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
  line-height:1.85; font-size:16px; letter-spacing:.01em;
  padding-bottom:90px;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{line-height:1.45;margin:0}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;background:rgba(246,244,238,.93);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.hd{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;flex:0 0 auto}
.mark svg{width:20px;height:20px}
.brand b{font-size:15px;font-weight:800;letter-spacing:.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11px;color:var(--ink3);display:block;margin-top:-3px}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:14px;flex:0 0 auto}
.stat{text-align:right;line-height:1.2}
.stat b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--green-d)}
.stat i{font-style:normal;font-size:10px;color:var(--ink3);display:block}
.ring{width:40px;height:40px;flex:0 0 auto}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:#e2ddd0}
.ring .fgc{stroke:var(--leaf);stroke-linecap:round;transition:stroke-dasharray .5s}
.ring text{font-size:11px;font-weight:800;fill:var(--green-d)}

/* ---------- nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(255,253,248,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nv{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nv button{padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10.5px;font-weight:700;border-top:2.5px solid transparent}
.nv button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nv button.on{color:var(--green);border-top-color:var(--green)}
.nv .bdg{position:absolute;transform:translate(15px,-4px);background:var(--red);color:#fff;font-size:9px;padding:0 5px;border-radius:9px;line-height:15px;font-weight:800}

main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.sec-t{font-size:12px;font-weight:800;color:var(--copper);letter-spacing:.14em;margin:26px 0 10px}
.sec-t:first-child{margin-top:0}
.btn{background:var(--green);color:#fff;padding:12px 20px;border-radius:11px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.ghost:hover{background:var(--green-l)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn.mut{background:var(--ink3)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.mut{color:var(--ink2)}
.tiny{font-size:12.5px;color:var(--ink3);line-height:1.7}

/* ---------- hero ---------- */
.hero{background:linear-gradient(150deg,var(--green-d),var(--green) 55%,#3f8452);color:#fff;border-radius:18px;padding:24px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero:before{content:"";position:absolute;right:30px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero h1{font-size:23px;font-weight:800;letter-spacing:.01em;position:relative}
.hero p{margin:9px 0 0;font-size:13.5px;opacity:.9;position:relative;line-height:1.8}
.hero .kpi{display:flex;gap:20px;margin-top:16px;position:relative;flex-wrap:wrap}
.hero .kpi div b{font-size:22px;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.hero .kpi div i{font-style:normal;font-size:10.5px;opacity:.8}

/* ---------- chapter cards ---------- */
.chgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ch{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:13px;align-items:flex-start;text-align:left;box-shadow:var(--shadow);transition:.15s;width:100%}
.ch:hover{transform:translateY(-2px);border-color:var(--leaf)}
.ch .num{width:38px;height:38px;flex:0 0 auto;border-radius:11px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.ch.done .num{background:var(--green);color:#fff}
.ch .bd{min-width:0;flex:1}
.ch .bd b{font-size:15.5px;font-weight:800;display:block}
.ch .bd p{margin:2px 0 8px;font-size:12px;color:var(--ink3);line-height:1.6}
.bar{height:5px;background:#eae5d8;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:4px;transition:width .5s}
.bar.q i{background:var(--copper)}
.ch .meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:5px;font-variant-numeric:tabular-nums}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}

/* ---------- plan table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--green-l);color:var(--green-d);font-weight:800;font-size:12px;white-space:nowrap}
tbody tr:nth-child(even){background:rgba(0,0,0,.012)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px -4px;padding:0 4px}

/* ---------- lesson ---------- */
.lsn-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lsn-hd .back{padding:7px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.steps{display:flex;gap:4px;margin:14px 0 18px}
.steps i{flex:1;height:4px;border-radius:3px;background:#e2ddd0}
.steps i.on{background:var(--leaf)}
.steps i.cur{background:var(--green-d)}
.dlg{margin:0 0 16px}
.turn{display:flex;gap:9px;margin-bottom:9px;align-items:flex-start}
.av{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff}
.av.midorikawa{background:var(--green)} .av.hana{background:var(--copper)} .av.kyaku{background:var(--blue)}
.bub{background:#fff;border:1px solid var(--line);border-radius:3px 13px 13px 13px;padding:9px 13px;font-size:13.5px;line-height:1.8;flex:1}
.turn.midorikawa .bub{background:var(--green-l);border-color:#d3e3d1}
.body{font-size:15px}
.body p{margin:0 0 13px}
.body h4{font-size:14px;color:var(--green-d);margin:18px 0 7px;padding-left:10px;border-left:3px solid var(--leaf)}
.body strong{color:var(--green-d);font-weight:800;background:linear-gradient(transparent 62%,rgba(106,168,79,.28) 62%)}
.body ul,.body ol{margin:0 0 13px;padding-left:22px}
.body li{margin-bottom:5px}
.body code{background:#eee9dc;padding:1px 5px;border-radius:4px;font-size:13px}
.why{background:var(--copper-l);border-left:4px solid var(--copper);border-radius:0 10px 10px 0;padding:12px 15px;margin:16px 0;font-size:13.5px;line-height:1.8}
.why b{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--copper);margin-bottom:3px}
.kp{background:#fff;border:1px dashed var(--leaf);border-radius:11px;padding:13px 16px;margin:16px 0}
.kp b{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--green);margin-bottom:7px}
.kp ul{margin:0;padding-left:19px}
.kp li{font-size:13.5px;margin-bottom:5px;line-height:1.75}
.mn{background:#fdf8e6;border:1px solid #eadfae;border-radius:11px;padding:12px 15px;margin:16px 0;font-size:13.5px;line-height:1.8}
.mn b{display:block;font-size:10.5px;letter-spacing:.14em;color:#9a7d18;margin-bottom:3px}
.tcap{font-size:11.5px;font-weight:800;color:var(--ink2);margin-top:16px}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pill{background:var(--green-l);color:var(--green-d);padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.pill.hot{background:#fdeede;color:var(--copper)}
.pill.time{background:#eef2f6;color:var(--blue)}
.pill.time.warn{background:var(--red-l);color:var(--red)}
.q{font-size:16.5px;font-weight:700;line-height:1.85;margin:6px 0 18px}
.opts{display:grid;gap:9px}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;text-align:left;font-size:14.5px;line-height:1.7;display:flex;gap:11px;align-items:flex-start;transition:.12s;width:100%}
.opt:hover:not(:disabled){border-color:var(--leaf);background:var(--green-l)}
.opt .k{width:23px;height:23px;flex:0 0 auto;border-radius:7px;background:#eee9dc;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.opt.sel{border-color:var(--green);background:var(--green-l)}
.opt.ok{border-color:var(--leaf);background:#e9f5e4}
.opt.ok .k{background:var(--leaf);color:#fff}
.opt.ng{border-color:var(--red);background:var(--red-l)}
.opt.ng .k{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px;font-size:14px;line-height:1.85;animation:fade .25s}
.fb.ok{background:#e9f5e4;border:1px solid #b9d8a8}
.fb.ng{background:var(--red-l);border:1px solid #e7c0bd}
.fb b{display:block;margin-bottom:4px;font-size:14.5px}
.fb.ok b{color:var(--green-d)} .fb.ng b{color:var(--red)}
.combo{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--gold);color:#fff;padding:9px 22px;border-radius:30px;font-weight:800;font-size:16px;box-shadow:0 6px 20px rgba(201,162,39,.4);z-index:200;pointer-events:none;animation:pop .9s ease forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.7)}20%{opacity:1;transform:translateX(-50%) scale(1.08)}75%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-24px) scale(.95)}}

/* ---------- result ---------- */
.res{text-align:center;padding:26px 18px}
.res .big{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--green-d)}
.res .big.ng{color:var(--red)}
.res .lbl{font-size:13px;color:var(--ink3);margin-top:6px}
.res h3{font-size:20px;margin:14px 0 4px}
.bkchart{display:grid;gap:7px;margin-top:8px}
.bk{display:grid;grid-template-columns:120px 1fr 46px;gap:9px;align-items:center;font-size:12px}
.bk .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.bk .bar{height:14px;border-radius:4px}
.bk .bar i{background:var(--leaf)}
.bk .bar i.low{background:var(--red)}
.bk .bar i.mid{background:var(--copper)}
.bk .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}

/* ---------- badges ---------- */
.bgs{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.bg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;opacity:.4}
.bg.got{opacity:1;border-color:var(--gold);background:#fdfaef}
.bg .ic{width:34px;height:34px;margin:0 auto 6px;border-radius:50%;background:#eee9dc;display:grid;place-items:center;font-weight:800;color:var(--ink3);font-size:15px}
.bg.got .ic{background:var(--gold);color:#fff}
.bg b{font-size:12.5px;display:block}
.bg span{font-size:10.5px;color:var(--ink3);line-height:1.5;display:block;margin-top:2px}

/* ---------- misc ---------- */
.chip{padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:11px;font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#fff;color:var(--ink);resize:vertical}
.wq{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:9px}
.wq .qt{font-size:14px;font-weight:700;line-height:1.75}
.wq .an{font-size:13px;color:var(--green-d);margin-top:6px;font-weight:700}
.wq .ex{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.75}
.wq .tag{font-size:10.5px;color:var(--copper);font-weight:800;letter-spacing:.06em}
.empty{text-align:center;padding:44px 20px;color:var(--ink3);font-size:14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:300;animation:fade .2s}
@media(max-width:520px){
  body{font-size:15px}
  .hero h1{font-size:19px}
  .hd{padding:9px 12px} .brand span{display:none}
  main{padding:14px 12px 30px}
  .bk{grid-template-columns:88px 1fr 40px}
  .q{font-size:15.5px}
}
</style>

<script>
const DATA = [{"id":1,"title":"現代生活と花・緑","subtitle":"緑の価値と役割、そして助言者としての立ち位置がわかる","minutes":35,"goals":["グリーンアドバイザーの役割と、相談を受けたときの聞き取りの型を説明できる","都市緑化・園芸療法・室内緑化など、花と緑が現代生活で果たす機能を理由つきで語れる","日本の園芸文化史の骨格と、有毒植物・農薬・近隣配慮など安全面の要点を判断できる"],"sections":[{"heading":"グリーンアドバイザーという仕事","dialogue":[{"who":"客","text":"ベランダのミニトマト、下の葉から黄色くなってきて。もうダメですかね……"},{"who":"ハナ","text":"（小声で）緑川さん、私、原因がひとつに絞れません。肥料切れかも、水のやりすぎかも、で止まってしまって。"},{"who":"緑川","text":"それでいい。私たちの仕事は、いきなり正解を当てることじゃない。お客さまの『置き場所』と『やってきたこと』を聞き出すところから始まるんだ。"},{"who":"ハナ","text":"答える人じゃなくて、聞く人……ですか。"}],"body":"<p><strong>グリーンアドバイザー</strong>は、公益社団法人 日本家庭園芸普及協会が1992年（平成4年）に創設した認定制度である。所定の認定講習を受け、認定試験に合格した人が認定・登録され、登録は一定期間ごとの更新が必要になる。名前のとおり<strong>アドバイザー＝助言者</strong>であり、栽培の名人であることそのものが目的ではない。</p><h4>求められるのは「翻訳」と「聞き取り」</h4><p>家庭園芸の相談は、教科書の答えがそのままは当てはまらない。同じ「ミニトマトの葉が黄色い」でも、日照3時間の北向きベランダと、一日中日の当たる南向きの庭では原因も対策も変わる。だから助言者はまず、<strong>相談者の条件（環境・経験・時間・予算）を聞き取り</strong>、その人が実行できる形に知識を翻訳する。正解を出すのではなく、その人にとっての最適解を一緒に決める仕事だと考えるとよい。</p><h4>相談対応の基本姿勢</h4><ul><li>決めつけない。症状は同じでも原因は複数あり得る</li><li>断定できないことは断定しない。可能性を並べ、確かめ方を示す</li><li>できない提案をしない。毎日水やりできない人に、毎日水やり前提の植物をすすめない</li><li><strong>安全にかかわる情報は最優先で伝える</strong>。農薬の適正使用、有毒植物、小さな子どもやペットのいる家庭への注意</li><li>地域と季節を踏まえる。同じ日本でも寒地と暖地では作型が違う</li><li>楽しさを削がない。失敗を責めず、次に試せる一手を渡す</li></ul>","why":"植物の反応は環境の関数なので、環境を聞き取らないかぎり同じ症状でも正しい助言にたどりつけないから。","keypoints":["グリーンアドバイザーは公益社団法人 日本家庭園芸普及協会の認定制度（1992年創設）","認定講習＋認定試験に合格して認定・登録され、登録は更新制","役割は栽培の代行ではなく、知識を相談者の条件に翻訳する助言","相談ではまず環境・経験・使える時間を聞き取る","安全（農薬・有毒植物・子どもとペット）に関する情報は優先度が最も高い"],"table":{"caption":"相談を受けたら必ず聞く6項目","headers":["項目","聞き方の例","これで分かること"],"rows":[["置き場所","庭ですか、ベランダですか、室内ですか","温度・風・雨の当たり方"],["日照","何時から何時まで日が当たりますか","光量不足か、強すぎるか"],["容器と用土","鉢の大きさと、何年植え替えていませんか","根詰まり・排水不良"],["水やり","どのくらいの間隔で、どのくらいの量を","過湿・乾燥のどちらか"],["肥料","いつ、どんなものをあげましたか","肥料切れ・肥料やけ"],["経過","いつ、どこから症状が出ましたか","下葉からか新芽からかで原因が分かれる"]]},"mnemonic":"聞き取りの型は「場所・光・鉢・水・肥・経過」＝バ・ヒ・ハ・ミ・ヒ・ケ。まず場所、最後に経過。"},{"heading":"都市を冷やす緑","dialogue":[{"who":"客","text":"西向きのベランダが夕方すごく暑くて。すだれは付けたんですけど、まだ熱いんです。"},{"who":"緑川","text":"すだれは日射をさえぎるだけですが、植物はもう一つ武器を持っています。葉から水を蒸発させて、そのとき熱を奪う。"},{"who":"ハナ","text":"打ち水を、葉っぱが一日中やってくれているようなものですね。"},{"who":"緑川","text":"そのとおり。だから同じ日陰でも、緑の日陰のほうが涼しい。"}],"body":"<p>都市部の気温が周辺より高くなる<strong>ヒートアイランド現象</strong>は、アスファルトやコンクリートによる被覆、建物・自動車・空調からの人工排熱、そして緑地と水面の減少が重なって起こる。夏の晴天日、アスファルト舗装の表面温度は50〜60℃に達するのに対し、芝生面や樹冠の下ははるかに低い。</p><h4>緑が冷やす二つの仕組み</h4><ol><li><strong>日射の遮へい</strong>…葉が日射を受け止め、地面や壁が高温になるのを防ぐ。これはすだれと同じ働き。</li><li><strong>蒸散</strong>…根から吸った水を葉の気孔から水蒸気として放出する。水が液体から気体に変わるとき周囲から熱（気化熱）を奪い、水1gあたりおよそ2.4kJ（約580cal）が消費される。だから葉自体が熱くならず、まわりの空気も冷える。</li></ol><h4>建物の緑化</h4><p><strong>屋上緑化</strong>は、土壌層の断熱と蒸散で屋根面の温度上昇をおさえ、冷房負荷と屋根材の劣化を減らす。ただし<strong>土と水の重量による荷重</strong>、防水層の保護、排水、灌水設備、風による飛散対策が前提条件になる。軽量な人工軽量土壌やセダム類が使われるのはこのためである。<strong>壁面緑化</strong>には、ツタやヘデラのように付着根・吸盤で自力で登る型、ネットに巻きひげや茎を絡ませる型、パネルやプランターを壁に取り付ける型がある。<strong>緑のカーテン</strong>はその手軽な家庭版で、ゴーヤ（ツルレイシ）、アサガオ、ヘチマ、キュウリ、フウセンカズラなどを窓の外にネットで這わせる。日射遮へいと蒸散が同時に働く点が、すだれとの決定的な違いである。</p>","why":"水が蒸発するときに気化熱を奪うから、蒸散する植物はすだれのような単なる日よけより強く周囲を冷やせる。","keypoints":["ヒートアイランドの主因は人工被覆・人工排熱・緑地と水面の減少","緑の冷却効果＝日射遮へい＋蒸散（気化熱）の二本立て","水1gの蒸発でおよそ2.4kJの熱を奪う","屋上緑化の第一条件は荷重（土壌と水の重量）と防水・排水","緑のカーテンはゴーヤ・アサガオ・ヘチマ・キュウリ・フウセンカズラなど","壁面緑化は登はん型（付着根・巻きひげ）とパネル型に大別"],"table":{"caption":"緑のカーテン向きのつる植物","headers":["植物","登り方","特徴"],"rows":[["ゴーヤ（ツルレイシ）","巻きひげ","生育旺盛で葉が密。実も収穫できる"],["アサガオ","つるが巻き付く","花を楽しめる。西洋アサガオは秋まで長く咲く"],["ヘチマ","巻きひげ","葉が大きく遮へい力が高い。重くなるので支柱を丈夫に"],["キュウリ","巻きひげ","生育が早いが期間が短い。うどんこ病に注意"],["フウセンカズラ","巻きひげ","軽やかで涼しげ。遮へい力は控えめ"],["ヘデラ（キヅタ類）","付着根","常緑多年生で壁面緑化向き。窓の一夏用ではない"]]}},{"heading":"植物がもつ環境機能","dialogue":[{"who":"客","text":"道路沿いなので、目隠しと、あと少しでも音が静かになる木がほしくて。"},{"who":"ハナ","text":"木で音って、そんなに消えるものなんでしょうか？"},{"who":"緑川","text":"正直に言うと、薄い植栽帯だけで騒音が大きく下がることはありません。ただ、見えなくなること、葉ずれの音がまじること、それだけで人が感じるうるささは確かに変わります。"}],"body":"<p>植物は景観だけでなく、物理・化学的な機能をあわせ持つ。助言するときは<strong>効果の大小を正直に伝える</strong>ことが信頼につながる。</p><h4>大気に対する働き</h4><p>光合成により二酸化炭素を吸収し炭素として体内に固定する。気孔からは二酸化窒素や二酸化硫黄などの大気汚染物質もある程度取り込まれる。また、葉の表面の毛や凹凸に粉じんが付着して捕捉される（<strong>降下ばいじんの捕捉</strong>）。葉が一年中ある常緑樹や、葉面に毛の多い樹種が有利である。</p><h4>物理的な働き</h4><ul><li><strong>防風</strong>…防風林の風下では、おおむね<strong>樹高の10倍程度</strong>の距離まで風速が弱まる。風を完全にせき止める密な壁より、適度に風を通す構造のほうが背後に乱流が生じにくく、効果が遠くまで及ぶ。</li><li><strong>防音・減音</strong>…厚みのある樹林帯は減音に寄与するが、薄い生垣程度では物理的効果は限定的。むしろ音源が見えなくなる視覚的遮へいと、葉ずれの音によるマスキングの心理的効果が大きい。</li><li><strong>目隠し・境界の明示</strong>…生垣は塀と違って倒壊しにくく、風も通す。</li><li><strong>防火</strong>…水分の多い常緑広葉樹の生垣は延焼をおさえる働きが期待される。</li><li><strong>土壌保全</strong>…根が表土をつかみ、落ち葉が地面を覆い、雨水の浸透をうながす。</li></ul><h4>生きものを呼ぶ</h4><p>庭の生物多様性を上げるには、成虫が蜜を吸う<strong>吸蜜植物</strong>と、幼虫が食べる<strong>食草・食樹</strong>の両方が要る。チョウを呼びたいのに食草がなければ、素通りされるだけである。</p>","why":"植物の環境機能は「光合成・蒸散という生理」と「かたち（葉の面・枝の密度）という物理」の二系統に分けて理解すると、効果の大小を正しく見積もれるから。","keypoints":["CO2吸収・大気汚染物質の吸収・粉じんの捕捉が大気への働き","防風林の効果はおおむね風下・樹高の10倍程度まで","完全に風をせき止めるより、適度に通す構造のほうが防風効果は広く及ぶ","薄い植栽の防音効果は物理的には小さく、視覚遮へいと心理効果が主","誘蝶には吸蜜植物と幼虫の食草の両方が必要"],"table":{"caption":"誘蝶・誘鳥植物の代表例","headers":["区分","植物","呼べる生きもの"],"rows":[["吸蜜植物","ブッドレア、ランタナ、フジバカマ、ヒャクニチソウ","各種のチョウ"],["食草（ミカン科）","サンショウ、ミカン、カラタチ","アゲハの幼虫"],["食草（セリ科）","パセリ、ニンジン、ミツバ","キアゲハの幼虫"],["食草（スミレ科）","スミレ、パンジー・ビオラ","ツマグロヒョウモンの幼虫"],["誘鳥（実）","ナンテン、ピラカンサ、ガマズミ、ムラサキシキブ","ヒヨドリ、メジロなど"],["誘鳥（花蜜）","ツバキ、サザンカ、ウメ","メジロなど"]]},"mnemonic":"チョウを呼ぶなら「食草なくして蝶来たらず」。蜜だけでは通過、食草があって初めて住みつく。"},{"heading":"園芸の効用と園芸療法","dialogue":[{"who":"客","text":"父の施設で、みんなでプランターを作ることになって。上手に育てられるか心配で……"},{"who":"緑川","text":"上手に育てることは、実は目的ではないんです。園芸療法で伸ばしたいのは、植物ではなく人のほうですから。"},{"who":"ハナ","text":"枯らしても失敗じゃない、ということですか。"},{"who":"緑川","text":"手を動かした、誰かと話した、明日の楽しみができた。そこがもう成果なんですよ。"}],"body":"<p><strong>園芸療法（ホーティカルチュラルセラピー）</strong>は、植物を育てる活動を通して心身の機能回復・維持や社会参加を図る手法である。欧米で戦傷者や精神科領域のリハビリテーションとして発展し、日本でも医療・福祉・教育の現場に広がった。<strong>収穫物の質や量ではなく、人に生じた変化を目標に置く</strong>点が通常の栽培と決定的に違う。</p><ul><li><strong>身体面</strong>…立つ・かがむ・つまむ・運ぶといった動作が、自然な形で関節可動域や巧緻性の訓練になる</li><li><strong>精神面</strong>…世話をする対象があることで役割と生活リズムが生まれ、発芽や開花が達成感につながる</li><li><strong>社会面</strong>…共同作業と収穫物の分配が会話と交流を生む</li></ul><h4>園芸福祉とコミュニティ</h4><p><strong>園芸福祉</strong>は、障がいの有無や年齢を問わず誰もが園芸を楽しみ、その効用を分かち合うという考え方で、地域づくりの手段として実践されている。都市部の空き地や公園を住民が共同で耕す<strong>コミュニティガーデン</strong>、区画を借りて栽培する<strong>市民農園</strong>も同じ流れにある。世代を超えた交流、防犯・景観の改善、災害時の共助の土台という副次効果も大きい。</p><h4>子どもと高齢者</h4><p>子どもにとって栽培体験は、生きものが日々変化することを実感する<strong>情操教育</strong>であり、育てた野菜を食べる<strong>食育</strong>でもある（食育基本法は2005年に制定・施行）。高齢者にとっては、外出のきっかけ、適度な運動、日光を浴びることによる生活リズムの安定につながる。ただし現場では<strong>熱中症、転倒、無理な前かがみ姿勢、道具によるけが</strong>への配慮が欠かせない。作業は短時間に区切り、日陰と椅子と水を用意するのが基本である。</p>","why":"園芸療法の評価軸は収穫物ではなく人の変化に置かれるので、うまく育たなくてもプログラムとしては成功しうるから。","keypoints":["園芸療法の目標は作物の出来ではなく人の心身機能・社会参加の改善","身体・精神・社会の三面に効果を整理して説明できるようにする","園芸福祉は年齢や障がいを問わず園芸の効用を分かち合う考え方","コミュニティガーデン・市民農園は交流と地域改善の場","食育基本法は2005年制定。栽培体験は情操教育と食育を兼ねる","高齢者の作業では熱中症・転倒・前かがみ姿勢に配慮する"],"table":{"caption":"似ているが目的が違う3つの園芸","headers":["区分","主な目的","成果の見方"],"rows":[["園芸療法","対象者の心身機能の回復・維持","人の変化を記録・評価する"],["園芸福祉","誰もが園芸を楽しみ地域がつながること","参加の広がりと関係づくり"],["趣味・生産の園芸","花や作物を良く育てること","植物の出来ばえ・収量"]]}},{"heading":"室内で植物と暮らす","dialogue":[{"who":"客","text":"空気をきれいにしたくて、寝室の隅に観葉植物を置いたら、だんだん元気がなくなって。"},{"who":"ハナ","text":"部屋の隅……明るさが足りなかったのかも。"},{"who":"緑川","text":"そう。人の目には十分明るく見えても、植物にとっては赤字なんです。稼ぎより支出が多い状態が続いている。"}],"body":"<p>室内は植物にとって<strong>暗く、風がなく、冬は乾く</strong>場所である。まず光から考える。</p><h4>人の目と植物の目は違う</h4><p>真夏の屋外の直射日光はおよそ10万ルクスに達するが、レースのカーテン越しの明るい窓辺で数千ルクス、部屋の奥や廊下では数百ルクスまで落ちる。人の目は暗さに順応するため差を過小評価しやすい。植物には<strong>光補償点</strong>——光合成による生産と呼吸による消費がちょうど釣り合う明るさ——があり、これを下回る場所に置き続けると、植物は体内の蓄えを取り崩して次第に葉を落とし衰弱する。耐陰性の高いサンスベリア、ポトス、アグラオネマ、シェフレラ、オモトなどは光補償点が低いため暗所に耐えるが、「暗くても育つ」のではなく「暗くても持ちこたえる」と理解したい。</p><h4>空気と湿度</h4><p>密閉した実験容器の中では、植物と用土の微生物による揮発性有機化合物の低減が確認されている。ただし実際の居室では<strong>換気による希釈の効果が圧倒的に大きく</strong>、鉢数個で空気を浄化できると説明するのは行き過ぎである。加湿についても、蒸散による水分放出はあるものの、部屋全体を潤すほどではない。むしろ冬は暖房で室内湿度が下がり、植物の側が乾燥で傷むことに注意する。</p><h4>置き場所の実務</h4><ul><li>エアコンの吹き出し風が直接当たる場所は避ける（急激な乾燥と葉先の枯れ）</li><li>冬の夜間、窓ぎわは外気なみに冷える。夜だけ部屋の内側へ移す</li><li>暗い場所＋こまめな水やりは<strong>根腐れ</strong>の典型パターン。光が弱いほど水の消費は少ない</li><li>ときどき鉢を回して、光の当たる向きを変える</li></ul><p>視覚的な緑にはストレスを和らげ注意力を回復させる効果も報告されており、置く価値は空気浄化以外の面にこそある。</p>","why":"光合成による生産が呼吸による消費を下回る（光補償点以下の）場所では、植物は蓄えを減らし続けるしかないから。","keypoints":["光補償点＝光合成量と呼吸量が釣り合う光の強さ。これ以下では衰弱する","直射日光は約10万ルクス、明るい窓辺は数千ルクス、部屋の奥は数百ルクス","耐陰性が高い植物は光補償点が低い（サンスベリア、ポトス、アグラオネマなど）","室内の空気浄化効果は限定的で、換気にはかなわない","暗い場所での水のやりすぎは根腐れの典型","冬の窓ぎわの夜間冷え込みとエアコンの風に注意"],"table":{"caption":"室内の明るさの目安と置ける植物","headers":["場所","明るさの目安","向く植物の例"],"rows":[["南向きの窓辺（レース越し）","数千〜1万ルクス","ゴムノキ、パキラ、サボテン・多肉（要順化）"],["東・西の窓から1〜2m","1000ルクス前後","シェフレラ、モンステラ、シダ類"],["部屋の奥・廊下","数百ルクス","サンスベリア、ポトス、アグラオネマ（長期は不可）"],["窓のない室・トイレ","ほぼ光合成不可","定期的に明るい場所へ交代させる運用が必要"]]},"mnemonic":"「暗い部屋ほど水は控えめ」。光が弱い＝蒸散も光合成も少ない＝水はいらない。逆をやると根腐れ。"},{"heading":"日本の園芸文化史","dialogue":[{"who":"客","text":"亡くなった祖父がオモトを集めていて。あれって何が面白いんでしょう。"},{"who":"緑川","text":"花ではなく、葉の斑や形の変異を愛でる世界です。江戸のころ、日本人はそこに熱狂しました。"},{"who":"ハナ","text":"花じゃなくて葉っぱ……。ちょっと分かる気もします。"},{"who":"緑川","text":"鉢という小さな枠に自然を閉じ込めて、変わりものを競う。これは世界的に見てもかなり独特な文化なんですよ。"}],"body":"<p>日本では古代から花木や草花が和歌や絵に詠まれ、中世には茶の湯とともに<strong>茶花</strong>の美学が育った。しかし家庭園芸の直接の源流は<strong>江戸時代</strong>にある。</p><h4>江戸の園芸文化</h4><p>参勤交代で江戸に集まった大名の庭づくり、鉢植えの普及、そして武士から町人まで階層を越えた愛好者の広がりによって、江戸は世界有数の園芸都市となった。特徴は、<strong>斑入り・獅子葉・変化花といった「変わりもの」を選抜して育て、品評会と番付で競い、図譜として出版した</strong>点にある。染井（現在の東京都豊島区付近）には植木屋が集まり、<strong>ソメイヨシノ</strong>もこの江戸の植木屋の手から生まれたとされる。鎖国下でもケンペル、ツュンベリー、シーボルトらが日本の植物を記録し、のちにフォーチュンらの手でユリ、キク、ツバキ、アジサイなどが欧州へ渡り、園芸品種の育成に影響を与えた。</p><h4>古典園芸植物</h4><p>江戸から明治にかけて磨かれ、独自の系統と品種名、鑑賞の作法をもつ植物群を<strong>古典園芸植物</strong>と呼ぶ。アサガオ（変化朝顔）、キク、ハナショウブ、オモト、サクラソウ、ツバキ、エビネ、セッコク、マツバラン、カラタチバナなどが代表である。</p><h4>盆栽・生垣・里山</h4><p><strong>盆栽</strong>は鉢の中に樹形と時間を凝縮する表現で、剪定・針金かけ・根の整理によって自然の姿を映す。<strong>生垣</strong>は塀と違い風を通し、目隠しと境界と防火を兼ねる暮らしの装置だった。<strong>里山</strong>は薪炭材や落ち葉堆肥の採取を通じて人が手を入れ続けたことで維持されてきた<strong>二次的自然</strong>であり、利用されなくなると藪化して生物多様性が失われる。手を入れることが保全になる、という逆説を押さえておきたい。</p>","why":"日本の園芸文化は「鉢という限られた枠の中で変異を選抜し、体系化して競う」性格を持ち、古典園芸植物も盆栽もその延長線上にあるから。","keypoints":["家庭園芸の源流は江戸時代。鉢植えと品評会・番付・図譜が文化を支えた","古典園芸植物＝アサガオ、キク、ハナショウブ、オモト、サクラソウ、ツバキ、エビネ、セッコク、マツバラン、カラタチバナなど","ハナショウブには江戸系・伊勢系・肥後系がある","ソメイヨシノは江戸・染井の植木屋に由来する日本生まれの品種","シーボルトらを通じて日本の植物が欧州の育種に影響を与えた","里山は人の利用によって維持された二次的自然。放置すると劣化する"],"table":{"caption":"主な古典園芸植物と鑑賞のポイント","headers":["植物","何を見るか","備考"],"rows":[["アサガオ","変化朝顔の花形・葉形の変異","江戸で二度の大流行"],["キク","花形と作りの技","嵯峨菊・伊勢菊・肥後菊・江戸菊などの系統"],["ハナショウブ","花形と色","江戸系・伊勢系・肥後系"],["オモト","葉の斑と葉形","鉢と葉姿を合わせて鑑賞"],["サクラソウ","花弁の形と色の変異","江戸の武士に愛好された"],["ツバキ","花形・花色・斑","古くから茶花としても重用"],["エビネ・セッコク","花や葉変わり","山野草系の古典植物"]]}},{"heading":"花き産業と園芸店","dialogue":[{"who":"ハナ","text":"1月と2月って、お店が急に静かになりますね。"},{"who":"緑川","text":"植物が動かない時期だからね。でも、静かな時期に何をすすめるかで、その店の力量が出る。"},{"who":"ハナ","text":"冬でも売れるものって……。"},{"who":"緑川","text":"秋植え球根の残り、寒さに強い花苗、そして春の準備の資材。お客さまの頭の中を一か月先に連れていくのが仕事だよ。"}],"body":"<p><strong>花き</strong>とは観賞用に栽培される植物の総称で、<strong>切り花・鉢もの（観葉植物と花鉢）・花壇用苗もの・球根・花木類・芝類や地被植物</strong>などに区分される。国の施策としては<strong>花きの振興に関する法律（花き振興法、2014年）</strong>があり、生産・流通・輸出入や需要拡大の方向が示されている。流通は、生産者から花き卸売市場（せり取引と相対取引）を経て仲卸・小売へ渡る経路が中心で、生花店や直売所への直接取引も増えている。</p><h4>売り場ごとの役割</h4><ul><li><strong>ホームセンター</strong>…用土・肥料・資材を一度にそろえられ、価格も手ごろ。初心者の入口だが、来店客が助言を得にくい面がある</li><li><strong>園芸専門店</strong>…品ぞろえと栽培アドバイス。難物や大株、地域に合った品種の提案が強み</li><li><strong>種苗店</strong>…タネ・球根・苗と地域の作型情報。まき時や品種特性の相談窓口</li><li><strong>生花店</strong>…切り花と贈答。行事需要への対応</li><li><strong>通信販売・ネット</strong>…珍しい品種を入手しやすいが、現物確認ができず輸送の傷みもある</li></ul><h4>種苗法と登録品種</h4><p>品種登録された<strong>登録品種</strong>には育成者権があり、育成者の許諾なく増殖したり譲渡・販売したりすることはできない。挿し木で増やして人に配る、フリーマーケットで売る、といった行為が権利侵害になり得る点は、店頭でも伝えるべき知識である。</p><h4>季節が需要をつくる</h4><p>家庭園芸の需要は季節にはっきり連動する。最大の山は<strong>春（3〜5月）</strong>で、花壇苗・野菜苗・母の日が重なる。夏は高温で植物も客足も動きが鈍り、秋に球根とパンジー・ビオラで再び伸び、年末年始の正月飾りを経て、1〜2月が端境期となる。</p>","why":"花きは生活必需品ではなく行事と気候に需要が支配されるため、季節先取りの提案がそのまま販売と栽培成功の両方につながるから。","keypoints":["花きの区分＝切り花・鉢もの・花壇用苗もの・球根・花木類・芝類地被","花きの振興に関する法律（花き振興法）は2014年","流通の中心は花き卸売市場（せり取引・相対取引）","登録品種は育成者権があり、無断の増殖・譲渡・販売はできない","需要の最大期は3〜5月、端境期は1〜2月","ホームセンター・専門店・種苗店は役割が異なる"],"table":{"caption":"家庭園芸の年間需要カレンダー","headers":["時期","主な動き","売れるもの"],"rows":[["3〜5月","最大の繁忙期。植え付けシーズンと母の日","花壇苗、野菜苗、用土・肥料、カーネーション"],["6月","梅雨。父の日","アジサイ、観葉植物、殺菌剤"],["7〜8月","高温で動きが鈍る。お盆","仏花、切り花、水やり資材、緑のカーテン材"],["9〜10月","彼岸。秋の植え付け開始","秋植え球根、パンジー・ビオラ、キク"],["11〜12月","正月準備とギフト","シクラメン、ハボタン、マツ、ポインセチア"],["1〜2月","端境期。剪定と土づくり","剪定用具、寒肥、タネ、春の資材"]]}},{"heading":"安全・近隣配慮とユニバーサルデザイン","dialogue":[{"who":"客","text":"庭のニラを摘んで炒めたら、家族が気持ち悪いと言い出して……。近くにスイセンも植えてあるんです。"},{"who":"緑川","text":"それは急いで医療機関へ。スイセンの葉はニラによく似ていて、毎年のように誤食が起きています。においを確かめれば見分けられますが、混植そのものを避けるのが確実です。"},{"who":"ハナ","text":"身近な庭の植物にも、そんなに危ないものがあるんですね。"}],"body":"<h4>農薬と近隣への配慮</h4><p>家庭園芸用の農薬も農薬取締法の対象であり、ラベルの<strong>適用作物・希釈倍率・使用時期・使用回数</strong>を守ることが義務である。散布は<strong>風の弱い早朝や夕方</strong>を選び、飛散（ドリフト）が隣家の洗濯物・ペット・水槽・池・菜園に及ばないよう配慮し、必要なら事前に声をかける。ミツバチなど有用昆虫への影響や空容器の処理にも注意する。隣地から越境した<strong>枝</strong>は、民法の改正（2023年4月1日施行）により、所有者に切除を求めても応じない場合など一定の条件のもとで自ら切除できるようになった。根は従来から自ら切除できる。</p><h4>有毒植物・かぶれ</h4><p>重い事故の多くは<strong>食用植物との誤認</strong>で起こる。庭では食べる植物と有毒植物を<strong>離して植える</strong>のが最大の予防策である。皮膚障害では、ウルシ類のウルシオールによる<strong>遅延型のかぶれ</strong>（数時間から数日後に発症）、イラクサの刺毛、トウダイグサ科（ポインセチアやユーフォルビア類）の<strong>白い乳液</strong>、サトイモ科のクワズイモやディフェンバキアの<strong>シュウ酸カルシウムの針状結晶</strong>が代表的。手袋と長袖、作業後の手洗いを基本とする。キョウチクトウは強心配糖体を含み、枝を串などに使わない、剪定枝を燃やさないことが鉄則である。</p><h4>ユニバーサルデザインの庭</h4><p>中心になるのが<strong>レイズドベッド（立ち上がり花壇）</strong>で、作業面をおおむね60〜75cmに上げると、立位でも車いすからでも無理なく手が届く。ひざが入る張り出しをつくればさらに近づける。通路は車いすが通れる<strong>90cm以上</strong>、方向転換には<strong>150cm四方</strong>程度を確保し、路面は平坦で滑りにくく仕上げる。軽量で長柄の道具、香りや手触りの豊かな植物、コントラストの強い色使いも有効である。</p>","why":"園芸事故のほとんどは「食用植物との見た目の類似」と「飛散・越境という物理的な広がり」から起こるので、植える段階で距離を取ることが最も効く対策になるから。","keypoints":["農薬はラベルの適用作物・希釈倍率・使用時期・使用回数を厳守","散布は風の弱い早朝・夕方。洗濯物、ペット、水槽、池、ミツバチに配慮","越境した枝は改正民法（2023年4月1日施行）により条件付きで自ら切除可能。根は従来から可","有毒植物事故の主因は食用植物との誤認。混植を避ける","ウルシによるかぶれは遅延型で、数時間〜数日後に症状が出る","サトイモ科のえぐみ・刺激はシュウ酸カルシウムの針状結晶","レイズドベッドの作業面は60〜75cm程度、通路は90cm以上、転回に150cm四方"],"table":{"caption":"誤食されやすい有毒植物","headers":["有毒植物","間違えられる食用植物","主な毒成分・部位"],"rows":[["スイセン","ニラ（葉）、タマネギ（鱗茎）","リコリンなど。全草"],["イヌサフラン","ギョウジャニンニク（葉）、ジャガイモ・タマネギ（球根）","コルヒチン。重篤な例が多い"],["トリカブト","ニリンソウ、モミジガサ（新芽）","アコニチン。全草"],["バイケイソウ","オオバギボウシ、ギョウジャニンニク","ジェルビンなどのアルカロイド"],["チョウセンアサガオ","ゴボウ（根）、モロヘイヤ（葉）","スコポラミンなど"],["ジギタリス","コンフリー（葉）","強心配糖体"],["ヒガンバナ","ノビル、ラッキョウ（鱗茎）","リコリン"],["キョウチクトウ","（誤食よりも枝の誤用・焼却が問題）","オレアンドリンなど強心配糖体"]]},"mnemonic":"「ニラ・ギョウジャ・ノビル・ゴボウ」は誤食四天王。似た葉の球根植物のそばには植えない。"}],"quiz":[{"type":"ox","q":"グリーンアドバイザーは、公益社団法人 日本家庭園芸普及協会が認定する制度である。","a":true,"why":"1992年（平成4年）創設の認定制度で、認定講習と認定試験を経て認定・登録される。"},{"type":"ox","q":"相談を受けたときは、まず具体的な品種名や薬剤名を提示することが最優先である。","a":false,"why":"先に必要なのは置き場所・日照・水やりなど条件の聞き取り。環境が分からなければ同じ症状でも助言が変わる。"},{"type":"ox","q":"植物が周囲の気温を下げる主な仕組みは、二酸化炭素を吸収することである。","a":false,"why":"気温低下の主因は蒸散による気化熱の消費と、葉による日射の遮へい。CO2吸収は温暖化緩和の話で、その場の気温低下とは別物。"},{"type":"ox","q":"緑のカーテンは、すだれと違って蒸散をともなうため葉面の温度が上がりにくい。","a":true,"why":"水1gの蒸発でおよそ2.4kJの熱を奪うため、日射を受けても葉自体が高温になりにくい。"},{"type":"ox","q":"屋上緑化の計画では、土壌と保水された水の重量による建物への荷重を検討しなければならない。","a":true,"why":"湿潤時の土壌は重い。荷重・防水・排水・灌水・飛散対策が屋上緑化の前提条件になる。"},{"type":"ox","q":"防風林は、風をまったく通さない密な構造にするほど風下側の効果が遠くまで及ぶ。","a":false,"why":"完全にせき止めると背後に乱流が生じて効果が続かない。適度に風を通す構造のほうが効果は遠くまで及ぶ。"},{"type":"ox","q":"チョウを庭に呼ぶには、成虫の吸蜜植物だけでなく幼虫の食草も必要である。","a":true,"why":"食草がなければ産卵・定着が起こらず、通過するだけで終わる。"},{"type":"ox","q":"園芸療法では、収穫物の品質や収量の高さが成果の主な評価基準となる。","a":false,"why":"評価するのは対象者の身体・精神・社会面の変化。作物の出来ではない。"},{"type":"ox","q":"光補償点とは、光合成による生産と呼吸による消費が釣り合う光の強さのことである。","a":true,"why":"これを下回る明るさに置き続けると、植物は蓄えを取り崩して衰弱していく。"},{"type":"ox","q":"室内の暗い場所に置いた鉢は、明るい場所に置いた鉢より水やりの間隔を長くとる。","a":true,"why":"光が弱いと光合成も蒸散も少なく、水の消費が減る。暗所＋頻繁な水やりは根腐れの典型パターン。"},{"type":"ox","q":"ソメイヨシノは、明治期にヨーロッパから導入された品種である。","a":false,"why":"江戸・染井の植木屋に由来する日本生まれの品種とされる。"},{"type":"ox","q":"里山は人が利用をやめて放置するほど、生物多様性が高く保たれる。","a":false,"why":"里山は薪炭材や落ち葉の採取など人の手入れで維持されてきた二次的自然。放置すると藪化し多様性は失われる。"},{"type":"ox","q":"種苗法に基づく登録品種は、育成者の許諾なく増殖して他人に譲渡することはできない。","a":true,"why":"育成者権があるため、挿し木で増やして販売・配布する行為は権利侵害になり得る。"},{"type":"ox","q":"家庭園芸の需要が年間で最も高まるのは、7〜8月である。","a":false,"why":"最大の山は3〜5月。夏は高温で植物も客足も動きが鈍る。"},{"type":"ox","q":"ウルシによるかぶれは、触れた直後だけに症状が出る即時型である。","a":false,"why":"ウルシオールによる遅延型のアレルギー性接触皮膚炎で、数時間から数日後に症状が出る。"},{"type":"ox","q":"スイセンは、葉をニラと間違えて食べる誤食事故が繰り返し起きている。","a":true,"why":"鱗茎をタマネギと誤認する例もある。食用植物のそばに植えないことが確実な予防になる。"},{"type":"mc","q":"グリーンアドバイザー制度を認定・運営している団体はどれか。","choices":["公益社団法人 日本家庭園芸普及協会","日本花き卸売市場協会","日本造園学会"],"a":0,"why":"1992年に同協会が創設した、家庭園芸の指導・助言者を養成する認定制度である。"},{"type":"mc","q":"相談対応でグリーンアドバイザーが最初に行うべきことはどれか。","choices":["おすすめの新品種を紹介する","置き場所・日照・水やりなど条件を聞き取る","とりあえず殺虫剤をすすめる"],"a":1,"why":"同じ症状でも環境によって原因が変わる。条件を聞かずに答えを出すと外れる。"},{"type":"mc","q":"蒸散が周囲の気温を下げる理由として正しいものはどれか。","choices":["葉が日射を反射するから","葉がCO2を吸収するから","水が気化する際に周囲から熱を奪うから"],"a":2,"why":"水1gの蒸発でおよそ2.4kJの気化熱が消費される。遮へいだけのすだれとの違いはここにある。"},{"type":"mc","q":"緑のカーテンに一般的に用いられる植物の組み合わせはどれか。","choices":["ゴーヤ・アサガオ・ヘチマ","ハボタン・シクラメン・パンジー","サンスベリア・ポトス・オモト"],"a":0,"why":"夏に旺盛に伸びるつる性植物を用いる。二つめは冬の花、三つめは耐陰性の観葉植物。"},{"type":"mc","q":"誘鳥植物として、実を目当てに鳥が集まるものはどれか。","choices":["チューリップ","ゼラニウム","ピラカンサ"],"a":2,"why":"ナンテン、ガマズミ、ムラサキシキブなども赤い実で鳥を呼ぶ。"},{"type":"mc","q":"園芸療法の説明として最も適切なものはどれか。","choices":["植物を育てる活動を通して人の心身機能の回復・維持を図る","薬用植物を栽培して医薬品を作る","高収量の栽培技術を指導する"],"a":0,"why":"目的は人の変化。作物の出来ばえは評価の中心ではない。"},{"type":"mc","q":"室内の耐陰性が高い植物の組み合わせはどれか。","choices":["ヒマワリ・ペチュニア","サンスベリア・ポトス・アグラオネマ","ゴーヤ・トマト"],"a":1,"why":"耐陰性が高い＝光補償点が低い。ただし「暗くても育つ」のではなく「持ちこたえる」だけである。"},{"type":"mc","q":"古典園芸植物に含まれないものはどれか。","choices":["オモト","サクラソウ","ペチュニア"],"a":2,"why":"ペチュニアは南米原産で近代以降に普及した草花。古典園芸植物は江戸から明治にかけて日本で体系化された植物群。"},{"type":"mc","q":"江戸の園芸文化の特徴として最も適切なものはどれか。","choices":["温室を用いた熱帯植物の大量生産","鉢植えで変わりものを選抜し、品評会や番付、図譜で競った","国が品種を管理し民間の栽培を禁じた"],"a":1,"why":"斑入り・獅子葉・変化花などの変異を愛でる文化が、階層を越えて広がった。"},{"type":"mc","q":"花きの振興に関する法律（花き振興法）が制定された年はどれか。","choices":["1992年","2005年","2014年"],"a":2,"why":"1992年はグリーンアドバイザー制度の創設年、2005年は食育基本法の制定年。年号の入れ替えに注意。"},{"type":"mc","q":"秋（9〜11月）に園芸店で主力となる商品はどれか。","choices":["秋植え球根とパンジー・ビオラ","アサガオとヒマワリの苗","緑のカーテン用のネット"],"a":0,"why":"春の需要期に次ぐ山。年末はシクラメン、ハボタン、マツへ移る。"},{"type":"mc","q":"種苗法の登録品種について正しいものはどれか。","choices":["購入した株なら自由に増殖して販売できる","育成者の許諾なく増殖して譲渡・販売することはできない","登録から1年で誰でも自由に増殖できる"],"a":1,"why":"育成者権が働くため、挿し木で増やしてフリーマーケットで売るような行為は権利侵害になり得る。"},{"type":"mc","q":"農薬散布時の近隣配慮として最も適切なものはどれか。","choices":["風の強い日にまとめて散布する","効果を高めるため表示より濃い倍率で使う","風の弱い早朝や夕方に散布し、隣家に事前に声をかける"],"a":2,"why":"ラベルの希釈倍率・使用回数の厳守は義務。飛散（ドリフト）で洗濯物、ペット、水槽、池にかからないよう配慮する。"},{"type":"mc","q":"球根をタマネギやジャガイモと間違えた誤食で、重篤な中毒が報告されている植物はどれか。","choices":["イヌサフラン","ムスカリ","チューリップ"],"a":0,"why":"コルヒチンを含み、葉をギョウジャニンニクと誤認する例もある。死亡例が報告されている。"},{"type":"mc","q":"クワズイモやディフェンバキアなどサトイモ科の植物で、皮膚や口の刺激を起こす主な原因はどれか。","choices":["ウルシオール","アコニチン","シュウ酸カルシウムの針状結晶"],"a":2,"why":"ウルシオールはウルシ類のかぶれ、アコニチンはトリカブトの毒。成分の取り違えに注意。"},{"type":"mc","q":"車いすでも作業しやすいレイズドベッドの作業面の高さの目安はどれか。","choices":["20〜30cm程度","60〜75cm程度","120〜140cm程度"],"a":1,"why":"立位でも車いすでも無理なく手が届く高さ。ひざが入る張り出しをつくるとさらに近づける。"}]},{"id":2,"title":"エネルギーと水のしくみ","subtitle":"光合成・呼吸・蒸散から置き場所と水やりを説明できる","minutes":50,"goals":["根・茎・葉の構造と、道管・師管・形成層の働きを説明できる","光合成と呼吸の収支から、置き場所・夜温・徒長の理由を判断できる","蒸散と吸水のしくみから、水やりの量・時間帯・葉水の可否を説明できる"],"sections":[{"heading":"根・茎・葉 ― 三つの部署の分業","dialogue":[{"who":"客","text":"この鉢、根がぐるぐる巻きで。植え替えのとき根って切っていいんですか。白いフワフワまで取れちゃって心配で。"},{"who":"ハナ","text":"白いフワフワ……あれ、カビじゃないんですよね？"},{"who":"緑川","text":"根毛ですよ。水を吸う担当の、いちばん働き者。太い根は道路、根毛は蛇口。道路を少し切っても走れますが、蛇口を全部落とすと当分水が飲めない。だから植え替えのあとは日陰で養生するんです。"}],"body":"<p>植物は動かないぶん、器官ごとに徹底した分業をしています。まず<strong>根</strong>。役割は<strong>吸水・養分吸収・体の固定・貯蔵</strong>の4つです。ダイコンやアサガオのように太い<strong>主根</strong>から<strong>側根</strong>が出る形（双子葉類）と、イネやユリのように同じ太さの<strong>ひげ根</strong>が束で出る形（単子葉類）があります。実際に水と養分を吸うのは根の先端近くにある<strong>根毛</strong>で、表皮細胞が一本の細胞のまま毛のように伸びたもの。太さは1本では頼りないのに、数で表面積を何十倍にも稼ぎます。先端には<strong>根冠</strong>という帽子があり、成長点（分裂組織）を土の摩擦から守りながら前進します。</p><p>次に<strong>茎</strong>。ここは輸送と支持の担当で、通り道が<strong>維管束</strong>です。<strong>道管</strong>は水と無機養分を根から上へ運ぶ管で、中身は死んだ細胞がつながった土管状。<strong>師管</strong>は葉で作った糖を全身へ配る管で、こちらは生きた細胞です。双子葉類では道管側（内側）と師管側（外側）のあいだに<strong>形成層</strong>があり、ここが分裂するから茎が太くなり、接ぎ木も活着します。単子葉類は維管束が散らばり形成層がないので、原則太りません。</p><p><strong>葉</strong>は光合成工場。表面を<strong>クチクラ層</strong>（ろう質）が覆って水の逃げすぎと病原菌を防ぎ、<strong>表皮</strong>にある<strong>気孔</strong>がガスと水蒸気の出入口。内側の<strong>葉肉</strong>細胞に<strong>葉緑体</strong>が詰まっています。<strong>花</strong>は受粉のための生殖器官、<strong>果実</strong>は種子を守り運ばせる容器、<strong>種子</strong>は次世代の休眠カプセル。根・茎・葉が<strong>栄養器官</strong>、花・果実・種子が<strong>生殖器官</strong>です。</p>","why":"植物は移動できないため、吸う・運ぶ・作る・殖やすを器官ごとに専門化させ、その構造の違い（根の形・維管束の並び）がそのまま栽培管理の違いになる。","keypoints":["根の役割は吸水・養分吸収・固定・貯蔵。実際に吸うのは先端近くの根毛","根冠は成長点を保護する帽子。根毛は表皮細胞が伸びたもの","道管＝水と無機養分を上へ／死細胞・内側（木部）","師管＝糖などの同化産物を全身へ／生きた細胞・外側（師部）","形成層があるのは双子葉類。だから肥大成長し、接ぎ木ができる","根・茎・葉＝栄養器官、花・果実・種子＝生殖器官"],"table":{"caption":"双子葉類と単子葉類の体のつくり","headers":["項目","双子葉類","単子葉類"],"rows":[["子葉の枚数","2枚","1枚"],["根の形","主根＋側根","ひげ根"],["茎の維管束","輪状に並ぶ","散在する"],["形成層","ある（肥大する）","ない（原則太らない）"],["葉脈","網状脈","平行脈"],["代表例","トマト・キク・バラ・アサガオ","イネ・ユリ・チューリップ・ラン"]]},"mnemonic":"道管は「水道管」で水が上へ、師管は「師匠が弟子に配る」で糖が下へ。内側が道管、外側が師管。"},{"heading":"光合成 ― 葉は砂糖工場である","dialogue":[{"who":"客","text":"肥料をあげているのに、ちっとも大きくならないんです。栄養が足りないのかしら。"},{"who":"ハナ","text":"置き場所、うかがってもいいですか。……北向きの玄関、ですか。"},{"who":"緑川","text":"そこが答えです。肥料は植物の『ごはん』ではなく、工場で使う微量の部品。ごはんは葉が光で自分で作ります。光がなければ、いくら部品を積んでも工場は動きません。"}],"body":"<p>光合成とは、<strong>葉緑体</strong>の中の色素<strong>クロロフィル</strong>が光エネルギーを受け取り、<strong>水と二酸化炭素から糖と酸素を作る</strong>反応です。式で書けば次のとおり。</p><p><code>6CO2 + 12H2O + 光エネルギー → C6H12O6（糖）+ 6O2 + 6H2O</code></p><p>材料は3つ。<strong>水</strong>は根から道管を通って葉へ、<strong>二酸化炭素</strong>は葉の裏の気孔から、<strong>光</strong>は葉の表から入ります。生産物は<strong>糖</strong>と<strong>酸素</strong>。糖はその場でデンプンとして葉に一時貯蔵され、主に夜のあいだにショ糖の形へ変えられて師管を通り、新芽や根、果実へ運ばれます。植物の体を作る炭素は、肥料由来ではなく、そのほとんどが空気中の二酸化炭素由来です。「肥料をやれば育つ」ではなく「光がある分しか育たない」のはこのためです。</p><p>ここで大事なのは、<strong>3つの材料のうち一番足りないものが生産量を決める</strong>という点です。真夏の温室では、光も水も十分なのに、締め切った空間の二酸化炭素が使い尽くされて光合成が頭打ちになることがあります。逆に冬の室内では、二酸化炭素も水も足りているのに光が足りない。家庭園芸で圧倒的に多い不足要因は<strong>光</strong>です。</p><p>葉が緑に見えるのは、クロロフィルが赤色光と青色光をよく吸収し、<strong>緑色光は吸収せず反射・透過する</strong>から。つまり葉の緑は「使い残した光の色」です。葉が黄色くなる（クロロシス）のは、クロロフィルが作れない・壊れたサインで、窒素・鉄・マグネシウム不足や、根の傷み、老化が疑われます。</p>","why":"植物の体はほぼ空気中の二酸化炭素と水からできており、その組み立てエネルギーは光だけが供給する。だから光が不足すれば肥料をいくら足しても増えない。","keypoints":["光合成＝水＋二酸化炭素＋光 → 糖（デンプン）＋酸素。場所は葉緑体","光を吸収する色素はクロロフィル。赤と青を吸収し、緑は反射するので葉は緑","水は根から道管、二酸化炭素は気孔から、光は葉の表から取り込む","作られた糖はデンプンとして葉に一時貯蔵され、師管で各器官へ転流する","最も不足している要素が生産量の上限を決める。家庭園芸では光不足が最多"],"table":{"caption":"光合成の材料と、足りないときに現場で起きること","headers":["要素","入口","不足すると起きること"],"rows":[["光","葉の表面（葉緑体）","徒長、葉が薄く淡色、花が咲かない、下葉が落ちる"],["二酸化炭素","気孔","締め切った温室で生育停滞。換気で改善"],["水","根（道管経由）","気孔が閉じて二酸化炭素も入らず、光合成が二重に止まる"],["適温","全体","低温は酵素が動かず、高温は気孔が閉じ呼吸が増えて収支悪化"]]}},{"heading":"光の三要素 ― 明るさ・色・長さ","dialogue":[{"who":"客","text":"室内の照明、けっこう明るいと思うんですけど、それじゃダメなんですか。"},{"who":"ハナ","text":"人の目には明るく見えても、ですか？"},{"who":"緑川","text":"人の目は暗さに慣れる性能が高いんです。晴天の屋外は10万ルクス、明るい室内でも数百ルクス。桁が二つ違う。植物にとって室内は『薄暮』なんですよ。"}],"body":"<p>光は、<strong>光量（強さ）・光質（波長＝色）・日照時間（長さ）</strong>の3つで効き方が変わります。</p><p><strong>光量</strong>。光が弱いところから徐々に明るくしていくと、あるところで<strong>光合成量と呼吸量が釣り合い、見かけ上の増減がゼロ</strong>になります。これが<strong>光補償点</strong>。ここより暗い場所に置き続けると、植物は貯金を取り崩すだけになり、下葉から落ちて痩せていきます。さらに明るくすると光合成は増えますが、やがて<strong>それ以上明るくしても増えない</strong>頭打ちに達します。これが<strong>光飽和点</strong>。晴天の直射日光は多くの植物の光飽和点を超えており、超えた分は熱と光阻害になるだけです。夏の遮光が有効なのはこのためで、光を減らしても光合成は落ちず、葉温と蒸散だけが下がります。</p><p><strong>光質</strong>。クロロフィルの吸収がよいのは<strong>赤色光（約660nm）と青色光（約450nm）</strong>で、これが光合成の主力。青色光はさらに、気孔を開かせ、光の方へ曲がる<strong>光屈性</strong>を起こし、茎の伸びすぎを抑えます。<strong>遠赤色光（約730nm）</strong>はほとんど光合成に使えませんが、植物はこれをセンサーとして使い、遠赤の割合が高い＝「他の葉の陰にいる」と判断して茎を急激に伸ばします（避陰反応）。混み合った場所の苗がひょろつくのは、暗いからだけでなく、この信号のせいでもあります。</p><p><strong>日照時間</strong>。花芽ができるかどうかは1日の明るい時間の長さで決まる種類があり、長日植物・短日植物・中性植物に分かれます。実際に植物が測っているのは明るい時間ではなく<strong>連続した暗期の長さ</strong>で、だから短日植物の夜に一瞬でも照明が当たると開花しません。街灯の下のキクが咲き遅れるのは、この仕組みによります。</p>","why":"光合成量は光の強さに比例して無限に増えるのではなく、補償点と飽和点というふたつの境界を持ち、さらに植物は光の色そのものを「まわりの混み具合」を知るセンサーとして使っている。","keypoints":["光補償点＝光合成量と呼吸量が等しくなる明るさ。これ以下では痩せる","光飽和点＝それ以上明るくしても光合成が増えない明るさ","光合成に有効なのは赤色光と青色光。緑色光は反射・透過されやすい","青色光は気孔開口・光屈性・徒長抑制に働く","遠赤色光は避陰反応の信号となり、割合が高いと茎が伸びる","開花の日長反応が実際に測っているのは連続した暗期の長さ"],"table":{"caption":"光の波長と植物への働き","headers":["光の色（波長の目安）","光合成での役割","そのほかの働き"],"rows":[["青色光（約450nm）","よく吸収され有効","気孔を開く、光屈性、徒長を抑える"],["緑色光（約550nm）","吸収されにくい","反射・透過するため葉が緑に見える"],["赤色光（約660nm）","最もよく吸収され有効","花芽形成や発芽の制御に関与"],["遠赤色光（約730nm）","ほぼ使えない","避陰反応の信号。多いと茎が伸びる"]]},"mnemonic":"「赤と青が働き者、緑はサボって跳ね返る、遠赤は伸びろの合図」"},{"heading":"陽性・半陰性・陰性 ― 置き場所と徒長","dialogue":[{"who":"客","text":"ミニトマトとポトスを同じ棚に並べてるんですけど、トマトだけ元気がなくて。"},{"who":"ハナ","text":"そのポトスは、つやつやですね。"},{"who":"緑川","text":"同じ光でも、必要量が全然違うんです。ポトスにとっては十分な光が、トマトには飢餓状態。植物を分けるんじゃなく、光で棚を分ける。それが置き場所選びの基本です。"}],"body":"<p>植物は必要な光量によって、<strong>陽性植物・半陰性（中性）植物・陰性植物</strong>に分けられます。違いの正体は、前節の<strong>光補償点と光飽和点の高さ</strong>です。陽性植物は両方が高く、強い光を使い切れる代わりに、暗い場所ではあっという間に赤字になります。陰性植物は両方が低く、弱い光でも黒字を出せますが、強光には耐えられず<strong>葉焼け</strong>を起こします。日陰に強いことと日向に強いことは別物で、「丈夫な植物」という一括りは通用しません。</p><p>光が足りないときに起きる代表的な失敗が<strong>徒長</strong>です。節間（葉と葉の間）が間延びし、茎は細く、葉は薄く色が淡く、全体にひょろ長くなる状態。なぜそうなるのか。ひとつは前述の<strong>避陰反応</strong>で、暗さと遠赤色光の割合の高さを「陰にいる」と読み、茎を伸ばして光を探しに行くから。もうひとつは、青色光による<strong>伸長抑制がかからない</strong>から。結果として、少ない光合成産物を細胞壁の厚みではなく<strong>縦の伸長</strong>に使ってしまいます。だから徒長株は「大きいのに弱い」。組織がスカスカで倒れやすく、病害虫にも弱く、花つきも悪くなります。</p><p>徒長を助長する条件は光不足だけではありません。<strong>高い夜温</strong>（伸長は主に夜に起きる）、<strong>窒素過多</strong>、<strong>過湿</strong>、<strong>密植</strong>がそろうと一気に進みます。対策は逆をやること。すなわち<strong>明るい場所へ移す・株間をとる・夜温を下げる・窒素を控える・水を控えめにする</strong>。いったん間延びした節間は元に戻らないので、切り戻して作り直すのが早道です。</p>","why":"光補償点と光飽和点の高さが種類ごとに違うため「適切な明るさ」は植物ごとに異なり、不足すると植物は光を探す反応として茎だけを伸ばす（徒長する）。","keypoints":["陽性植物は光補償点も光飽和点も高い。陰性植物は両方低い","陰性植物を強光に置くと葉焼け、陽性植物を日陰に置くと徒長・落葉","徒長＝節間が伸び、茎が細く、葉が薄く淡くなる状態","原因は光不足・避陰反応・高夜温・窒素過多・過湿・密植","伸びてしまった節間は戻らない。切り戻して仕立て直す"],"table":{"caption":"必要光量による植物の3分類","headers":["区分","光補償点／光飽和点","適した置き場所","代表例"],"rows":[["陽性植物","ともに高い","一日中よく日の当たる屋外","トマト・ヒマワリ・バラ・マツ・スイレン"],["半陰性植物","中間","午前中だけ日が当たる、明るい半日陰","アジサイ・ツバキ・ギボウシ・ヤツデ"],["陰性植物","ともに低い","直射の入らない明るい日陰・室内","シダ類・アオキ・ポトス・観葉植物の多く"]]},"mnemonic":"徒長は「暗い・熱い夜・窒素多い・水多い・混んでる」の5点セット。ひとつでも外せば止まる。"},{"heading":"呼吸 ― 夜、植物は貯金を使う","dialogue":[{"who":"客","text":"熱帯夜が続いたら、シクラメンが急にへたって。昼は日陰に入れてたんですけど。"},{"who":"ハナ","text":"昼を涼しくしても、だめなんですか？"},{"who":"緑川","text":"むしろ問題は夜なんです。昼に稼いだ糖を、夜の暑さがどんどん燃やしてしまう。稼ぎが同じでも支出が倍なら、家計は破綻するでしょう。"}],"body":"<p><strong>呼吸</strong>は、糖と酸素からエネルギーを取り出し、二酸化炭素と水を出す反応です。式は光合成のちょうど逆向き。</p><p><code>C6H12O6 + 6O2 → 6CO2 + 6H2O + エネルギー</code></p><p>決定的な違いは3つ。呼吸は<strong>光がなくても行われ、昼夜を問わず24時間続く</strong>こと。葉緑体を持たない<strong>根や茎や花も含めた全細胞</strong>で行われること。そして<strong>温度が高いほど激しくなる</strong>ことです。目安として、温度が10度上がると呼吸量はおよそ2倍前後になります。</p><p>したがって植物の成長量は「光合成量－呼吸量」の収支で決まります。昼は光合成が呼吸を上回って黒字、夜は呼吸だけなので必ず赤字。<strong>1日の黒字が赤字を上回った分だけ、植物は太る</strong>わけです。ここで熱帯夜が効いてきます。夜温が25度、28度と上がると呼吸だけが跳ね上がり、昼に貯めた糖を夜のうちに燃やし尽くす。株は消耗し、花芽ができず、色も乗らず、徒長します。夏の高冷地の花がよく締まって色が濃いのは、昼は暖かく<strong>夜が冷える＝昼夜の温度差（較差）が大きい</strong>からです。夏に鉢を夜だけ涼しい場所へ動かす、風を通す、といった管理はすべて「夜の支出を減らす」ための操作です。</p><p>例外的な戦略をとるのが<strong>CAM植物</strong>。多肉植物やサボテン、カランコエ、パイナップルなどが該当します。彼らは<strong>夜に気孔を開いて二酸化炭素を取り込み、有機酸（リンゴ酸）の形で貯めておき、昼は気孔を閉じたまま、その貯金を使って光合成</strong>をします。昼に気孔を開けば乾燥地では水が失われるからで、蒸散を最小限にする適応です。乾燥に強い一方で成長は遅く、水のやりすぎに弱い。多肉の水やりを涼しい時間帯に行い、真夏の日中を避けるのは、この生理に沿った扱いです。</p>","why":"呼吸は光と無関係に全細胞で24時間続き、温度が上がるほど加速するため、夜が暑いほど昼の稼ぎが失われ、収支としての成長が細る。","keypoints":["呼吸＝糖＋酸素 → 二酸化炭素＋水＋エネルギー。光合成の逆反応","呼吸は昼夜24時間、葉緑体のない根や花も含む全細胞で行われる","温度が10度上がると呼吸量はおよそ2倍。高夜温は消耗の主因","成長量＝光合成量－呼吸量。昼夜の温度差が大きいほど株が締まる","CAM植物は夜に気孔を開けてCO2を有機酸で貯め、昼は閉じて光合成する","CAM型の例：サボテン、多肉植物、カランコエ、パイナップル"],"table":{"caption":"光合成と呼吸の比較","headers":["項目","光合成","呼吸"],"rows":[["行う時間","光のあるときだけ","24時間つねに"],["行う場所","葉緑体のある細胞","生きた全細胞（根・茎・花も）"],["吸収する気体","二酸化炭素","酸素"],["放出する気体","酸素","二酸化炭素"],["物質の増減","糖を作る（合成）","糖を分解する"],["エネルギー","光を化学エネルギーに変える","化学エネルギーを取り出す"]]}},{"heading":"蒸散と気孔 ― 葉は汗をかいて冷やす","dialogue":[{"who":"客","text":"梅雨どきに室内へ入れておいたら、葉の先が茶色く枯れてきました。水は足りているはずなのに。"},{"who":"ハナ","text":"水があるのに、水が足りない症状……ですか？"},{"who":"緑川","text":"そのとおり。湿度が高くて風がないと、葉から水が出ていかない。出ていかなければ、根からも上がってこない。運ばれるはずのカルシウムが末端に届かず、葉先から枯れるんです。"}],"body":"<p><strong>蒸散</strong>は、根から吸った水を葉の<strong>気孔</strong>から水蒸気として放出する働きです。気孔は2つの<strong>孔辺細胞</strong>が向かい合った構造で、細胞に水が入って<strong>膨圧</strong>が高まると、内側の細胞壁が厚く外側が薄いという壁の厚みの差のせいで細胞が湾曲し、すき間ができて開きます。水が抜けてしぼめば閉じます。気孔は<strong>青色光</strong>と<strong>葉内の二酸化炭素濃度の低下</strong>で開き、<strong>乾燥ストレス（アブシジン酸）・暗黒・過度の高温</strong>で閉じます。多くの植物は朝に開き、夕方から夜に閉じます。</p><p>蒸散が果たす働きは3つ。<strong>第一に、水を吸い上げる原動力になること。</strong>葉から水が抜けると水柱が上へ引っぱられ、根の吸水が続きます。<strong>第二に、水にとけた無機養分を根から地上部へ運ぶこと。</strong>とくにカルシウムやホウ素は水の流れに乗ってしか動けないため、蒸散が止まると末端に届きません。トマトの尻腐れ果やレタスのチップバーンは、土にカルシウムがあっても起きる「運搬の事故」です。<strong>第三に、気化熱で葉温を下げること。</strong>直射下の葉が焼けずにいられるのは、この打ち水効果があるからです。</p><p>したがって<strong>高湿度・無風</strong>は蒸散を止める危険な条件になります。梅雨や締め切った室内で不調が出るのはこのため。適度な<strong>風</strong>は葉の表面にできる湿った空気の層（境界層）を吹き払って蒸散を助けますが、強風・乾風は気孔を閉じさせ、逆に萎れさせます。<strong>葉水</strong>は、湿度を補い、葉温を下げ、乾燥を好む<strong>ハダニ</strong>を抑える点で有効です。ただし夜間に葉を濡らしたままにすると、灰色かび病などの発生を招くので、行うなら乾く時間のある日中に。</p>","why":"蒸散は水を捨てる無駄ではなく、吸水の駆動・養分の運搬・葉温の低下という三つの仕事を同時にこなす動力であり、止まればそのすべてが止まる。","keypoints":["気孔は2つの孔辺細胞の膨圧変化で開閉する","気孔は青色光と葉内CO2低下で開き、乾燥・暗黒・高温で閉じる","蒸散の3つの働き＝水の吸い上げ、無機養分の運搬、葉温の低下","カルシウム欠乏（尻腐れ・チップバーン）は蒸散不足でも起きる","高湿度・無風は蒸散を止める。適度な風は蒸散を促す","葉水は湿度補給・葉温低下・ハダニ予防に有効。夜は濡らしたままにしない"],"table":{"caption":"環境条件と蒸散量の関係","headers":["条件","蒸散","現場で起きること"],"rows":[["湿度が低い","増える","水切れしやすい。真夏の乾風で急にしおれる"],["湿度が高い","減る","吸水が止まり、カルシウムなどが末端に届かない"],["適度な風がある","増える","境界層が薄くなり、葉温も下がる"],["無風","減る","葉温が上がりやすく、蒸れ・病気の温床"],["高温（極端）","減る","気孔が閉じ、光合成も同時に止まる"],["夜間","ほぼ止まる","気孔が閉じる。根圧で葉先に水滴（溢液）が出ることがある"]]}},{"heading":"水はなぜ上がるか ― 吸水と水やりの理屈","dialogue":[{"who":"客","text":"水やりって、毎日ちょっとずつのほうが優しいですよね？"},{"who":"ハナ","text":"……なんとなく、そんな気がします。"},{"who":"緑川","text":"逆なんです。ちょっとずつだと表面しか濡れず、根は下へ伸びる理由を失う。鉢底から流れ出るまでたっぷりやる。あれは水をやる作業であると同時に、鉢の中の古い空気を押し出して、新しい酸素を入れる作業なんですよ。"}],"body":"<p>水はポンプもないのに、なぜ木のてっぺんまで上がるのか。三つの力が重なっています。</p><p>まず<strong>浸透圧</strong>。根の細胞内の液は土の水より濃いので、水は薄いほうから濃いほうへ、細胞膜を通って自然に入ってきます。逆に言えば、<strong>肥料を濃くやりすぎて土の水のほうが濃くなると、水は根から出ていく</strong>。これが<strong>肥料焼け</strong>の正体で、根に水があるのにしおれるという奇妙な症状になります。次に<strong>根圧</strong>。根が能動的に水を押し上げる力で、蒸散のない夜間や早朝に働き、葉先から水滴がしみ出す<strong>溢液</strong>として観察できます。ただし根圧だけで届くのはせいぜい数メートルです。</p><p>主役は三つめ、<strong>蒸散による引き上げ</strong>です。水分子どうしは水素結合で強く引き合っており（<strong>凝集力</strong>）、細い道管の中では途切れない一本の<strong>水柱</strong>になっています。葉から水が蒸発すると、その分だけ水柱全体が上へ引っぱられる。ストローと同じ原理で、細い管では<strong>毛管現象</strong>も加勢します。だから蒸散が止まれば吸水も止まる。前節の話と裏表です。</p><p>水が足りなくなると<strong>しおれ</strong>ます。日中に蒸散が吸水を上回って一時的にしおれ、夕方や日陰で回復するのが<strong>一時萎凋</strong>。土の水分が根の吸える限界（永久しおれ点）を下回り、<strong>水をやっても回復しない</strong>のが<strong>永久萎凋</strong>です。ここから水やりの理屈が導けます。<strong>鉢底から流れ出るまで与える</strong>のは、水が古い空気を押し出し、引いたあとに新鮮な酸素が入るから。<strong>受け皿の水を捨てる</strong>のは、溜めておくと酸素が入らず根が窒息して根腐れするから。<strong>真夏は早朝と夕方</strong>に与えるのは、日中の水は鉢内で温まって根を傷め、蒸散のピークとずれるから。<strong>冬は午前中</strong>に済ませるのは、夕方に濡らすと夜間に凍結・低温障害を起こすからです。</p>","why":"水を運ぶ主な力は葉の蒸散による引き上げであり、根は水と同時に酸素も必要とするため、水やりは「水を足す作業」であると同時に「空気を入れ替える作業」でもある。","keypoints":["吸水を支える力は浸透圧・根圧・蒸散による引き上げ（＋毛管現象）","水分子の凝集力で切れない水柱ができ、葉の蒸散が全体を引き上げる","肥料の濃度が高すぎると浸透圧が逆転し、根から水が奪われて肥料焼け","根圧の証拠が早朝の溢液（葉先の水滴）","一時萎凋は日陰・夕方で回復、永久萎凋は水をやっても戻らない","鉢底から流れ出るまで与える理由は酸素の入れ替えと余分な塩類の洗い流し","夏は早朝と夕方、冬は午前中。受け皿の水は溜めない"],"table":{"caption":"季節ごとの水やりの時間帯と理由","headers":["季節","適した時間帯","理由"],"rows":[["春・秋","午前中","日中の蒸散に間に合い、夜までに表面が乾く"],["夏","早朝と夕方","日中は鉢内の水温が上がって根を傷め、蒸発も激しい"],["冬","午前中（暖かい日）","夕方以降だと夜間に凍結・低温障害を起こす"]]},"mnemonic":"しおれの区別は「日陰で戻れば一時、戻らなければ永久」。"},{"heading":"転流と温度 ― 摘む理由、夏バテの理由","dialogue":[{"who":"客","text":"せっかく咲いたつぼみを摘めって言われたんですが、もったいなくて。"},{"who":"ハナ","text":"私も最初、同じことを思いました。"},{"who":"緑川","text":"葉が稼ぐ糖の総額は決まっているんです。取り分を10人で分けるか3人で分けるか。摘むというのは、配当を集中させる操作なんですよ。"}],"body":"<p>葉で作られた糖は師管を通って必要な場所へ移動します。これが<strong>転流</strong>。糖を供給する側（主に成熟した葉）を<strong>ソース</strong>、消費・貯蔵する側（新芽、花、果実、根、球根、イモ）を<strong>シンク</strong>と呼びます。ソース側で糖が積み込まれると濃度が上がって水が入り、圧力が高まって、圧力の低いシンク側へ押し流される。つまり<strong>転流は圧力差による流れ</strong>です。</p><p>ここが実務に直結します。ソースの総生産量は光の量で決まり、簡単には増えません。一方シンクは互いに<strong>競合</strong>します。だから<strong>摘心・摘芽・摘蕾・摘果</strong>でシンクの数を減らせば、残ったものへの配分が増えて大きく充実する。大玉のスイカや大輪のキクは、この算数の産物です。<strong>摘心</strong>にはもうひとつ効果が。茎の先端（頂芽）は側芽の伸長を抑えるホルモンを出しており（<strong>頂芽優勢</strong>）、先端を摘むと抑制が外れて側芽が動き、枝数が増えて株が横に広がります。</p><p>最後に<strong>温度</strong>。光合成は酵素反応なので低温では進まず、高温でも落ちます。多くの草花・野菜の生育適温は昼<strong>20〜25度</strong>前後。それを超えると<strong>気孔が閉じて二酸化炭素が入らない・呼吸が増える・酵素の効率が落ちる</strong>という三重苦で収支が悪化します。これが植物の「夏バテ」です。</p><p>ただし高温への強さは種類で違います。多くの植物は<strong>C3植物</strong>（イネ、コムギ、ダイズ、多くの草花）で、高温・強光下では光合成の酵素が酸素と反応する<strong>光呼吸</strong>の損失が大きい。一方<strong>C4植物</strong>（トウモロコシ、サトウキビ、ススキ、メヒシバなど主に熱帯起源のイネ科）は、葉の中で二酸化炭素を濃縮してから光合成に渡す仕組みを持ち、光呼吸の損失が小さい。だから<strong>真夏に強い</strong>。夏の畑でイネ科の雑草だけが元気なのは、根性ではなく回路の違いです。</p>","why":"葉の総生産量は光で頭打ちになるため、収穫物を大きくする唯一の現実的な手段は分配先（シンク）を減らして配分を集中させることであり、その生産量自体も温度と光合成回路の型に強く縛られる。","keypoints":["ソース＝糖を作る成熟葉、シンク＝消費・貯蔵する新芽・花・果実・根","転流は師管を通り、ソースとシンクの圧力差で流れる","摘心・摘蕾・摘果はシンクを減らして残りへの配分を増やす操作","頂芽優勢：頂芽が側芽の伸長を抑える。摘心で抑制が外れ枝数が増える","多くの草花・野菜の生育適温は昼おおむね20〜25度","高温で光合成が落ちる理由は、気孔閉鎖・呼吸増加・酵素効率の低下","C4植物はCO2を濃縮して光呼吸を抑えるため高温・強光に強い"],"table":{"caption":"C3植物とC4植物の違い","headers":["項目","C3植物","C4植物"],"rows":[["得意な環境","冷涼〜温暖、中程度の光","高温・強光・やや乾燥"],["光呼吸による損失","大きい","小さい（CO2を濃縮するため）"],["光飽和点","比較的低い","高い（強光を使い切れる）"],["代表例","イネ・コムギ・ダイズ・多くの草花","トウモロコシ・サトウキビ・ススキ・メヒシバ"]]},"mnemonic":"「C4は夏の主役」…トウモロコシ・サトウキビ・ススキ、みな真夏にぐんぐん伸びる顔ぶれ。"}],"quiz":[{"type":"ox","q":"道管は根から吸い上げた水や無機養分を運び、師管は葉で作られた糖などを運ぶ。","a":true,"why":"道管は上向きに水と無機養分、師管は葉から各器官へ同化産物を運ぶ。道管は死細胞、師管は生きた細胞という違いもある。"},{"type":"ox","q":"形成層は単子葉類にあり、これがあるため茎が年々太くなる。","a":false,"why":"形成層があるのは双子葉類。単子葉類は維管束が散在し形成層を持たないため、原則として肥大成長しない。"},{"type":"ox","q":"根の先端にある根冠は、内部の成長点を土の摩擦から守る役割を持つ。","a":true,"why":"根冠は分裂組織を保護する帽子状の組織。水を吸うのは根冠ではなく、少し後方にある根毛である。"},{"type":"ox","q":"光合成で放出される気体は二酸化炭素である。","a":false,"why":"光合成が吸収するのが二酸化炭素で、放出するのは酸素。二酸化炭素を放出するのは呼吸のほう。"},{"type":"ox","q":"葉が緑色に見えるのは、クロロフィルが緑色光をよく吸収するためである。","a":false,"why":"逆。クロロフィルは赤色光と青色光をよく吸収し、緑色光は吸収せず反射・透過する。だから残った緑が目に見える。"},{"type":"ox","q":"光補償点とは、光合成による二酸化炭素の吸収量と呼吸による放出量が釣り合う明るさのことである。","a":true,"why":"見かけ上の増減がゼロになる点。これより暗い場所に置き続けると植物は蓄えを取り崩して衰弱する。"},{"type":"ox","q":"陰性植物は陽性植物にくらべて光補償点も光飽和点も高い。","a":false,"why":"陰性植物は両方とも低い。弱い光でも黒字にできる代わりに、強光では葉焼けを起こす。"},{"type":"ox","q":"呼吸は夜間だけ行われ、昼間は光合成に切り替わるため停止している。","a":false,"why":"呼吸は昼夜を問わず24時間、生きた全細胞で続いている。昼は光合成が上回るため見かけ上目立たないだけ。"},{"type":"ox","q":"夜温が高いと呼吸が増え、昼に蓄えた同化産物が消費されて株が消耗しやすい。","a":true,"why":"呼吸は温度が10度上がるとおよそ2倍になる。熱帯夜が続くと収支が赤字となり、花芽がつかず徒長しやすい。"},{"type":"ox","q":"CAM植物は昼間に気孔を開いて二酸化炭素を取り込み、夜間は気孔を閉じる。","a":false,"why":"逆である。CAM植物は夜に気孔を開いてCO2を有機酸として貯め、昼は気孔を閉じたまま光合成する。乾燥地で水を失わないための適応。"},{"type":"ox","q":"気孔の開閉は、2つの孔辺細胞の膨圧の変化によって起こる。","a":true,"why":"水が入って膨圧が高まると、細胞壁の厚みの差で湾曲して開く。水が抜けてしぼむと閉じる。"},{"type":"ox","q":"湿度が高く風のない環境では蒸散が盛んになり、カルシウムの運搬が促進される。","a":false,"why":"高湿度・無風では蒸散が抑えられる。蒸散が止まると水流に乗るカルシウムが末端へ届かず、尻腐れやチップバーンの原因になる。"},{"type":"ox","q":"日中にしおれても夕方や日陰で回復するものを一時萎凋という。","a":true,"why":"蒸散が吸水を一時的に上回った状態。土の水分が永久しおれ点を下回り、水をやっても戻らないものが永久萎凋。"},{"type":"ox","q":"鉢植えの水やりで鉢底から水が流れ出るまで与えるのは、用土内の古い空気を押し出して新しい酸素を入れる意味がある。","a":true,"why":"根も呼吸しているため酸素が必要。同時に、蓄積した余分な塩類を洗い流す効果もある。"},{"type":"ox","q":"摘心をすると頂芽優勢が解除され、側芽が伸びて枝数が増える。","a":true,"why":"頂芽が出す側芽抑制の作用が取り除かれるため。同時にシンクが整理され、残った部分への配分も変わる。"},{"type":"ox","q":"トウモロコシやサトウキビはC3植物で、高温・強光では光呼吸による損失が大きい。","a":false,"why":"トウモロコシ・サトウキビはC4植物。二酸化炭素を濃縮して光呼吸を抑えるため、高温・強光でも効率よく光合成できる。"},{"type":"mc","q":"実際に水と養分の吸収を担っている部分はどれか。","choices":["根冠","根毛","形成層"],"a":1,"why":"根毛は表皮細胞が伸びたもので、表面積を大幅に増やして吸収を担う。根冠は成長点の保護、形成層は肥大成長の担当。"},{"type":"mc","q":"単子葉類の特徴として正しい組み合わせはどれか。","choices":["ひげ根・平行脈・維管束が散在","主根と側根・網状脈・維管束が輪状","ひげ根・網状脈・形成層あり"],"a":0,"why":"単子葉類は子葉1枚、ひげ根、平行脈、維管束が散在し形成層がない。網状脈と主根・側根は双子葉類の特徴。"},{"type":"mc","q":"光合成の材料として必要ないものはどれか。","choices":["水","二酸化炭素","酸素"],"a":2,"why":"酸素は光合成の材料ではなく生産物。材料は水・二酸化炭素・光エネルギーの3つ。"},{"type":"mc","q":"光合成に最も有効に利用される光の色の組み合わせはどれか。","choices":["緑色光と黄色光","赤色光と青色光","遠赤色光と緑色光"],"a":1,"why":"クロロフィルの吸収極大は赤（約660nm）と青（約450nm）付近。緑色光は反射・透過され、遠赤色光はほとんど光合成に使えない。"},{"type":"mc","q":"青色光の働きとして正しいものはどれか。","choices":["気孔を開かせ、茎の伸びすぎを抑える","茎を急速に伸長させ、徒長を促す","ほとんど吸収されず葉の色を決める"],"a":0,"why":"青色光は気孔開口・光屈性・伸長抑制に働く。伸長を促す信号は遠赤色光、反射されて葉色を決めるのは緑色光。"},{"type":"mc","q":"それ以上明るくしても光合成量が増えなくなる明るさを何というか。","choices":["光補償点","光飽和点","永久しおれ点"],"a":1,"why":"光飽和点。光補償点は光合成量と呼吸量が釣り合う点、永久しおれ点は水分についての用語で、いずれも別物。"},{"type":"mc","q":"陽性植物の例として最も適切なものはどれか。","choices":["シダ類","アオキ","ヒマワリ"],"a":2,"why":"ヒマワリは強い光を要求する典型的な陽性植物。シダ類とアオキは弱光でも育つ陰性植物側で、直射では葉焼けしやすい。"},{"type":"mc","q":"徒長の説明として正しいものはどれか。","choices":["節間が伸び、茎が細く葉が薄く淡くなる","節間が詰まり、葉が厚く濃緑になる","根だけが異常に太くなる"],"a":0,"why":"徒長は光不足や高夜温、窒素過多などで茎が間延びした状態。節間が詰まって葉が厚く濃いのは、むしろ十分な光を受けた締まった生育。"},{"type":"mc","q":"徒長を助長する条件として当てはまらないものはどれか。","choices":["高い夜温","窒素過多","十分な株間と強い光"],"a":2,"why":"株間を十分にとり強い光に当てるのは徒長を防ぐ管理。高夜温・窒素過多・過湿・密植・光不足が徒長を招く。"},{"type":"mc","q":"呼吸について正しい記述はどれか。","choices":["葉緑体をもつ細胞だけで行われる","根や花を含む生きた全細胞で行われる","光のある昼間だけ行われる"],"a":1,"why":"呼吸は生きたすべての細胞で24時間行われる。葉緑体が必要で光のある時だけ行われるのは光合成のほう。"},{"type":"mc","q":"温度が10度上昇したときの呼吸量の変化として、目安に近いものはどれか。","choices":["約2倍になる","約半分になる","変わらない"],"a":0,"why":"呼吸は酵素反応なので温度に強く反応し、10度の上昇でおよそ2倍になる。これが高夜温で株が消耗する理由。"},{"type":"mc","q":"蒸散の働きとして誤っているものはどれか。","choices":["水を吸い上げる原動力になる","無機養分を地上部へ運ぶ","二酸化炭素を糖に変える"],"a":2,"why":"二酸化炭素を糖に変えるのは光合成。蒸散の3つの働きは、吸水の駆動、養分の運搬、気化熱による葉温の低下。"},{"type":"mc","q":"トマトの尻腐れ果の背景として最も適切な説明はどれか。","choices":["蒸散が不足してカルシウムが果実に届かない","窒素が不足して葉が黄化する","日照が強すぎて糖が過剰になる"],"a":0,"why":"カルシウムは水の流れに乗ってしか移動できない。高湿度・無風・急な水切れなどで蒸散が乱れると、土に足りていても末端に届かず発生する。"},{"type":"mc","q":"肥料を濃くやりすぎたときに根がしおれる理由として正しいものはどれか。","choices":["根圧が高まりすぎて水が噴き出すから","土の溶液のほうが濃くなり、根から水が奪われるから","毛管現象が強くなりすぎるから"],"a":1,"why":"浸透圧の関係が逆転し、水が根の細胞から土へ出ていく。これが肥料焼けで、水があるのにしおれるという症状になる。"},{"type":"mc","q":"真夏の鉢物の水やりについて、最も適切なものはどれか。","choices":["正午前後にたっぷり与える","早朝と夕方に、鉢底から流れ出るまで与える","毎日表面が湿る程度に少量ずつ与える"],"a":1,"why":"日中の水は鉢内で温まって根を傷める。たっぷり与えるのは酸素の入れ替えと塩類の洗い流しのため。少量ずつでは深部が乾き、根が下へ伸びない。"},{"type":"mc","q":"摘果や摘蕾によって残った果実や花が大きくなる理由として正しいものはどれか。","choices":["葉の光合成能力そのものが高まるから","同化産物を受け取るシンクの数が減り、配分が集中するから","道管の本数が増えて水の供給が増えるから"],"a":1,"why":"ソース（葉）の総生産量は光で決まり簡単には増えない。シンクを減らすことで1つあたりの取り分が増えるという分配の問題である。"}]},{"id":3,"title":"花を咲かせるスイッチ","subtitle":"発芽・休眠・花芽形成を光と温度から説明できる","minutes":50,"goals":["発芽の3条件と光の要求性を、覆土の厚さという実作業に結びつけて判断できる","日長・温度・ホルモンのどれが花芽のスイッチかを見分け、咲かない原因を診断できる","花芽ができる時期から逆算して、庭木の剪定適期を自分で決められる"],"sections":[{"heading":"発芽の3条件と、第4の条件「光」","dialogue":[{"who":"客","text":"去年もらったレタスの種、丁寧に土をかぶせて水もやったのに、ほとんど芽が出なかったんです。"},{"who":"ハナ","text":"水も温度もばっちりなのに……。土をかけすぎたんでしょうか？"},{"who":"緑川","text":"それが正解だよ。レタスは光を浴びないと発芽しない種。丁寧に埋めたことが、そのまま失敗の原因になったんだ。"}],"body":"<h4>まず水・温度・酸素</h4><p>種子の発芽に絶対必要なのは<strong>水・温度・酸素（空気）</strong>の3つです。水を吸うと種子内部の酵素が働きはじめ、貯蔵しているデンプンや脂肪を分解して胚が使える形に変えます。その分解と呼吸には<strong>酸素</strong>が要るので、水をやりすぎて用土が水びたしになると種子は呼吸できず腐ります。「発芽まで乾かさない、しかし土が息をできる状態を保つ」が播種の基本です。温度は種類ごとに発芽適温があり、低すぎれば酵素が動かず、高すぎても発芽しません。</p><h4>第4の条件が光</h4><p>3条件がそろっても発芽しない種子があります。光があると発芽する<strong>好光性種子（光発芽種子）</strong>と、光があると発芽が抑えられる<strong>嫌光性種子（暗発芽種子）</strong>です。好光性種子は一般に小粒で貯蔵養分が少なく、深く埋まると地上に出る前に力尽きてしまう。そこで「明るい＝地表に近い」ことを確かめてから発芽するしくみを持っています。だから<strong>覆土はごく薄く、あるいは覆土しない</strong>。乾燥が心配なら、ふるったバーミキュライトをうっすらかけるか、発芽まで新聞紙で覆って湿りを保ちます。逆に嫌光性種子は大粒のものが多く、しっかり覆土して暗くします。</p><p>覆土の一般的な目安は<strong>種子の直径の2〜3倍</strong>。好光性種子だけがこの原則の例外だと押さえておけば、播種の失敗は大きく減ります。</p>","why":"好光性種子が光を要求するのは、養分の少ない小粒種子が「地表に近い＝出られる」ことを確認するための安全装置だから。","keypoints":["発芽の3条件は水・温度・酸素（空気）。第4の条件として光の要求性がある","好光性種子＝光で発芽が促される。小粒が多く、覆土は極薄または無し","嫌光性種子＝光で発芽が抑えられる。大粒が多く、しっかり覆土する","覆土の目安は種子の直径の2〜3倍。好光性種子はその例外","過湿は酸素不足を招き、種子を腐らせる"],"table":{"caption":"光の要求性による種子の分類と覆土","headers":["区分","性質","代表例","覆土"],"rows":[["好光性種子（光発芽種子）","光が当たると発芽が促される。小粒が多い","レタス、シュンギク、セロリ、ニンジン、ペチュニア、キンギョソウ、ベゴニア、プリムラ","かけないか、ごく薄く。新聞紙やバーミキュライトで乾燥防止"],["嫌光性種子（暗発芽種子）","光が当たると発芽が抑えられる。大粒が多い","ダイコン、ネギ、タマネギ、トマト、ナス、カボチャ、スイカ、パンジー、シクラメン、ニチニチソウ","種子の直径の2〜3倍を目安にしっかり"]]},"mnemonic":"好光性は「小さい種は光を頼りに顔を出す」。レタス・シュンギク・セロリ・ニンジンは頭文字で『レ・シュン・セ・ニン』とまとめて覚える。"},{"heading":"休眠と休眠打破 ― 眠っている種子を起こす","dialogue":[{"who":"客","text":"庭のサクラから採った種を蒔いたんですが、半年たっても何も出てきません。腐ったんでしょうか。"},{"who":"ハナ","text":"水も温度も大丈夫そうなのに……種が悪かったんでしょうか？"},{"who":"緑川","text":"いや、生きているよ。眠っているだけだ。サクラの種は『きちんと冬を越した』と感じないと目を覚まさない。冬を体験させてやる必要がある。"}],"body":"<h4>休眠は「まだ起きるな」という命令</h4><p>条件がそろっても発芽しない状態を<strong>休眠</strong>といいます。秋に落ちた種子がその場ですぐ発芽すれば、幼い芽は冬の寒さで全滅する。そこで植物は<strong>アブシシン酸</strong>などの発芽抑制物質や、水を通さない硬い種皮で、自分自身にブレーキをかけています。このブレーキを外す作業が<strong>休眠打破</strong>です。</p><h4>代表的な3つの打破法</h4><ul><li><strong>硬実種子の種皮処理</strong>…アサガオ、スイートピー、カンナのように種皮が硬く吸水できない種子は、やすりや爪切りで種皮に傷をつける、ぬるま湯に一晩浸けるなどして水を入れてやります。</li><li><strong>低温湿潤処理（層積処理・チリング）</strong>…湿らせた砂やバーミキュライトに種子を混ぜ、5℃前後で数週間から数か月置きます。バラ、モモ、サクラ、カエデなど木本類の種子に有効で、「冬を越した」と種子に信じさせる処理です。乾いたまま冷やしても効きません。<strong>湿らせることが必須</strong>です。</li><li><strong>後熟</strong>…採種直後は胚が未熟だったり抑制物質が残っていて発芽できない種子が、一定期間の貯蔵を経て発芽能力を持つようになる現象です。</li></ul><h4>芽も眠る</h4><p>休眠するのは種子だけではありません。落葉樹は夏から秋に自ら休眠に入り、一定量の低温に遭わないと春になっても芽が動きません。この必要量を<strong>低温要求量</strong>といい、暖冬や暖地では満たされずに萌芽や開花が不揃いになります。<strong>休眠打破の低温は「眠りから覚ますため」、春化の低温は「起きている植物に花芽をつくらせるため」</strong>。同じ低温でも目的が違う、と区別してください。</p>","why":"休眠は「季節を読み違えて死なない」ための保険であり、休眠打破とはその保険が要求する条件（吸水・冬の低温・時間）を人が代わりに与えてやること。","keypoints":["休眠＝発芽条件がそろっても発芽しない状態。抑制物質（アブシシン酸）や硬い種皮による","硬実種子は種皮に傷をつける・温湯に浸すなどで吸水させる（アサガオ、スイートピー、カンナ）","低温湿潤処理（層積・チリング）は湿らせて5℃前後。乾かしたままでは効かない","後熟＝貯蔵期間を経て発芽能力を得る現象","落葉樹の芽も休眠し、低温要求量を満たさないと萌芽・開花が不揃いになる","休眠打破の低温＝目覚めさせる／春化の低温＝花芽をつくらせる"],"table":{"caption":"休眠打破の方法と対象","headers":["方法","何が原因の休眠か","処理の内容","対象の例"],"rows":[["種皮処理（硬実処理）","硬い種皮で吸水できない","やすり・爪切りで傷をつける、温湯やぬるま湯に浸す","アサガオ、スイートピー、カンナ"],["低温湿潤処理（層積・チリング）","胚が低温を要求している","湿った砂やバーミキュライトに混ぜ5℃前後で数週間〜数か月","サクラ、モモ、バラ、カエデなど木本類"],["後熟（貯蔵）","胚が未熟、抑制物質が残る","適切な条件で一定期間貯蔵する","採種直後の草花・野菜の種子"]]}},{"heading":"花芽分化と花芽形成 ― 剪定で花を落とさない","dialogue":[{"who":"客","text":"秋に庭のツツジをきれいに刈り込んだら、翌春まったく咲かなくて。木が弱ったんでしょうか？"},{"who":"ハナ","text":"形はきれいに整っていたのに、不思議ですね。"},{"who":"緑川","text":"木は元気だよ。ツツジは花が終わってすぐ、夏には翌年の花芽をつくり終えている。秋の刈り込みは、その花芽をまとめて切り落としていたんだ。"}],"body":"<h4>まず言葉を分ける</h4><p><strong>花芽分化</strong>とは、茎の先端の成長点が「葉や枝になる」予定から「花になる」予定へ切り替わること、およびその開始を指します。外から見てもわからないほど小さな変化です。これに対して<strong>花芽形成</strong>は、分化のあとにがく・花弁・おしべ・めしべといった器官がつくられ、花芽として完成するまでの過程全体を指します。<strong>分化はスタート、形成はプロセス</strong>と押さえます。</p><h4>剪定の失敗はここで起きる</h4><p>庭木の多くは、<strong>花が咲くよりずっと前に花芽をつくり終えています</strong>。ツツジ、サツキ、アジサイ、ウメ、サクラ、モクレン、ユキヤナギ、レンギョウなどは、花後の初夏から夏にかけて翌年の花芽を分化させ、その花芽を付けたまま冬を越します。つまり秋や冬に枝を切りそろえると、完成した花芽ごと落としてしまう。これらは<strong>花が終わったらすぐ（おおむね梅雨入り前まで）</strong>に剪定するのが鉄則です。</p><p>逆にサルスベリ、ムクゲ、フヨウ、ノウゼンカズラ、四季咲きのバラなどは、春に伸びた<strong>その年の枝（当年枝）</strong>に花芽をつけてその年に咲きます。落葉期に強く切り戻しても花は減りません。<strong>前年枝に咲くのか、当年枝に咲くのか</strong>――剪定時期の判断は、結局この一点に集約されます。</p>","why":"花芽は開花のはるか前に完成しているので、「いつ花芽ができるか」を知らないまま切ると、枝ではなく来年の花を切ってしまうから。","keypoints":["花芽分化＝葉芽になる予定が花芽になる予定へ切り替わる開始点","花芽形成＝分化後、花の器官がそろって花芽が完成するまでの過程","前年枝咲き（ツツジ、サツキ、アジサイ、ウメ、サクラ、ユキヤナギ）は花後すぐに剪定","当年枝咲き（サルスベリ、ムクゲ、フヨウ、ノウゼンカズラ、四季咲きバラ）は落葉期の強剪定が可能","秋冬の刈り込みで咲かなくなるのは、木の衰弱ではなく花芽の切除が原因"],"table":{"caption":"花芽のつく枝と剪定適期","headers":["タイプ","花芽ができる時期","代表樹種","剪定適期"],"rows":[["前年枝に花芽をつける","前年の初夏〜夏（花後まもなく）","ツツジ、サツキ、アジサイ、ウメ、サクラ、モクレン、ユキヤナギ、レンギョウ","花後すぐ（おおむね梅雨入り前まで）"],["当年枝に花芽をつける","その年の春に伸びた枝の上で","サルスベリ、ムクゲ、フヨウ、ノウゼンカズラ、四季咲きバラ","落葉期の冬〜早春に強く切り戻してよい"]]},"mnemonic":"『春に咲く木は花後すぐ、夏に咲く木は冬に切る』。開花期が早い木ほど、花芽づくりも早く終わっている。"},{"heading":"日長反応の正体は「夜の長さ」","dialogue":[{"who":"ハナ","text":"キクは短日植物、と暗記したんですが……そもそも植物は昼の長さをどうやって測っているんですか？"},{"who":"緑川","text":"いい質問だ。実は植物が測っているのは昼じゃない。途切れない夜の長さのほうなんだ。"},{"who":"ハナ","text":"夜？　それなら『短日植物』というより『長夜植物』ですね。"},{"who":"緑川","text":"その通り。名前は日長だが中身は暗期。ここを取り違えると、電照栽培の理屈が全部ひっくり返ってしまう。"}],"body":"<h4>限界暗期という境目</h4><p>日長の変化に反応して花芽をつくる性質を<strong>光周性</strong>といいます。ただし植物が実際に感じているのは<strong>連続した暗期（夜）の長さ</strong>であり、花芽形成の可否が切り替わる境目の暗期の長さを<strong>限界暗期</strong>と呼びます。</p><p><strong>短日植物</strong>は、連続暗期が限界暗期より<strong>長く</strong>なると花芽をつくります。キク、コスモス、アサガオ、ポインセチアなど、夏至を過ぎて夜が伸びていく季節に咲く顔ぶれです。<strong>長日植物</strong>は逆に、連続暗期が限界暗期より<strong>短く</strong>なると花芽をつくります。ホウレンソウ、シュンギク、カーネーション、ペチュニアなどで、春から初夏に花茎を上げます。<strong>中性植物（中日植物）</strong>は日長と無関係で、株が一定の大きさに育てば咲く。トマト、キュウリ、バラ、トウモロコシなどです。</p><h4>光中断が証明する</h4><p>「本質は夜だ」と証明するのが<strong>光中断（ナイトブレイク）</strong>です。短日植物の長い夜の途中で、わずかな時間だけ光を当てる。すると暗期が2つに分断され、どちらも限界暗期に届かないため花芽ができません。1日の明るい時間の合計はほとんど変えていないのに反応が逆転する――ここが理解の勘所であり、試験でも狙われます。</p>","why":"光周性の実体は連続暗期の長さの測定であり、暗期が途中で分断されると測り直しになるため、短時間の光が開花を左右する。","keypoints":["光周性で植物が測っているのは連続暗期の長さ。境目が限界暗期","短日植物＝連続暗期が限界暗期より長いと花芽形成（キク、コスモス、アサガオ、ポインセチア）","長日植物＝連続暗期が限界暗期より短いと花芽形成（ホウレンソウ、シュンギク、カーネーション、ペチュニア）","中性植物＝日長に関係なく、一定の大きさになれば開花（トマト、キュウリ、バラ、トウモロコシ）","光中断（ナイトブレイク）は暗期を分断し、短日植物の花芽形成を妨げる"],"table":{"caption":"日長反応による分類と代表植物","headers":["区分","花芽ができる条件","自然界で咲く季節","代表植物"],"rows":[["短日植物","連続暗期が限界暗期より長い","夏の終わり〜秋・冬","キク、コスモス、アサガオ、ポインセチア"],["長日植物","連続暗期が限界暗期より短い","春〜初夏","ホウレンソウ、シュンギク、カーネーション、ペチュニア"],["中性植物（中日植物）","日長に左右されない","一定の大きさに育てばいつでも","トマト、キュウリ、バラ、トウモロコシ"]]},"mnemonic":"短日は『キク・コスモス・アサガオ・ポインセチア』で秋冬の花、長日は『ホウレンソウ・シュンギク・カーネーション・ペチュニア』で春の花。咲く季節から逆算すれば暗記しなくても答えられる。"},{"heading":"電照栽培とシェード栽培 ― 夜を操作する","dialogue":[{"who":"客","text":"去年買ったポインセチア、葉は元気なのに今年はちっとも赤くならないんです。肥料が足りませんか？"},{"who":"ハナ","text":"置き場所はどちらですか？"},{"who":"客","text":"リビングの明るいところです。夜もテレビを見るので、10時ごろまでは電気がついていますね。"},{"who":"緑川","text":"原因はそれです。ポインセチアは短日植物。夜の明かりが『まだ夏だ』と伝えてしまっている。"}],"body":"<h4>夜を切る＝電照栽培</h4><p>キクは短日植物です。秋に夜が長くなると花芽をつくるので、ハウス内で夜間に電灯をつけて光中断すれば花芽分化を止め、開花を<strong>遅らせる</strong>ことができます。これが<strong>電照栽培（抑制栽培）</strong>で、需要期に合わせた計画出荷を可能にしました。逆に<strong>シェード栽培（遮光栽培）</strong>は、夕方から翌朝まで黒い遮光資材で株を覆って人工的に長い夜をつくり、開花を<strong>早める</strong>方法で、促成栽培にあたります。<strong>電照は遅らせる、シェードは早める</strong>。必ずセットで覚えます。</p><h4>ポインセチアの短日処理</h4><p>ポインセチアの赤い部分は花弁ではなく<strong>苞（ほう）</strong>で、短日条件に置かれることで色づきます。家庭では9月下旬ごろから、夕方に段ボール箱や暗幕をかぶせて翌朝まで完全に暗くする作業を毎日、1〜2か月ほど続けます。途中で光が漏れれば、その日の暗期は分断されて振り出しに戻ります。</p><h4>咲かない犯人は街灯かもしれない</h4><p>「庭のキクが咲かない」「アサガオがつるばかり伸びて花が少ない」という相談の原因が、<strong>街灯・玄関灯・室内照明</strong>であることは珍しくありません。短日植物にとって夜間の照明は光中断そのものです。花を見たい短日植物は、夜に明かりの当たらない場所に置く。これが唯一かつ確実な対処です。</p>","why":"短日植物は連続暗期の長さで季節を判断するので、夜間のわずかな照明が「夏がまだ続いている」という誤った信号になるから。","keypoints":["電照栽培＝夜間の光中断で花芽分化を抑え、開花を遅らせる（キクの抑制栽培）","シェード栽培＝遮光で暗期を長くし、開花を早める（キクの促成栽培）","ポインセチアの苞の着色には短日処理が必要。9月下旬ごろから毎日暗くする","光が1日でも漏れると暗期が分断され、着色・開花が遅れる","街灯や室内照明の下では、短日植物は花芽をつくりにくい"],"table":{"caption":"電照栽培とシェード栽培の比較","headers":["方法","操作の内容","暗期への影響","開花への効果","代表例"],"rows":[["電照栽培","夜間に電灯をつけて光中断する","連続暗期が短くなる（分断される）","短日植物の開花を遅らせる（抑制）","キクの秋〜冬出荷"],["シェード栽培","夕方から翌朝まで遮光資材で覆う","連続暗期が長くなる","短日植物の開花を早める（促成）","キクの夏〜秋出荷、ポインセチアの短日処理"]]},"mnemonic":"『電気をつけると咲くのが遅れる、暗くすると早く咲く』。短日植物では、人の直感と逆になる点に注意。"},{"heading":"温度で咲かせる ― 春化・抽苔・球根の温度処理","dialogue":[{"who":"客","text":"3月にホウレンソウを蒔いたら、葉が育つ前に茎が伸びて花が咲きそうになってしまって。"},{"who":"ハナ","text":"トウ立ちですね。……でも、なぜ春まきだと起きやすいんでしょう？"},{"who":"緑川","text":"幼い株が寒さに当たると『冬を越した』と判断してしまうんだ。そのあと日が長くなれば、あとは咲きにいくだけになる。"}],"body":"<h4>春化（バーナリゼーション）</h4><p>一定期間の低温に遭うことで花芽形成が誘導される現象を<strong>春化</strong>といいます。冬を越したことを確認してから花を咲かせるための安全装置で、低温に感応できる時期によって2つに分かれます。<strong>種子春化型</strong>は、吸水した種子の段階からすでに低温に感応するタイプで、ダイコン、カブ、ハクサイなど。<strong>緑植物春化型</strong>は、株がある程度の大きさに育ってからでないと低温に感応しないタイプで、キャベツ、タマネギ、ニンジンなどが該当します。</p><h4>抽苔（トウ立ち）</h4><p>春化した株がその後の長日や高温を受け、花茎を伸ばして咲きにいくのが<strong>抽苔（トウ立ち）</strong>です。葉物や根菜では硬くなり品質が落ちるため厄介者で、春まきのホウレンソウやダイコンで起きやすい。対策は<strong>晩抽性（トウ立ちの遅い）品種を選ぶ・適期に播く・生育初期に低温に遭わせない</strong>の3点です。とくに種子春化型は幼苗期の寒さが直接効くので、早まきとトンネル無しの組み合わせが失敗のもとになります。</p><h4>球根も温度で動く</h4><p>チューリップは掘り上げ後の高温期に球の中で花芽を分化させ、その後に一定期間の低温に遭って初めて茎が伸びて開花します。球根を冷蔵してから植える促成栽培もこの原理です。ユリも低温処理で萌芽・開花が揃います。ヒヤシンスの水栽培で「根が出るまで暗く涼しい場所に置く」のも、この低温要求を満たすための手順です。</p>","why":"低温に一定期間さらされることが「冬が終わった」という信号になり、花芽形成のスイッチが入る。だから寒さに当てる時期を誤ると、咲いてほしくない株が咲いてしまう。","keypoints":["春化＝一定期間の低温によって花芽形成が誘導される現象","種子春化型＝吸水した種子から低温に感応（ダイコン、カブ、ハクサイ）","緑植物春化型＝一定の大きさに育ってから低温に感応（キャベツ、タマネギ、ニンジン）","抽苔（トウ立ち）＝春化後に花茎が伸びる現象。春まき葉物・根菜で問題になる","トウ立ち対策は晩抽性品種・適期播種・幼苗期を低温に当てない","チューリップは高温期に花芽分化、その後の低温で茎が伸びて開花する"],"table":{"caption":"春化型の違いと栽培上の注意","headers":["区分","低温に感応する時期","代表作物","栽培上の注意"],"rows":[["種子春化型","吸水した種子の段階から","ダイコン、カブ、ハクサイ","早まきや低温期の播種で幼苗が寒さに当たると一気にトウ立ちする"],["緑植物春化型","株が一定の大きさに育ってから","キャベツ、タマネギ、ニンジン","苗が大きくなりすぎた状態で越冬させるとトウ立ちしやすい"]]},"mnemonic":"『種から効くのは種子春化（ダイコン・カブ・ハクサイ）、育ってから効くのが緑植物春化（キャベツ・タマネギ・ニンジン）』。"},{"heading":"植物ホルモン5種 ― 微量で全体を動かす","dialogue":[{"who":"ハナ","text":"お客様に『摘心すると枝数が増える』と説明したんですが、理由を聞かれて答えられませんでした。"},{"who":"緑川","text":"先端が脇芽を押さえつけていたんだよ。押さえていた指を離せば、下の芽はいっせいに動き出す。その指がオーキシンだ。"},{"who":"ハナ","text":"切ったから伸びるんじゃなくて、抑えていたものが消えたから伸びるんですね。"}],"body":"<h4>5つの主役</h4><p>植物ホルモンは、植物自身がごく微量つくり、離れた場所の細胞に指令を送る物質です。試験で問われるのは主に5種類です。</p><p><strong>オーキシン</strong>は細胞を伸長させ、<strong>頂芽優勢</strong>をつくります。頂芽でつくられたオーキシンが下へ流れて側芽の伸長を抑えるため、先端が元気なうちは脇芽が動きません。だから<strong>摘心（ピンチ）するとオーキシンの供給源が消え、脇芽がいっせいに伸びて枝数が増える</strong>のです。発根を促す作用もあり、挿し木の発根促進剤に利用されます。</p><p><strong>ジベレリン</strong>は節間を伸ばして草丈を高くし、休眠打破と種子の発芽を促します。ブドウの花房を処理して種なしにする（無核化）用途がよく知られます。<strong>サイトカイニン</strong>は細胞分裂を促し、側芽の伸長を助け、葉の老化を抑えます。側芽に対してはオーキシンと拮抗的に働きます。</p><p><strong>アブシシン酸</strong>はブレーキ役で、休眠の導入と維持、乾燥時の<strong>気孔閉鎖</strong>、ストレス応答を担います。<strong>エチレン</strong>は唯一の気体のホルモンで、果実の成熟、離層形成による落葉・落花、花の老化を進めます。リンゴは多量のエチレンを出すため、未熟な果実と一緒に袋に入れると追熟が進みます。裏を返せば、切り花や球根をリンゴのそばに置くと日持ちが悪くなるということです。</p>","why":"植物ホルモンは「伸ばす・分けさせる・止める・熟させる」という役割分担で働き、人はその一部を足したり断ったりして形と時期を操作している。","keypoints":["オーキシン＝細胞伸長、頂芽優勢、発根促進。摘心で脇芽が伸びるのはオーキシン減少のため","ジベレリン＝節間伸長、休眠打破、発芽促進、ブドウの無核化","サイトカイニン＝細胞分裂促進、側芽の伸長、老化抑制。オーキシンと拮抗的","アブシシン酸＝休眠の導入・維持、気孔閉鎖、ストレス応答","エチレン＝気体。果実の成熟、落葉・落花（離層形成）、切り花の老化促進","リンゴのエチレンは追熟に利用できる一方、切り花や球根の日持ちを縮める"],"table":{"caption":"植物ホルモン5種のはたらき","headers":["ホルモン","主なはたらき","園芸での現れ方・利用"],"rows":[["オーキシン","細胞伸長、頂芽優勢、発根促進、屈性に関与","摘心で枝数を増やす、挿し木の発根促進剤"],["ジベレリン","節間伸長、休眠打破、発芽促進","種なしブドウ（無核化）、球根や種子の休眠打破"],["サイトカイニン","細胞分裂促進、側芽の伸長、老化抑制","組織培養、切り花や葉物の緑色保持"],["アブシシン酸","休眠の導入・維持、気孔閉鎖、ストレス応答","種子の発芽抑制、乾燥時の水分保持"],["エチレン","果実の成熟、落葉・落花、花の老化（気体）","リンゴによる追熟、切り花の日持ち低下"]]},"mnemonic":"『オ（伸ばす）・ジ（もっと伸ばす）・サ（増やす）・ア（止める）・エ（終わらせる）』の順に、伸長から老化までの流れとして覚える。"},{"heading":"屈性と傾性 ― 植物はどうやって向きを知るか","dialogue":[{"who":"客","text":"球根を植えるとき、上下を間違えたかもしれないんです。掘り返したほうがいいでしょうか。"},{"who":"ハナ","text":"……逆さのままだと、芽は地中に潜っていってしまうんでしょうか？"},{"who":"緑川","text":"大丈夫、植物は重力を感じて向きを直せる。ただし遠回りする分だけ体力を使うから、わかっているなら直したほうがいい。"}],"body":"<h4>屈性は方向のある反応</h4><p>刺激の<strong>方向に対して</strong>決まった向きに曲がる性質を<strong>屈性</strong>といいます。刺激の方へ曲がれば正、逆へ曲がれば負です。<strong>光屈性</strong>では、茎は光の方へ曲がります（正の光屈性）。しくみはオーキシンで、光が当たらない側にオーキシンが多く移動し、その側の細胞がよく伸びるため、結果として株全体が光の方へ傾きます。窓辺の鉢を時々回すのは、この偏りを打ち消すためです。</p><p><strong>重力屈性</strong>は、根が下へ（正）、茎が上へ（負）伸びる反応です。球根を上下逆さに植えても芽が地上に出てくるのは、重力の向きを感じ取って自分で進路を修正するからです。<strong>接触屈性</strong>は、つる植物や巻きひげが支柱に触れると、触れた側の伸長が抑えられ反対側が伸びることで巻きついていく反応です。</p><h4>傾性は方向に関係のない反応</h4><p>刺激の方向とは無関係に、決まった動きが起こるのが<strong>傾性</strong>です。マメ科の葉やカタバミが夜に葉を閉じる<strong>就眠運動</strong>、オジギソウが触れられて葉を閉じる運動、チューリップの花が温度によって開閉する運動などが当てはまります。<strong>刺激の方向に沿って曲がるか、方向と無関係に動くか</strong>――屈性と傾性はこの一点で切り分けます。</p>","why":"屈性はオーキシンなどの偏った分布によって左右の伸び方に差が生まれる結果であり、傾性は方向と無関係にあらかじめ決まった動きが起こる点で本質的に異なる。","keypoints":["屈性＝刺激の方向に対して一定方向に曲がる。刺激の方へなら正、逆なら負","光屈性は、光の当たらない側にオーキシンが多く移動して起こる","重力屈性は根が正（下向き）、茎が負（上向き）。球根を逆さに植えても芽は上へ向かう","接触屈性はつる植物・巻きひげが支柱に巻きつく反応","傾性＝刺激の方向と無関係に起こる運動。就眠運動、オジギソウ、チューリップの開閉"],"table":{"caption":"屈性と傾性の整理","headers":["区分","定義","例"],"rows":[["屈性","刺激の方向に対し一定の向きに曲がる","光屈性（茎は光へ）、重力屈性（根は下、茎は上）、接触屈性（つる・巻きひげ）"],["傾性","刺激の方向とは無関係に決まった運動が起こる","就眠運動（マメ科の葉、カタバミ）、オジギソウの閉葉、チューリップの花の開閉"]]},"mnemonic":"『曲がる向きが刺激で決まる＝屈性、決まらない＝傾性』。就眠運動は毎晩同じ動きなので傾性。"}],"quiz":[{"type":"ox","q":"発芽に必要な3条件は、水・温度・酸素（空気）である。","a":true,"why":"この3つが基本条件。光は種類によって要求が分かれる第4の条件であり、すべての種子に必須ではない。"},{"type":"ox","q":"好光性種子は光を嫌うので、厚く覆土して暗くする。","a":false,"why":"好光性種子は光が当たると発芽が促される種子。覆土はごく薄くするか、覆土しない。厚く覆土するのは嫌光性種子。"},{"type":"ox","q":"覆土の一般的な目安は、種子の直径の2〜3倍である。","a":true,"why":"好光性種子はこの原則の例外で、ごく薄くするか覆土しない。"},{"type":"ox","q":"レタスやシュンギクの種子は嫌光性種子なので、しっかり覆土する。","a":false,"why":"レタス、シュンギク、セロリ、ニンジンなどは代表的な好光性種子。覆土を厚くすると発芽しない。"},{"type":"ox","q":"低温湿潤処理（層積処理）は、種子を乾燥させたまま冷蔵する方法である。","a":false,"why":"湿らせた砂やバーミキュライトに混ぜて低温に置くのが低温湿潤処理。乾いたままでは休眠打破の効果がない。"},{"type":"ox","q":"硬実種子は種皮に傷をつけると吸水しやすくなり、発芽が揃いやすい。","a":true,"why":"アサガオ、スイートピー、カンナなどは種皮が硬く水を通さないため、傷をつけたり温湯に浸けたりして吸水させる。"},{"type":"ox","q":"後熟とは、採種直後には発芽しない種子が一定期間の貯蔵を経て発芽能力を持つようになる現象である。","a":true,"why":"胚の未熟や発芽抑制物質が時間の経過で解消されることによる。"},{"type":"ox","q":"花芽形成とは、成長点が花芽になる方向へ切り替わり始める瞬間だけを指す言葉である。","a":false,"why":"それは花芽分化。花芽形成は分化後に花の器官がそろって花芽が完成するまでの過程全体を指す。"},{"type":"ox","q":"ツツジやアジサイは花後まもなく翌年の花芽をつくるので、剪定は花が終わったらすぐ行う。","a":true,"why":"秋や冬に刈り込むと、すでにできあがった花芽を切り落としてしまい翌春咲かなくなる。"},{"type":"ox","q":"光周性において植物が実際に感じ取っているのは、連続した暗期の長さである。","a":true,"why":"名称は日長だが本質は暗期。だから夜間の短時間の光（光中断）で反応が変わる。"},{"type":"ox","q":"ホウレンソウやシュンギクは短日植物である。","a":false,"why":"どちらも長日植物。短日植物の代表はキク、コスモス、アサガオ、ポインセチアなど。"},{"type":"ox","q":"キクの電照栽培は、夜間に光を当てて花芽分化を抑え、開花を遅らせる抑制栽培である。","a":true,"why":"逆に遮光して暗期を長くするシェード栽培は、開花を早める促成栽培になる。"},{"type":"ox","q":"ポインセチアを夜も照明のつく室内に置くと、苞が色づきにくい。","a":true,"why":"ポインセチアは短日植物で、夜間の照明が光中断となって短日条件が成立しないため。"},{"type":"ox","q":"ダイコンやカブは緑植物春化型である。","a":false,"why":"ダイコン、カブ、ハクサイは種子春化型。緑植物春化型はキャベツ、タマネギ、ニンジンなど。"},{"type":"ox","q":"摘心すると脇芽が伸びるのは、頂芽から送られてくるオーキシンが減り、頂芽優勢が解けるためである。","a":true,"why":"オーキシンは側芽の伸長を抑えている。その供給源を取り除くので脇芽が動き出す。"},{"type":"ox","q":"マメ科の葉が夜に閉じる就眠運動は、刺激の方向に対して曲がる屈性の一種である。","a":false,"why":"就眠運動は刺激の方向と無関係に起こるので傾性。屈性は光屈性・重力屈性・接触屈性など。"},{"type":"mc","q":"発芽に必ず必要な3条件に含まれないものはどれか。","choices":["水","光","酸素（空気）"],"a":1,"why":"3条件は水・温度・酸素。光はすべての種子に必要なわけではなく、好光性種子だけが要求する第4の条件。"},{"type":"mc","q":"好光性種子（光発芽種子）の代表はどれか。","choices":["ダイコン","トマト","レタス"],"a":2,"why":"レタスは代表的な好光性種子。ダイコンとトマトは嫌光性種子で、しっかり覆土する。"},{"type":"mc","q":"嫌光性種子（暗発芽種子）の代表はどれか。","choices":["シクラメン","ペチュニア","シュンギク"],"a":0,"why":"シクラメンは嫌光性。ペチュニアとシュンギクは好光性で、覆土をごく薄くする。"},{"type":"mc","q":"硬実種子の休眠打破として適切な処理はどれか。","choices":["濃い液肥に浸す","種皮にやすりで傷をつける","高温で完全に乾燥させる"],"a":1,"why":"硬実種子は種皮が水を通さないことが原因。物理的に傷をつけるか温湯に浸けて吸水させる。"},{"type":"mc","q":"採種直後は発芽できない種子が、一定期間の貯蔵を経て発芽できるようになる現象を何というか。","choices":["春化","後熟","抽苔"],"a":1,"why":"後熟。春化は低温による花芽形成の誘導、抽苔は花茎が伸びる現象で、いずれも発芽の話ではない。"},{"type":"mc","q":"前年枝に花芽をつけるため、剪定を花後すぐに行うべき樹種はどれか。","choices":["サルスベリ","ムクゲ","ユキヤナギ"],"a":2,"why":"ユキヤナギは前年の夏に翌年の花芽をつくる。サルスベリとムクゲは当年枝咲きで、冬の強剪定が可能。"},{"type":"mc","q":"短日植物どうしの組み合わせはどれか。","choices":["キクとコスモス","ホウレンソウとシュンギク","トマトとキュウリ"],"a":0,"why":"ホウレンソウとシュンギクは長日植物、トマトとキュウリは中性植物。"},{"type":"mc","q":"長日植物はどれか。","choices":["アサガオ","カーネーション","バラ"],"a":1,"why":"カーネーションは長日植物。アサガオは短日植物、バラは中性植物。"},{"type":"mc","q":"中性植物（中日植物）はどれか。","choices":["ポインセチア","シュンギク","トウモロコシ"],"a":2,"why":"トウモロコシは中性植物。ポインセチアは短日植物、シュンギクは長日植物。"},{"type":"mc","q":"短日植物であるキクの開花を遅らせたいとき、正しい方法はどれか。","choices":["夜間に電灯を点けて暗期を中断する","夕方から遮光資材で覆って暗期を長くする","球根を低温で貯蔵する"],"a":0,"why":"電照による光中断で花芽分化が止まり開花が遅れる。遮光（シェード）は逆に開花を早める。"},{"type":"mc","q":"緑植物春化型の作物はどれか。","choices":["ダイコン","ハクサイ","キャベツ"],"a":2,"why":"キャベツは株がある程度育ってから低温に感応する緑植物春化型。ダイコンとハクサイは種子春化型。"},{"type":"mc","q":"チューリップが茎を伸ばして開花するために必要な条件はどれか。","choices":["花芽分化後に一定期間の低温に遭うこと","植え付け後ずっと高温を保つこと","植え付け後に長日処理を行うこと"],"a":0,"why":"高温期に球内で花芽が分化し、その後の低温を経て茎が伸びて咲く。冷蔵処理による促成もこの原理。"},{"type":"mc","q":"ブドウを種なしにする処理に使われる植物ホルモンはどれか。","choices":["オーキシン","ジベレリン","エチレン"],"a":1,"why":"ジベレリンの無核化処理。オーキシンは発根促進や頂芽優勢、エチレンは成熟や落葉に関与する。"},{"type":"mc","q":"乾燥時に気孔を閉じさせ、休眠の維持にはたらくホルモンはどれか。","choices":["サイトカイニン","エチレン","アブシシン酸"],"a":2,"why":"アブシシン酸はブレーキ役のホルモン。サイトカイニンは細胞分裂と老化抑制、エチレンは成熟と老化促進。"},{"type":"mc","q":"未熟な果実をリンゴと一緒に袋に入れると追熟が進むのは、リンゴが多く放出する何によるか。","choices":["ジベレリン","オーキシン","エチレン"],"a":2,"why":"エチレンは気体の植物ホルモンで果実の成熟を促す。同じ理由で、切り花や球根をリンゴのそばに置くと日持ちが悪くなる。"},{"type":"mc","q":"つる植物の巻きひげが支柱に巻きつく反応を何というか。","choices":["光屈性","接触屈性","就眠運動"],"a":1,"why":"接触した側の伸長が抑えられ反対側が伸びることで巻きつく屈性。就眠運動は方向と無関係な傾性。"}]},{"id":4,"title":"植物の分類と名前","subtitle":"科・属・種と学名を手がかりに、初対面の植物の育て方を推理できる","minutes":45,"goals":["学名の書き方（二名法・品種名・交雑種・変種）を読み解き、和名や流通名とのズレに気づける","一年草・多年草・球根などの園芸上の分類と、球根5タイプ・秋植え／春植えの違いを説明できる","主要な科の特徴と代表植物を結びつけ、連作障害の輪作年限や除草剤の選択性の理由を語れる"],"sections":[{"heading":"分類の階層 ― 植物の住所録","dialogue":[{"who":"ハナ","text":"店長、この札に書いてある横文字、いつも読み飛ばしてます。界とか門とか、試験に出るんですか？"},{"who":"緑川","text":"階層の名前は聞かれることがある。でも現場で本当に効くのは下の3段だけだよ。科・属・種。ここが読めると、初めて見る植物でも育て方の見当がつく。"},{"who":"ハナ","text":"見当がつく？ 名前を見ただけで？"},{"who":"緑川","text":"住所と同じだ。同じ町内なら気候も似る。同じ科なら、病気も土の好みも似てくるんだ。"}],"body":"<p>生物の分類は、大きなくくりから順に <strong>界・門・綱・目・科・属・種</strong> と入れ子になっている。住所にたとえると、界が国、門が都道府県、科が市町村、属が番地、種が部屋番号だ。ヒマワリなら、植物界 → 被子植物 → 双子葉類 → キク目 → <strong>キク科</strong> → <strong>ヒマワリ属</strong> → <strong>ヒマワリ</strong>、という並びになる。</p><p>園芸で毎日使うのは、下の3段 ― <strong>科・属・種</strong> ― にほぼ限られる。理由ははっきりしている。</p><ul><li><strong>科</strong>が同じなら、かかる病気・つく虫・連作障害の出方が似る。輪作の計画は科の単位で立てる。</li><li><strong>属</strong>が同じなら、交配できる可能性があり、接ぎ木の相性もよい。栽培管理はほぼ共通と考えてよい。</li><li><strong>種</strong>が同じなら、あとは品種ごとの個性の差だけだ。</li></ul><p>「種」とは、自然の状態で交配して子孫を残せるまとまりを指す。その種の中から、花色や草姿の優れた個体を人が選び出して固定したものが<strong>栽培品種（園芸品種）</strong>で、これは自然の分類ではなく人がつくった区分にあたる。</p><p>つまり階層の上のほうは学者の仕事、下の3段は園芸家の道具だ。名札の科名が読めれば、「この土でいいのか」「去年ここに何を植えたか」まで一気に判断できる。</p>","why":"科・属・種は「近縁ほど性質が似る」という進化の事実を圧縮した情報なので、名前から栽培条件と病害虫を推定できる。","keypoints":["階層は上から界・門・綱・目・科・属・種の7段","園芸で実用になるのは下の3段（科・属・種）","科が同じ＝病害虫と連作障害が共通しやすい","属が同じ＝交配・接ぎ木の相性がよく、管理がほぼ同じ","栽培品種（園芸品種）は人が選抜・固定した人為的な区分"],"table":{"caption":"分類階層の実例（ヒマワリ）と園芸での使いどころ","headers":["階層","ヒマワリの場合","園芸での使いどころ"],"rows":[["界","植物界","ほぼ使わない"],["門","被子植物","裸子植物（針葉樹）との区別に効く"],["綱","双子葉類","除草剤の選択性・根の張り方の推定"],["目","キク目","ほぼ使わない"],["科","キク科","病害虫・連作・輪作の単位"],["属","ヒマワリ属","交配・接ぎ木・栽培管理の単位"],["種","ヒマワリ","個々の植物。以下は品種の差"]]},"mnemonic":"階層は「かモンだモッカゾクシュ（界・門・綱・目・科・属・種）」。園芸で握るのは最後の3つ。"},{"heading":"学名のしくみ ― 世界共通の背番号","dialogue":[{"who":"客","text":"ネットで海外の種を買ったら、ラベルが全部アルファベットで。これ、日本の何にあたるんでしょう？"},{"who":"緑川","text":"学名ですね。世界中どこでも1種類に1つだけ、と決まっている背番号です。読み方の型さえ知っていれば、国が違っても取り違えません。"},{"who":"ハナ","text":"型、ですか。"},{"who":"緑川","text":"そう。前が属名、後ろが種小名。この2語だけ。あとの記号は全部「おまけの情報」だと思えばいい。"}],"body":"<p>学名は<strong>二名法</strong>で書く。<strong>属名＋種小名</strong>の2語をラテン語で並べるだけだ。属名は頭文字を大文字、種小名はすべて小文字。印刷物では<strong>イタリック体（斜体）</strong>、手書きなら下線を引く。ヒマワリなら <code>Helianthus annuus</code>。</p><p>正式には、そのあとに命名者名を立体（斜体にしない）で添える。ハマナスなら <code>Rosa rugosa Thunb.</code> のように書く。園芸の現場で命名者まで書くことはまれだが、「学名の一部として立体で付く」ことは覚えておきたい。</p><p>付加情報の記号は次のとおり。</p><ul><li><strong>シングルクォート</strong>… 栽培品種名を囲む。斜体にせず頭文字を大文字にして囲む。例 <code>Hosta 'Halcyon'</code>。</li><li><strong>×</strong>… 交雑種。属名と種小名の間に置けば<strong>種間雑種</strong>（例 ソメイヨシノ <code>Prunus × yedoensis</code>）、属名の前に置けば<strong>属間雑種</strong>（例 ファツヘデラ <code>×Fatshedera lizei</code>）。</li><li><strong>subsp.（ssp.）</strong>… 亜種。<strong>var.</strong>… 変種。<strong>f.</strong>… 品種（自然界で生じた小変異）。細かさは 亜種 ＞ 変種 ＞ 品種 の順で、これらの略号だけは立体で書く。</li></ul><p>ここが試験の狙いどころだ。<strong>「×」は交雑であって突然変異ではない</strong>。<strong>シングルクォートで囲まれた語は人がつくった栽培品種</strong>で、ラテン語である必要もない。記号の意味が分かれば、ラベル1枚から「これは交配種で、しかも園芸品種だ」と読み取れる。</p>","why":"学名は1種に1つと国際的に決められているため、和名や流通名が地域ごとに揺れても、学名だけは取り違えが起きない。","keypoints":["二名法＝属名（頭大文字）＋種小名（小文字）、ラテン語・イタリック体","命名者名は学名の後ろに立体で付ける","栽培品種名はシングルクォートで囲み、斜体にしない","×は交雑種。属名と種小名の間＝種間雑種、属名の前＝属間雑種","subsp.（亜種）＞var.（変種）＞f.（品種）の順に細かい区分"],"table":{"caption":"学名の記号早見表","headers":["書き方","意味","例・注意点"],"rows":[["Genus species","属名＋種小名（二名法）","イタリック体。属名だけ頭文字が大文字"],["Genus species Auth.","命名者名つき","命名者名は立体で書く"],["Genus species 'Name'","栽培品種（園芸品種）","シングルクォートで囲み立体。ラテン語でなくてよい"],["Genus × species","種間雑種","同じ属の別種どうしの交配"],["×Genus species","属間雑種","違う属どうしの交配。×は属名の前"],["subsp. / ssp.","亜種","分布域などで分かれた大きめの区分"],["var.","変種","亜種より小さい形態上の区分"],["f.","品種（フォルマ）","自然に生じた小さな変異。栽培品種とは別物"]]},"mnemonic":"「クォートは人の手、バツは交配」。囲みは園芸品種、×は掛け合わせ。"},{"heading":"和名・流通名・学名のズレ","dialogue":[{"who":"客","text":"去年ここで買ったゼラニウム、庭に地植えしたら冬に枯れちゃって。本には『丈夫な宿根草』ってあったのに。"},{"who":"ハナ","text":"えっ、ゼラニウムって寒さに強いんじゃ……。"},{"who":"緑川","text":"そこが名前の落とし穴です。うちで売っている『ゼラニウム』は、正しくはペラルゴニウム属。南アフリカ生まれで霜に弱い。本に載っていた宿根草のほうは、学名どおりのゼラニウム属＝フウロソウの仲間です。"},{"who":"ハナ","text":"同じ名前で中身が別……。それ、事故になりますね。"}],"body":"<p>日本の園芸店では、1つの植物に <strong>和名・流通名（園芸名）・学名</strong> の3つの名前が並ぶ。厄介なのは、流通名が学名の属名からずれて定着してしまった例だ。</p><p>代表格が<strong>ゼラニウム</strong>。園芸店で売られるのは <code>Pelargonium</code>（ペラルゴニウム属）で、南アフリカ原産の非耐寒性。一方、学名どおりの <code>Geranium</code>（フウロソウ属）は耐寒性の宿根草だ。「ゼラニウム」の一語で耐寒性を判断すると、まるごと外す。</p><p><strong>マーガレット</strong>も同様で、和名はモクシュンギク、カナリア諸島原産の半耐寒性で、茎が木質化して低木状になる。日本の野山で見る白い花<strong>フランスギク</strong>はヨーロッパ原産の耐寒性多年草で、同じキク科でも別属の別種だ。</p><p>観葉の<strong>ゴムの木</strong>はインドゴムノキで<strong>クワ科イチジク属</strong>。ベンジャミンやガジュマル、イチジクと同じ仲間である。天然ゴムをとるパラゴムノキはトウダイグサ科で、まったく別のグループだ。<strong>ハナミズキ</strong>は和名アメリカヤマボウシ、ミズキ科の落葉高木で、日本のヤマボウシとは同じ属の別種にあたる。</p><p>対策は一つ。<strong>迷ったら学名か科名まで戻る</strong>こと。耐寒性・土の好み・病害虫は、流通名ではなく素性についてくる。</p>","why":"流通名は売り場の都合で定着した通称にすぎず、耐寒性や病害虫といった性質は学名（＝素性）のほうにひもづいているため。","keypoints":["園芸店の「ゼラニウム」＝ペラルゴニウム属（非耐寒性）、学名Geraniumはフウロソウ属（耐寒性宿根草）","マーガレット＝モクシュンギク（半耐寒性・木質化）。フランスギクは別属の耐寒性多年草","観葉のゴムの木＝インドゴムノキ、クワ科イチジク属。パラゴムノキ（トウダイグサ科）とは無関係","ハナミズキ＝アメリカヤマボウシ。ヤマボウシとは同属別種","名前に「ラン」とついてもラン科とは限らない（クンシランはヒガンバナ科）","性質を知りたければ流通名ではなく学名・科名まで戻る"],"table":{"caption":"現場で混乱しやすい名前","headers":["よく使う名前","正体","取り違えの中身"],"rows":[["ゼラニウム","ペラルゴニウム属（フウロソウ科）","本来のゼラニウム属＝フウロソウは耐寒性宿根草。耐寒性が逆"],["マーガレット","モクシュンギク（キク科）","フランスギクと混同されるが別属。こちらは半耐寒性で木質化する"],["ゴムの木","インドゴムノキ（クワ科イチジク属）","天然ゴムをとるパラゴムノキ（トウダイグサ科）とは別物"],["ハナミズキ","アメリカヤマボウシ（ミズキ科）","ヤマボウシとは同属別種。花に見えるのは総苞"],["クンシラン","ヒガンバナ科クンシラン属","名にランとつくがラン科ではない。管理法が別"],["サルビアとセージ","どちらもシソ科アキギリ属（Salvia）","同じ属の呼び分けにすぎない"]]}},{"heading":"園芸上の分類 ― 一年草から高木まで","dialogue":[{"who":"客","text":"花壇を作りたいんですが、一年草と宿根草、どっちを買えばいいのか分からなくて。"},{"who":"緑川","text":"植えっぱなしで毎年出てきてほしいなら宿根草、季節ごとに景色を替えたいなら一年草です。要は『何年生きる設計か』で選ぶんですよ。"},{"who":"ハナ","text":"球根は、その分け方だとどこに入るんですか？"},{"who":"緑川","text":"いい質問。球根植物は多年草の一種だ。地下に弁当箱を持っている多年草、と考えるといい。"}],"body":"<p>園芸では、分類学とは別に「どう生き、どう扱うか」で植物を分ける。まず茎が木質化するかどうかで<strong>草本（草花）</strong>と<strong>木本（樹木）</strong>に分かれる。木本は形成層で年々太り、地上部を残して越冬する。</p><p>草本は寿命で3つに分かれる。<strong>一年草</strong>は発芽から結実・枯死までが1年以内。<strong>二年草</strong>は1年目に株をつくり、冬の低温を経て2年目に開花して枯れる（ジギタリス、パセリなど）。<strong>多年草（宿根草）</strong>は何年も生き、毎年花を咲かせる。冬に地上部が枯れて地下部だけで越すタイプと、常緑のタイプがある。<strong>球根植物</strong>は多年草の一種で、地下に貯蔵器官を持つものを指す。</p><p>木本は樹高と樹形で<strong>低木</strong>（株立ちで概ね3m以下）と<strong>高木</strong>（主幹がはっきりし3mを超える）に分け、自力で立たず巻きついたり付着したりするものを<strong>つる性</strong>と呼ぶ。冬の葉で<strong>常緑樹</strong>と<strong>落葉樹</strong>、葉の形と系統で<strong>針葉樹</strong>（裸子植物。マツ・スギ・ヒノキ）と<strong>広葉樹</strong>（被子植物）に分ける。</p><p>ここで引っかけが1つ。<strong>針葉樹＝常緑ではない</strong>。カラマツ、メタセコイア、ラクウショウは落葉する針葉樹だ。逆にクスノキやカシ、ツバキは常緑の広葉樹である。</p><p>なお<strong>観葉植物・多肉植物・ハーブ・山野草</strong>といった呼び名は、学問上の分類ではなく<strong>使い方による売り場の区分</strong>だ。観葉植物は熱帯・亜熱帯原産で耐陰性があり越冬に最低10度程度を要するもの、ハーブは香りや薬効を利用するもの、という具合に、栽培条件の共通点でくくられている。</p>","why":"園芸上の分類は「何年生きるか・冬をどう越すか」で組んであるので、そのまま植え替え・防寒・切り戻しの作業計画に翻訳できる。","keypoints":["草本と木本の境目は茎が木質化して肥大するかどうか","一年草＝1年以内に枯れる、二年草＝冬を挟んで2年目に開花、多年草（宿根草）＝毎年開花","球根植物は多年草の一種（地下に貯蔵器官を持つ）","低木は概ね3m以下の株立ち、高木は主幹のある3m超","針葉樹はすべて常緑ではない（カラマツ・メタセコイア・ラクウショウは落葉）","観葉植物・多肉植物・ハーブ・山野草は利用上の便宜的なグループ"],"table":{"caption":"園芸上の生活型","headers":["区分","定義","代表例"],"rows":[["一年草","発芽から結実・枯死まで1年以内","アサガオ、ヒマワリ、マリーゴールド、パンジー"],["二年草","1年目に株をつくり、越冬して2年目に開花・枯死","ジギタリス、パセリ、ビジョナデシコ"],["多年草（宿根草）","数年以上生き毎年開花。冬に地上部が枯れる型と常緑型がある","シャクヤク、ギボウシ、クリスマスローズ"],["球根植物","地下（一部地上）に貯蔵器官を持つ多年草","チューリップ、ユリ、ダリア、グラジオラス"],["低木","主幹が明確でない株立ち、概ね3m以下","アジサイ、サツキ、ヒラドツツジ"],["高木","主幹が明確で3mを超える","サクラ、ケヤキ、クスノキ"],["つる性","自力で立たず、巻きつく・付着して伸びる","クレマチス、フジ、アサガオ、ヘデラ"]]}},{"heading":"春まきと秋まき ― 原産地が答え","dialogue":[{"who":"客","text":"パンジーの種、春にまいたら発芽もしないし、出てもすぐ溶けてしまって。"},{"who":"緑川","text":"パンジーは秋まきの仲間です。原産のあたりは冬に雨が降って暖かく、夏はカラカラに乾く。だから『夏を種でやり過ごし、涼しくなったら芽を出す』設計になっているんですよ。"},{"who":"ハナ","text":"まき時って、原産地の気候の写しなんですね。"},{"who":"緑川","text":"そのとおり。まき時を暗記しなくても、故郷を思い出せば出てくる。"}],"body":"<p>一年草のまき時は、<strong>原産地の気候をそのまま引き継いだ設計図</strong>だ。</p><p><strong>春まき一年草</strong>は熱帯・亜熱帯（中南米やアフリカなど）が原産。生育適温が高く、霜に当たれば一発で枯れる。発芽適温はおよそ20〜25度なので、桜が咲いて遅霜の心配がなくなってからまく。春にまいて夏から秋に咲き、冬の寒さで一生を終える。アサガオ、ヒマワリ、マリーゴールド、ジニア、ホウセンカ、ケイトウ、サルビアなどだ。</p><p><strong>秋まき一年草</strong>は地中海沿岸やヨーロッパ、西アジアが原産。あちらは<strong>冬に雨が降って温暖、夏は高温乾燥</strong>という気候だから、秋に発芽して株（ロゼット）で冬を越し、春に開花して初夏には種を残して枯れる。発芽適温はおよそ15〜20度で、暑さが残るうちにまくと発芽しない。一定期間の低温に当たらないと花芽ができないタイプも多い。パンジー、ビオラ、キンセンカ、ヤグルマギク、ストック、スイートピー、ネモフィラ、ハボタンなどが該当する。</p><p>もう一つ、試験でよく問われるのが<strong>「本来は多年草なのに日本では一年草扱い」</strong>という現象。原因は2つある。</p><ul><li><strong>非耐寒性</strong>で冬を越せない … ニチニチソウ、ペチュニア、インパチェンス、コリウス、ベゴニア・センパフローレンス。</li><li><strong>非耐暑性</strong>で日本の高温多湿の夏を越せない … パンジー・ビオラ、プリムラ類、ロベリア、キンギョソウ。</li></ul><p>つまり一年草か多年草かは、植物の性質だけでなく<strong>植物と土地の気候の組み合わせ</strong>で決まる。同じ株が北海道では宿根し、関東では夏に消えることもある。</p>","why":"一年草の生活サイクルは原産地の「過ごしにくい季節」を種でやり過ごす設計なので、原産地の気候が分かればまき時と耐寒・耐暑性が導ける。","keypoints":["春まき一年草＝熱帯・亜熱帯原産。発芽適温20〜25度、霜に弱く、夏から秋に開花","秋まき一年草＝地中海沿岸などの原産。発芽適温15〜20度、寒さに比較的強く、春に開花","秋まき型には低温に一定期間当たらないと花芽ができないものが多い","非耐寒性で冬に枯れる例＝ニチニチソウ、ペチュニア、インパチェンス","非耐暑性で夏に枯れる例＝パンジー・ビオラ、プリムラ、ロベリア","一年草扱いかどうかは植物の性質と栽培地の気候の組み合わせで決まる"],"table":{"caption":"春まき一年草と秋まき一年草","headers":["項目","春まき一年草","秋まき一年草"],"rows":[["原産地の気候","熱帯・亜熱帯（夏に雨、冬なし）","地中海性など（冬に雨で温暖、夏は乾燥）"],["まき時","遅霜の心配がなくなる春","残暑がやわらぐ初秋"],["発芽適温の目安","20〜25度","15〜20度"],["開花期","夏〜秋","春〜初夏"],["耐寒性","弱い（霜で枯れる）","比較的強い（幼苗で越冬）"],["代表例","アサガオ、ヒマワリ、マリーゴールド、ジニア、ケイトウ","パンジー、ビオラ、キンセンカ、ストック、ネモフィラ"]]},"mnemonic":"「暑がりは春まき、寒がりは秋まき」ではなく逆。夏が苦手な地中海組が秋まき、冬が苦手な熱帯組が春まき。"},{"heading":"球根の5タイプと植え時","dialogue":[{"who":"客","text":"ダリアの球根、去年ぶつ切りにして植えたら1本も芽が出ませんでした。チューリップは同じやり方で平気だったのに。"},{"who":"緑川","text":"ダリアの球根は太った根なんです。根そのものには芽がない。芽は茎の付け根にしかないので、そこを付けて切り分けないと出てきません。"},{"who":"ハナ","text":"球根って、みんな同じ作りじゃないんですね……。"},{"who":"緑川","text":"そう。何が太ったのかで5種類。作りが分かれば、切り方も貯蔵の仕方も自動的に決まる。"}],"body":"<p>「球根」は園芸の便宜的な呼び名で、<strong>地下の貯蔵器官の総称</strong>だ。何が肥大したかで5タイプに分かれ、この違いがそのまま増やし方・貯蔵法に直結する。</p><ul><li><strong>鱗茎</strong>… 葉が変化した鱗片が重なったもの。チューリップ、ユリ、ヒヤシンス、スイセン、タマネギ。外皮のあるチューリップやスイセンは乾燥に強く裸で流通するが、外皮のないユリは乾燥に弱く、おがくず入りで届いたらすぐ植える。</li><li><strong>球茎</strong>… 茎が丸く肥大したもので中身は詰まっている。グラジオラス、クロッカス、フリージア。毎年古い球の上に新球ができて更新される。</li><li><strong>塊茎</strong>… 地下茎が塊状に太ったもの。シクラメン、アネモネ、ジャガイモ、カラー。芽の出る位置が決まっている（ジャガイモの「目」）。</li><li><strong>根茎</strong>… 地下茎が横に伸びて太ったもの。カンナ、ジャーマンアイリス、ショウガ。切り分けて増やす。</li><li><strong>塊根</strong>… 根が太ったもの。ダリア、ラナンキュラス、サツマイモ。<strong>根には芽がない</strong>ので、分球のときは必ず茎の付け根を付ける。</li></ul><p>植え時は原産地の気候で決まる。<strong>秋植え球根</strong>は地中海沿岸などの出身で耐寒性が高く、冬の低温に当たることで春に伸びて咲き、夏は休眠する（チューリップ、スイセン、ヒヤシンス、クロッカス、ムスカリ、アネモネ、ラナンキュラス）。<strong>春植え球根</strong>は熱帯や南アフリカの出身で寒さに弱く、春に植えて夏から秋に咲く（ダリア、グラジオラス、カンナ、球根ベゴニア、カラー）。寒い地域では晩秋に掘り上げ、凍らない場所で貯蔵する。</p>","why":"球根は「何の器官が太ったか」で芽の位置と乾燥への強さが決まるため、タイプが分かれば分球の切り方と貯蔵法が自動的に決まる。","keypoints":["鱗茎＝葉が肥大（チューリップ・ユリ・ヒヤシンス・スイセン・タマネギ）","球茎＝茎が肥大（グラジオラス・クロッカス・フリージア）","塊茎＝地下茎が塊状に肥大（シクラメン・アネモネ・ジャガイモ・カラー）","根茎＝地下茎が横に伸びて肥大（カンナ・ジャーマンアイリス・ショウガ）","塊根＝根が肥大（ダリア・ラナンキュラス・サツマイモ）。芽がないので茎の付け根を付けて分ける","秋植え球根は耐寒性が高く低温を経て春に開花、春植え球根は非耐寒性で夏〜秋に開花"],"table":{"caption":"球根の5タイプ","headers":["タイプ","肥大した器官","特徴","代表植物"],"rows":[["鱗茎","葉（鱗片）","鱗片が重なる。外皮の有無で乾燥への強さが違う","チューリップ、ユリ、ヒヤシンス、スイセン、タマネギ"],["球茎","茎","中身が詰まった塊。毎年新球に更新される","グラジオラス、クロッカス、フリージア"],["塊茎","地下茎","塊状。芽の出る位置が決まっている","シクラメン、アネモネ、ジャガイモ、カラー"],["根茎","地下茎","横に伸びる。切り分けて増やす","カンナ、ジャーマンアイリス、ショウガ"],["塊根","根","芽がないため茎の付け根を付けて分球する","ダリア、ラナンキュラス、サツマイモ"]]},"mnemonic":"「鱗は葉、球と塊と根は茎、塊根だけが根」。塊根だけ芽なし、と覚える。"},{"heading":"主要な科と連作障害","dialogue":[{"who":"客","text":"毎年同じ畝でトマトを作っていたら、今年は途中で青くなって萎れてしまって。"},{"who":"緑川","text":"連作障害ですね。トマト・ナス・ピーマンはどれもナス科。同じ科は同じ病原菌に狙われるので、去年ナスだった場所も『同じ場所』とみなさないといけません。"},{"who":"ハナ","text":"作物名じゃなくて、科で記録するんですね。"},{"who":"緑川","text":"そう。畑の日誌は科で書く。それだけで連作事故はぐっと減るよ。"}],"body":"<p>科を覚える最大の実益は、<strong>病害虫と連作障害の予測</strong>だ。同じ科の植物は同じ病原菌や線虫の宿主になり、養分の吸い方も似ている。だから同じ場所で続けると、<strong>土壌病害虫の蓄積・特定養分の偏った消耗・根から出る物質による生育阻害</strong>が重なり、生育が落ちる。これが連作障害である。</p><p>対策は<strong>科の単位で場所を回す（輪作）</strong>こと。目安はナス科のトマト
