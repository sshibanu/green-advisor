・ナス・ピーマンで3〜4年、ジャガイモで2〜3年、ウリ科のスイカ・メロンで4〜5年、キュウリで2〜3年、マメ科のエンドウで4〜5年、インゲンで2〜3年、アブラナ科のハクサイ・キャベツで2〜3年、ダイコンで1〜2年。逆にサツマイモ、カボチャ、トウモロコシ、ネギ、タマネギ、ニンジンなどは連作障害が出にくい。接ぎ木苗の利用、堆肥で土の微生物相を豊かにすること、プランターなら用土の更新も有効だ。</p><p>科ごとの見分けどころも押さえておく。<strong>キク科</strong>は小花が集まって1輪に見える頭状花序、<strong>アブラナ科</strong>は花弁4枚の十字花、<strong>マメ科</strong>は蝶形花で根に根粒菌が共生し空気中の窒素を固定するため窒素肥料は控えめでよい。<strong>シソ科</strong>は茎の断面が四角く葉が対生し芳香を持つ。<strong>セリ科</strong>は傘状の花序で直根性のため移植を嫌う。<strong>ツツジ科</strong>は酸性土壌を好み細い根が浅く張る。<strong>サボテン科</strong>は刺座（アレオーレ）から刺が出る点で、ほかの多肉植物と区別できる。</p>","why":"同じ科の植物は同じ病原菌の宿主で養分の吸い方も似るため、科の単位で場所を回さないと土の中の障害要因が積み上がる。","keypoints":["連作障害の三大要因は土壌病害虫の蓄積、特定養分の消耗、生育阻害物質の蓄積","輪作は作物名ではなく科の単位で考える","トマト・ナス・ピーマン、スイカ・メロン、エンドウは4〜5年が目安","ジャガイモ、キュウリ、インゲン、ハクサイ・キャベツは2〜3年、ダイコンは1〜2年","サツマイモ、カボチャ、トウモロコシ、ネギ類は連作障害が出にくい","マメ科は根粒菌の窒素固定があるため窒素肥料は控えめにする"],"table":{"caption":"主要な科（双子葉）の特徴・代表植物・連作の目安","headers":["科名","見分けの手がかり","代表植物","連作の目安"],"rows":[["キク科","小花が集まった頭状花序（舌状花と筒状花）","キク、ヒマワリ、コスモス、マリーゴールド、ダリア、ガーベラ、レタス","レタス2年程度"],["バラ科","花弁5枚が基本、雄しべが多数。果樹が多い","バラ、サクラ、ウメ、リンゴ、ナシ、イチゴ、シモツケ","イチゴ2〜3年"],["マメ科","蝶形花、実は莢。根に根粒がつく","エンドウ、インゲン、ダイズ、スイートピー、ルピナス、フジ","エンドウ4〜5年／インゲン2〜3年"],["アブラナ科","花弁4枚の十字花。アオムシがつきやすい","キャベツ、ハクサイ、ダイコン、ブロッコリー、ストック、ハボタン","ハクサイ・キャベツ2〜3年／ダイコン1〜2年"],["ナス科","合弁花が5つに裂ける。連作障害の代表","トマト、ナス、ピーマン、ジャガイモ、ペチュニア、ホオズキ","トマト・ナス・ピーマン4〜5年／ジャガイモ2〜3年"],["ウリ科","つる性で巻きひげ。雌花と雄花が分かれる","キュウリ、カボチャ、スイカ、メロン、ゴーヤー","スイカ・メロン4〜5年／キュウリ2〜3年"],["セリ科","傘状に細かい花が集まる。直根性で移植を嫌う","ニンジン、パセリ、ミツバ、セロリ、フェンネル","比較的少ない"],["シソ科","茎の断面が四角、葉は対生、芳香がある","シソ、バジル、ミント、ラベンダー、ローズマリー、サルビア、コリウス","−"],["ツツジ科","酸性土壌を好み、細根が浅く広がる","ツツジ、サツキ、シャクナゲ、ブルーベリー、アセビ","−"],["ツバキ科","常緑で葉が厚く光沢がある","ツバキ、サザンカ、チャノキ","−"],["ミカン科","葉に油点があり香る。アゲハ類の食草","ミカン、レモン、ユズ、キンカン、サンショウ","−"],["キンポウゲ科","花弁に見えるのが萼片のものが多い。有毒種が多い","クレマチス、アネモネ、ラナンキュラス、デルフィニウム、オダマキ","−"],["ナデシコ科","茎の節がふくらみ、葉は対生","カーネーション、ナデシコ、カスミソウ","−"],["オオバコ科（旧ゴマノハグサ科の一部）","筒状・唇形の花が穂になる","キンギョソウ、ジギタリス、ペンステモン、ベロニカ","−"],["サボテン科","刺座（アレオーレ）から刺が出る。ほぼ南北アメリカ原産","各種サボテン","−"]]},"mnemonic":"長い輪作は「ナス・スイカ・エンドウで4〜5年」。短いのは「ダイコン1〜2年」。"},{"heading":"単子葉と双子葉、そしてAPGの再編","dialogue":[{"who":"客","text":"芝生に生えた雑草だけ枯らす除草剤って、なぜ芝は枯れないんですか？ 同じ草なのに。"},{"who":"緑川","text":"芝はイネ科、つまり単子葉。雑草の多くは双子葉です。体のつくりも薬への反応も違うので、片方だけ効かせられるんですよ。"},{"who":"ハナ","text":"子葉が1枚か2枚かの違いが、除草剤にまで効いてくるんですか。"},{"who":"緑川","text":"そこがおもしろいところ。子葉の数は、葉脈も根も茎の中身も全部セットで違うという合図なんだ。"}],"body":"<p>被子植物は<strong>単子葉植物</strong>と<strong>双子葉植物</strong>に大きく分かれる。違いは子葉の枚数だけではなく、体のつくり一式がセットで変わる。単子葉は子葉1枚・平行脈・ひげ根で、茎の維管束が<strong>散在していて形成層がない</strong>。だから幹が年々太る二次肥大をしないし、接ぎ木もできない。双子葉は子葉2枚・網状脈・主根と側根で、維管束が輪状に並び<strong>形成層がある</strong>ので肥大成長する。花の基本数も単子葉が3の倍数、双子葉が4か5の倍数だ。</p><p><strong>除草剤の選択性はここから来る</strong>。オーキシン様の成長調整作用を持つ薬剤に双子葉は過敏に反応して異常成長し枯れるが、単子葉は反応が鈍い。加えて単子葉は生長点が株元にあって葉が基部から伸びるため、上から薬がかかっても刈られても再生しやすい。だから<strong>イネ科の芝生に生えた広葉雑草だけを枯らす</strong>ことができる。ただし芝の種類で適用が違うので、必ず登録内容を確認する。</p><p>科の枠組みも、遺伝子解析にもとづく<strong>APG体系</strong>で大きく組み替えられた。とくに旧ユリ科は解体され、代表的な行き先は次のとおり。</p><ul><li><strong>ユリ科に残る</strong>… ユリ、チューリップ、カタクリ、バイモ</li><li><strong>ヒガンバナ科へ</strong>… ヒガンバナ、スイセン、アマリリス、ネギ、タマネギ、ニンニク、クンシラン</li><li><strong>キジカクシ科へ</strong>… アスパラガス、ヒヤシンス、ムスカリ、スズラン、ギボウシ</li><li><strong>ススキノキ科へ</strong>… アロエ、ヘメロカリス</li><li><strong>イヌサフラン科へ</strong>… コルチカム</li></ul><p>ほかの単子葉の主要科では、<strong>ラン科</strong>（唇弁を持つ左右相称の花。種子が微細で、自然界では菌類と共生して発芽する）、<strong>アヤメ科</strong>（ハナショウブ、カキツバタ、グラジオラス、フリージア、クロッカス）、<strong>サトイモ科</strong>（モンステラ、ポトス、アンスリウムなど観葉に多い）を押さえておきたい。</p>","why":"単子葉と双子葉は維管束と生長点の位置まで含めて体制がまるごと違うため、その差がそのまま除草剤の効き方や接ぎ木の可否として現れる。","keypoints":["単子葉＝子葉1枚・平行脈・ひげ根・維管束が散在・形成層なし・花は3の倍数","双子葉＝子葉2枚・網状脈・主根と側根・維管束が輪状・形成層あり・花は4か5の倍数","形成層がない単子葉は肥大成長せず、接ぎ木もできない","除草剤の選択性は双子葉がオーキシン様作用に過敏なこと、単子葉の生長点が株元にあることから生じる","APG体系で旧ユリ科は解体。ネギ・スイセンはヒガンバナ科、ヒヤシンス・アスパラガス・ギボウシはキジカクシ科へ","ラン科の種子は微細で、自然状態では菌類との共生で発芽する"],"table":{"caption":"単子葉植物と双子葉植物","headers":["項目","単子葉植物","双子葉植物"],"rows":[["子葉","1枚","2枚"],["葉脈","平行脈","網状脈"],["茎の維管束","散在。形成層がなく肥大しない","輪状に並ぶ。形成層があり肥大する"],["根","ひげ根","主根と側根"],["花の基本数","3の倍数","4または5の倍数"],["生長点の位置","株元（葉は基部から伸びる）","茎の先端"],["代表","イネ、芝、ユリ、ラン、アヤメ、ヤシ、タケ","多くの草花・野菜・広葉樹"]]},"mnemonic":"単子葉は「1・平行・ひげ・3の倍数」。双子葉は「2・網目・主根・4か5」。"}],"quiz":[{"type":"ox","q":"学名は属名と種小名の2語で表す二名法で書き、印刷物ではイタリック体（斜体）にする。","a":true,"why":"二名法の定義そのもの。属名は頭文字が大文字、種小名はすべて小文字で、手書きなら下線を引く。"},{"type":"ox","q":"園芸店で「ゼラニウム」として売られている植物の多くは、分類上はペラルゴニウム属である。","a":true,"why":"流通名のゼラニウムはPelargonium属で南アフリカ原産の非耐寒性。学名どおりのGeranium属はフウロソウで耐寒性宿根草。"},{"type":"ox","q":"学名では、属名も種小名もどちらも頭文字を大文字で書き始める。","a":false,"why":"大文字で始めるのは属名だけ。種小名はすべて小文字で書く。"},{"type":"ox","q":"学名の属名と種小名の間にある「×」は、突然変異で生まれたことを示す記号である。","a":false,"why":"×は交雑種の印。属名と種小名の間なら種間雑種、属名の前なら属間雑種を示す。"},{"type":"ox","q":"針葉樹はすべて常緑樹であり、冬に葉を落とす種類はない。","a":false,"why":"カラマツ、メタセコイア、ラクウショウは落葉する針葉樹。針葉樹と常緑樹は別の切り口の分類。"},{"type":"ox","q":"パンジーやキンセンカのような秋まき一年草は、原産地が地中海沿岸などで、高温には弱いが低温には比較的強い。","a":true,"why":"冬に雨が降って温暖、夏は高温乾燥という気候に合わせ、秋に発芽して幼苗で越冬し春に咲く設計になっている。"},{"type":"ox","q":"チューリップの球根は、茎が肥大した球茎に分類される。","a":false,"why":"チューリップは葉（鱗片）が肥大した鱗茎。球茎はグラジオラス、クロッカス、フリージアなど。"},{"type":"ox","q":"ダリアの球根は塊根なので、分球するときは芽のある茎の付け根を必ず付けて切り分ける。","a":true,"why":"塊根は太った根であり根そのものに芽がない。芽は茎の付け根にあるため、そこを付けないと発芽しない。"},{"type":"ox","q":"マメ科の植物は根粒菌と共生して空気中の窒素を固定するため、窒素肥料は控えめでよい。","a":true,"why":"根粒菌が窒素を供給するので、窒素が多すぎるとつるや葉ばかり茂って着莢が悪くなる。"},{"type":"ox","q":"アブラナ科の花は花弁が5枚で、十字状に開くのが特徴である。","a":false,"why":"アブラナ科の花弁は4枚。5枚が基本で雄しべが多数なのはバラ科。"},{"type":"ox","q":"単子葉植物の茎は維管束が輪状に並び、形成層があるため年々太く肥大する。","a":false,"why":"これは双子葉植物の説明。単子葉は維管束が散在し形成層がないので肥大成長せず、接ぎ木もできない。"},{"type":"ox","q":"芝生に生えた広葉雑草だけを枯らす除草剤があるのは、単子葉植物と双子葉植物で薬剤への反応や体のつくりが違うためである。","a":true,"why":"双子葉はオーキシン様の作用に過敏で異常成長を起こす一方、単子葉は反応が鈍く、生長点も株元にあって再生しやすい。"},{"type":"ox","q":"APG体系による見直しで、ネギやニンニクは旧ユリ科からヒガンバナ科として扱われるようになった。","a":true,"why":"旧ユリ科は解体され、ネギ属やスイセンはヒガンバナ科、ヒヤシンスやアスパラガスはキジカクシ科に移った。"},{"type":"ox","q":"連作障害を避ける輪作では、同じ属さえ避ければよく、科までさかのぼって考える必要はない。","a":false,"why":"同じ科は同じ病原菌や線虫の宿主になるため、輪作は科の単位で計画する。トマトの跡にナスは連作と同じ扱い。"},{"type":"ox","q":"サボテン科の植物には刺座（アレオーレ）があり、これがほかの多肉植物との見分けどころになる。","a":true,"why":"刺は刺座から出る。刺があるかどうかではなく刺座があるかどうかがサボテン科の決め手。"},{"type":"ox","q":"ハナミズキはヤマボウシの別名であり、両者はまったく同じ植物である。","a":false,"why":"ハナミズキの和名はアメリカヤマボウシで、日本のヤマボウシとは同じ属の別種。花に見える部分は総苞。"},{"type":"mc","q":"分類の階層で「科」のすぐ上位にあたるのはどれか。","choices":["目","綱","属"],"a":0,"why":"上から界・門・綱・目・科・属・種の順。科の上が目、下が属になる。"},{"type":"mc","q":"学名の表記として正しいものはどれか。","choices":["属名を小文字、種小名を大文字で書き始める","属名の頭文字を大文字、種小名はすべて小文字で書く","属名も種小名も頭文字を大文字で書く"],"a":1,"why":"大文字で始めるのは属名だけ。全体はイタリック体で書き、命名者名を添える場合は立体にする。"},{"type":"mc","q":"学名に付く「subsp.（ssp.）」が示すのはどれか。","choices":["変種","品種","亜種"],"a":2,"why":"subsp.は亜種。var.が変種、f.が品種で、細かさは亜種＞変種＞品種の順。"},{"type":"mc","q":"鱗茎に分類される球根はどれか。","choices":["グラジオラス","スイセン","ダリア"],"a":1,"why":"スイセンは葉が肥大した鱗茎。グラジオラスは球茎、ダリアは塊根。"},{"type":"mc","q":"球茎に分類される球根はどれか。","choices":["クロッカス","シクラメン","カンナ"],"a":0,"why":"クロッカスは茎が肥大した球茎。シクラメンは塊茎、カンナは根茎。"},{"type":"mc","q":"塊根に分類される球根はどれか。","choices":["ジャガイモ","ショウガ","ラナンキュラス"],"a":2,"why":"ラナンキュラスは根が肥大した塊根。ジャガイモは塊茎、ショウガは根茎。"},{"type":"mc","q":"春植え球根はどれか。","choices":["ヒヤシンス","カンナ","クロッカス"],"a":1,"why":"カンナは熱帯性で寒さに弱く、春に植えて夏から秋に咲く。ヒヤシンスとクロッカスは秋植え球根。"},{"type":"mc","q":"秋まき一年草はどれか。","choices":["マリーゴールド","ホウセンカ","ストック"],"a":2,"why":"ストックは地中海沿岸原産の秋まき型。マリーゴールドとホウセンカは熱帯・亜熱帯原産の春まき型。"},{"type":"mc","q":"小さな花が多数集まって1輪に見える頭状花序が特徴の科はどれか。","choices":["キク科","セリ科","シソ科"],"a":0,"why":"キク科は舌状花と筒状花が集まった頭状花序。セリ科は傘状の花序、シソ科は唇形花。"},{"type":"mc","q":"茎の断面が四角く、葉が対生し、芳香を持つものが多い科はどれか。","choices":["ナデシコ科","シソ科","アブラナ科"],"a":1,"why":"シソ科の特徴。バジル、ミント、ラベンダー、ローズマリーなどハーブが多く含まれる。"},{"type":"mc","q":"ペチュニアと同じ科に属する野菜はどれか。","choices":["キュウリ","ダイコン","トマト"],"a":2,"why":"ペチュニアはナス科。トマト・ナス・ピーマン・ジャガイモと同じ科で、花壇でも連作を避けたい。"},{"type":"mc","q":"輪作でとくに長く（4〜5年）間隔をあけたい組み合わせはどれか。","choices":["トマトのあとにナス","トウモロコシのあとにサツマイモ","コマツナのあとにネギ"],"a":0,"why":"どちらもナス科で病原菌を共有するため3〜4年あける。トウモロコシ・サツマイモ・ネギは連作障害が出にくい。"},{"type":"mc","q":"APG体系で旧ユリ科から分かれ、アスパラガス・ヒヤシンス・ギボウシが含まれる科はどれか。","choices":["ヒガンバナ科","キジカクシ科","アヤメ科"],"a":1,"why":"これらはキジカクシ科。ヒガンバナ科にはネギ、タマネギ、スイセン、アマリリスなどが入る。"},{"type":"mc","q":"単子葉植物の特徴として正しいものはどれか。","choices":["葉脈が網状に広がる","根が主根と側根に分かれる","葉脈が平行で根はひげ根"],"a":2,"why":"平行脈とひげ根が単子葉の特徴。網状脈と主根・側根は双子葉の特徴。"},{"type":"mc","q":"ツツジやブルーベリーが属するツツジ科の、土に関する性質はどれか。","choices":["酸性土壌を好む","強いアルカリ性を好む","土壌pHの影響をほとんど受けない"],"a":0,"why":"ツツジ科は酸性土壌を好み、細い根が浅く広がる。ピートモスや鹿沼土が用いられるのはこのため。"},{"type":"mc","q":"園芸店で売られる観葉植物の「ゴムの木」（インドゴムノキ）が属する科はどれか。","choices":["クワ科","トウダイグサ科","ツバキ科"],"a":0,"why":"インドゴムノキはクワ科イチジク属で、ベンジャミンやガジュマルと同じ仲間。天然ゴムをとるパラゴムノキはトウダイグサ科の別物。"}]},{"id":5,"title":"植物の特性を読む","subtitle":"原産地から育て方を逆算できるようになる","minutes":45,"goals":["原産地の気候から、その植物の水・光・温度の要求を推測して管理を組み立てられる","耐寒性・耐暑性・耐陰性・pHの好みなど「特性のラベル」を読んで、置き場所と季節作業を決められる","開花習性・生育型・品種（固定種／F1／栄養系）の違いを説明し、お客さんに合った選択を勧められる"],"sections":[{"heading":"原産地は、植物が書いた取扱説明書","dialogue":[{"who":"客","text":"この植物、育て方の札に『水やりは控えめに、日当たりのよい場所で』としか書いてなくて。控えめってどのくらいですか。"},{"who":"ハナ","text":"うーん……週に一回、くらいでしょうか。"},{"who":"緑川","text":"曜日で決めると、たいてい失敗します。それより札の隅を見てください。『原産地：南アフリカ』。ここが本当の説明書です。乾いた土地の子なら『土がしっかり乾いてから、たっぷり』が答えになる。"},{"who":"ハナ","text":"原産地から、育て方を逆算するんですね。"}],"body":"<p>園芸で覚えることは膨大に見えますが、幹は一本です。<strong>植物は原産地の気候に合わせて体をつくってきた</strong>。だから原産地がわかれば、水・光・温度・土の要求はおおよそ逆算できます。丸暗記の代わりに、この一本の筋を通してください。</p><p>逆算のしかたは単純です。原産地について次の4つを想像します。<strong>(1)雨はいつ降るか (2)夏と冬の気温 (3)光は強いか弱いか (4)土は水はけがよいか</strong>。たとえば「夏に雨が降らない土地」の出身なら、日本の梅雨と真夏の高温多湿は未知の拷問です。「森の下草」の出身なら、直射日光はごちそうではなく火傷の原因になります。</p><h4>覚えておきたい5つの気候タイプ</h4><p>家庭園芸で出会う植物は、ざっくり5つの出身グループに分けられます。<strong>地中海性気候</strong>（夏は乾いて暑く、雨は冬に降る）、<strong>熱帯雨林</strong>（年じゅう高温多湿、林床は薄暗い）、<strong>乾燥地</strong>（雨が少なく昼夜の温度差が大きい）、<strong>高山</strong>（涼しく、光は強く、水はすぐ抜ける）、<strong>東アジア温帯</strong>（四季と梅雨があり、日本の在来種の故郷）。</p><p>この5つのうち、<em>日本の気候と素直に合う</em>のは最後のひとつだけです。残りの4グループは、どこかの季節で必ず無理をしている。だから管理の勘どころは「その植物が日本のどの季節を苦手とするか」を先に決め打ちすることに尽きます。苦手な季節さえ乗り切れば、あとは放っておいても育つ植物は多いのです。</p>","why":"植物の要求は気まぐれではなく原産地の気候の写し取りだから、気候を知れば管理は推測できる。","keypoints":["育て方は原産地から逆算する。逆算に使うのは「雨期・気温・光の強さ・土の水はけ」の4点","地中海性気候は夏乾燥・冬雨。日本とは雨の降る季節が逆になる","熱帯雨林出身は高温多湿を好み、林床育ちのものは弱い光でも育つ（耐陰性）","乾燥地出身は過湿が致命傷、高山出身は暑さと蒸れが致命傷","日本の気候に素直に合うのは東アジア温帯出身のグループ。他は必ずどこかの季節で無理をする","管理の設計は「この植物が苦手な季節はどこか」を先に決めることから始める"],"table":{"caption":"原産地の気候タイプと管理の逆算","headers":["気候タイプ","現地の環境","代表的な植物","日本で苦手な季節","管理の要点"],"rows":[["地中海性気候","夏は高温乾燥、雨は冬に降る","ラベンダー、ローズマリー、オリーブ、シクラメン","梅雨〜真夏","梅雨前に切り戻して風通しを確保、夏は雨を避け水を控える"],["熱帯雨林","年間高温多湿、林床は弱い光","ポトス、モンステラ、フィカス、アンスリウム","冬","冬はおよそ10℃以上を確保、水は控えめ、暖房の乾いた風を当てない"],["乾燥地","降水が少なく昼夜の温度差が大きい","サボテン、アガベ、多くの多肉植物","梅雨〜秋の長雨","水はけ最優先、乾いてからたっぷり、雨ざらしにしない"],["高山","涼しい・強い光・水はすぐ抜ける","高山植物、多くの山野草","真夏","夏は遮光と風通し、鉢は地面から離して地温を下げる"],["東アジア温帯","四季と梅雨がある","ヤマアジサイ、ギボウシ、ツツジ、シュウメイギク","特になし（適地）","基本は自然まかせ。夏の乾きすぎだけ注意"]]},"mnemonic":"「地・熱・乾・高・東」の5グループ。困ったら『故郷では今ごろ何をしている季節か』と問い直す。"},{"heading":"休む季節を読む — 夏越しと冬越し","dialogue":[{"who":"客","text":"去年買ったシクラメン、初夏に元気がなくなって枯らしちゃいました。水が足りなかったのかな。"},{"who":"緑川","text":"おそらく逆です。シクラメンは地中海の生まれで、夏は球根で眠る植物です。眠ろうとしている株に水を与え続けると、そこから腐ります。"},{"who":"ハナ","text":"元気がないのは、弱ったんじゃなくて休みに入っただけ……。"},{"who":"緑川","text":"そう。<em>弱っている</em>のか<em>休んでいる</em>のかを見分けられるかどうかで、この仕事の腕は決まります。"}],"body":"<p>原産地から逆算すると、多くの植物には<strong>生育期と休眠期</strong>があることが見えてきます。現地の厳しい季節（乾期や酷寒）を、葉を落としたり地下部だけになったりしてやり過ごす仕組みです。日本ではこの休眠が「梅雨〜真夏」か「冬」に来ます。<strong>休眠期の合図を、株の不調と読み違えて水や肥料を与えるのが最大の失敗</strong>です。</p><h4>夏に休む組</h4><p>シクラメン、プリムラ、多くの山野草がここに入ります。シクラメンの夏越しは、葉が黄変してきたら水を減らし、鉢ごと雨の当たらない涼しい日陰で乾かして休ませる（休眠法）か、水を細く与え続けて葉を保つ（非休眠法）かのどちらかに決めること。中途半端が一番危ない。山野草は真夏におよそ30〜50%の遮光と風通しを確保し、鉢は地面に直置きせず棚に上げて地温を逃がします。</p><h4>冬に休む組・冬に弱る組</h4><p>落葉樹や宿根草は冬に休眠します。休眠中は代謝が落ちているので、<strong>植え付け・移植・強い剪定はこの時期が適期</strong>。一方、熱帯生まれの観葉植物は冬でも休眠しきらず、ただ寒さで弱ります。冬の観葉植物が傷むのは「寒い」ためだけではなく、<em>気温が低くて根が水を吸えないのに、いつもと同じ量の水が与えられて根が傷む</em>ためであることが多い。冬は水やりの間隔を大きくあけ、暖かい時間帯に与えます。</p><h4>多肉植物の生育型</h4><p>多肉植物は原産地の雨期がいつかで、<strong>春秋型・夏型・冬型</strong>に分かれます。生育型を外すと、休眠中にたっぷり水をやって腐らせることになります。</p>","why":"休眠は弱りではなく生き残るための戦略なので、休眠期に生育期と同じ世話をすると根が傷む。","keypoints":["「弱っている」と「休んでいる」を見分ける。休眠期は水と肥料を減らすのが原則","シクラメン・プリムラ・山野草は夏に休む組。夏は涼しく・乾かし気味・遮光","落葉樹と宿根草は冬に休眠し、その時期が植え付け・移植・強剪定の適期","常緑樹の植え付け・移植は厳寒期を避け、芽吹き前の春かおだやかな秋に行う","冬の観葉植物の傷みは低温と過湿の合わせ技。水やりの間隔を大きくあける","多肉植物は春秋型・夏型・冬型を確認し、休眠期は断水〜ごく控えめにする"],"table":{"caption":"多肉植物の生育型と季節の管理","headers":["生育型","よく育つ時期","代表例","休眠期の扱い"],"rows":[["春秋型","春と秋（およそ10〜25℃）","エケベリア、ハオルチア、セダム","真夏と真冬は生育が鈍る。水は控えめ、夏は遮光と風通し"],["夏型","春〜秋","サボテンの多く、アガベ、アロエ、パキポディウム","冬は断水気味にし、およそ5℃以上を保って越冬させる"],["冬型","秋〜春（涼しい時期）","リトープスなどメセン類、コノフィツム、アエオニウム","夏は休眠。断水し、遮光した涼しい風通しのよい場所へ"]]},"mnemonic":"夏型は「夏に働き冬に寝る」、冬型は「冬に働き夏に寝る」。水は“働いている季節”にだけやる。"},{"heading":"耐寒性の3区分と、冬をしのぐ道具","dialogue":[{"who":"客","text":"この花、外に置きっぱなしで冬を越せますか。うち、庭が北向きなんですけど。"},{"who":"ハナ","text":"ラベルには『半耐寒性』とあります。……半分って、どっちなんでしょう。"},{"who":"緑川","text":"半耐寒性は『霜には当てないでほしい』という意味です。凍らせなければ生きる。だから軒下に寄せるだけで結果が変わることが多い。晴れた夜は地面の熱が空へ逃げて気温より株元が冷えるのですが、屋根や不織布はその逃げ道にふたをするんです。"}],"body":"<p>耐寒性は「その植物が枯れずに耐えられる最低温度」の目安で、園芸では大きく3区分します。<strong>耐寒性</strong>（戸外でそのまま越冬できる）、<strong>半耐寒性</strong>（凍らなければ越冬でき、霜よけや軒下で守る）、<strong>非耐寒性</strong>（およそ5〜10℃を下回ると傷み、室内や温室が必要）。区分の名前ではなく、<em>その株にとっての限界温度がいくつか</em>で管理を決めるのが実務です。</p><h4>冬に本当に効く場所選び</h4><p>同じ庭でも温度は一様ではありません。よく晴れて風のない夜は<strong>放射冷却</strong>で地表付近の熱が空へ逃げ、気温よりも株元が冷えて霜が降ります。上に屋根やネットがあると熱が逃げにくく、霜が降りにくい。だから<strong>軒下・樹木の下・建物の南側の壁ぎわ</strong>は、庭のなかの避難所になります。逆に、吹きさらしの高台や、冷たい空気がたまる窪地は危険地帯です。</p><h4>守る道具の使い分け</h4><p>株元をわらや腐葉土、バークで覆う<strong>マルチング</strong>は地温の急降下と凍結を和らげます。<strong>不織布や寒冷紗のべたがけ</strong>は霜を直接当てない工夫。鉢物は<strong>二重鉢</strong>にしたり、地面から浮かせて冷えを断ちます。室内へ取り込む場合は、日中は明るい窓辺でも<em>夜の窓ぎわは屋外並みに冷える</em>ので、夜だけ部屋の中側へ寄せるのが定石です。</p>","why":"冬の被害の多くは平均気温ではなく晴れた夜の放射冷却による局所的な凍結で起きるから、上を覆うだけで生死が分かれる。","keypoints":["耐寒性・半耐寒性・非耐寒性の3区分。実務では区分名より「限界温度の目安」で判断する","非耐寒性はおよそ5〜10℃以上の確保が必要。多くの観葉植物がここに入る","晴れて風のない夜は放射冷却で株元が気温より冷える。霜はこの条件で降りる","軒下・常緑樹の下・建物南側の壁ぎわは、上や横からの放射冷却を防ぐ避難所になる","マルチング・不織布のべたがけ・寒冷紗・二重鉢が基本の防寒資材","室内でも夜間の窓ぎわは大きく冷える。夜は窓から離す"],"table":{"caption":"耐寒性の区分と冬の管理","headers":["区分","耐えられる温度の目安","代表例","冬の置き場所と対策"],"rows":[["耐寒性","およそ0℃以下でも越冬できる","パンジー、ビオラ、ハボタン、宿根草、落葉樹","戸外でそのまま。寒風と乾燥だけ注意し、株元をマルチング"],["半耐寒性","凍らなければ耐える（およそ0〜5℃）","ゼラニウム、シクラメン、多くの秋播き一年草","軒下や霜の当たらない場所へ。不織布・寒冷紗でべたがけ"],["非耐寒性","およそ5〜10℃を下回ると傷む","観葉植物、熱帯性の花木、多くの夏の草花","室内や温室へ取り込む。夜は窓辺から離す"]]},"mnemonic":"「耐＝そのまま／半＝屋根の下／非＝屋根の内」。冬の置き場所は3段階で覚える。"},{"heading":"耐暑性 — 日本の夏は夜が敵","dialogue":[{"who":"客","text":"夏になってからトマトの実つきが急に悪くて。肥料が足りないんでしょうか。"},{"who":"緑川","text":"真夏の着果不良は、肥料より温度のことが多いですね。花粉は高温に弱いんです。"},{"who":"ハナ","text":"でも日中は遮光できても、夜の暑さはどうにもならないですよね。"},{"who":"緑川","text":"そこが日本の夏の本当の難所です。<strong>昼の暑さより、夜温が下がらないことのほうが植物を消耗させる</strong>。"}],"body":"<p>耐暑性は耐寒性ほど数値で語られませんが、日本の家庭園芸では失敗の原因として耐寒性以上に重い。理屈はこうです。植物は光合成で糖をつくり（同化）、呼吸で糖を使って生きています（異化）。<strong>気温が高いほど呼吸は盛んになる</strong>のに、およそ30℃を超えると多くの植物では光合成の効率が頭打ちか低下します。つまり<em>稼ぎが減って支出が増える</em>状態です。</p><h4>夜温が下がらない害</h4><p>昼は光合成で稼げますが、<strong>夜は呼吸で消費するだけ</strong>。夜温が下がれば消費は抑えられますが、熱帯夜のようにおよそ25℃を下回らない夜が続くと、昼の蓄えが夜のうちに燃やされてしまいます。結果として、株がひょろひょろ伸びる（徒長）、花つきが悪くなる、実が甘くならない、株全体が消耗して病気に負ける、といった不調が重なります。夏に生育が止まるのは怠けではなく、収支が合っていないのです。</p><h4>高温障害の代表例</h4><p>受粉・受精は特に高温に弱く、トマトやピーマンはおよそ35℃を超える日が続くと花粉の働きが落ちて実がつきにくくなります。レタスやホウレンソウは高温では発芽がそろわず、日が長く暑くなるととう立ちします。花色が薄くなる、花が小さくなるのも典型です。</p><h4>打てる手</h4><p>遮光ネットや寒冷紗で日中の温度を下げる、風通しをつくる、株元をマルチして地温上昇を抑える、鉢を直射のコンクリートに置かない（照り返しと熱伝導で根が煮える）、夕方の打ち水で気化熱を使う。<strong>下げるべきは気温より根の温度</strong>だと覚えておくと選択を誤りません。</p>","why":"高温では呼吸による消費が光合成による生産を上回りやすく、とくに夜温が下がらないと蓄えを一方的に失うから。","keypoints":["高温では呼吸が増える一方、およそ30℃超で光合成の効率は頭打ちになり収支が悪化する","夜温がおよそ25℃を下回らないと、昼の蓄えを夜に消費して徒長・花つき低下・株の消耗を招く","トマト・ピーマンはおよそ35℃以上で花粉が傷み着果不良になる","レタス・ホウレンソウなど涼しい気候を好む野菜は高温で発芽不良やとう立ちを起こす","対策は遮光・風通し・マルチ・打ち水。鉢はコンクリート直置きを避ける","気温そのものより根の温度（地温）を下げることを優先する"],"mnemonic":"夏バテの式は「昼の稼ぎ − 夜の出費」。夜が暑い年ほど植物は痩せる。"},{"heading":"光と水の要求 — 半日陰には2つの意味がある","dialogue":[{"who":"客","text":"『半日陰を好む』って書いてあるので、家の北側の通路に植えたら、まったく育たなくて。"},{"who":"ハナ","text":"半日陰……たしかに、どこを指すのかあいまいですよね。"},{"who":"緑川","text":"実はこの言葉には2つの意味があります。<strong>午前だけ日が当たる場所</strong>と、<strong>一日じゅう木漏れ日が差す場所</strong>。北側の暗い通路は、そのどちらでもない『日陰』です。"},{"who":"ハナ","text":"同じ言葉なのに、場所として全然ちがう……。"}],"body":"<p>ラベルの日照表示は、おおむね3段階です。<strong>日なた</strong>は1日およそ5〜6時間以上の直射がある場所。<strong>半日陰</strong>はおよそ3〜4時間の直射がある場所、<em>または</em>一日じゅう木漏れ日が差す明るい場所。<strong>明るい日陰</strong>は直射は入らないが空が開けていて、昼間に本が読める程度の明るさがある場所です。</p><h4>「半日陰」の2つの意味</h4><p>ここが試験でも実務でも要注意。半日陰には<strong>(1)午前だけ日が当たり午後は日陰になる場所 (2)落葉樹の下などで木漏れ日が終日差す場所</strong>の2通りがあります。同じ3〜4時間でも、午前の日射は弱く涼しいので安全なのに対し、<strong>西日</strong>は強く、地面や壁の熱と重なって高温と乾燥を招きます。「半日陰」と書かれた植物を午後の日ざしだけが当たる場所に置くのは、事実上の日なた管理になります。</p><h4>耐陰性は「育つ」ではなく「耐える」</h4><p>耐陰性の高い植物（熱帯林の林床出身の観葉植物、シダ、ギボウシなど）は暗さに耐えますが、暗いほど元気になるわけではありません。暗すぎれば徒長し、葉色が薄くなり、斑入り品種は斑がぼやけます。</p><h4>耐乾性と耐湿性は別の軸</h4><p>水の要求は「量」ではなく<strong>水はけ（排水性）と水もち（保水性）のどちらを重視するか</strong>で考えます。乾燥地・高山出身は水はけ最優先で、軽石や鹿沼土を多く配合し、乾いてからたっぷり与える。湿地・水辺出身（ハナショウブ、ミント、サトイモなど）は水もち重視で、乾かすと傷みます。<em>「乾かし気味に」は水を少量ずつやることではなく、与える間隔をあけること</em>。一度に与える量はどちらもたっぷりが原則です。</p>","why":"同じ日照時間でも午前と午後で光の強さと熱が違い、水も総量ではなく乾湿のリズムで根の呼吸が決まるから。","keypoints":["日なた＝直射およそ5〜6時間以上、半日陰＝およそ3〜4時間、明るい日陰＝直射なしだが明るい","「半日陰」は(1)午前だけ日が当たる場所と(2)終日の木漏れ日、の2つの意味をもつ","同じ時間でも午前の光は弱く涼しく、西日は強く高温と乾燥を招くので同一視しない","耐陰性は暗さに耐える力であり、暗いほど良いという意味ではない。暗すぎると徒長し斑が不鮮明になる","耐乾性の高い植物は水はけ優先、耐湿性の高い植物は水もち優先で用土を変える","「乾かし気味」＝1回の量を減らすのではなく、与える間隔をあける"],"table":{"caption":"日照条件の区分と向く植物","headers":["区分","直射日光の目安","場所の例","向く植物"],"rows":[["日なた","1日およそ5〜6時間以上","南向きの庭、屋上、ベランダの手すり際","多くの草花・野菜・果樹、ラベンダー、バラ、多肉植物"],["半日陰（午前型）","午前中およそ3〜4時間","東向きの庭、建物の東側","アジサイ、ギボウシ、クリスマスローズ、多くの山野草"],["半日陰（木漏れ日型）","終日の弱い光","落葉樹の下、すだれ越しの場所","シュウメイギク、ホスタ、シダ類、多くの観葉植物"],["明るい日陰","直射なし・空は開けている","北向きの明るい壁ぎわ、レースカーテン越しの室内","耐陰性の高い観葉植物、シダ、ヤブラン"]]},"mnemonic":"半日陰は「午前の日」か「木漏れ日」。西日だけ当たる場所は半日陰と呼ばない。"},{"heading":"土壌pHの好みと、アジサイの花色","dialogue":[{"who":"客","text":"去年は青かったアジサイが、今年はピンクに寄ってしまって。品種が変わるなんてありますか。"},{"who":"ハナ","text":"肥料の色でも移るんでしょうか……。"},{"who":"緑川","text":"犯人は土の酸度です。アジサイは<strong>土が酸性だとアルミニウムが溶け出して根から吸われ、花の色素と結びついて青くなる</strong>。中性〜アルカリ性ではアルミが溶けないので、赤やピンクになります。株元に石灰をまいた覚えはありませんか。"},{"who":"客","text":"……去年、うっかりまきました。"}],"body":"<p>土壌pHは、養分が根に届くかどうかを左右する調整つまみです。pHがずれると、土のなかに養分があっても<strong>溶けない・吸えない</strong>状態になります。日本は雨が多く、石灰などが流れ出るため<strong>土は放っておくと酸性に傾きます</strong>。だから野菜づくりでは苦土石灰などによる酸度矯正が定番作業になります。</p><h4>酸性を好む植物・中性〜弱アルカリを好む植物</h4><p><strong>酸性を好む</strong>のは、ブルーベリー、ツツジ・シャクナゲ・サツキ、青花のアジサイ、スギ・ヒノキ、チャノキなど。これらに石灰を与えるのは逆効果で、酸度未調整のピートモスや鹿沼土で酸性側に保ちます。<strong>中性〜弱アルカリを好む</strong>のは、ホウレンソウ、ラベンダー、カーネーション、クレマチス、エンドウなど。多くの野菜はおよそpH6.0〜6.5の弱酸性〜中性が適します。</p><h4>石灰の入れすぎが招くこと</h4><p>矯正のつもりで石灰を過剰に施すと、鉄やマンガンなどの微量要素が溶けにくくなり、<strong>葉脈だけ緑を残して葉が黄化するクロロシス</strong>が出ます。「酸性はいけない」と機械的に石灰をまくのではなく、その植物の好みを確認してから使うこと。</p><h4>アジサイの色の理屈</h4><p>アジサイの青は、酸性土壌で可溶化したアルミニウムイオンが吸収され、花色素（アントシアニン）と結合して発色します。したがって<strong>青くしたいなら酸性、赤くしたいなら中性〜弱アルカリ</strong>。ただし<em>白花品種はもともと色素をもたないので、pHを変えても白のまま</em>です。ここは引っかけとして出やすい点です。</p>","why":"pHは養分の溶けやすさを決めるつまみであり、アジサイではアルミニウムの溶解量が花色素の発色を左右するから。","keypoints":["日本の土は雨で塩基が流れ、放置すると酸性に傾く","酸性を好む：ブルーベリー、ツツジ・シャクナゲ、青花アジサイ、スギ・ヒノキ、チャノキ","中性〜弱アルカリを好む：ホウレンソウ、ラベンダー、カーネーション、クレマチス。多くの野菜はおよそpH6.0〜6.5","アジサイは酸性でアルミニウムが溶けて吸収され青、中性〜アルカリでは吸えず赤・ピンクになる","白花のアジサイは色素をもたないためpHを変えても色は変わらない","石灰の入れすぎは鉄・マンガンの吸収を妨げ、葉脈間が黄化するクロロシスを招く"],"table":{"caption":"土壌pHの好みと調整の方向","headers":["好むpHの傾向","代表的な植物","調整に使うもの","やりがちな失敗"],"rows":[["酸性（およそpH4.5〜5.5）","ブルーベリー、ツツジ・シャクナゲ、青花アジサイ、スギ・ヒノキ","酸度未調整のピートモス、鹿沼土","石灰をまいて生育不良・黄化を招く"],["弱酸性〜中性（およそpH6.0〜6.5）","多くの野菜、多くの草花","苦土石灰で少しずつ矯正","毎作大量に石灰を入れ、pHを上げすぎる"],["中性〜弱アルカリ（およそpH6.5〜7.5）","ホウレンソウ、ラベンダー、カーネーション、クレマチス","苦土石灰、消石灰","酸性のまま植えて発芽・生育が揃わない"]]},"mnemonic":"「青は酸（さん）、赤はアルカリ」。ア＝青＝アルミ＝酸性、とアで繋げる。"},{"heading":"都市で生きる木の条件 — 耐潮・耐風・耐煙・耐病","dialogue":[{"who":"客","text":"海の近くに引っ越したんですが、去年植えた木が、潮風の後に葉が茶色くなって落ちてしまって。"},{"who":"緑川","text":"潮風は葉から水を奪い、塩分が組織を傷めます。海沿いには<strong>耐潮性</strong>のある樹種を選ぶのが先決です。クロマツやトベラ、シャリンバイ、マサキなど。"},{"who":"ハナ","text":"駅前の街路樹がイチョウばかりなのも、何か理由があるんですか。"},{"who":"緑川","text":"あります。排気ガスに強く、強い剪定にも耐えて萌芽する。都市では<em>美しさより我慢強さ</em>で樹種が選ばれるんです。"}],"body":"<p>植物の特性は、光や温度だけでなく<strong>環境ストレスへの耐性</strong>としても記述されます。造園・緑化の場面では、この耐性が樹種選定の決め手になります。</p><h4>4つの耐性</h4><p><strong>耐潮性</strong>は潮風（塩分を含む風）に耐える力。海岸では塩分と乾いた強風で葉が焼けるため、クロマツ、トベラ、シャリンバイ、マサキ、ウバメガシ、タブノキなどが用いられます。<strong>耐風性</strong>は強風で折れたり倒れたりしにくい力で、深く根を張り、幹や枝がしなやかな樹種が強い。<strong>耐煙性</strong>は排気ガスなど大気汚染に耐える力で、イチョウ、プラタナス、トウカエデなどが街路樹に多用されるのはこのためです。<strong>耐病性</strong>は病気にかかりにくい性質で、品種改良や台木の選択で高めます。</p><h4>都市の緑化樹に求められるもの</h4><p>都市の街路は、植物にとって過酷な立地です。舗装で雨水が入らず乾きやすい、根を張る土の容積が小さい、照り返しで高温になる、排気ガスがある、そして電線や標識のために強く剪定される。したがって求められるのは<strong>耐煙性・耐乾性・強い萌芽力（剪定後に芽を吹く力）・病虫害に強いこと・落枝しにくいこと</strong>。花の美しさは優先順位としては後ろに来ます。</p><h4>耐病性は買うときに決まる</h4><p>病気は出てから治すより、かからない品種を選ぶほうが確実です。うどんこ病や黒星病に強いバラ品種、青枯病など土壌病害に強い台木を使った<strong>接ぎ木苗</strong>の利用は、その代表例です。</p>","why":"都市や海岸では光と水より先に塩分・汚染・強剪定といったストレスが生死を決めるため、耐性で樹種を選ぶ必要があるから。","keypoints":["耐潮性＝潮風の塩分と乾燥に耐える力。クロマツ、トベラ、シャリンバイ、マサキ、ウバメガシなど","耐風性は深根性でしなやかな樹種が高い","耐煙性＝大気汚染への耐性。イチョウ、プラタナス、トウカエデが街路樹に多い理由","都市の緑化樹には耐煙性・耐乾性・強い萌芽力・病虫害への強さ・落枝しにくさが求められる","耐病性は栽培中の対処より品種選びで確保するのが確実","接ぎ木苗は台木の耐病性（土壌病害・連作障害の回避）を利用する手段"],"table":{"caption":"環境ストレスと対応する特性・樹種の例","headers":["ストレス","求められる特性","樹種の例","選定を誤ると起きること"],"rows":[["潮風・飛来塩分","耐潮性","クロマツ、トベラ、シャリンバイ、マサキ、ウバメガシ","葉が褐変して落ち、枝先から枯れ込む"],["強風・台風","耐風性（深根性・しなやかさ）","クロマツ、シラカシ、スダジイ","倒伏、幹折れ、根鉢の浮き上がり"],["排気ガス・大気汚染","耐煙性","イチョウ、プラタナス、トウカエデ","葉の斑点・早期落葉、樹勢の低下"],["強剪定・狭い植え枡","萌芽力・耐乾性","イチョウ、ヤナギ、トウカエデ","剪定後に芽を吹かず、樹形が回復しない"]]}},{"heading":"咲き方と品種を読む — 一季咲き・四季咲き・F1","dialogue":[{"who":"客","text":"つるバラを買ったんですが、冬に思い切って短く切ったら、翌年ほとんど咲かなくて。"},{"who":"緑川","text":"そのつるバラは一季咲きだったのでは。<strong>一季咲きは前の年の夏に翌春の花芽をつくる</strong>ので、冬に切ると花芽ごと落としてしまいます。"},{"who":"ハナ","text":"四季咲きなら冬に切ってもいいんですか。"},{"who":"緑川","text":"四季咲きは新しく伸びた枝に咲くので、冬の強剪定が前提になります。<em>同じバラでも、咲き方が違えば正反対の作業になる</em>んです。"}],"body":"<p>花期と<strong>開花習性</strong>は、その植物にいつ何をするかを決める情報です。<strong>一季咲き</strong>は年に一度だけ咲くタイプで、多くの花木やオールドローズ、つるバラの多くが該当します。花後すぐ（およそ夏まで）に翌年の花芽ができるため、<strong>剪定は花後すみやかに</strong>行い、それ以降は切らないのが鉄則。<strong>四季咲き</strong>は温度条件が合えば繰り返し咲くタイプで、モダンローズの多くがこれ。伸びた新梢に花をつけるので冬の強剪定と花がら切り（花後の切り戻し）が有効です。<strong>返り咲き</strong>は春が主体で、条件が合えば秋にもう一度咲くタイプを指します。</p><h4>バラのタイプ</h4><p>ハイブリッドティー（大輪の一輪咲き、四季咲き）、フロリバンダ（中輪の房咲き、四季咲き）、ミニチュア、シュラブ（半つる性）、つる性（一季咲きが多い）、オールドローズ。<strong>タイプがわかれば剪定期は自動的に決まります</strong>。</p><h4>品種の3つの出自</h4><p><strong>固定種（在来種）</strong>は世代を重ねて形質が固定されており、自家採種しても親と同じものが得られます。地域の風土に合い個性がある一方、生育や収穫は揃いにくい。<strong>F1（一代雑種）</strong>は性質の異なる親を掛け合わせた一代目で、<strong>雑種強勢</strong>により生育が旺盛で、大きさや形、収穫期がよく揃い、耐病性も付与しやすい。ただし<em>自家採種した次の世代では形質が分離して揃わない</em>ため、毎作タネを買う必要があります。<strong>栄養系品種</strong>は挿し木・接ぎ木・株分け・組織培養で殖やすもので、母株と遺伝的に同一。果樹やバラ、キクのように種子では揃わない作物で使われます。</p><h4>登録品種の扱い</h4><p>種苗法の登録品種（PVP表示）は育成者権で保護され、<strong>自家増殖には原則として育成者権者の許諾が必要</strong>です。在来種や保護期間の切れた一般品種には、この制限はかかりません。</p>","why":"花芽がいつどこにつくられるかで剪定の適期が決まり、品種の殖やし方の違いで種子から同じものが採れるかが決まるから。","keypoints":["一季咲きは前年の夏までに花芽をつくるので、剪定は花後すぐ。冬に切ると翌年咲かない","四季咲きは新梢に咲くため冬の強剪定と花後の切り戻しが有効。返り咲きは春が主体で条件が合えば秋にも咲く","バラはハイブリッドティー、フロリバンダ、ミニチュア、シュラブ、つる性、オールドローズなどに分かれる","固定種は自家採種で同じ形質が再現できるが、揃いは劣る","F1は雑種強勢で生育旺盛・揃いがよいが、自家採種した次世代では形質が分離する","栄養系品種は挿し木・接ぎ木・株分け・組織培養で殖やし母株と遺伝的に同一。種苗法の登録品種（PVP）は自家増殖に原則として許諾が必要"],"table":{"caption":"品種のタイプと自家採種・自家増殖","headers":["タイプ","殖やし方","次世代の揃い","利点","注意点"],"rows":[["固定種（在来種）","種子（自家採種可）","親と同じ形質が出る","地域に適応、味や姿に個性、タネを買い続けなくてよい","生育や収穫期が揃いにくい"],["F1（一代雑種）","毎作タネを購入","自家採種すると形質が分離する","雑種強勢で旺盛、大きさ・収穫期が揃う、耐病性を付与しやすい","自家採種で同じものは採れない"],["栄養系品種","挿し木・接ぎ木・株分け・組織培養","母株と遺伝的に同一","優良個体をそのまま増やせる","登録品種は自家増殖に許諾が必要な場合がある"]]},"mnemonic":"「一季は花後に、四季は冬に切る」。F1は“強くて揃うが、子は当てにならない”。"}],"quiz":[{"type":"ox","q":"地中海性気候は「夏に雨が多く、冬は乾燥する」気候である。","a":false,"why":"逆である。地中海性気候は夏に高温乾燥、雨は冬に降る。だからラベンダーやオリーブは日本の梅雨と夏の多湿が苦手になる。"},{"type":"ox","q":"熱帯雨林の林床出身の植物に耐陰性の高いものが多いのは、原産地で上層の樹木に光がさえぎられているためである。","a":true,"why":"林床は弱い光の環境なので、そこで進化した植物は弱光でも生きられる。これが観葉植物を室内で使える理由である。"},{"type":"ox","q":"シクラメンが初夏に葉を黄変させるのは、必ず根腐れなど不調のサインなので、水を増やして回復させる。","a":false,"why":"地中海生まれのシクラメンは夏に休眠する。黄変は休眠の合図であることが多く、水を増やすとかえって球根が腐る。"},{"type":"ox","q":"落葉樹の植え付けや移植、強い剪定は、葉を落として休眠している時期が適期である。","a":true,"why":"休眠期は代謝が落ち、根が傷んでも水分消費が少ないため負担が小さい。常緑樹は厳寒期を避けて春または秋に行う。"},{"type":"ox","q":"多肉植物の「冬型」は、冬によく生育するタイプなので、夏は水を控えて涼しい場所で休ませる。","a":true,"why":"冬型（メセン類など）は涼しい季節が生育期で、夏が休眠期。休眠中の潅水は腐敗の原因になるため断水気味にする。"},{"type":"ox","q":"よく晴れて風のない夜は、放射冷却によって株元が気温より冷え、霜が降りやすい。","a":true,"why":"地表の熱が空へ逃げるため。だから軒下や樹木の下、不織布のべたがけのように「上をふさぐ」だけで霜害を減らせる。"},{"type":"ox","q":"半耐寒性の植物とは、およそ5〜10℃を下回ると傷むため必ず加温した温室が必要な植物のことである。","a":false,"why":"それは非耐寒性の説明。半耐寒性は凍らなければ越冬でき、軒下や霜よけ程度の保護で足りることが多い。"},{"type":"ox","q":"高温では呼吸が盛んになる一方、およそ30℃を超えると多くの植物で光合成の効率は頭打ちか低下する。","a":true,"why":"稼ぎ（同化）が増えないのに支出（異化）が増えるため、夏に生育が止まり株が消耗する。"},{"type":"ox","q":"夜温が高いままの熱帯夜が続いても、日中に十分な光があれば植物の消耗は起きない。","a":false,"why":"夜は光合成をせず呼吸だけが進む。夜温が下がらないと昼の蓄えが夜に消費され、徒長や花つきの低下を招く。"},{"type":"ox","q":"「半日陰」には、午前だけ日が当たる場所と、終日木漏れ日が差す場所の2つの意味がある。","a":true,"why":"どちらも直射が弱いか短い環境を指す。西日だけが当たる場所は高温乾燥になるため半日陰とは扱わない。"},{"type":"ox","q":"「乾かし気味に管理する」とは、1回に与える水の量を少量にとどめることである。","a":false,"why":"水やりの間隔をあけるという意味。1回に与えるときは鉢底から流れ出るまでたっぷり与えるのが原則である。"},{"type":"ox","q":"日本の土壌は雨が多いため、放置すると酸性に傾きやすい。","a":true,"why":"降雨でカルシウムなどの塩基が流亡するため。だから多くの野菜づくりでは苦土石灰などによる酸度矯正が定番になる。"},{"type":"ox","q":"アジサイは土壌がアルカリ性に傾くほどアルミニウムをよく吸収し、花が青くなる。","a":false,"why":"原因と結果が逆。アルミニウムは酸性土壌で溶け出して吸収され、花色素と結合して青くなる。アルカリ側では赤・ピンクに寄る。"},{"type":"ox","q":"白花のアジサイは、土壌を酸性にしても青色にはならない。","a":true,"why":"白花品種は発色のもとになる色素をもたないため。pHとアルミニウムは色素があってはじめて効く。"},{"type":"ox","q":"F1品種から自家採種したタネをまくと、翌年も親とまったく同じ性質の株が揃って育つ。","a":false,"why":"F1は一代目にだけ雑種強勢と揃いが現れる。次の世代では形質が分離するため揃わない。同じものが欲しければ毎作タネを買う。"},{"type":"ox","q":"種苗法に基づく登録品種は、原則として育成者権者の許諾なしに自家増殖することができない。","a":true,"why":"登録品種は育成者権で保護される。在来種や保護期間の切れた一般品種にはこの制限はかからない。"},{"type":"mc","q":"ラベンダーやローズマリー、オリーブが日本の夏に弱りやすい最大の理由はどれか。","choices":["原産地より日本のほうが冬の寒さが厳しく、冬に根が凍るから","原産地より日本のほうが日照時間が短く、光が不足するから","原産地の地中海沿岸は夏に乾燥するため、高温多湿と長雨で蒸れて根が傷むから"],"a":2,"why":"地中海性気候は夏乾燥・冬雨。日本の梅雨と高温多湿はこれらにとって未経験の環境で、蒸れと過湿が致命傷になる。"},{"type":"mc","q":"山野草や高山植物の夏越しとして最も適切な組み合わせはどれか。","choices":["直射に当てて締めて育て、水を毎日たっぷり与える","室内の暗所に取り込み、断水して休ませる","およそ30〜50%の遮光と風通しを確保し、鉢は地面から離して地温を下げる"],"a":2,"why":"高山出身は涼しく強い光と良い排水に適応している。日本の平地の夏は高温と蒸れが問題なので、遮光と通風、地温対策が要点になる。"},{"type":"mc","q":"冬に観葉植物が傷む原因として、最も典型的なものはどれか。","choices":["冬は光が強すぎて葉焼けを起こす","低温で根の吸水力が落ちているのに、生育期と同じ量の水を与えて根が傷む","冬は肥料が不足するため、追肥を増やす必要がある"],"a":1,"why":"熱帯生まれの観葉植物は低温で活動が鈍る。水の間隔をあけるのが基本で、休眠に近い時期の追肥はかえって根を傷める。"},{"type":"mc","q":"耐寒性の区分について、正しい説明はどれか。","choices":["耐寒性＝凍らなければ越冬できる、半耐寒性＝戸外でそのまま越冬できる","耐寒性＝戸外でそのまま越冬できる、半耐寒性＝霜に当てなければ越冬できる","非耐寒性＝戸外で霜よけをすれば越冬できる"],"a":1,"why":"耐寒性は戸外そのまま、半耐寒性は霜よけ・軒下で保護、非耐寒性はおよそ5〜10℃以上が必要で室内や温室に取り込む。"},{"type":"mc","q":"霜害を防ぐ工夫として、原理の説明が正しいものはどれか。","choices":["軒下に置くと、上方への放射冷却がさえぎられて株元が冷えにくくなる","軒下に置くと、風がよく当たって霜が吹き飛ばされる","軒下に置くと、日中の直射が強まって株が温まる"],"a":0,"why":"霜は晴れた無風の夜の放射冷却で降りる。屋根や不織布は熱の逃げ道をふさぐことで効く。"},{"type":"mc","q":"真夏にトマトの実つきが悪くなる典型的な理由はどれか。","choices":["高温で葉が茂りすぎ、光合成産物が果実に回らないから","およそ35℃を超える高温で花粉の働きが落ち、受粉・受精がうまくいかないから","高温で土が乾き、根が水を吸えなくなるから"],"a":1,"why":"受粉・受精は高温に特に弱い。肥料や水の問題と混同しやすいが、真夏の着果不良はまず温度を疑う。"},{"type":"mc","q":"夏の高温対策として、優先度が最も高い考え方はどれか。","choices":["気温そのものより、遮光やマルチ、鉢の置き方で根の温度（地温）を下げること","肥料を増やして体力をつけさせること","水やりの回数を減らして株を締めること"],"a":0,"why":"根は高温に弱く、コンクリート直置きの鉢は照り返しと熱伝導で内部が高温になる。地温を下げる工夫が最も効く。"},{"type":"mc","q":"「日なた」の目安として最も適切なものはどれか。","choices":["1日およそ1〜2時間の直射がある場所","1日およそ3〜4時間の直射がある場所","1日およそ5〜6時間以上の直射がある場所"],"a":2,"why":"およそ3〜4時間は半日陰の目安。日なたはおよそ5〜6時間以上の直射が入る場所を指す。"},{"type":"mc","q":"「半日陰を好む」植物の置き場所として、最も不適切なものはどれか。","choices":["午後の西日だけが3〜4時間当たる、建物の西側","午前中だけ日が当たる、建物の東側","落葉樹の下で木漏れ日が終日差す場所"],"a":0,"why":"同じ時間でも西日は強く、照り返しの熱と重なって高温乾燥になる。半日陰は「午前の日」か「木漏れ日」を指す。"},{"type":"mc","q":"耐陰性についての説明として正しいものはどれか。","choices":["暗い環境ほど生育がよくなる性質のこと","弱い光の環境に耐えられる性質であり、暗すぎれば徒長し斑も不鮮明になる","直射日光に当てても葉焼けしない性質のこと"],"a":1,"why":"耐陰性はあくまで「耐える」力。光が足りなければ光合成量は減り、間伸びして葉色や斑が悪くなる。"},{"type":"mc","q":"乾燥地や高山出身の植物の用土として、最も重視すべき性質はどれか。","choices":["保水性を高めるため、ピートモスを多く配合する","排水性を高めるため、軽石や鹿沼土などを多く配合する","肥料分を高めるため、有機質を多く配合する"],"a":1,"why":"これらの出身地は水がすぐ抜ける土壌。過湿は根の呼吸を妨げ根腐れを招くため、水はけが最優先になる。"},{"type":"mc","q":"酸性土壌を好む植物の組み合わせとして正しいものはどれか。","choices":["ブルーベリー、ツツジ・シャクナゲ、スギ・ヒノキ","ホウレンソウ、カーネーション、クレマチス","ラベンダー、エンドウ、ホウレンソウ"],"a":0,"why":"ブルーベリーやツツジ科、スギ・ヒノキは酸性を好む。ホウレンソウ、カーネーション、クレマチス、ラベンダーは中性〜弱アルカリを好む。"},{"type":"mc","q":"石灰を過剰に施用したときに起こりやすい生育障害はどれか。","choices":["リン酸が過剰になり、葉が濃緑色になって徒長する","土壌が強い酸性になり、根が溶ける","鉄やマンガンが吸収されにくくなり、葉脈間が黄化するクロロシスが出る"],"a":2,"why":"pHが上がりすぎると微量要素が溶けにくくなる。「酸性はいけない」と機械的に石灰をまくのが典型的な失敗である。"},{"type":"mc","q":"都市の街路樹に求められる性質として、最も重要度が低いものはどれか。","choices":["耐煙性（大気汚染への耐性）","強い剪定の後に芽を吹く萌芽力","花が大きく香りが強いこと"],"a":2,"why":"街路は乾燥・高温・排気ガス・強剪定という過酷な環境。耐煙性、耐乾性、萌芽力、病虫害への強さが優先され、花の美しさは後順位になる。"},{"type":"mc","q":"海岸沿いの植栽に用いる樹種として、耐潮性の観点から最も適切なものはどれか。","choices":["クロマツ、トベラ、シャリンバイ","モミジ、コブシ、ヤマボウシ","ブルーベリー、シャクナゲ、アセビ"],"a":0,"why":"クロマツ、トベラ、シャリンバイ、マサキ、ウバメガシなどは潮風に耐える。耐潮性の低い樹種は葉が褐変して枝先から枯れ込む。"},{"type":"mc","q":"一季咲きのつるバラの剪定について、正しいものはどれか。","choices":["冬に強く切り詰めるほど翌春の花つきがよくなる","花後すみやかに剪定する。翌年の花芽は夏までにつくられるため冬の強剪定は花を失う","花期に関係なく、一年じゅういつ切ってもよい"],"a":1,"why":"一季咲きは前年の夏までに翌春の花芽を形成する。冬の強剪定が有効なのは新梢に咲く四季咲きのタイプである。"}]},{"id":6,"title":"種子・球根・苗の目利き","subtitle":"袋の表示と姿かたちから、ちゃんと育つ資材を選べるようになる","minutes":45,"goals":["種子袋の表示（発芽率・有効期限・薬剤処理）を読み解き、買ってよい種子かを判断できる","種子の寿命・保存条件・加工種子・好光性種子の扱いの違いを理由つきで説明できる","球根と苗を現物の姿から選別し、植え付けまでの管理をお客さんに指示できる"],"sections":[{"heading":"種子袋は品質保証書だ","dialogue":[{"who":"客","text":"去年の余った種をまいたのに、ほとんど芽が出なかったよ。安物だったのかな。"},{"who":"ハナ","text":"袋の裏、見せてもらえますか。……あ、有効期限が去年の秋で切れています。"},{"who":"緑川","text":"種子袋の裏は、法律で決められた品質保証書なんだ。ここを読めるかどうかで、失敗の半分は防げる。"}],"body":"<p>種子小袋の裏面には、<strong>種苗法</strong>にもとづいて表示が義務づけられた項目が並んでいる。これは飾りではなく、その袋の中身がどんな品質かを売り手が保証している欄だ。表示は大きく「何の種か」「どれだけ入っているか」「どのくらい発芽するか」「いつまで有効か」「薬剤を使ったか」に分けて読むとよい。</p><p>とくに重要なのが<strong>発芽率</strong>だ。これは「一定の条件下で発芽試験を行ったとき、供試した種子数のうち発芽した種子数の割合」を指す。畑にまいて出てくる割合（<em>圃場出芽率</em>）ではない点に注意したい。試験は温度・水分・光を整えた理想条件で行うので、実際の畑では必ずこれより低くなる。だから発芽率八十パーセントの種子は、畑では六割前後しか立たないつもりで、まき数に余裕を持たせる。</p><p>発芽率とセットで見るのが<strong>発芽試験月</strong>と<strong>有効期限（または採種年月）</strong>だ。発芽率は「その試験をした時点の数字」であり、時間とともに必ず低下する。試験月が古い袋は、表示の数字より実力が落ちていると考える。有効期限は、正しく保管されていればその発芽率をおおむね維持できる期限の目安である。</p><p>さらに、消毒（薬剤処理）をした種子には<strong>薬剤名と用途</strong>が表示される。表示があれば、その種子は食用にしてはいけないし、扱ったあとは手を洗う。生産地（採種地）の表示は、海外採種が多い日本の種子事情を映すもので、品質の良否そのものを示すわけではない。</p>","why":"表示された発芽率は「理想条件での試験値」であり、時間とともに落ちる数字だから、試験月と有効期限をセットで読まないと実力を見誤る。","keypoints":["種子小袋の表示は種苗法にもとづく義務表示で、品質の保証欄である","発芽率＝試験に供した種子数に対する発芽した種子数の割合（畑での出芽率ではない）","発芽試験月が古いほど、表示の発芽率より実際は低下している","有効期限は適正保管を前提とした発芽率維持の目安","薬剤処理種子は薬剤名・用途が表示され、食用にしてはいけない","表示には種類名・品種名、数量、生産地（採種地）も含まれる"],"table":{"caption":"種子袋の表示項目と読み方","headers":["表示項目","何を意味するか","現場での使いどころ"],"rows":[["種類名・品種名","作物の種類と品種","同じ「トマト」でも品種で草姿・耐病性が違う"],["発芽率","試験条件下で発芽した種子の割合","低いほど、まき数を増やして補う"],["発芽試験月","その発芽率を測った年月","古いほど実力は表示値より下"],["有効期限／採種年月","発芽率を保てる目安の期限","期限切れは間引き前提でまくか買い直す"],["数量","内容量（粒数またはミリリットル・グラム）","必要株数から買う袋数を決める"],["生産地（採種地）","種子を採った国・地域","品質の良否ではなく由来の情報"],["薬剤名・用途","消毒に使った農薬とその目的","食用禁止・手洗い・取り扱い注意の合図"]]},"mnemonic":"発芽率は「理想の教室での点数」。畑という本番では必ず点が下がる、と覚える。"},{"heading":"短命種子と長命種子","dialogue":[{"who":"ハナ","text":"同じ棚に置いていたのに、タマネギだけ発芽が悪いんです。置き方が悪かったんでしょうか。"},{"who":"緑川","text":"置き方の前に、種類の差だ。タマネギやネギはもともと寿命が短い。一年で見切りをつける種子だよ。"},{"who":"ハナ","text":"種にも寿命の長い短いがあるんですね。"}],"body":"<p>種子は生きた器官で、貯蔵中もゆるやかに呼吸している。呼吸は貯蔵養分を減らし、細胞や酵素を傷める活性酸素も生む。だから<strong>呼吸を抑えるほど寿命は延びる</strong>。呼吸速度を決めるのは主に温度と種子の水分で、温度が高いほど、湿度が高いほど、劣化は速く進む。</p><p>そのうえで、種類ごとの生まれつきの差がある。おおまかに、一年程度しかもたない<strong>短命種子</strong>、二〜三年の<strong>常命種子</strong>、四年以上もつ<strong>長命種子</strong>に分かれる。短命種子の代表はネギ・タマネギ・ニラといったネギの仲間、それにニンジン・ミツバ・ラッカセイなど。油分や薄い種皮をもつものが多く、劣化が速い。長命の代表はトマト・ナスなどのナス科と、スイカ・カボチャ・メロンなどのウリ科で、種皮が厚く硬い。アブラナ科やマメ科には比較的長持ちするものが多い。</p><p>保存の三原則は<strong>低温・低湿・密閉</strong>。乾燥剤（シリカゲル）とともに密閉容器に入れ、冷蔵庫の野菜室など低温の場所に置く。古くから「保存温度（度）＋相対湿度（パーセント）が百以下なら良好」という目安が使われる。たとえば五度・湿度四十パーセントなら合計四十五で十分良好、二十五度・湿度八十パーセントなら合計百五で不良、という具合だ。</p><p>注意点は取り出し方。冷たい容器をいきなり開けると結露して種子が吸湿し、かえって寿命を縮める。<strong>常温に戻してから開封する</strong>のが鉄則である。</p>","why":"種子は貯蔵中も呼吸して自らをすり減らすので、温度と湿度を下げて呼吸を抑えることが寿命を延ばす唯一の道だから。","keypoints":["種子は貯蔵中も呼吸しており、高温・高湿ほど劣化が速い","短命種子（約1年）＝ネギ・タマネギ・ニラ・ニンジン・ミツバ・ラッカセイ","長命種子（4年以上）＝トマト・ナスなどナス科、スイカ・カボチャ・メロンなどウリ科","保存の三原則は低温・低湿・密閉。乾燥剤を併用する","「温度＋相対湿度＝100以下」が良好保存の目安","冷蔵庫から出した容器は常温に戻してから開ける（結露防止）"],"table":{"caption":"種子の寿命による分類","headers":["区分","おおよその寿命","代表的な種類"],"rows":[["短命種子","約1年","ネギ、タマネギ、ニラ、ニンジン、ミツバ、ラッカセイ、ゴボウ"],["常命種子","2〜3年","キャベツ、ハクサイ、ダイコン、カブ、レタス、キュウリ、エンドウ、インゲン"],["長命種子","4年以上","トマト、ナス、トウガラシ、スイカ、カボチャ、メロン"]]},"mnemonic":"短命は「ネギ・ニン・ミツバ・ラッカセイ」＝ネ・ニ・ミ・ラで“寝に見らんない（もたない）”種子。"},{"heading":"加工種子と覆土の作法","dialogue":[{"who":"客","text":"この青い粒々、本当に種なの。それとレタスは深くまいたのに芽が出なくてね。"},{"who":"ハナ","text":"青い粒はペレット種子です。レタスのほうは、たぶん覆土が厚すぎたんだと思います。"},{"who":"緑川","text":"加工の中身と、その種が光を好むかどうか。この二つで覆土と水やりが変わるんだ。"}],"body":"<p>種子には、まきやすさや揃いを高める加工がある。<strong>コーティング種子（ペレット種子）</strong>はニンジンやレタスのような微細で不定形な種子を粘土などで包んで球形にしたもので、一粒まきがしやすく間引きが減る。ただし外殻が吸水を妨げるため、<strong>水を切らすと殻が割れず発芽しない</strong>。</p><ul><li><strong>フィルムコート種子</strong>…薄い膜で被覆。形はほぼ元のままで、着色による識別や薬剤付与に使う</li><li><strong>プライミング種子</strong>…発芽直前まで生理的に進めた種子。早く揃って発芽するが寿命は短く、その年に使い切る</li><li><strong>消毒種子</strong>…殺菌剤処理済み。赤や青の着色は「処理済み・食用不可」の合図で、扱ったら手を洗う</li></ul><p>もう一つの分かれ道が光だ。発芽に光を要する<strong>好光性種子</strong>は、貯蔵養分が少なく深い位置から地表に届かないため、「光がある＝地表のごく近く」を確認してから発芽する。大粒の<strong>嫌光性種子</strong>は乾きやすい地表を避け、暗さを合図に発芽する。</p><p>だから覆土が変わる。原則は<strong>種子の直径の二〜三倍</strong>。好光性種子はさらに薄くし、覆土しないか種子が隠れる程度にとどめ、新聞紙掛けや底面給水で乾燥を防ぐ。嫌光性種子はしっかり覆土して光を遮る。ペレット種子も覆土は薄めにし、発芽まで絶対に乾かさない。</p>","why":"加工は「まきやすさ・揃い・消毒」のどれかを買う代わりに水管理や使用期限の制約を負い、覆土の厚さは種子の大きさと光要求で決まるから。","keypoints":["コーティング（ペレット）種子は微細種子を球形化したもの。乾かすと殻が割れず発芽不良になる","フィルムコート種子は薄膜被覆で形はほぼ元のまま。プライミング種子は発芽が早く揃うが寿命が短い","消毒種子の着色は識別のため。食用にせず、作業後は手を洗う","好光性種子＝レタス、シュンギク、セロリ、ミツバ、ニンジン、ペチュニア、プリムラ。覆土はごく薄く","嫌光性種子＝ダイコン、トマト、ナス、カボチャ、スイカ、ネギ、タマネギ、パンジー。しっかり覆土","覆土の一般原則は種子の直径の2〜3倍"],"table":{"caption":"好光性種子と嫌光性種子","headers":["区分","代表例","覆土の考え方"],"rows":[["好光性（光発芽）種子","レタス、シュンギク、セロリ、ミツバ、ニンジン、ペチュニア、キンギョソウ、プリムラ、ベゴニア","覆土なし〜種子が隠れる程度。乾燥防止を必ず併用"],["嫌光性（暗発芽）種子","ダイコン、トマト、ナス、カボチャ、スイカ、キュウリ、ネギ、タマネギ、ニラ、パンジー、ニチニチソウ","種子の直径の2〜3倍を目安にしっかり覆土"]]},"mnemonic":"好光性は「レタス・シュンギク・ミツバ・セロリ」＝サラダの皿に乗る葉もの。光が好き。"},{"heading":"球根は太らせて売る","dialogue":[{"who":"客","text":"去年掘り上げたチューリップ、今年は花が咲かなかった。球根はちゃんと残ってたのに。"},{"who":"ハナ","text":"球根の大きさ、どのくらいでしたか。小指の先くらいなら、まだ花を咲かせる体力がないかもしれません。"},{"who":"緑川","text":"球根は貯金通帳だ。残高が一定額を超えないと、花という高い買い物ができない。"}],"body":"<p>球根は、葉でつくった養分を地下に貯めた<strong>貯蔵器官</strong>である。花芽をつくり、春に一気に咲かせるだけの養分が貯まって初めて開花する。だから球根選びの第一条件は<strong>大きさと充実度</strong>だ。同じ品種なら、大きく、持ったときにずしりと重く、握って硬くしまっているものを選ぶ。軽くてふかふかしたものは中身が減っている。</p><p>規格には<strong>球周</strong>（球の一番太いところの周囲長）や球径が使われる。チューリップやヒヤシンス、グラジオラスは球周表示が一般的で、数字が大きいほど開花の確実性が高い。次に外観をみる。<strong>傷、カビ、へこんだ病斑、変色、腐敗臭</strong>があるものは避ける。基部（底の付け根、ベーサルプレート）が欠けているものは根が出ないので不可だ。皮がやや剥けている程度は品質に影響しない。</p><p>掘り上げは、<strong>地上部が黄変して枯れてから</strong>。葉が緑のうちは光合成で球を太らせている最中で、早く切ったり掘ったりすると翌年の花が消える。花がら摘みを早めに行うのも、種子に養分を回さず球へ回すためだ。</p><p>貯蔵法は種類で二つに分かれる。チューリップ・スイセン・ヒヤシンス・グラジオラスなどは<strong>乾燥貯蔵</strong>で、風通しのよい冷暗所にネットで吊るす。ユリ・ダリア・カンナ・球根ベゴニアなどは乾燥に弱く、おがくずやピートモスをやや湿らせた中に埋める<strong>湿潤貯蔵</strong>にする。</p><p>ふえ方も覚えておきたい。親球のわきにできる小球が<strong>子球（分球）</strong>、ユリの地下茎やグラジオラスの球茎の基部にできる小さな球が<strong>木子</strong>、オニユリやヤマノイモのように葉のつけ根の地上部にできる球芽が<strong>むかご（珠芽）</strong>である。いずれも花が咲く大きさまで数年、畑で育てて太らせる。</p>","why":"球根は貯蔵養分そのものであり、開花に必要な量が貯まって初めて花芽が動くから、大きさ・重さ・充実度がそのまま咲く確率になる。","keypoints":["球根選びは大きく重く硬いものが基本。規格には球周・球径が使われる","傷・カビ・病斑・腐敗、基部（根の出る底部）の欠損があるものは避ける","掘り上げは地上部が黄変してから。葉が緑のうちは球を太らせている","乾燥貯蔵＝チューリップ、スイセン、ヒヤシンス、グラジオラス","湿潤貯蔵＝ユリ、ダリア、カンナ、球根ベゴニア（乾燥に弱い）","子球（分球）、木子（地下にできる小球）、むかご（地上の葉腋にできる球芽）を区別する"],"table":{"caption":"球根の休眠期貯蔵","headers":["貯蔵法","対象","やり方"],"rows":[["乾燥貯蔵","チューリップ、スイセン、ヒヤシンス、グラジオラス、クロッカス","よく乾かし、ネット等に入れ風通しのよい冷暗所に吊るす"],["湿潤貯蔵","ユリ、ダリア、カンナ、球根ベゴニア","おがくず・ピートモス・バーミキュライトをやや湿らせて埋め、乾燥させない"]]},"mnemonic":"湿潤貯蔵は「ユリ・ダリア・カンナ」＝ユ・ダ・カ。“ゆだかに（豊かに）湿らせる”。"},{"heading":"植え時と深さの原則","dialogue":[{"who":"客","text":"球根って、どれも秋に植えればいいんだよね。"},{"who":"ハナ","text":"いえ、グラジオラスやダリアは春植えです。秋に植えたら冬で凍えてしまいます。"},{"who":"緑川","text":"原産地の気候を思えばいい。冬が雨で穏やかな地方の球根は秋植え、冬が厳しい所の球根は春植えだ。"}],"body":"<p>球根は植え付け時期で三つに分けられる。<strong>秋植え球根</strong>は、地中海沿岸のように冬が穏やかで夏が乾く気候に適応したもの。秋に植えて冬に根を張り、低温にあたって花芽が動き、春に咲いて夏は休眠する。チューリップ、スイセン、ヒヤシンス、クロッカス、ムスカリ、アネモネ、ラナンキュラス、ユリなどが該当し、植え付けは秋（おおむね十月〜十一月）。低温に一定期間あたる必要があるので、暖地では早植えを避ける。</p><p><strong>春植え球根</strong>は熱帯・亜熱帯原産が多く、寒さに弱い。グラジオラス、ダリア、カンナ、球根ベゴニア、アマリリス、カラーなどで、霜の心配がなくなる春に植えて夏に咲き、寒冷地では秋に掘り上げて貯蔵する。<strong>夏植え球根</strong>はヒガンバナ（リコリス）、コルチカム、サフラン、ネリネなど、夏の終わりに植えて秋に咲くグループだ。</p><p>植え付けの深さには原則がある。<strong>庭植えは球の高さの二〜三倍の土をかぶせる</strong>。深めに植えると温度変化がゆるやかになり、球が倒れにくく、分球しすぎを防げる。一方<strong>鉢植えは浅めに植える</strong>。鉢は土の量が限られ、深く植えると根を張る空間が足りなくなるためで、球の頭が土に隠れる程度でよい。</p><p>また、アネモネやラナンキュラスのように乾いた球をいきなり水に浸すと吸水障害で腐るものがあり、湿らせた用土に数日置いてゆっくり吸水させてから植える。植え付け間隔は、翌年も掘り上げずに置くなら広めにとる。</p>","why":"球根の植え時は原産地の気候（冬が穏やかか厳しいか）の再現であり、深さは温度の安定と根張りの空間という物理条件で決まるから。","keypoints":["秋植え球根＝チューリップ、スイセン、ヒヤシンス、クロッカス、ムスカリ、ユリ（秋に植え春咲き）","春植え球根＝グラジオラス、ダリア、カンナ、球根ベゴニア、アマリリス（春に植え夏咲き、寒さに弱い）","夏植え球根＝ヒガンバナ、コルチカム、サフラン、ネリネ（夏の終わりに植え秋咲き）","庭植えの深さは球の高さの2〜3倍の覆土が原則","鉢植えは土量が限られるため浅めに植える","秋植え球根は一定期間の低温にあうことで花芽・茎が伸びる"],"table":{"caption":"球根の植え付け時期の目安","headers":["区分","植え付け期","開花期","代表例"],"rows":[["秋植え球根","9〜11月","春","チューリップ、スイセン、ヒヤシンス、クロッカス、ムスカリ、ユリ"],["春植え球根","3〜5月","夏","グラジオラス、ダリア、カンナ、球根ベゴニア、アマリリス"],["夏植え球根","8〜9月","秋","ヒガンバナ、コルチカム、サフラン、ネリネ"]]},"mnemonic":"深さは「二〜三倍、鉢は浅く」。地面は毛布が厚く、鉢は毛布が足りない。"},{"heading":"よい苗はここを見る","dialogue":[{"who":"客","text":"せっかくだから、もう花が咲いてる大きい苗をもらおうかな。得した気がするし。"},{"who":"ハナ","text":"……店長、大きくて咲いている苗のほうがいいんですよね。"},{"who":"緑川","text":"そこが落とし穴だ。売り場で立派な苗と、植えてから伸びる苗は別物なんだよ。"}],"body":"<p>苗にはいくつもの種類がある。種子から育てた<strong>実生苗</strong>、枝を挿してふやした<strong>さし苗（挿し木苗）</strong>、台木に穂木を接いだ<strong>接ぎ木苗</strong>。仕立て方では、ポリポットで根鉢を作った<strong>ポット苗</strong>、セルトレイで小さく育てた<strong>プラグ苗（セル成型苗）</strong>、根に土をつけたまま掘った<strong>根鉢付き苗</strong>、土を落とした<strong>素掘り苗（裸苗）</strong>がある。ポット苗は根鉢が「充実」して崩れないのが良品だが、行きすぎて根が白く鉢の内側をぐるぐる巻いた<strong>根詰まり</strong>状態は、植えても根が外へ出て行きにくく生育が遅れる。</p><p>よい苗の見分け方は、すべて「植えてから伸びる力があるか」という一点に集約できる。<strong>節間が詰まっている</strong>のは十分な光と適温で育った証拠。逆に節間が伸びた<strong>徒長苗</strong>は日照不足や高温・過湿・窒素過多で軟弱に育っており、風や乾燥に弱い。<strong>茎が太く、葉色が濃く厚い</strong>のは養分と光が足りていた印だ。<strong>下葉が黄変していない</strong>ことは、肥料切れや老化、根傷みが起きていない証拠になる。</p><p>野菜苗では<strong>子葉（双葉）が残っている</strong>かどうかが年齢と管理の良否を映す鏡になる。子葉は最初に落ちる葉なので、これが健在なら育苗期間が適正で、肥料切れも根詰まりも起こしていない。<strong>根は白くみずみずしく</strong>、鉢底から少し見える程度がよい。茶色く傷んだ根や、鉢底穴から太い根が長く飛び出したものは避ける。</p><p>そして<strong>つぼみや花が多すぎる苗は避ける</strong>。植え付け直後の株は根を張ることに力を注ぐべきなのに、開花・結実に養分を取られると根張りが遅れ、結局その後の収量や花数が落ちる。加えて、病斑・変色・食害痕・葉裏の虫は、そのまま自分の庭へ病害虫を持ち込むことになる。</p>","why":"売り場で立派に見える苗ほど、養分を花や葉に使い切っていることが多く、植え付け後に必要な根を張る力が残っていないから。","keypoints":["節間が詰まり、茎が太く、葉色が濃く厚い苗を選ぶ（十分な光と適温の証拠）","徒長苗は日照不足・高温・過湿・窒素過多で軟弱に育った苗","下葉が黄変していない、子葉（双葉）が残っているのは適正な育苗の印","根は白くみずみずしいものを。根が回りすぎた根詰まり苗は活着が遅れる","つぼみ・花が多すぎる苗は、定植後に根張りより開花に養分を取られる","病斑・食害痕・葉裏の害虫がある苗は庭に病害虫を持ち込む"],"table":{"caption":"よい苗・悪い苗のチェックポイント","headers":["見る場所","よい苗","避けたい苗"],"rows":[["節間","詰まっていて全体ががっしり","間延びして細長い（徒長）"],["茎","太くまっすぐ","細く軟らかい、曲がっている"],["葉","色が濃く厚い、下葉も健全","薄く黄色い、下葉が黄変・落葉"],["子葉（双葉）","残っている","早くに落ちている"],["根","白くみずみずしく、鉢底に少し見える","茶変、鉢内をぐるぐる巻き（根詰まり）"],["花・つぼみ","着き始め程度","多数開花して株が疲れている"],["病害虫","病斑・食害なし","葉裏に虫、斑点、かじり跡"]]},"mnemonic":"苗選びは「詰まって・太くて・濃くて・双葉あり」。四拍子でリズムよく確認する。"},{"heading":"接ぎ木苗と樹木の苗","dialogue":[{"who":"客","text":"接ぎ木のトマト苗、普通のより倍近い値段だけど、そんなに違うものかね。"},{"who":"緑川","text":"同じ場所で毎年ナス科を作るなら、値段の差は保険料だと思ってください。土の病気を根で受け止めるのは台木ですから。"},{"who":"ハナ","text":"植えるときは、接いだ部分を土に埋めないんですよね。"},{"who":"緑川","text":"そこが肝心。埋めたら保険を自分で解約するようなものだ。"}],"body":"<p><strong>接ぎ木苗</strong>は、根となる<strong>台木</strong>に、収穫したい品種の<strong>穂木</strong>を接いだ苗である。台木には土壌病害（つる割病、青枯病、半身萎凋病、線虫など）に強い種類が使われるので、<strong>連作障害を回避でき、耐病性が高く、吸肥力が強いため生育も旺盛</strong>になる。ウリ科（キュウリ、スイカ、メロン）やナス科（トマト、ナス、ピーマン）で広く使われる。</p><p>最大の注意点が植え付け深さだ。<strong>接ぎ木部（接合部）は必ず地上に出す</strong>。埋めてしまうと、穂木自身から根（自根）が出て土に直接触れ、せっかくの台木の耐病性が働かなくなる。また接合部は組織が未熟で、土中では病原菌の侵入口にもなる。うね立てや土寄せのときにも埋めないよう気をつける。台木から出る芽（台芽）は見つけしだいかき取る。</p><p>花木・果樹の苗にも形態の区別がある。掘り上げた根鉢を麻布やこもで巻いた<strong>根巻き苗</strong>、鉢で育てた<strong>ポット苗（コンテナ苗）</strong>、根の土を落とした<strong>裸苗（素掘り苗）</strong>だ。ポット苗は根鉢が保たれているため植え付け適期の幅が広い。裸苗・根巻き苗は根が乾くと致命的なので、落葉樹なら落葉して休眠している十一月〜三月、常緑樹なら生育が動き出す春（三〜四月）や梅雨どきが適期になる。</p><p>果樹では<strong>受粉樹</strong>の要否を必ず確認する。ニホンナシ、リンゴ、オウトウ、スモモ、ウメの多くの品種、クリ、ラビットアイ系ブルーベリーなどは<strong>自家不和合性</strong>で、自分の花粉では実らない。開花期の合う別品種を近くに植える必要がある。一方ブドウ、モモ、カンキツ、イチジクなどは一本で結実しやすい。</p>","why":"接ぎ木苗の価値は台木の根が持つ耐病性にあり、接合部を埋めて穂木から自根が出れば、その根が土壌病原菌に直接さらされて効果が消えるから。","keypoints":["接ぎ木苗＝耐病性の台木＋収穫したい穂木。連作障害回避・耐病性・生育旺盛が目的","接ぎ木部は必ず地上に出す。埋めると穂木から自根が出て台木の効果が失われる","台木から出る台芽はかき取る","根巻き苗・裸苗は根の乾燥に弱く、落葉樹は休眠期（11〜3月）が適期","ポット苗は根鉢が崩れないため植え付け適期の幅が広い","ナシ・リンゴ・オウトウ・スモモ・クリなどは自家不和合性で受粉樹が必要"],"table":{"caption":"果樹の受粉樹の要否","headers":["区分","代表例","植え方"],"rows":[["受粉樹が必要（自家不和合性が多い）","ニホンナシ、リンゴ、オウトウ、スモモ、クリ、ラビットアイ系ブルーベリー","開花期の合う別品種を近くに植える"],["1本でも実りやすい","ブドウ、モモ、カンキツ、イチジク、カキ（品種による）","単植可。ただし品種特性は要確認"]]}},{"heading":"買ってから植えるまで","dialogue":[{"who":"客","text":"苗は買ったけど、畑の準備が週末までできないんだ。それまで玄関に置いとけばいいかな。"},{"who":"ハナ","text":"暗い玄関だと徒長してしまいます。明るい場所で、水を切らさないほうが安全です。"},{"who":"緑川","text":"それと、温室育ちの苗をいきなり寒風にさらすのも禁物だ。段階を踏んで外の空気に慣らす。"}],"body":"<p>苗は買った瞬間から環境が激変する。温室やハウスの弱い光・高い湿度・安定した温度で育った苗を、いきなり屋外の強い日ざしや寒風にさらすと、葉焼け・しおれ・生育停止を起こす。そこで数日から一週間かけて、日陰から半日陰、そして日なたへと少しずつ外気と直射光に慣らす。これを<strong>順化（ハードニング）</strong>という。順化した苗は表皮のクチクラが発達し、根が充実し、細胞内の浸透圧が高まって、乾燥にも低温にも強くなる。</p><p>低温を意図的にあてて丈夫にすることを<strong>寒じめ（寒締め）</strong>という。低温にさらされた植物は細胞内に糖などを蓄えて凍りにくくするため、耐寒性が上がる。ホウレンソウなどでは食味が濃くなる効果も知られる。ただし順化なしの急な低温は障害になるだけなので、段階を踏むことが前提だ。</p><p>すぐに植えられないときの管理は種類別に考える。<strong>ポット苗</strong>は、風の当たらない明るい屋外に置き、鉢土を乾かさない。暗所に置くと徒長して苗質が落ちる。長引くなら一回り大きな鉢に<strong>鉢増し</strong>して根詰まりを避ける。<strong>裸苗・根巻き苗</strong>は根の乾燥が命取りなので、庭の隅に浅く斜めに埋めて根を土で覆う<strong>仮植え</strong>をする。<strong>球根</strong>は湿気と高温を避け、風通しのよい冷暗所で保管し、袋のまま蒸らさない。</p><p>植え付け直前には、ポット苗の根鉢に水をたっぷり含ませておく。乾いた根鉢のまま植えると、周囲の土に水を吸われて活着が遅れるからだ。</p>","why":"温室育ちの苗は組織が軟らかく蒸散を抑える能力が低いため、段階的に外気に慣らして体をつくり替えないと、屋外の光と乾燥に耐えられないから。","keypoints":["順化（ハードニング）は数日〜1週間かけて日陰から日なたへ段階的に慣らす作業","順化するとクチクラが発達し根が充実して、乾燥・低温に強くなる","寒じめは低温にあてて糖を蓄えさせ、耐寒性と食味を高める","すぐ植えられないポット苗は明るい屋外で乾かさない。暗所は徒長を招く","裸苗・根巻き苗は根の乾燥に弱いので仮植えして根を土で覆う","植え付け直前に根鉢へたっぷり吸水させると活着が早い"]}],"quiz":[{"type":"ox","q":"種子袋に表示された発芽率は、その種子を畑にまいたときに出芽する割合を示している。","a":false,"why":"発芽率は一定条件下の発芽試験で、供試した種子数に対して発芽した種子数の割合。理想条件の値なので、畑での出芽率はこれより低くなる。"},{"type":"ox","q":"種子小袋の表示は種苗法にもとづくもので、種類名・品種名、数量、発芽率、生産地などが含まれる。","a":true,"why":"指定種苗の表示事項として法で定められている。品質保証の欄として読む。"},{"type":"ox","q":"発芽試験月が古い袋でも、表示されている発芽率はそのまま維持されている。","a":false,"why":"発芽率は試験時点の数値で、時間とともに必ず低下する。試験月が古いほど実力は表示値を下回る。"},{"type":"ox","q":"ネギ、タマネギ、ニンジン、ミツバは寿命の短い種子で、おおむね1年で更新するのが安全である。","a":true,"why":"これらは代表的な短命種子。買い置きせず毎年新しい種子を使うのが基本。"},{"type":"ox","q":"トマトやナス、スイカ、カボチャの種子は寿命が短く、翌年には使えなくなる。","a":false,"why":"ナス科・ウリ科のこれらは種皮が厚く長命種子に属し、適正に保存すれば4年以上もつ。"},{"type":"ox","q":"種子の保存では、保存温度（℃）と相対湿度（％）の合計が100以下であることが良好さの目安になる。","a":true,"why":"呼吸を抑えるほど寿命が延びるため、温度と湿度の合計で保存条件の良否を判断する古典的な目安が使われる。"},{"type":"ox","q":"冷蔵庫で保存していた種子の容器は、冷たいうちにすぐ開けて種子を取り出すのがよい。","a":false,"why":"冷たいまま開けると結露して種子が吸湿し、劣化を早める。常温に戻してから開封する。"},{"type":"ox","q":"コーティング（ペレット）種子は、まいたあとに水を切らすと外殻が割れず発芽不良になりやすい。","a":true,"why":"外殻が吸水を妨げるため、十分な水分がないと殻が崩れず発芽できない。覆土は薄く、乾燥させないことが条件。"},{"type":"ox","q":"プライミング種子は発芽の準備を進めてあるため、通常の種子より長期間保存できる。","a":false,"why":"逆である。生理的に動かしてあるぶん寿命は短く、購入したシーズンに使い切るのが原則。"},{"type":"ox","q":"消毒種子が赤や青に着色されているのは、薬剤処理済みで食用にできないことを識別させるためである。","a":true,"why":"着色は識別のための表示。食用や飼料に用いず、扱ったあとは手を洗う。"},{"type":"ox","q":"レタスやシュンギクは嫌光性種子なので、しっかり覆土しないと発芽しない。","a":false,"why":"レタス・シュンギクは好光性（光発芽）種子。覆土はごく薄くするか、しないで軽く押さえる。"},{"type":"ox","q":"覆土の一般的な目安は、種子の直径の2〜3倍である。","a":true,"why":"深すぎれば貯蔵養分が尽き、浅すぎれば乾く。直径の2〜3倍が一般原則で、好光性種子はさらに薄くする。"},{"type":"ox","q":"球根の掘り上げは、花が終わったらすぐ、葉が緑のうちに行うのがよい。","a":false,"why":"葉が緑のうちは光合成で球を太らせている最中。地上部が黄変して枯れてから掘り上げる。"},{"type":"ox","q":"ユリやダリア、カンナの球根は乾燥に弱いため、湿らせたおがくずなどに埋める湿潤貯蔵にする。","a":true,"why":"鱗片や塊根がむき出しで乾きやすいため、乾燥貯蔵にすると枯死する。"},{"type":"ox","q":"球根の庭植えでは、球の高さの2〜3倍の土をかぶせるのが原則である。","a":true,"why":"深めに植えると地温変化がゆるやかになり、倒伏や過度の分球を防げる。ただし鉢植えは土量が限られるので浅めにする。"},{"type":"ox","q":"接ぎ木苗は、接ぎ木部を土に埋めて植えると株が安定し、台木の効果も高まる。","a":false,"why":"埋めると穂木から自根が出て土壌病原菌に直接さらされ、台木の耐病性が働かなくなる。接合部は必ず地上に出す。"},{"type":"mc","q":"種子袋の「発芽率」の定義として正しいものはどれか。","choices":["袋に入っている種子のうち、生きている種子の重量割合","一定条件下の発芽試験で、供試した種子数に対して発芽した種子数の割合","畑にまいたときに実際に出芽した株数の割合"],"a":1,"why":"発芽率は試験条件下での粒数ベースの割合。畑での出芽率（圃場出芽率）とは別物である。"},{"type":"mc","q":"種子小袋の表示事項として、通常含まれないものはどれか。","choices":["栽培に必要な肥料の銘柄","発芽率と発芽試験月","薬剤処理をした場合の薬剤名と用途"],"a":0,"why":"肥料の銘柄は表示義務事項ではない。種類名・品種名、数量、生産地、発芽率、有効期限、薬剤名などが表示される。"},{"type":"mc","q":"短命種子ばかりを並べた組み合わせはどれか。","choices":["トマト、ナス、スイカ","キャベツ、ダイコン、キュウリ","ネギ、ニンジン、ラッカセイ"],"a":2,"why":"ネギ類・ニンジン・ミツバ・ラッカセイは短命種子。トマトやスイカは長命、キャベツやダイコンは常命に属する。"},{"type":"mc","q":"微細で不定形な種子を粘土などで包み、球形にして一粒まきをしやすくした種子はどれか。","choices":["プライミング種子","コーティング（ペレット）種子","フィルムコート種子"],"a":1,"why":"ペレット種子はニンジンやレタスなどの微細種子を球形化したもの。フィルムコートは薄膜被覆で形はほぼ元のまま。"},{"type":"mc","q":"プライミング種子の特徴として正しいものはどれか。","choices":["外殻が厚く、乾燥に強いので長期保存に向く","光を遮る被膜があるため嫌光性種子だけに使われる","発芽が早く揃うが、寿命が短いので早く使い切る"],"a":2,"why":"発芽直前まで生理的に進めてある種子で、立ち上がりがよい反面、貯蔵性は落ちる。"},{"type":"mc","q":"好光性種子だけを並べた組み合わせはどれか。","choices":["ダイコン、ネギ、トマト","カボチャ、スイカ、タマネギ","レタス、シュンギク、セロリ"],"a":2,"why":"レタス・シュンギク・セロリ・ミツバ・ニンジンは好光性。ダイコン、ネギ類、ウリ科の大粒種子は嫌光性である。"},{"type":"mc","q":"微細な種子に好光性のものが多い理由として最も適切なのはどれか。","choices":["種皮が薄く、光がないと水を吸えないから","貯蔵養分が少なく、地表近くからでないと出芽しきれないから","光が当たると休眠が深まり、乾燥から守られるから"],"a":1,"why":"光は「地表に近い」という信号。養分の少ない小さな種子は、浅い位置でしか自力で地上に届かない。"},{"type":"mc","q":"球根選びの基準として最も適切なものはどれか。","choices":["軽くて持ちやすく、皮がまったく剥けていないもの","小さくても芽がすでに長く伸びているもの","同じ品種なら、大きく重く、握って硬くしまっているもの"],"a":2,"why":"球根は貯蔵養分そのもの。大きく重く充実したものほど開花が確実。皮の多少の剥けは品質に影響しない。"},{"type":"mc","q":"乾燥貯蔵が適する球根の組み合わせはどれか。","choices":["ユリ、ダリア、カンナ","チューリップ、ヒヤシンス、グラジオラス","球根ベゴニア、カンナ、ユリ"],"a":1,"why":"チューリップ、スイセン、ヒヤシンス、グラジオラスは乾燥貯蔵。ユリ・ダリア・カンナ・球根ベゴニアは乾燥に弱く湿潤貯蔵にする。"},{"type":"mc","q":"オニユリなどで、葉のつけ根（地上部）にできる小さな球芽を何というか。","choices":["むかご（珠芽）","木子","子球"],"a":0,"why":"地上の葉腋にできるのがむかご。地下茎や球茎の基部にできる小球が木子、親球のわきにできるのが子球（分球）。"},{"type":"mc","q":"春植え球根の組み合わせとして正しいものはどれか。","choices":["チューリップ、スイセン、クロッカス","ヒガンバナ、コルチカム、サフラン","グラジオラス、ダリア、カンナ"],"a":2,"why":"グラジオラス・ダリア・カンナは寒さに弱い春植え球根で夏に咲く。チューリップ類は秋植え、ヒガンバナ類は夏植えである。"},{"type":"mc","q":"苗の徒長を招く原因として当てはまらないものはどれか。","choices":["十分な日照と適度な低温","日照不足と高温・過湿","窒素肥料の効かせすぎ"],"a":0,"why":"徒長は日照不足、高温、過湿、窒素過多で起こる。十分な光と適度な低温は節間の詰まったがっしりした苗をつくる。"},{"type":"mc","q":"野菜のポット苗を選ぶとき、良品の目安として適切でないものはどれか。","choices":["子葉（双葉）が残っている","つぼみや花がたくさんついて咲きそろっている","根が白く、鉢底から少し見える程度"],"a":1,"why":"花や実に養分を取られると定植後の根張りが遅れる。開花しすぎた苗より、着き始めの苗のほうがその後伸びる。"},{"type":"mc","q":"接ぎ木苗を使う主な目的として最も適切なものはどれか。","choices":["台木の耐病性を利用して土壌病害・連作障害を避けるため","実の糖度を必ず上げるため","花芽の分化を早めて開花を促すため"],"a":0,"why":"台木に土壌病害に強い種類を使うことで連作障害を回避し、吸肥力の強さから生育も旺盛になる。"},{"type":"mc","q":"受粉樹が必要になりやすい果樹の組み合わせはどれか。","choices":["ニホンナシ、リンゴ、オウトウ","ブドウ、モモ、イチジク","カンキツ、イチジク、ブドウ"],"a":0,"why":"ナシ・リンゴ・オウトウ・スモモ・クリなどは自家不和合性が強く、開花期の合う別品種を近くに植える必要がある。"},{"type":"mc","q":"温室育ちの苗を屋外に定植する前に行う「順化」の説明として正しいものはどれか。","choices":["定植直前に高温多湿の場所に置き、細胞を軟らかくして根を伸ばしやすくする","数日〜1週間かけて段階的に外気と直射光に慣らし、乾燥・低温に耐える体にする","一晩だけ強い直射日光に当てて葉を厚くする"],"a":1,"why":"急な環境変化は葉焼けやしおれを招く。段階的に慣らすことでクチクラが発達し、根も充実して活着がよくなる。"}]},{"id":7,"title":"播種・育苗・定植","subtitle":"まき方から苗づくり、植え付けまでを筋道立てて判断できる","minutes":45,"goals":["直まきと移植栽培を、植物の根の形から選び分けられる","覆土・水やり・温度・光を「発芽の理屈」から説明できる","間引き・鉢上げ・順化・定植の適期と手順を判断できる"],"sections":[{"heading":"直まきか、苗を作るか","dialogue":[{"who":"客","text":"ニンジンを育苗箱にまいて、大きくなってからプランターに植え替えたんです。そうしたら根が二股、三股でぐにゃぐにゃ。土が悪かったんでしょうか。"},{"who":"ハナ","text":"土……ではなさそうですね。でも、なぜ植え替えただけで根が割れるんでしょう。"},{"who":"緑川","text":"ニンジンは直根性。あの太い根そのものが主根で、先端の生長点を一度でも傷めると、代わりに脇の根が太って股割れになる。植え替えた時点で勝負が決まっていたんです。"}],"body":"<p>種まきには、育てる場所に直接まく<strong>直まき（直播）</strong>と、まき床で苗を育ててから植える<strong>移植栽培</strong>の二つがある。どちらを選ぶかは好みではなく、その植物の<strong>根の形</strong>で決まる。</p><p>根には大きく二型ある。太い主根がまっすぐ下へ伸びる<strong>直根性</strong>と、細い根が四方に広がる<strong>ひげ根型・分枝根型</strong>だ。直根性の植物は主根の先端に生長点があり、ここを切られたり折られたりすると二度と元通りには伸びない。ダイコン・ニンジン・ゴボウなら根が股割れ・曲がりを起こし、スイートピーやルピナスは生育が止まったまま立ち直らない。つまり<strong>直根性＝原則、直まき</strong>である。</p><p>代表的な移植嫌いは、野菜ではダイコン・ニンジン・ゴボウ・ホウレンソウ・カブ、草花ではスイートピー・ルピナス・ポピー（ヒナゲシ）・ハナビシソウ・ナスタチウム・ニゲラなど。逆にキャベツ・ハクサイ・レタス・トマト・マリーゴールド・サルビアなどは細根が多く、移植してもすぐ活着する。</p><p>移植栽培にわざわざ手間をかける理由もはっきりしている。狭い場所に集めれば加温・保温・水やりを一括で管理でき、悪天候や害虫から守れる。畑では前作が終わる前から苗を育てられるので回転が上がり、種も無駄にならない。何より、良い苗だけを選んで植えられる。</p><p>どうしても移植嫌いの植物を苗で育てたいときは、ポリポットやセルトレイ、紙製ポットに直接まき、<strong>根鉢を崩さず、若いうちに</strong>植える。それが唯一の逃げ道だ。</p>","why":"直根性の植物は主根の先端の生長点が失われると回復しないため、根を動かす移植そのものが致命傷になる。","keypoints":["直根性の植物は移植を嫌う。原則は直まき","移植を嫌う野菜：ダイコン、ニンジン、ゴボウ、ホウレンソウ、カブ","移植を嫌う草花：スイートピー、ルピナス、ポピー（ヒナゲシ）、ハナビシソウ、ナスタチウム","移植栽培の利点は、温度・水・病害虫の管理を集中でき、良い苗を選べること","やむを得ず苗にするときはポットやセルトレイに直まきし、根鉢を崩さず若苗で植える"],"table":{"caption":"根の形と播種方法の選び分け","headers":["根の型","性質","代表的な植物","播種方法"],"rows":[["直根性（移植を嫌う）","太い主根が下へ伸び、先端を傷めると回復しない","ダイコン、ニンジン、ゴボウ、ホウレンソウ、カブ","直まき。苗にするならポット・セルトレイに直まき"],["直根性の草花","根が傷むと生育が止まる","スイートピー、ルピナス、ポピー、ハナビシソウ、ナスタチウム、ニゲラ","直まき、または若苗で根鉢を崩さず定植"],["分枝根・ひげ根型","細根が多く、切れても再生しやすい","キャベツ、ハクサイ、レタス、トマト、ナス、ネギ、サルビア、マリーゴールド","育苗して移植が有利"]]},"mnemonic":"移植嫌いは「ダイ・ニン・ゴボウにホウレンソウ、スイートピーとルピナス、ポピー・ハナビシ・ナスタチウム」"},{"heading":"ばらまき・すじまき・点まき","dialogue":[{"who":"ハナ","text":"種まきって、要は土にまけばいいんですよね。まき方に名前まで付いているのはなぜですか。"},{"who":"緑川","text":"その後の作業がまったく変わるからです。まく瞬間に、間引きのしやすさも、追肥のしやすさも、収穫量も決まってしまう。"},{"who":"客","text":"私はいつも適当にパラパラと……。だから間引きが大仕事になるんですね。"}],"body":"<p>まき方は三つ。<strong>ばらまき（散播）</strong>・<strong>すじまき（条播）</strong>・<strong>点まき（点播）</strong>だ。</p><p><strong>ばらまき</strong>は、育苗箱や平鉢の全面に均一にまく方法。ペチュニアのような微細種子や、小さな苗を大量に取りたいときに使う。指先やまき溝を使わず広くまけるが、どうしても密度がばらつき、<strong>厚まきになりやすい</strong>。厚まきは葉が重なって光を奪い合い、風が通らず、徒長と苗立枯病を同時に呼び込む。ばらまきの成否は「薄くまけるか」に尽きる。</p><p><strong>すじまき</strong>は、板の縁などでまき溝を切り、線状にまく方法。列が決まっているので<strong>間引き・除草・追肥・土寄せがしやすく</strong>、発芽もそろって見える。ホウレンソウ、コマツナ、ニンジン、ミズナなど葉物の定番で、育苗箱の中でもすじまきにすると管理が格段に楽になる。</p><p><strong>点まき</strong>は、決まった間隔に数粒ずつまとめてまく方法。エダマメ、インゲン、トウモロコシ、カボチャ、ダイコンのような<strong>大粒種子や株間の決まった作物</strong>に向く。一か所に数粒まくのは、発芽不良への保険であると同時に、幼苗どうしを適度に競わせて初期生育をそろえるためでもある。</p><p>どのまき方でも、まき終えたら<strong>覆土して軽く押さえる（鎮圧）</strong>。種子と土を密着させ、毛管水が種子に届くようにするためだ。押さえが足りないと、土の中に空洞ができて種子が乾き、発芽がばらつく。</p>","why":"まき方の違いは種子の配置の違いであり、配置がその後の光・風・作業性、つまり苗の質を決めるから。","keypoints":["ばらまき（散播）＝微細種子・大量育苗向き。厚まきによる徒長と立枯れに注意","すじまき（条播）＝間引き・除草・追肥・土寄せがしやすい。葉物の定番","点まき（点播）＝大粒種子や株間の決まった作物向き。数粒まくのは発芽不良の保険","播種後は軽く鎮圧して種子と土を密着させ、毛管水を届ける","厚まきは光と風を奪い、徒長・苗立枯病の直接原因になる"],"table":{"caption":"三つのまき方の比較","headers":["まき方","向く種子・作物","利点","注意点"],"rows":[["ばらまき（散播）","微細種子、ペチュニア、ベゴニア、ベビーリーフ","広い面に一度にまける。苗を大量に取れる","厚まきになりやすく徒長・立枯れを招く。間引きが手間"],["すじまき（条播）","ホウレンソウ、コマツナ、ニンジン、ミズナ","間引き・除草・追肥・土寄せがしやすい。生育がそろう","溝の深さを一定にしないと発芽がばらつく"],["点まき（点播）","エダマメ、インゲン、トウモロコシ、カボチャ、ダイコン","株間を最初から決められる。間引きが少なくて済む","1か所1粒だと欠株になる。数粒まいて後で間引く"]]}},{"heading":"まき床と用土・容器","dialogue":[{"who":"客","text":"去年プランターで使った土が残っていたので、それに種をまいたら、芽は出たのに次々パタッと倒れて。"},{"who":"ハナ","text":"倒れた株元が、細くくびれて茶色くなっていませんでしたか。"},{"who":"緑川","text":"苗立枯病ですね。使い回しの土には病原菌が残っている。それに、肥料分が残った土は種子にとって毒にもなる。まき床の用土は『清潔で、やせている』ことが条件です。"}],"body":"<p>播種用土に求められる条件は三つ。<strong>清潔であること、肥料分が少ないこと、水はけと水もちが両立していること</strong>である。</p><p><strong>なぜ清潔か。</strong> 幼苗はまだ抵抗力がない。土壌中のピシウムやリゾクトニアといった菌が原因の<strong>苗立枯病</strong>にかかると、株元がくびれて一晩で倒れ、しかも隣へ次々と広がる。一度使った培養土には菌も害虫の卵も残っているため、播種には使わない。新しい市販の種まき用培養土か、バーミキュライト・ピートモス・赤玉土小粒・鹿沼土細粒などを使う。</p><p><strong>なぜ肥料分が少ないほうがよいか。</strong> 種子は発芽に必要なエネルギーを胚乳や子葉にすでに蓄えている。外からの肥料はいらない。むしろ土の肥料濃度が高いと浸透圧の関係で種子が水を吸えず（<strong>肥料焼け</strong>）、発芽率が落ちる。発芽してもチッ素が効きすぎて徒長する。肥料が要るのは、鉢上げして根が伸び出してからだ。</p><p>容器はいくつもある。<strong>育苗箱（平箱）</strong>は大量にばらまき・すじまきするとき。<strong>セルトレイ</strong>は1穴1株で根鉢が崩れず、移植を嫌う植物にも使えるが、土量が少ないので乾きやすく、置きすぎると老化苗になる。<strong>ポリポット</strong>は鉢上げ後の定位置。<strong>ピートバン</strong>は圧縮したピートモスの板で、水を吸わせて膨らませてから微細種子をまくのに向く。紙製ポットは根鉢ごと植えられる。</p>","why":"種子は自前の養分で発芽するので肥料は不要どころか害になり、無防備な幼苗にとって最大の敵は土中の病原菌だから。","keypoints":["播種用土の条件は「清潔・肥料分が少ない・水はけと水もちの両立」","使い回しの土は苗立枯病（ピシウム、リゾクトニア）の原因になるので使わない","肥料分が多いと浸透圧で種子が水を吸えず、肥料焼けで発芽不良になる","肥料が必要になるのは鉢上げ以降","セルトレイは根鉢が崩れず移植嫌いにも使えるが、乾きやすく老化しやすい","ピートバンは微細種子のばらまきに向く"],"table":{"caption":"育苗容器と資材の使い分け","headers":["容器・資材","特徴","向く場面","注意点"],"rows":[["育苗箱（平箱）","面積が広く一度に大量にまける","ばらまき・すじまきで苗を多く取る","混み合うと徒長。早めに鉢上げする"],["セルトレイ","1穴1株。根鉢が崩れない","移植を嫌う植物、そろった苗を計画的に作る","用土が少なく乾きやすい。置きすぎると老化苗"],["ポリポット","根鉢が作れ、そのまま定植できる","鉢上げ後の育苗、大粒種子の直まき","根が回ったら早めに定植する"],["ピートバン","圧縮ピートモス。吸水させて使う","ペチュニアなど微細種子のばらまき","肥料分がないので発芽後は早く鉢上げ"],["紙製ポット・ジフィーポット","容器ごと土に植えられる","移植を嫌う植物の育苗","植えるときポットの縁を地上に出さない（乾く）"]]}},{"heading":"覆土の厚さと、光の要る種・要らない種","dialogue":[{"who":"ハナ","text":"ペチュニアの種、粉みたいに細かいですね。これ、どのくらい土をかけるんですか。"},{"who":"緑川","text":"かけません。ペチュニアは光がないと発芽しない好光性種子です。"},{"who":"ハナ","text":"土をかけないと乾いてしまいませんか。"},{"who":"緑川","text":"そこが腕の見せどころ。だから底面給水と新聞紙が要るんです。覆土を省くかわりに、水の管理で払う。"}],"body":"<p>覆土には四つの役目がある。乾燥を防ぐ、光を遮る、種子を固定する、伸びた根が土をつかめるようにする。厚さの目安は<strong>種子の直径の2〜3倍</strong>。大粒種子は厚く、小粒種子は薄く、という当たり前の話が、この一言に集約されている。</p><p>ここに<strong>光</strong>の要素が加わる。発芽に光を必要とする種子を<strong>好光性種子（光発芽種子）</strong>、逆に光があると発芽が抑えられる種子を<strong>嫌光性種子（暗発芽種子）</strong>という。好光性種子は<strong>覆土しないか、ごく薄く</strong>。嫌光性種子は<strong>しっかり覆土して光を遮る</strong>。</p><p>なぜこんな仕組みがあるのか。好光性種子はおおむね小さく、蓄えた養分がわずかしかない。深く埋まれば地上に出る前に力尽きる。だから「光が届く＝地表のすぐ近くにいる」という信号を受け取ったときだけ発芽する、という安全装置を持っている。逆に大粒の嫌光性種子は、深い位置で発芽したほうが乾燥にも風にも強い。</p><p>好光性の代表は、ペチュニア、ベゴニア、キンギョソウ、プリムラ、トルコギキョウ、シネラリア、インパチェンス、ロベリア、カンパニュラ、そして野菜ではレタス、シュンギク、ニンジン、セロリ、ミツバ。嫌光性の代表は、パンジー、ビオラ、ケイトウ、シクラメン、ニゲラ、デルフィニウム、野菜ではトマト、ナス、ダイコン、ネギ、カボチャ、スイカ。</p><p>微細種子は指ではつまめない。乾いた砂と混ぜてまく、二つ折りにした紙から落とす、といった工夫で薄くばらまく。</p>","why":"小さな種子は蓄えが乏しく深い場所からは地上に出られないため、光を「浅い場所にいる証拠」として発芽の合図に使っているから。","keypoints":["覆土の厚さは種子の直径の2〜3倍が目安","好光性種子（光発芽種子）は覆土しないか、ごく薄く","嫌光性種子（暗発芽種子）はしっかり覆土して光を遮る","好光性：ペチュニア、ベゴニア、キンギョソウ、プリムラ、トルコギキョウ、シネラリア、レタス、シュンギク、ニンジン","嫌光性：パンジー、ビオラ、ケイトウ、シクラメン、ニゲラ、トマト、ナス、ダイコン、ネギ","覆土しない場合は乾きやすいので、底面給水と新聞紙・不織布で補う"],"table":{"caption":"光と覆土の関係","headers":["区分","覆土","代表的な種子","理由"],"rows":[["好光性種子（光発芽種子）","しない、またはごく薄く","ペチュニア、ベゴニア、キンギョソウ、プリムラ、トルコギキョウ、シネラリア、レタス、シュンギク、ニンジン","種子が小さく養分が少ない。浅い位置でしか地上に出られない"],["嫌光性種子（暗発芽種子）","種子の直径の2〜3倍しっかりと","パンジー、ビオラ、ケイトウ、シクラメン、ニゲラ、トマト、ナス、ダイコン、ネギ、カボチャ","大粒で養分があり、深い位置のほうが乾燥に耐えられる"],["中間（光の影響が小さい）","直径の2〜3倍を標準に","多くの一般的な野菜・草花","水分と温度を優先して管理する"]]},"mnemonic":"好光性は「ペチュニア・ベゴニア・キンギョソウ、レタス・シュンギク・ニンジンは、光が好きだから土かけない」"},{"heading":"播種後の水やりと発芽の環境","dialogue":[{"who":"客","text":"まいた後にジョウロで水をやったら、種が全部すみに寄ってしまって。"},{"who":"ハナ","text":"ハス口、下に向けていませんでしたか。"},{"who":"緑川","text":"上向きにすると、水が一度放物線を描いてから静かに落ちる。勢いが消えるんです。微細種子ならそもそも上からかけない。底から吸わせます。"}],"body":"<p>発芽に必要なのは<strong>水・適温・酸素</strong>の三つ（種類により光が加わる）。播種後の管理は、この三つを切らさない作業だと考えるとよい。</p><p><strong>底面給水（腰水）</strong>は、水を張ったトレイに容器を浸け、鉢底から毛管現象で吸わせる方法。上から水をかけないので<strong>種子や覆土が流れず、表土が固まらず、用土全体が均一に湿る</strong>。覆土しない微細種子では事実上必須である。ただし浸けっぱなしは酸素不足と塩類の集積を招くので、用土の表面が湿ったら水から上げる。</p><p>上から水をやるときは<strong>ジョウロのハス口を上向き</strong>にする。水が一度上へ放物線を描いてから落ちるため、勢いが弱まって種子が動かない。下向きだと水圧が用土に直撃する。</p><p>乾燥防止には<strong>新聞紙や不織布</strong>をかける。ただし<strong>発芽が始まったら直ちに外す</strong>。1日の遅れがそのまま徒長になる。</p><p>温度も決定的だ。<strong>発芽適温と生育適温は別物</strong>で、多くの植物では発芽適温のほうが高めに設定されている。トマトは25〜30℃で発芽するが、生育は昼20〜25℃・夜10〜15℃を好む。逆にレタスやシュンギクは高温で休眠に入り、25℃を超えると発芽がそろわない。低温期は<strong>電熱マット、育苗器、トンネル、フレーム</strong>で保温する。温度が低いほど発芽日数が延び、その間に種子が腐る危険が増す。</p>","why":"発芽は水・温度・酸素がそろって初めて始まる生理反応であり、そのうち一つでも欠けると種子は動かないまま腐敗へ向かうから。","keypoints":["発芽の三条件は水・適温・酸素。種類により光が加わる","底面給水（腰水）は種子や覆土を流さず均一に湿らせる。微細種子には必須","腰水の浸けっぱなしは酸素不足と塩類集積を招く","ジョウロのハス口は上向き。水勢を弱めて種子を動かさないため","新聞紙・不織布は乾燥防止用。発芽が始まったら直ちに外す","発芽適温と生育適温は一致しない。レタス・シュンギクは高温で休眠する"],"table":{"caption":"発芽適温と生育適温の違い（目安）","headers":["植物","発芽適温","生育適温の傾向","ポイント"],"rows":[["トマト・ピーマン","25〜30℃","昼20〜25℃／夜10〜15℃","発芽には加温が要る。発芽後は下げないと徒長する"],["キュウリ・カボチャ・スイカ","25〜30℃","20〜25℃","低温では発芽日数が延び種子が腐りやすい"],["レタス・シュンギク","15〜20℃","15〜20℃","好光性。25℃以上で高温休眠し発芽がそろわない"],["パンジー・ビオラ・プリムラ","15〜20℃","10〜20℃","夏まきは涼しい場所を確保する"],["ホウレンソウ","15〜20℃","15〜20℃","高温では発芽が悪い。直根性なので直まき"]]}},{"heading":"発芽後の管理 ── 光と間引きと徒長","dialogue":[{"who":"客","text":"芽は出たんです。でもモヤシみたいにヒョロヒョロで、風で倒れてしまって。"},{"who":"ハナ","text":"発芽してから、どのくらいで新聞紙を外しましたか。"},{"who":"客","text":"三日……四日くらい経ってからでしょうか。"},{"who":"緑川","text":"その三日です。芽が出た瞬間から、苗は光を探して茎を伸ばし始める。暗いままだと、伸びる方向にすべての力を使ってしまうんです。"}],"body":"<p>発芽を確認したら、<strong>覆いを外してすぐ光に当てる</strong>。ここが育苗の最初の分岐点だ。</p><p>光が足りないと、植物は光源を求めて胚軸（茎）を急激に伸ばす。細胞は縦に伸びるが太らないので、細く、白っぽく、水っぽい体になる。これが<strong>徒長</strong>である。徒長苗は自立できず、病気に弱く、定植後の初期生育も悪い。原因は<strong>光不足・高温（特に夜温が高い）・過湿・厚まき・チッ素過多・風通し不足</strong>の六つ。裏を返せば対策も六つで、明るい場所に出す、夜温を下げる、水を控えめにする、間引きと鉢ずらしで間隔をあける、肥料を控える、風に当てる、となる。</p><p><strong>間引き</strong>は<strong>2〜3回に分けて</strong>行う。1回目は発芽がそろい子葉が展開したころ、2回目は本葉1〜2枚、3回目は本葉3〜4枚。一度に最終株数まで減らさないのは、虫害や病気で欠株が出たときの保険であり、適度な競争があったほうが締まった苗になり、回を重ねるほど良い株を見分けられるようになるからだ。</p><p>残すのは、<strong>子葉（双葉）の形が整って左右対称</strong>で、大きさがそろい、葉色が濃く、<strong>茎が太くて節間が短い</strong>株。子葉の形は種子の充実度をそのまま映すので、最初の選抜基準として信頼できる。抜くときは残す株の根が動かないよう株元を押さえ、込み合っていればハサミで地際を切る。子葉は光合成と養分供給の役目があるので、傷つけない。</p>","why":"光が不足すると植物は光を求めて胚軸を伸長させ、細胞は縦に伸びても肥大しないため、細く弱い体になるから。","keypoints":["発芽したら直ちに覆いを外し、光に当てる","徒長の原因は光不足・高温（特に夜温）・過湿・厚まき・チッ素過多・風通し不足","間引きは2〜3回に分ける。子葉展開期、本葉1〜2枚、本葉3〜4枚が目安","一度に間引かないのは欠株への保険と、適度な競争・選抜のため","残す株は子葉の形が整い左右対称、葉色が濃く、茎が太く節間が短いもの","子葉は光合成と養分供給を担うので傷つけない"],"table":{"caption":"徒長の原因と対策","headers":["原因","起きている現象","対策"],"rows":[["光不足","光源を求めて胚軸が伸びる","覆いを外す、明るい場所へ移す、日照時間を確保する"],["高温（特に夜温）","呼吸で養分を消費し、伸長だけが進む","夜間の温度を下げる、換気する"],["過湿","細胞が水を含んで軟弱に伸びる","水やりを控えめにし、表土が乾いてから与える"],["厚まき","葉が重なり互いに光を奪い風が通らない","薄くまく、早めに間引く、鉢ずらしで間隔をあける"],["チッ素過多","葉と茎ばかりが伸び、組織が軟弱になる","播種用土は肥料分の少ないものにし、追肥を控える"],["風通し不足","茎が刺激を受けず太らない","換気し、屋外の風に当てる"]]}},{"heading":"鉢上げ・ずらし・順化","dialogue":[{"who":"ハナ","text":"ポットに移すのは、いつがいいんでしょう。大きくなってからのほうが安全な気がしますが。"},{"who":"緑川","text":"逆です。本葉2〜3枚。それより遅れると根が絡み合って、ほぐす時点でちぎれる。早すぎれば根が少なくて持ちこたえられない。ちょうどよい窓は思ったより狭い。"},{"who":"客","text":"うちは温室育ちの苗をそのまま畑に出したら、翌日に葉が真っ白になりました。"},{"who":"緑川","text":"順化を飛ばしましたね。温室の苗は、外の光にも風にも耐える体になっていないんです。"}],"body":"<p><strong>鉢上げ</strong>は、まき床の苗を1株ずつポットに移す作業。適期は<strong>本葉2〜3枚</strong>。早すぎると根が少なく移植に耐えられず、遅れると根が絡んで必ず切れる。</p><p>手順の要点は<strong>根を切らないこと</strong>に尽きる。前日にたっぷり水を与えて用土をなじませ、苗を引き抜かず<strong>土ごとすくい上げる</strong>。ポットには先に用土を入れて穴をあけ、根を折り曲げずに入れて、<strong>子葉が土に埋まらない深さ</strong>で植える。植え終えたらすぐ水をやり、<strong>2〜3日は半日陰で風の当たらない場所</strong>に置く。根が水を吸う力が戻るまで蒸散を抑えるためで、これが活着を早める。</p><p><strong>ずらし（鉢ずらし）</strong>は、ポットが触れ合うほど込んできたら間隔を広げる作業。葉が重なると光と風を奪い合い、確実に徒長する。生長に合わせて2〜3回ずらす。</p><p><strong>断根・断根挿し</strong>は主根をあえて切り、細根を多く出させて締まった苗にする技法。スイカやキュウリの接ぎ木では、切った胚軸を挿して発根させる断根挿し接ぎが使われる。</p><p><strong>順化（ハードニング）</strong>は、定植の<strong>7〜10日前</strong>から外気・低温・直射光・風に段階的に慣らす作業。温室育ちの苗は葉が柔らかくクチクラ層が薄いため、急に外へ出すと蒸散が追いつかずしおれ、強光で葉焼けし、低温で傷む。水と肥料をやや控えめにしながら屋外に出す時間を延ばすと、組織が締まり、<strong>植え傷みが激減する</strong>。</p>","why":"根も葉も、置かれた環境に合わせて作られているため、環境を変える前に体をその環境用に作り替える時間が要るから。","keypoints":["鉢上げの適期は本葉2〜3枚。遅れると根が絡んで切れる","苗は引き抜かず土ごとすくい上げ、根を切らない","子葉が埋まらない深さに植え、2〜3日は半日陰で管理して活着させる","鉢ずらしは葉の重なりによる徒長を防ぐ作業","順化（ハードニング）は定植7〜10日前から。外気・低温・強光・風に段階的に慣らす","順化を省くと植え傷み・葉焼け・しおれが起きる","断根・断根挿しは主根を切って細根を増やし、締まった苗を作る技法"],"table":{"caption":"播種から定植までの工程と判断基準","headers":["工程","タイミングの目安","判断基準","ねらい"],"rows":[["播種","発芽適温が確保できる時期","気温・地温が発芽適温に入る","水・温度・酸素をそろえる"],["覆いを外す","発芽が始まった直後","地表に芽が見え始める","徒長させない"],["1回目の間引き","子葉が展開したころ","発芽がそろう","込み合いを解消する"],["2〜3回目の間引き","本葉1〜2枚、3〜4枚","葉が触れ合う","良い株を選抜する"],["鉢上げ","本葉2〜3枚","根が絡む前","1株分の根域を与える"],["ずらし","ポットが触れ合うころ","葉が重なる","光と風を全体に当てる"],["順化","定植の7〜10日前","定植適期が近い","外気・強光・低温に慣らす"],["定植","本葉が所定の枚数、根が回り始めたころ","曇天または夕方","植え傷みなく活着させる"]]}},{"heading":"定植 ── 植え穴・根鉢・深さ・活着","dialogue":[{"who":"客","text":"よく晴れた日曜のお昼に、張り切って苗を植えたんです。夕方にはぐったりしていました。"},{"who":"ハナ","text":"晴れの日は気持ちいいんですけどね……。"},{"who":"緑川","text":"植えた直後の根は、まだ土から水を吸えません。それなのに真昼の葉は水をどんどん逃がす。収支が合わないんです。だから曇りの日か、夕方に植える。"}],"body":"<p>定植の適期は、苗の状態と天候の両方で決める。苗はポットの底に白い根が回り始めたころが最適で、根が真っ白にとぐろを巻いた<strong>老化苗</strong>になると初期生育が遅れる。天候は<strong>曇りの日か夕方</strong>。晴天の日中は蒸散が根の吸水能力を上回り、しおれて<strong>植え傷み</strong>を起こす。夕方に植えれば夜のうちに根が落ち着く。</p><p>植え穴は先に掘って<strong>水を注ぎ、引いてから植える</strong>。乾いた土に植えると、周囲の土が根鉢から水を吸い取ってしまう。</p><p><strong>根鉢は崩さないのが原則</strong>。とくにエダマメ・インゲン・エンドウなどのマメ科、ウリ科、直根性の植物、球根類、一部のハーブは根を切ると回復しない。ただし根が回りすぎて根鉢の表面が根で白くなり、底でとぐろを巻いている場合は例外で、<strong>底の根を軽くほぐすか、底を1cmほど切り、側面に縦の切れ目を入れる</strong>。そのまま植えると根が外へ出ず、いつまでも根鉢の中だけで生きることになる。</p><p>深さは<strong>根鉢の表面が地面と同じか、ごくわずかに高く</strong>が基本。深植えは酸素不足と生長点の埋没を招く。イチゴのクラウン、キャベツ・ハクサイ・レタスの生長点は絶対に埋めない。例外的に深植えできるのは、茎から不定根を出すトマトや、溝に植えて土寄せするネギである。</p><p>株間・条間は成株の大きさで決める。植えたら<strong>すぐ仮支柱</strong>を立てる。根が張る前に風で揺すられると新しい根が切れるからだ。<strong>活着するまでは土を乾かさず</strong>、新しい葉が動き出し日中もしおれなくなったら、<strong>「乾いたらたっぷり」</strong>に切り替えて根を深く張らせる。</p>","why":"植え付け直後の根はまだ土と接触しておらず吸水できないため、蒸散を抑え、根が土をつかむまでの時間を稼ぐ管理が要るから。","keypoints":["定植は曇りの日か夕方に行う。晴天の日中は蒸散が吸水を上回り植え傷みする","植え穴には先に水を注ぎ、引いてから植える","根鉢は崩さないのが原則。マメ科、ウリ科、直根性、球根、一部のハーブは特に厳守","根が回りすぎた苗は底の根を軽くほぐすか底を切り、側面に切れ目を入れる","深さは根鉢の表面が地面と同じかごくわずかに高く。深植えは避ける","イチゴのクラウン、キャベツ・ハクサイの生長点は埋めない。トマトは深植え可、ネギは溝植え","定植直後に仮支柱。活着まで乾かさず、活着後は乾いたらたっぷりに切り替える"],"table":{"caption":"定植時の根鉢と植え付け深さ","headers":["区分","扱い","代表例","理由"],"rows":[["根鉢を崩さない","そのまま植える","エダマメ、インゲン、エンドウ、キュウリ、カボチャ、直根性の草花、球根類","根が切れると回復せず生育が止まる"],["根が回った苗","底の根を軽くほぐす／底を1cm切り側面に切れ目","長く置いた老化苗全般","根が外へ出ず根鉢の中だけで生育するのを防ぐ"],["浅植え（原則）","根鉢の表面と地面を同じ高さに","ほとんどの野菜・草花","深植えは酸素不足と生長点の埋没を招く"],["生長点を埋めない","浅植えを厳守","イチゴ（クラウン）、キャベツ、ハクサイ、レタス","生長点が埋まると腐敗し生育が止まる"],["深植えできる例外","茎の一部を土に埋める","トマト（不定根が出る）、ネギ（溝植え・土寄せ）","茎から新しい根が出て吸水量が増える"]]},"mnemonic":"定植三原則は「曇りか夕方・根鉢は崩さず・浅く植える」"}],"quiz":[{"type":"ox","q":"直根性の植物は移植を嫌うため、原則として直まきにする。","a":true,"why":"直根性は主根の先端に生長点があり、傷めると回復しない。ダイコンやニンジンは股割れ・曲がりの原因になる。"},{"type":"ox","q":"ホウレンソウやニンジンは移植栽培に向くので、育苗箱で苗を作ってから畑に植えるとよい。","a":false,"why":"どちらも直根性で移植を嫌う。直まきが原則である。"},{"type":"ox","q":"覆土の厚さは、種子の直径の5〜6倍が目安である。","a":false,"why":"目安は種子の直径の2〜3倍。5〜6倍では深すぎて出芽できない種子が多い。"},{"type":"ox","q":"好光性種子は、光で発芽が抑えられるため厚めに覆土する。","a":false,"why":"説明が逆。好光性種子は発芽に光が必要なので覆土しないかごく薄くする。厚く覆土するのは嫌光性種子。"},{"type":"ox","q":"微細種子の播種で底面給水を使うのは、上から水をかけると種子や覆土が流れてしまうためである。","a":true,"why":"底面給水は毛管現象で下から吸わせるので種子が動かず、用土全体が均一に湿る。"},{"type":"ox","q":"播種後にジョウロで水をやるときは、ハス口を下向きにして勢いよくかけるとよい。","a":false,"why":"ハス口は上向き。水が放物線を描いてから落ちるので勢いが弱まり、種子が動かない。"},{"type":"ox","q":"発芽適温と生育適温は、どの植物でも必ず一致する。","a":false,"why":"一致しない。トマトは発芽適温25〜30℃だが生育は昼20〜25℃・夜10〜15℃を好む。"},{"type":"ox","q":"播種用土は肥料分が多いほど発芽がよくなる。","a":false,"why":"種子は自前の養分で発芽するため肥料は不要。濃度が高いと浸透圧で水を吸えず肥料焼けを起こす。"},{"type":"ox","q":"まき床に清潔な用土を使う主な理由は、苗立枯病などの病害を防ぐためである。","a":true,"why":"幼苗は抵抗力が弱く、ピシウムやリゾクトニアによる苗立枯病で一晩のうちに倒れて広がる。"},{"type":"ox","q":"発芽が始まった後も新聞紙をかけたままにしておくと、苗は徒長しやすくなる。","a":true,"why":"光が届かないと胚軸が光を求めて伸長する。発芽を確認したら直ちに覆いを外す。"},{"type":"ox","q":"間引きは一度に最終株数まで減らしてしまうのが原則である。","a":false,"why":"2〜3回に分ける。欠株への保険になり、適度な競争で締まった苗になり、選抜の精度も上がる。"},{"type":"ox","q":"間引きで残す株は、子葉（双葉）の形が整って左右対称のものを選ぶ。","a":true,"why":"子葉の形は種子の充実度を映すため、初期の選抜基準として信頼できる。"},{"type":"ox","q":"鉢上げは本葉が5〜6枚に育ってから行うのがよい。","a":false,"why":"適期は本葉2〜3枚。遅れると根が絡み合い、ほぐす時点で切れてしまう。"},{"type":"ox","q":"順化（ハードニング）は、定植の7〜10日前から外気や低温、強い光に段階的に慣らす作業である。","a":true,"why":"温室育ちの苗は葉が柔らかくクチクラ層が薄いため、慣らさずに外へ出すとしおれ・葉焼け・低温害を起こす。"},{"type":"ox","q":"苗の定植は、晴天の日中よりも曇りの日や夕方が適している。","a":true,"why":"植え付け直後の根はまだ吸水できない。晴天の日中は蒸散が吸水を上回りしおれて植え傷みする。"},{"type":"ox","q":"ポットの中で根が回り、底でとぐろを巻いた苗は、底の根を軽くほぐしてから植えるとよい。","a":true,"why":"そのまま植えると根が外へ伸び出せず、根鉢の中だけで生育してしまう。ただしマメ科や直根性は例外で崩さない。"},{"type":"mc","q":"次のうち、移植栽培に向く（移植を嫌わない）植物はどれか。","choices":["ゴボウ","ダイコン","キャベツ"],"a":2,"why":"ゴボウとダイコンは直根性で移植を嫌う。キャベツは細根が多く、育苗して移植するのが一般的。"},{"type":"mc","q":"覆土の厚さの一般的な目安はどれか。","choices":["種子の直径と同じ厚さ","種子の直径の2〜3倍","種子の直径の10倍"],"a":1,"why":"直径の2〜3倍が標準。大粒種子は厚く、小粒種子は薄くという原則がこの一言に含まれている。"},{"type":"mc","q":"好光性種子（光発芽種子）にあたるものはどれか。","choices":["トマト","ケイトウ","キンギョソウ"],"a":2,"why":"キンギョソウは好光性で覆土しないかごく薄く。トマトとケイトウは嫌光性でしっかり覆土する。"},{"type":"mc","q":"嫌光性種子（暗発芽種子）にあたるものはどれか。","choices":["パンジー","プリムラ","ベゴニア"],"a":0,"why":"パンジー・ビオラは嫌光性でしっかり覆土する。プリムラとベゴニアは好光性で覆土しない。"},{"type":"mc","q":"すじまき（条播）の主な利点はどれか。","choices":["間引き・除草・追肥・土寄せがしやすい","種子を最も節約できる","覆土が不要になる"],"a":0,"why":"列が決まるので株の位置が把握でき、その後の作業がすべてしやすくなる。種子の節約は点まきの利点。"},{"type":"mc","q":"エダマメやトウモロコシのような大粒種子で、株間があらかじめ決まっている場合に適したまき方はどれか。","choices":["ばらまき（散播）","すじまき（条播）","点まき（点播）"],"a":2,"why":"点まきは一定間隔に数粒ずつまく。数粒まくのは発芽不良への保険と、幼苗を適度に競わせるため。"},{"type":"mc","q":"播種用土に求められる条件として正しいものはどれか。","choices":["肥料分が多く、栄養豊富であること","未熟な堆肥を多く含むこと","清潔で肥料分が少ないこと"],"a":2,"why":"種子は自前の養分で発芽するので肥料は不要。むしろ濃度が高いと肥料焼けし、菌がいれば苗立枯病になる。"},{"type":"mc","q":"発芽に必要な三つの条件の組み合わせとして正しいものはどれか。","choices":["水・温度・酸素","水・光・肥料","温度・光・肥料"],"a":0,"why":"発芽の三条件は水・適温・酸素。光は種類により必要（好光性）または不要（嫌光性）で、肥料は不要。"},{"type":"mc","q":"徒長の原因として当てはまらないものはどれか。","choices":["夜間の温度が高い","厚まきで葉が重なっている","風通しがよく、よく日が当たる"],"a":2,"why":"徒長の原因は光不足・高温・過湿・厚まき・チッ素過多・風通し不足。日照と通風の確保は対策のほうである。"},{"type":"mc","q":"鉢上げ（ポットへの移植）の適期はどれか。","choices":["子葉が展開したとき","本葉2〜3枚のとき","本葉6〜7枚のとき"],"a":1,"why":"本葉2〜3枚。早すぎると根が少なく移植に耐えられず、遅れると根が絡んで切れてしまう。"},{"type":"mc","q":"真夏にレタスやシュンギクの種をまくと発芽がそろわないことがある。主な理由はどれか。","choices":["高温によって休眠が起こり、発芽が抑えられるため","光が強すぎて種子が焼けるため","土中の酸素が多すぎるため"],"a":0,"why":"レタス・シュンギクの発芽適温は15〜20℃で、25℃を超えると高温休眠に入る。低温性の好光性種子の代表例。"},{"type":"mc","q":"苗の植え付け深さの原則として正しいものはどれか。","choices":["根鉢の表面が地面と同じ高さか、ごくわずかに高くなるように植える","根鉢の上に5cmほど覆土して深く植える","根鉢の半分を地上に出して植える"],"a":0,"why":"深植えは酸素不足と生長点の埋没を招く。浅植えが原則で、トマトやネギは例外的に深植えできる。"},{"type":"mc","q":"定植のとき、根鉢を崩さずに植えるべき代表的な植物はどれか。","choices":["キャベツ","エダマメ","ハクサイ"],"a":1,"why":"マメ科は根を切ると回復しにくい。ウリ科、直根性、球根類も同様に根鉢を崩さず植える。"},{"type":"mc","q":"定植直後に仮支柱を立てる主な理由はどれか。","choices":["見た目を整えるため","根が張る前に風で揺すられて根が切れるのを防ぐため","水やりの位置の目印にするため"],"a":1,"why":"活着前の苗は根が土をつかんでいない。揺れると出たばかりの新根が切れ、活着がさらに遅れる。"},{"type":"mc","q":"定植後の水やりの考え方として正しいものはどれか。","choices":["活着するまでは乾かさず、活着後は乾いたらたっぷり与える","活着するまでは乾かし気味にし、活着後は毎日少量ずつ与える","植え付け後は雨に任せ、一切与えない"],"a":0,"why":"活着前は吸水力が弱いので土を乾かさない。活着後は乾湿の差をつけると根が水を求めて深く伸びる。"},{"type":"mc","q":"ペチュニアやベゴニアのような微細種子の播種に最も適した資材・方法はどれか。","choices":["大粒の赤玉土を入れた深鉢にまき、たっぷり覆土する","ピートバンや細かい播種用土の平箱にばらまき、覆土せず底面給水する","畑の土をそのまま入れた鉢にまき、上からジョウロで潅水する"],"a":1,"why":"微細種子は好光性が多く覆土しない。細かく清潔な用土に薄くばらまき、底面給水で乾燥を防ぐ。"}]},{"id":8,"title":"ふやす","subtitle":"挿し木・株分け・接ぎ木・取り木・交配を原理から使い分けられる","minutes":45,"goals":["実生と栄養繁殖の違いを説明し、目的に合った繁殖法を選べる","挿し木・株分け・接ぎ木・取り木の適期と作業の勘どころを、発根や活着の理屈から説明できる","人工授粉とF1のしくみ、そして種苗法上ふやしてよい品種かどうかを判断できる"],"sections":[{"heading":"実生か栄養繁殖か ── クローンをつくるということ","dialogue":[{"who":"客","text":"うちのアジサイ、すごくきれいな青なんです。種をとってふやせますか。"},{"who":"緑川","text":"種からだと、まずあの青にはなりません。花の色も形も、親とは別のものが出ます。"},{"who":"ハナ","text":"えっ、子どもなのに親と同じにならないんですか。"},{"who":"緑川","text":"種は父と母の掛け合わせですからね。同じ株がほしいなら、枝を挿すか株を分ける。体の一部を取れば、それはコピーです。"}],"body":"<p><strong>実生（みしょう）</strong>は種子からふやす方法、<strong>栄養繁殖（栄養系繁殖）</strong>は挿し木・株分け・接ぎ木・取り木のように親株の体の一部からふやす方法である。決定的な違いは遺伝のしくみにある。種子は花粉と胚珠が受精してできるため両親の遺伝子が組み替わり、<strong>子は親と同じにならない</strong>。八重咲き、斑入り、大輪、特別な花色といった園芸品種の特徴は、実生ではまず再現できない。</p><p>いっぽう栄養繁殖は体細胞分裂によるコピー、つまり<strong>クローン</strong>である。花色も樹形も病気への強さも親のままで、同じ性質の苗をそろえられる。すでに花を咲かせる<strong>成熟した枝</strong>を使うので、実生より早く開花・結実するのも利点だ。実生の樹は数年から十数年の<strong>幼若期</strong>を過ぎないと咲かない。</p><p>ただしコピーは欠点も引き継ぐ。とくに<strong>ウイルス病は栄養繁殖で確実に伝わる</strong>。ウイルスの多くは種子ではほとんど伝染しないので、実生には「病気をリセットできる」という強みがある。実生はさらに、一度に多量の苗が安く得られ、直根の張った丈夫な根ができるため、台木づくりや新品種を生み出す育種に欠かせない。</p><p>この両方の弱点を同時に解決したのが<strong>組織培養</strong>である。生長点付近にはウイルスが入り込みにくいため、その部分を無菌培養する<strong>茎頂培養（メリクロン）</strong>で<strong>ウイルスフリー苗</strong>が得られ、しかも同一個体を大量に増殖できる。洋ランの苗、イチゴ、ジャガイモ、キク、カーネーションなどで実用化されている。</p>","why":"種子は受精のたびに遺伝子が組み替わるが、栄養繁殖は体細胞分裂によるコピーなので、親の形質をそのまま残したいなら栄養繁殖しか手がないから。","keypoints":["実生＝種子繁殖。遺伝的に変異が出るため、園芸品種の形質は再現できない","栄養繁殖＝クローン。形質が親と同一で、開花・結実も早い","ウイルスは栄養繁殖で確実に伝染する。種子ではほとんど伝わらない","実生の利点は多量・安価・丈夫な根。台木づくりと育種に使う","茎頂培養（メリクロン）はウイルスフリー苗の大量増殖に使われ、洋ランで普及"],"table":{"caption":"実生と栄養繁殖の比較","headers":["項目","実生（種子繁殖）","栄養繁殖（栄養系）"],"rows":[["子の性質","両親の遺伝子が組み替わり変異する","親と同一のクローン"],["園芸品種の維持","できない","できる"],["開花・結実まで","幼若期があり遅い","成熟枝を使うので早い"],["ウイルス","ほとんど伝染しない","確実に受け継ぐ"],["一度に得られる数","多量・安価","限られる・手間がかかる"],["主な用途","台木づくり、育種、一年草","品種の増殖、果樹・花木・宿根草"]]},"mnemonic":"実生は「バラつくが健康」、栄養繁殖は「そっくりだが病気ごと」。"},{"heading":"挿し木の理屈 ── なぜ切った枝から根が出るのか","dialogue":[{"who":"ハナ","text":"枝を切って土に挿すだけで根が出るって、よく考えると不思議です。"},{"who":"緑川","text":"植物の細胞は、条件がそろうと役割を作り直せるんですよ。傷口にカルスができて、そこから根が生まれる。"},{"who":"ハナ","text":"じゃあ、うまくいかない人は何を間違えてるんでしょう。"},{"who":"緑川","text":"たいてい二つ。挿し床に肥料の入った土を使うことと、葉を減らさずに乾かすことです。"}],"body":"<p>枝を切って挿すと、切り口にまず<strong>カルス</strong>（癒傷組織）ができる。この細胞のかたまりや切り口付近の形成層の細胞が性質を変え、本来そこにないはずの根＝<strong>不定根</strong>を出す。植物の細胞が体を作り直す力を持っているからこそ成り立つ技である。</p><p>発根を促すホルモンが<strong>オーキシン</strong>だ。オーキシンは形態的な先端側から基部側へという決まった向き（極性移動）で挿し穂の基部へ移動して溜まり、そこに根をつくらせる。市販の<strong>発根促進剤</strong>はこのオーキシンの仲間（インドール酪酸など）で、切り口に粉をまぶしたり液に浸したりして使う。</p><p>作業の要点は三つ。第一に<strong>切り口</strong>。よく切れる清潔な刃物で斜めに切り、断面を潰さない。斜め切りは吸水面と発根面を広げるためである。第二に<strong>水あげ</strong>。挿す前に三十分から数時間水に浸け、十分に吸水させてから挿す。第三に<strong>挿し床</strong>。鹿沼土の細粒、赤玉土の小粒、バーミキュライト、パーライト、川砂など、<strong>無肥料で清潔な用土</strong>を使う。根がないうちは肥料を吸えないうえ、肥料分は雑菌の餌になって切り口を腐らせるからだ。保水性と通気性を兼ね、病原菌や雑草の種子を含まないことが条件になる。</p><p>挿したあとは<strong>蒸散との勝負</strong>になる。根がないのに葉から水が出続ければ萎れて枯れる。だから大きな葉は<strong>半分に切り</strong>、明るい日陰に置き、ビニールなどで覆う<strong>密閉ざし</strong>で湿度を保つ。用土は乾かさず、発根を確かめようと引き抜くのは厳禁。新芽が動き出したら発根の合図で、それから薄い液肥を始め、少しずつ光に慣らす。</p>","why":"挿し穂には吸水する根がないため、発根までは「オーキシンを基部に溜める」「蒸散を抑える」「切り口を腐らせない」の三つを同時に満たす必要があるから。","keypoints":["切り口にカルスができ、細胞が性質を変えて不定根を出す","オーキシンが基部に溜まって発根を促す。発根促進剤はその仲間","挿し床は無肥料・清潔・保水性と通気性。肥料は吸えないうえ腐敗の原因","水あげは30分〜数時間。切り口は鋭利な刃物で斜めに","葉は半分に切り、明るい日陰・密閉ざしで蒸散を抑える","発根の確認に引き抜かない。新芽の動きが発根のサイン"],"table":{"caption":"挿し床に使う用土と性質","headers":["用土","性質","向く場面"],"rows":[["鹿沼土（細粒）","酸性・無肥料・保水と通気のバランスがよい","最も一般的な挿し床"],["赤玉土（小粒）","無肥料・保水性が高い","一般の枝挿し"],["バーミキュライト","軽く清潔・保水性が非常に高い","葉ざし、細かい挿し穂"],["パーライト","軽く通気性が高い","腐りやすい種類、単用や混合"],["川砂・日向土","排水がよく腐りにくい","多肉植物、根腐れしやすい種類"],["培養土（元肥入り）","肥料と有機物を含む","挿し床には不向き（腐敗・雑菌）"]]}},{"heading":"挿し木の種類と適期 ── 春ざし・梅雨ざし・秋ざし","dialogue":[{"who":"客","text":"今からアジサイを挿しても間に合いますか。もう6月ですけど。"},{"who":"緑川","text":"むしろ一番いい時期です。梅雨は気温も湿度も高くて、根が出やすい。今年伸びた枝を使ってください。"},{"who":"ハナ","text":"春に挿すときは、どの枝を使うんでしたっけ。"},{"who":"緑川","text":"春は去年伸びた枝、梅雨は今年伸びた枝。ここだけは間違えないように。"}],"body":"<p>挿し穂にどこを使うかで呼び名が変わる。その年伸びた新梢が少し固まったものを使うのが<strong>緑枝ざし（新梢ざし）</strong>、落葉樹の前年枝を休眠中に使うのが<strong>熟枝ざし（休眠枝ざし）</strong>である。ほかに葉一枚を挿す<strong>葉ざし</strong>、葉に腋芽を一つ付けて挿す<strong>葉芽ざし</strong>、根を切り取って挿す<strong>根ざし</strong>がある。</p><p>適期は年に三回。<strong>春ざし</strong>（三〜四月）は前年枝を使う熟枝ざしが中心。<strong>梅雨ざし</strong>（六〜七月）は当年枝の緑枝ざしで、高温多湿の条件がそろうため最も成功しやすい。<strong>秋ざし</strong>（九月ごろ）は充実した当年枝を使うが、冬までに根を張らせる必要があり、防寒が要る。いずれも挿し穂は生育の勢いがある健全な枝から採り、花芽や蕾は取り除く。</p><p>葉ざしができるのはセントポーリア、レックスベゴニア、サンセベリア、多肉植物など、葉から芽と根の両方をつくれる種類に限られる。ここで要注意なのが<strong>斑入り品種</strong>で、斑入りサンセベリアを葉ざしすると斑のない緑葉の株に戻ってしまう。斑を残したいなら<strong>株分け</strong>を選ぶ。葉芽ざしはゴムノキ、アジサイ、ツバキ、ポトスなど、根ざしはフジ、ノウゼンカズラ、キリなどで使われる。</p><p>得手不得手もはっきりしている。ヤナギ、キク、ゼラニウム、コリウス、ポトス、アイビー、アジサイ、サツキ、マサキ、バラ、イチジクなどはよく発根する。逆に<strong>マツなどの針葉樹、サクラ、カキ、クリ、ナシ、リンゴ、モモ、カエデ</strong>は発根しにくく、これらは接ぎ木や取り木でふやす。</p>","why":"梅雨ざしが最も成功しやすいのは、気温が高くて細胞分裂が活発なうえ、空中湿度が高くて根のない挿し穂が萎れにくいという、発根の二条件が同時にそろうから。","keypoints":["緑枝ざし＝当年枝（梅雨）、熟枝ざし＝前年枝（春・休眠期）","春ざし3〜4月、梅雨ざし6〜7月（最も容易）、秋ざし9月ごろ","葉ざしはセントポーリア、ベゴニア、サンセベリア、多肉植物","斑入りサンセベリアの葉ざしは斑が消える。斑を残すなら株分け","挿し木が難しいのはマツ類・サクラ・カキ・クリ・ナシ・リンゴ・モモ・カエデ","挿して着かない種類は接ぎ木か取り木に切り替える"],"table":{"caption":"挿し木の種類・適期・代表植物","headers":["種類","使う部分と適期","代表植物"],"rows":[["緑枝ざし（新梢ざし）","当年枝の充実したもの／6〜7月・9月","アジサイ、サツキ、ツバキ、バラ、キク"],["熟枝ざし（休眠枝ざし）","前年枝／3〜4月の芽出し前","ムクゲ、ヤナギ、ブドウ、イチジク"],["葉ざし","葉1枚／生育期","セントポーリア、ベゴニア、サンセベリア、多肉植物"],["葉芽ざし","葉＋腋芽1個／生育期","ゴムノキ、アジサイ、ツバキ、ポトス"],["根ざし","根の一部／休眠期","フジ、ノウゼンカズラ、キリ"]]},"mnemonic":"「春は去年の枝、梅雨は今年の枝」。熟＝前年、緑＝当年。"},{"heading":"分けてふやす ── 株分け・分球・ランナー","dialogue":[{"who":"客","text":"シンビジウムが鉢からはみ出してきて。細かく分けたら株数が稼げますか。"},{"who":"緑川","text":"気持ちはわかりますが、分けすぎると数年花が咲きません。バルブを三本は残してください。"},{"who":"ハナ","text":"宿根草も同じですか。"},{"who":"緑川","text":"同じです。芽三つが目安。分けるのは、株を若返らせる手術でもありますからね。"}],"body":"<p><strong>株分け</strong>は、根の付いた芽のかたまりを掘り上げて分ける方法で、最も失敗の少ない繁殖法である。適期は<strong>生育が始まる直前</strong>か<strong>花後</strong>。春咲きの宿根草は花後から秋に、秋咲きのものは春に分ける。観葉植物は気温の高い五〜九月、洋ランは花後で新芽と新根が動き出す前が目安になる。</p><p>要点は分けすぎないこと。一株に<strong>三芽以上</strong>（洋ランならバルブ三本以上）を残す。小さく割ると回復に時間がかかり、その年は花が咲かない。手で裂けるものは手で、固い株は清潔な刃物で切り、腐った根や古い根を落としてから植え直す。根が減っている分、数日は<strong>半日陰</strong>で養生させる。鉢物は二〜三年に一度が目安だ。</p><p>球根は自分から分かれる。親球のわきにできた子球を外すのが<strong>分球</strong>で、チューリップ、スイセン、グラジオラス、ダリアなどが該当する。ダリアは球根の首（クラウン）に芽があるので、必ず芽を付けて切り分ける。球茎の基部にできる小球が<strong>木子（きご）</strong>、葉のつけ根などにできる小球が<strong>むかご（珠芽）</strong>で、オニユリやヤマノイモが代表。ユリは<strong>鱗片ざし</strong>ができ、鱗茎をばらして鱗片を挿すと基部に小球ができる。</p><p>ほふく枝（<strong>ランナー</strong>）の先に子株をつくる植物もある。オリヅルラン、イチゴ、ユキノシタが代表で、子株を土に受けて発根させてから切り離す。イチゴでは病気を持ちやすい親株側の太郎苗を避け、次郎苗以降を使う。ドクダミやシバのように<strong>地下茎</strong>で広がる植物も、掘り取れば同じ要領でふやせる。</p>","why":"株分け・分球・ランナーは、植物がもともと持っている「自分で分かれてふえる形」を人が手伝うだけなので、切り口から根をつくらせる挿し木より確実に成功するから。","keypoints":["株分けの適期は生育開始前か花後。観葉植物は5〜9月、洋ランは花後","一株に3芽以上（洋ランはバルブ3本以上）。細かく分けると花が咲かない","分けた直後は根が減っているので半日陰で養生。鉢物は2〜3年に1回","ダリアの分球は芽（クラウン）を必ず付けて切る","木子＝球茎基部の小球、むかご＝葉のつけ根などの小球（オニユリ、ヤマノイモ）","ランナーでふえるのはオリヅルラン、イチゴ、ユキノシタ"],"table":{"caption":"分けてふやす方法の整理","headers":["方法","内容","代表植物"],"rows":[["株分け","根の付いた芽の集まりを分ける","宿根草、観葉植物、洋ラン、シバザクラ"],["分球","親球のわきにできた子球を外す","チューリップ、スイセン、グラジオラス、ダリア"],["木子","球茎の基部にできる小球を育てる","グラジオラス、ユリ"],["むかご（珠芽）","葉のつけ根などにできる小球をまく","オニユリ、ヤマノイモ"],["鱗片ざし","鱗茎をばらして鱗片を挿す","ユリ類"],["ランナー・子株","ほふく枝の先の子株を発根させて切る","オリヅルラン、イチゴ、ユキノシタ"]]}},{"heading":"接ぎ木 ── 形成層を合わせる技術","dialogue":[{"who":"ハナ","text":"接ぎ木って、他人同士の枝がなぜくっつくんですか。"},{"who":"緑川","text":"樹皮のすぐ内側に形成層という細胞分裂の層がある。そこ同士が触れると、互いにカルスを出してつながるんです。"},{"who":"客","text":"太さが違うときは、真ん中を合わせればいいのかな。"},{"who":"緑川","text":"いいえ。中心ではなく、片側の形成層をそろえます。真ん中を合わせるとどちらの形成層もずれてしまう。"}],"body":"<p>接ぎ木は、根の側になる<strong>台木</strong>と、育てたい品種の枝である<strong>穂木（ほぎ）</strong>をつないで一本の植物にする技術である。成功のかぎはただ一つ、<strong>形成層を合わせる</strong>こと。形成層は樹皮のすぐ内側にある分裂能力を持った薄い層で、ここが接すると互いにカルスを出して癒合し、水と養分の通り道がつながる。これを<strong>活着</strong>という。太さが違うときは中心ではなく<strong>片側の形成層</strong>をそろえるのが鉄則で、接いだ部分は接ぎ木テープで固定して乾燥を防ぐ。</p><p>方法は季節と対象で使い分ける。<strong>切り接ぎ</strong>は台木を切り詰め、樹皮と木部の間に削った穂木を差し込む方法で、芽が動き出す三月ごろに行う最も一般的なやり方。<strong>割り接ぎ</strong>は台木を縦に割り、くさび形に削った穂木を差す。<strong>芽接ぎ</strong>は八〜九月に芽一個を台木の樹皮に入れる方法で、バラ、サクラ、モモ、カキで使われる。<strong>呼び接ぎ</strong>は台木と穂木の双方に根や株を付けたまま接ぎ、活着してから切り離すので失敗が少ない。穂木は休眠中に採った充実した前年枝を、乾かさないよう低温で保存して使う。</p><p>接ぎ木の目的は幅広い。<strong>耐病性と連作障害の回避</strong>（野菜の接ぎ木苗）、<strong>矮化</strong>（矮性台木で樹を小さくし管理しやすくする）、<strong>挿し木でふやせない種類の繁殖</strong>、既存の樹に別品種を接ぐ<strong>品種更新（高接ぎ）</strong>、開花・結実までの短縮などである。ただし台木と穂木は同種か近縁でなければ活着しない（接ぎ木親和性）。</p><p>接ぎ木苗で最も多い失敗が<strong>台芽</strong>の放置だ。台木から出る芽は勢いが強く、放っておくと穂木が負けて枯れ、いつのまにか台木の品種に入れ替わる。株元から出る<strong>ひこばえ</strong>も同じで、見つけしだい元からかき取る。</p>","why":"接ぎ木がつながるのは形成層どうしがカルスを出して癒合するからで、形成層がずれれば水も養分も通らず、いくらきれいに削っても活着しないから。","keypoints":["台木＝根の側、穂木＝ふやしたい品種の枝","形成層を合わせることが絶対条件。太さが違えば片側をそろえる","切り接ぎ＝3月ごろ、芽接ぎ＝8〜9月、呼び接ぎ＝両方に根を付けたまま","目的は耐病性・連作障害回避・矮化・繁殖・品種更新・結実の早期化","同種か近縁でないと活着しない（接ぎ木親和性）","台芽・ひこばえは放置すると穂木が負ける。見つけしだいかき取る"],"table":{"caption":"接ぎ木のおもな方法","headers":["方法","やり方","時期・特徴"],"rows":[["切り接ぎ","台木を切り詰め、樹皮と木部の間に穂木を差す","3月ごろ。最も一般的"],["割り接ぎ","台木を縦に割り、くさび形の穂木を差す","春。台木が太いときに"],["芽接ぎ","芽を1個、台木の樹皮に入れる","8〜9月。バラ、サクラ、モモ、カキ"],["呼び接ぎ","双方に根を付けたまま接ぎ、活着後に切り離す","生育期。難しい種類でも成功しやすい"]]}},{"heading":"取り木 ── 枝を付けたまま根を出させる","dialogue":[{"who":"客","text":"ゴムノキが天井まで伸びて、下の葉が全部落ちてしまって。"},{"who":"緑川","text":"上の姿のいいところで取り木しましょう。根を出させてから切れば、いきなり立派な鉢になります。"},{"who":"ハナ","text":"皮をぐるっと剥ぐんですよね。それで枯れないんですか。"},{"who":"緑川","text":"水は木部を通るから上がり続けます。剥ぐのは樹皮まで。だから枯れずに、糖だけがそこで足止めされる。"}],"body":"<p>取り木は、枝を親株に付けたまま発根させ、根が出てから切り離す方法である。親から水と養分が送られ続けるので枯れる心配が少なく、<strong>挿し木では発根しにくい種類</strong>や、大きな苗を一気に得たいときに向く。</p><p>基本作業が<strong>環状剥皮（かんじょうはくひ）</strong>だ。発根させたい位置の樹皮を、枝の直径ほどの幅（およそ一〜三センチ）でぐるりと剥ぎ取り、内側の形成層も削り取る。ここで大事なのは<strong>木部（材）は残す</strong>こと。水を運ぶ道管は木部にあるので、剥皮しても上の葉は水を受け取れ、枝は枯れない。いっぽう、葉がつくった糖などの<strong>同化産物は師部（樹皮側）を通って下る</strong>ため、剥皮部で行き止まりになる。オーキシンも一緒に溜まり、その上端から根が出る。</p><p>剥皮部は湿らせた<strong>水ゴケ</strong>で包み、ビニールで上下を縛る。乾けば発根しないので、ときどき水を足す。適期は生育の盛んな<strong>五〜七月</strong>。一〜三か月でビニール越しに白い根が見えたら、剥皮部の下で切り離して鉢上げし、しばらく半日陰で養生させる。このやり方を<strong>高取り法</strong>という。</p><p>ほかに、枝を地面まで曲げて途中を土に埋める<strong>圧条法（曲げ取り法）</strong>、株元に土を盛る<strong>盛り土法</strong>がある。天井まで伸びて下葉が落ちたゴムノキやドラセナの仕立て直し、モミジ、サツキ、ツバキ、アジサイ、そして盆栽の枝づくりなどで使われる。</p>","why":"環状剥皮で師部だけを断つと、葉でつくられた同化産物とオーキシンが剥皮部の上に溜まり、木部は無事なので水は上がり続ける。この「糖は止まり、水は通る」状態が発根を起こすから。","keypoints":["取り木は親株に付けたまま発根させるので、挿し木が難しい種類でも可能","環状剥皮は枝の直径ほどの幅で樹皮と形成層を剥ぐ。木部は残す","師部が断たれ、同化産物とオーキシンが上に溜まって発根する","剥皮部を湿らせた水ゴケで包みビニールで密封。乾かさない","適期は生育期の5〜7月。1〜3か月で発根したら剥皮部の下で切り離す","高取り法のほかに圧条法（曲げ取り法）、盛り土法がある"],"table":{"caption":"挿し木・接ぎ木・取り木の使い分け","headers":["方法","強み","弱み・向かない場面"],"rows":[["挿し木","手軽・一度に多数・道具がいらない","発根しにくい樹種では成功しない"],["接ぎ木","耐病性の根や矮化が得られる。挿し木困難種にも有効","台木が必要・技術がいる・台芽の管理が要る"],["取り木","大きな苗が得られ、失敗しても枝が枯れない","一度に取れる数が少なく、時間がかかる"]]}},{"heading":"交配 ── 人工授粉と受粉の型","dialogue":[{"who":"客","text":"キウイを一本だけ植えたんですが、花は咲くのに実がつかなくて。"},{"who":"緑川","text":"キウイは雌雄異株です。その木は雌株でしょう。花粉をくれる雄株がないと実りません。"},{"who":"ハナ","text":"自分の花粉じゃだめな植物もありますよね。"},{"who":"緑川","text":"自家不和合性ですね。近い者どうしで殖えないための仕組み。人間が交配するときは、その性質を逆に利用します。"}],"body":"<p>交配（人工授粉）は、<strong>おしべの葯</strong>から出た花粉を<strong>めしべの柱頭</strong>に人の手で付ける作業である。目的は二つ。確実に実らせる結実目的と、二品種の性質を掛け合わせる育種目的だ。</p><p>育種で交配するときは、母親にする花の<strong>おしべを開花前のつぼみのうちに取り除く</strong>。これが<strong>除雄（じょゆう）</strong>で、自分の花粉が付く自家受粉を防ぐためである。除雄した花には袋をかけ、交配後にもう一度<strong>袋かけ</strong>をして、虫や風の運ぶ別の花粉の混入を防ぐ。札には交配日と父母の品種名を必ず書く。</p><p>適期を外すと実らない。花粉は<strong>葯が裂けた直後</strong>が最も活力があり、柱頭は<strong>粘液が出て濡れて光るころ</strong>が受精可能な時期だ。作業は<strong>よく晴れた日の午前中</strong>に行う。雨や高湿度では花粉が流されたり発芽しなかったりする。花粉は乾燥・低温にすればしばらく保存でき、開花期のずれた品種どうしを交配することもできる。</p><p>花のつくりによって手間は変わる。同じ花の中で受粉が成立する<strong>自家受粉</strong>（イネ、トマト、エンドウ）、別株の花粉が要る<strong>他家受粉</strong>、自分の花粉では受精できない<strong>自家不和合性</strong>（ナシ、リンゴ、オウトウ、アブラナ科の多く）がある。さらに一株に雄花と雌花が分かれてつく<strong>雌雄異花</strong>（キュウリ、カボチャ、スイカなどウリ科、トウモロコシ）、雄株と雌株が別々の<strong>雌雄異株</strong>（キウイフルーツ、イチョウ、ホウレンソウ、アスパラガス）では、雌側だけを植えても実らない。</p>","why":"除雄と袋かけをするのは、花粉が「どこから来たか」が確定しなければ交配の結果が親のどちらに由来するか説明できず、育種として成り立たないから。","keypoints":["除雄＝母本のおしべを開花前に取り除く。自家受粉を防ぐため","袋かけ＝他の花粉の混入を防ぐ。交配日と親をラベルに記録","花粉は葯が裂けた直後、柱頭は粘液で濡れて光るころが適期","作業は晴れた日の午前中。雨・高湿度は花粉が流れ発芽しない","自家不和合性はナシ、リンゴ、オウトウ、アブラナ科に多い","雌雄異花＝ウリ科・トウモロコシ、雌雄異株＝キウイ、イチョウ、ホウレンソウ、アスパラガス"],"table":{"caption":"受粉の型と代表植物","headers":["型","内容","代表植物"],"rows":[["自家受粉","同じ花・同じ株の花粉で受精する","イネ、トマト、エンドウ、ナス"],["他家受粉","別の株の花粉で受精する","多くの果樹、アブラナ科野菜"],["自家不和合性","自分の花粉では受精できない","ナシ、リンゴ、オウトウ、ハクサイ、キャベツ"],["雌雄異花（同株）","一株に雄花と雌花が別々につく","キュウリ、カボチャ、スイカ、トウモロコシ"],["雌雄異株","雄株と雌株が別の個体","キウイフルーツ、イチョウ、ホウレンソウ、アスパラガス"]]},"mnemonic":"雌雄異株は「キ・イ・ホ・ア」＝キウイ、イチョウ、ホウレンソウ、アスパラガス。"},{"heading":"F1と採種、そして種苗法","dialogue":[{"who":"客","text":"去年の立派なトマトから種をとってまいたら、ばらばらの実になっちゃって。"},{"who":"緑川","text":"袋にF1と書いてありませんでしたか。F1は一代限り。次の代で性質が分かれるんです。"},{"who":"ハナ","text":"じゃあ、うちで増やしていい植物と、いけない植物があるってことですか。"},{"who":"緑川","text":"そこはF1とは別の話で、法律の問題です。種苗法の登録品種は、勝手に挿し木してはいけません。"}],"body":"<p><strong>F1（一代雑種）</strong>は、性質を固定した別々の系統どうしを交配して得た雑種第一代である。<strong>雑種強勢</strong>が働いて生育が旺盛で、大きさや開花期がよくそろい、耐病性を持たせやすい。F1をつくるには自家受粉を確実に防ぐ必要があり、除雄のほか、<strong>自家不和合性</strong>や<strong>雄性不稔</strong>（花粉ができない性質）が利用される。</p><p>問題は次の代である。F1から採った種子をまくと形質が分離し、草丈も花色も収量もばらばらになる。<strong>F1品種は家庭で採種しても再現できない</strong>。同じものを作りたければ毎年種子を買うことになる。逆に性質の固定した<strong>固定種（在来種）</strong>なら自家採種で受け継げるが、ウリ科やアブラナ科は他品種と交雑しやすいので、開花期をずらすか隔離する必要がある。</p><p>採種は<strong>完熟</strong>が原則。トマト、ナス、キュウリは食べごろを過ぎるまで熟させてから種子を取り出して洗い、アサガオやマリーゴールドはさやが茶色く枯れてから採る。採った種子は日陰でよく<strong>乾燥</strong>させ、紙袋に入れて乾燥剤とともに密閉し、<strong>低温・低湿・暗所</strong>で保存する。品種名と採種年を書き添えておく。</p><p>最後に法律の話を。<strong>種苗法</strong>で品種登録された<strong>登録品種</strong>には<strong>育成者権</strong>があり、権利者に無断で増殖することはできない。二〇二〇年の法改正で、それまで原則自由だった農業者の自家増殖も許諾制になった。家庭でも、登録品種のバラやランを挿し木・株分けでふやして配ったり売ったりすれば権利侵害になりうる。登録期間の切れたものや在来種などの<strong>一般品種</strong>は自由にふやせる。まずラベルの品種登録表示を確かめる習慣をつけたい。</p>","why":"F1は二つの系統を掛け合わせた雑種第一代なので、次の代では両親由来の遺伝子が分離し、そろいのよさという最大の長所がそのまま失われるから。","keypoints":["F1＝一代雑種。雑種強勢で生育旺盛・そろいがよい・耐病性を持たせやすい","F1の採種種子は形質が分離してそろわない。固定種なら自家採種可能","F1採種には除雄のほか自家不和合性・雄性不稔を利用する","採種は完熟後。よく乾燥させ、低温・低湿・暗所で保存","ウリ科・アブラナ科は交雑しやすく、自家採種には隔離が必要","登録品種の増殖には育成者権者の許諾が必要。一般品種は自由"],"table":{"caption":"ふやしてよい品種かの判断","headers":["区分","内容","自分でふやせるか"],"rows":[["登録品種","種苗法で品種登録され育成者権が存続中","許諾が必要。無断の挿し木・株分け・採種は不可"],["一般品種","登録されていない品種、在来種、登録期間が切れた品種","自由にふやせる"],["F1品種","一代雑種（法的区分ではなく育種上の区分）","法的に可でも次代は形質が分離し再現できない"]]}}],"quiz":[{"type":"ox","q":"挿し木や株分けでふやした株は、親と遺伝的に同じクローンである。","a":true,"why":"栄養繁殖は体細胞分裂によるコピーなので、花色や樹形などの形質が親とまったく同じになる。"},{"type":"ox","q":"ウイルス病は、種子でまくよりも挿し木などの栄養繁殖のほうが確実に受け継がれる。","a":true,"why":"ウイルスは親株の組織の中にいるため、体の一部を使う栄養繁殖では必ず持ち込まれる。種子ではほとんど伝染しない。"},{"type":"ox","q":"挿し床には元肥を入れておくと発根がよくなる。","a":false,"why":"根がないうちは肥料を吸えず、肥料分は雑菌の餌になって切り口を腐らせる。挿し床は無肥料で清潔な用土を使う。"},{"type":"ox","q":"挿し穂は切ったらすぐ挿すのがよく、水あげは必要ない。","a":false,"why":"挿す前に30分〜数時間水に浸けて十分吸水させる。根のない挿し穂は水切れに弱いため、水あげが発根率を左右する。"},{"type":"ox","q":"熟枝ざしとは、その年に伸びた新梢を梅雨に挿す方法である。","a":false,"why":"それは緑枝ざし（新梢ざし）の説明。熟枝ざしは前年枝を休眠中の春に挿す方法である。"},{"type":"ox","q":"実生でふやした樹は、栄養繁殖でふやした株より開花・結実までの年数が長くなることが多い。","a":true,"why":"実生には花芽をつけられない幼若期があるが、栄養繁殖はすでに成熟した枝を使うため早く咲く。"},{"type":"ox","q":"株分けは、芽を細かく分けるほど早く大株に育つ。","a":false,"why":"逆である。3芽以上を一株にする。小さく割ると回復に時間がかかり、その年は花が咲かない。"},{"type":"ox","q":"ダリアの分球では、球根に芽（クラウン部）を付けて切り分ける。","a":true,"why":"ダリアの芽は球根の首の部分にあり、芽の付いていない球根を植えても発芽しない。"},{"type":"ox","q":"接ぎ木した苗の台木から出る芽（台芽）は、見つけしだいかき取る。","a":true,"why":"台芽は勢いが強く、放置すると穂木が負けて枯れ、台木の品種に入れ替わってしまうため。"},{"type":"ox","q":"取り木の環状剥皮では、木部まで削り取って水の通り道を断つ。","a":false,"why":"剥ぐのは樹皮と形成層まで。木部を残すから道管を通って水が上がり続け、枝が枯れずに発根できる。"},{"type":"ox","q":"高取り法では、環状剥皮した部分を湿らせた水ゴケで包み、ビニールで覆って乾かさないようにする。","a":true,"why":"発根には湿度が不可欠で、水ゴケが乾くと出かけた根が枯れてしまう。"},{"type":"ox","q":"自家不和合性とは、自分の花粉では受精しない性質のことである。","a":true,"why":"近親交配を避けるしくみで、ナシ、リンゴ、オウトウ、アブラナ科に多い。受粉樹やF1採種に関わる。"},{"type":"ox","q":"袋かけとは、母本にする花のおしべを開花前に取り除く作業のことである。","a":false,"why":"おしべを取り除くのは除雄。袋かけは、その後に他の花粉が混入しないよう袋で覆う作業である。"},{"type":"ox","q":"F1品種から採った種子をまけば、翌年も同じ形質の株がそろって育つ。","a":false,"why":"F1の次代は形質が分離し、草丈も花色も収量もばらばらになる。そろいのよさは一代限りである。"},{"type":"ox","q":"品種登録の期間が切れた品種は、一般品種として自由にふやすことができる。","a":true,"why":"育成者権が存続している登録品種のみ許諾が必要で、登録が切れた品種や在来種は自由に増殖できる。"},{"type":"ox","q":"オリヅルランやイチゴは、ランナー（ほふく枝）の先にできる子株でふやせる。","a":true,"why":"ランナーの子株を土に受けて発根させ、根が出てから切り離す。ユキノシタも同じ方法でふえる。"},{"type":"mc","q":"挿し床に無肥料で清潔な用土を使う理由として最も適切なものはどれか。","choices":["根がないうちは肥料を吸えず、肥料分は雑菌の餌になって切り口を腐らせるから","肥料分があると挿し穂が徒長して倒れてしまうから","無肥料の用土のほうが乾きやすく、水やりの回数を減らせるから"],"a":0,"why":"発根前の挿し穂は吸水も吸肥もできない。肥料と有機物は腐敗と病原菌の
