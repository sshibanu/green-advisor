水を回復させ、その後に<strong>目土</strong>を入れて凹凸を直し、地下茎を保護する。施肥は生育期に、雑草は密度を高く保つことが最良の対策となる。</p>","why":"芝は種類ごとに生育適温が決まっており、暖地型か寒地型かで生育期・休眠期・弱る季節がすべて反転するから。","keypoints":["日本芝（コウライシバ・ノシバ）＝暖地型。夏に生育、冬は休眠して褐色になる（枯死ではない）","西洋芝の多くは寒地型。冬も緑だが高温多湿の夏に弱く夏枯れしやすい","ティフトン（バミューダグラス系）は西洋芝だが暖地型","刈り込みは一度に葉の3分の1以上を刈らない。深刈りは軸刈りを招く","軸刈り＝生長点まで刈ること。葉が再生せず回復が遅れる","サッチング＝溜まった刈りかす・枯れ葉の層を掻き出し、通気と透水を回復","エアレーション（穴あけ）で土の固結を解消し、その後に目土を入れる"],"table":{"caption":"日本芝と西洋芝の比較","headers":["項目","日本芝（暖地型）","西洋芝（寒地型）"],"rows":[["代表種","コウライシバ、ノシバ","ケンタッキーブルーグラス、ベントグラス、トールフェスク"],["よく育つ季節","初夏〜盛夏","春と秋（冷涼期）"],["冬の姿","地上部が褐色になり休眠","緑を保つ"],["弱い条件","低温期の生育停止","高温多湿による夏枯れ"],["ふやし方","切り芝を張るのが一般的","種まきもできる"],["刈り込み頻度","生育期に定期的に","春秋は頻度が高くなる"],["手間","比較的少ない","多い（夏の管理が要）"]]},"mnemonic":"「日本芝は夏働いて冬眠る、西洋芝は冬起きて夏バテる」。"},{"heading":"生垣・冬の管理と年間カレンダー","dialogue":[{"who":"客","text":"生垣の下のほうがスカスカで、上ばかり茂ってしまうんです。"},{"who":"ハナ","text":"刈るときは上を軽く、下をしっかり……で合ってますか?"},{"who":"緑川","text":"逆だよ。上を強めに刈って光を下まで入れる。上が張り出すと下は日陰になって枯れ上がる。だから断面は上が狭い台形にする。"}],"body":"<p><strong>刈り込み</strong>は表面をそろえて<strong>面</strong>を作る作業、<strong>剪定</strong>は枝を一本ずつ選んで切る作業で、目的が違う。生垣は刈り込みが中心となり、生育期の年2回程度（伸びの止まる初夏と、秋）が目安。<strong>上部は強く、下部は弱く</strong>刈って断面を台形にすると、光が下枝まで届き<strong>枯れ上がり</strong>を防げる。マツやマキを球状に仕立てる<strong>玉散らし</strong>のような整形木も、内部に光を入れる考え方は同じである。</p><h4>庭木の支柱と冬の手当て</h4><p>植え付け直後の樹は根が張るまで揺れると活着しない。3本の丸太を斜めに掛ける<strong>八つ掛け</strong>、2本の柱に横木を渡す<strong>二脚鳥居</strong>などで固定し、幹と支柱の間には当て木や幹当てを入れて樹皮を守る。冬は<strong>幹巻き</strong>で幹の凍害・乾燥・日焼けを防ぎ、株元の<strong>マルチング</strong>で根を保温する。<strong>雪吊り</strong>は雪の重みによる枝折れを防ぐ支持である。<strong>寒肥</strong>は休眠期に有機質肥料などを樹冠の外周に施す施肥で、ゆっくり分解して<strong>春の芽出しに効く</strong>のが要点。落葉樹の植え替え・移植も休眠期が適期である。</p><h4>安全は作業計画の一部</h4><p>脚立は平らな場所に開き止めまで開いて据え、<strong>天板には乗らない</strong>。高所は高枝切りばさみで代替し、可能なら2人で作業する。電動工具は保護めがねを着け、巻き込まれない服装で扱う。夏は朝夕に作業時間をずらし、こまめな水分・塩分補給で<strong>熱中症</strong>を防ぐ。中腰の連続は<strong>腰痛</strong>の原因なので、柄の長い道具を使い、膝を曲げて持ち上げる。</p>","why":"光は上から届くため、上を強く刈らないと下枝が日陰で枯れ上がり、生垣も庭木も内部から失われるから。","keypoints":["刈り込み＝面をそろえる、剪定＝枝を選んで切る","生垣は上を強く・下を弱く刈り、断面を台形にして枯れ上がりを防ぐ","庭木の支柱は八つ掛け、二脚鳥居など。幹当てで樹皮を保護する","幹巻きは凍害・乾燥・日焼けの防止、雪吊りは雪の重みによる枝折れ防止","寒肥は休眠期に施し、ゆっくり分解して春の芽出しに効かせる","落葉樹の移植・植え替えは休眠期が適期","脚立の天板に乗らない、夏は朝夕作業、保護具の着用"],"table":{"caption":"年間作業カレンダー","headers":["時期","主な作業","ねらい・注意"],"rows":[["春（3〜5月）","植え付け・植え替え、種まき、常緑樹の芽出し前剪定、芝の目土・エアレーション、支柱立て","生育開始に合わせて土と株を整える"],["初夏（6月）","花木の花後剪定、摘心、生垣の刈り込み、追肥、防虫ネット掛け","花芽分化前に樹形を決める"],["梅雨","過湿対策と排水、枝を透かして通風確保、病害の早期発見、鉢の雨よけ","多湿は病害の最大要因"],["盛夏（7〜8月）","早朝と夕方の水やり、遮光・敷きわら、花がら摘み、切り戻し、強剪定は避ける","日中の水やりと強剪定は株を傷める"],["秋（9〜11月）","秋の刈り込み、球根の植え付け、株分け、施肥（お礼肥）、落ち葉の掃除と腐葉土づくり","翌春に向けた仕込みの季節"],["冬（12〜2月）","落葉樹の剪定、寒肥、幹巻き・マルチング・雪吊り、休眠期の移植、道具の手入れ","休眠期は樹への負担が小さい"]]},"mnemonic":"冬は「切って・埋めて・巻いて・研ぐ」。落葉樹の剪定、寒肥、防寒、道具の手入れ。"}],"quiz":[{"type":"ox","q":"ジョウロのハス口を上向きにすると、水はやわらかく細かく降り、種まき後や幼苗の水やりに向く。","a":true,"why":"上向きだと水がいったん上に散ってから落ちるため衝撃が小さい。下向きは勢いと水量が増し、株元や広い面向き。"},{"type":"ox","q":"剪定ばさみのアンビル式は、二枚の刃がすれ違って切るため切り口が平滑で、生きた枝に最も適する。","a":false,"why":"刃がすれ違うのはバイパス式。アンビル式は受け台に押しつける構造で切り口がつぶれやすく、枯れ枝・硬い枝向き。"},{"type":"ox","q":"誘引で8の字がけをするのは、茎が肥大したときにひもが食い込むのを防ぐためである。","a":true,"why":"支柱側を固く、茎側をゆるく結ぶことで締めつけず、風による擦れ傷も防げる。"},{"type":"ox","q":"鉢植えの水やりは、少量をこまめに与えて常に土を湿らせておくのが理想である。","a":false,"why":"原則は「乾いたらたっぷり」。常に湿っていると土中の酸素が欠乏し根腐れを招く。たっぷり与える水は土の換気も兼ねる。"},{"type":"ox","q":"根腐れを起こした株は、根が水を吸えなくなるため地上部がしおれ、水切れと似た症状を示す。","a":true,"why":"見分けがつきにくく追い水で悪化しやすい。しおれたらまず鉢の重さと土の湿りを確認する。"},{"type":"ox","q":"落葉樹の剪定は、枝ぶりが見えて樹への負担も小さい落葉後の休眠期が基本である。","a":true,"why":"養分が根と幹に蓄えられている時期のため負担が小さい。ただし厳寒期の強い切り込みは避ける。"},{"type":"ox","q":"多くの花木は、花が終わって秋になってから剪定するとよく咲くようになる。","a":false,"why":"多くの花木は初夏から夏に翌年の花芽を作るため、それ以降の剪定は花芽を切り落とす。原則は「花後すぐ」。"},{"type":"ox","q":"間引き剪定（枝抜き）は枝を付け根から切る方法で、樹全体の大きさを変えずに密度を下げられる。","a":true,"why":"切り返し剪定は枝の途中で切るため、切り口近くの芽が動いて枝数が増え、勢いが強くなる。"},{"type":"ox","q":"枝を切るときは内芽の上で切ると、枝が外へ向かって伸び樹冠の内部が混みにくい。","a":false,"why":"外向きに伸ばしたいなら外芽の上で切る。内芽で切ると枝が内側へ向かい、ふところが混んで暗くなる。"},{"type":"ox","q":"摘心（ピンチ）は頂芽優勢を解除する操作で、わき芽が伸びて枝数や花数が増える。","a":true,"why":"先端がわき芽の伸長を抑えているため、先端を摘むと抑制が解ける。摘芽は逆に不要なわき芽を除く操作。"},{"type":"ox","q":"花がら摘みの主なねらいは、種子形成に養分が転換されるのを防ぎ、次の花を咲かせることである。","a":true,"why":"併せて、腐った花弁が灰色かび病などの発生源になるのを防ぐ意味もある。"},{"type":"ox","q":"コウライシバやノシバは寒地型で、冬も緑を保ち夏の高温多湿に弱い。","a":false,"why":"日本芝は暖地型で、夏に旺盛に育ち冬は休眠して褐色になる。冬も緑で夏に弱いのは寒地型の西洋芝。"},{"type":"ox","q":"芝刈りでは、伸ばしてから一度に短く刈り込むと軸刈りになり、回復が著しく遅れる。","a":true,"why":"生長点まで刈ってしまうと葉が再生しない。一度に葉の3分の1以上は刈らないのが原則。"},{"type":"ox","q":"エアレーションは、踏圧で固まった土に穴をあけて通気と排水を回復させる作業である。","a":true,"why":"作業後に目土を入れて凹凸を直し、地下茎を保護するとよい。サッチングは溜まった刈りかす層の除去。"},{"type":"ox","q":"生垣の刈り込みでは、下部を強く上部を弱く刈って、断面を上が広い形にするとよい。","a":false,"why":"逆で、上を強く刈って光を下まで届かせる。上が張り出すと下枝が日陰になって枯れ上がる。断面は上が狭い台形。"},{"type":"ox","q":"寒肥は休眠期に施す施肥で、ゆっくり分解して春の芽出しに効かせるねらいがある。","a":true,"why":"有機質肥料などを樹冠の外周に施す。速効性を期待する施肥ではない。"},{"type":"mc","q":"粘土質で硬く締まった土を砕いて起こすのに、最も適した道具はどれか。","choices":["刃が三本に分かれた備中ぐわ","刃が平らな角形スコップ","柄の長い三角ホー"],"a":0,"why":"分かれた刃は土に食い込みやすく、塊を砕くのに向く。角形スコップはすくう・ならす、三角ホーは表土を削る道具。"},{"type":"mc","q":"用土をふるいにかける主な目的はどれか。","choices":["肥料成分を均一に混ぜるため","土を殺菌するため","細かいみじんを除いて排水と通気を確保するため"],"a":2,"why":"みじんが残ると隙間が詰まって水はけと通気が悪くなる。ふるいに殺菌や施肥の働きはない。"},{"type":"mc","q":"生きた枝を切るときにバイパス式の剪定ばさみが推奨される理由はどれか。","choices":["小さい力で太い枝を切れるから","刃がすれ違うため切り口がつぶれず平滑になるから","刃がさびにくい材質だから"],"a":1,"why":"アンビル式は受け台に押しつけるため組織がつぶれ、乾燥や腐朽菌の侵入を招きやすい。"},{"type":"mc","q":"剪定ばさみやのこぎりを株ごとに消毒する最大の理由はどれか。","choices":["刃の切れ味を保つため","樹液のべたつきを取るため","病原体を次の株へ運ばないため"],"a":2,"why":"とくにウイルス病は汁液で伝染する。切れ味維持は洗浄・乾燥・注油、清潔さの確保は消毒と役割が分かれる。"},{"type":"mc","q":"鉢植えのつる性植物を、鉢の上でコンパクトに仕立てる方法はどれか。","choices":["あんどん仕立て","二脚鳥居","八つ掛け"],"a":0,"why":"あんどん仕立ては3〜4本の支柱に輪状にひもを回す方法。二脚鳥居と八つ掛けは庭木を支える支柱の形式。"},{"type":"mc","q":"ビニールトンネルを使うとき、最も注意すべきことはどれか。","choices":["夜間に必ず外すこと","晴天日に換気して高温障害を防ぐこと","水やりを完全に止めること"],"a":1,"why":"保温力が大きい分、晴天日は内部が高温になる。すそを上げるなどして換気する。"},{"type":"mc","q":"シルバー（銀色）マルチの特徴として正しいものはどれか。","choices":["反射光でアブラムシを寄せつけにくく、地温上昇を抑える","地温を最も強く上げる","光を通すためマルチ下に雑草が生える"],"a":0,"why":"地温上昇が最大なのは透明マルチ、雑草抑制と地温上昇の両立は黒マルチ。銀色は反射による忌避と高温対策。"},{"type":"mc","q":"水を鉢底から流れ出るまでたっぷり与えることの、土の中で起きる効果はどれか。","choices":["古い空気と老廃物を押し出し、新しい空気を引き込む","土の粒子を細かく砕く","肥料成分を土に固定する"],"a":0,"why":"水が抜けるときに新鮮な空気が入る。少量ずつでは下層が乾いたままで塩類も溜まりやすい。"},{"type":"mc","q":"真夏の鉢植えで、水やりを避けるべき時間帯とその理由の組み合わせはどれか。","choices":["早朝／気温が低く吸収が悪いため","日中／鉢内の水温と地温が上がり根を傷めるため","夕方／夜間に凍結するため"],"a":1,"why":"夏は早朝と夕方が基本。夜間凍結を避けるのは冬の話で、冬は暖かい午前中に与える。"},{"type":"mc","q":"留守中の対策として「常時続けると根腐れを招く」ため短期にとどめるべき方法はどれか。","choices":["自動潅水タイマー","受け皿に水をためる腰水","日陰にまとめて置く"],"a":1,"why":"腰水は常に土が飽和して酸素欠乏になる。短期の応急処置として使う。"},{"type":"mc","q":"強剪定を行ったときに起こりやすいこととして、正しいものはどれか。","choices":["徒長枝が多発し、花つきが落ちることがある","必ず翌年の花つきがよくなる","樹形は変えられない"],"a":0,"why":"強く切ると樹はバランスを取り戻そうと勢いのある枝を出す。樹形の作り直しはできるが花つきは犠牲になりやすい。"},{"type":"mc","q":"忌み枝のうち、1か所から放射状に3本以上出た枝を何というか。","choices":["からみ枝","逆さ枝","車枝"],"a":2,"why":"車枝はその部分だけが太って樹形が不自然になる。からみ枝は交差する枝、逆さ枝は内側へ向かう枝。"},{"type":"mc","q":"枝を切る位置として最も適切なのはどれか。","choices":["芽のすぐ真上、芽に密着させて","芽の5mm〜1cmほど上を、芽と反対側へ軽く傾けて","芽から5cm以上離した位置で"],"a":1,"why":"近すぎると芽が乾き、遠すぎると残った部分が枯れ込んで腐朽の入口になる。"},{"type":"mc","q":"トマトのわき芽を取り除く作業の分類と目的はどれか。","choices":["摘芽で、養分を残す枝に集中させる","摘心で、頂芽優勢を解除する","摘蕾で、実を大きくする"],"a":0,"why":"摘心は先端の生長点を摘む操作。摘蕾はつぼみを減らす操作で、わき芽の除去は摘芽（芽かき）。"},{"type":"mc","q":"西洋芝でも暖地型に分類されるものはどれか。","choices":["ケンタッキーブルーグラス","ベントグラス","ティフトン（バミューダグラス系）"],"a":2,"why":"ケンタッキーブルーグラスとベントグラスは寒地型。ティフトンは西洋芝だが暖地型で、夏に旺盛に育つ。"},{"type":"mc","q":"芝生のサッチングとはどのような作業か。","choices":["土に穴をあけて通気と排水を回復させる","刈り込み後に細かい土をまく","溜まった刈りかすや枯れ葉の層を掻き出す"],"a":2,"why":"穴あけはエアレーション、細かい土をまくのは目土入れ。サッチは通気・透水を妨げ病害の原因になる。"}]},{"id":13,"title":"花壇・コンテナ・室内","subtitle":"花壇の型と色の組み方、鉢と室内の植物の扱いを設計できる","minutes":50,"goals":["花壇の型（境栽・平面・沈床・高設ほか）を見分け、見る方向に合わせて草丈・株間・花期を設計できる","色相環にもとづく配色と進出色・後退色の理屈を使い、遠目にも効く花壇と寄せ植えを組み立てられる","鉢の素材・大きさ・植え替えの判断、室内の光量の読み方、切り花の水あげまでを理由つきで説明できる"],"sections":[{"heading":"骨格が先、花はあと ― 庭とベランダの設計","dialogue":[{"who":"客","text":"庭を花でいっぱいにしたくて、好きな苗を三十株ほど買ったんです。でも植えたら、なんだかごちゃごちゃで。"},{"who":"ハナ","text":"きれいな花ばかりなのに、どうしてでしょう……。"},{"who":"緑川","text":"庭は絵ではなく部屋なんです。先に決めるのは花ではなく、人がどう歩くか、どこに視線が止まるか、どこを隠すか。骨格が決まっていない庭に花を足すと、増やすほど散らかります。"},{"who":"ハナ","text":"家具を置く前に間取りを決める、みたいなことですね。"}],"body":"<p>庭づくりの順番は<strong>「動線 → 目隠し → フォーカルポイント → 花壇」</strong>だと考えるとよい。まず<strong>動線</strong>、つまり玄関から門、物干し、駐車場へと人が実際に歩く線を確保する。動線をふさぐ場所に花壇をつくると、必ず踏まれるか、通るたびに邪魔になる。次に<strong>目隠し</strong>。隣家の窓や道路からの視線を、樹木・生垣・フェンス・トレリスで切る。ここが片づくと、庭は「外」から「部屋」に変わる。</p><p>そのうえで<strong>フォーカルポイント</strong>を一つ置く。視線が最後に着地する場所のことで、シンボルツリー、鉢、ベンチ、水景、彫像などが役を担う。狭い庭にフォーカルポイントを二つ三つ置くと視線が迷い、かえって狭く見える。<strong>一つに絞るのが原則</strong>だ。園路は動線をなぞって敷き、足元をグラウンドカバーや下草でつなぐと、余白が「未完成」ではなく「間」に見えてくる。照明は明るくするためではなく、夜に見せたい一点だけを照らすために使う。</p><p>庭がなくベランダや屋上を使う場合は、設計の前に<strong>物理的な制約</strong>を先に確認する。<strong>荷重</strong>（土は水を含むと重い）、<strong>風</strong>（高所ほど強く、乾燥と転倒を招く）、<strong>排水</strong>（階下や排水口）、<strong>防水層</strong>を傷めないこと、そして<strong>避難経路をふさがないこと</strong>。ベランダの隔て板や避難ハッチの前に鉢を置くのは、見た目以前に安全上の禁止事項である。</p>","why":"庭の快適さは花の数ではなく動線と視線の設計で決まるため、骨格を先に決めないと植栽は足すほど散らかる。","keypoints":["設計の順番は動線 → 目隠し → フォーカルポイント → 花壇。花を選ぶのは最後","フォーカルポイント（視線の着地点）は原則一つ。増やすと視線が迷い、空間が狭く感じられる","シンボルツリーは家の顔となる中高木。目隠しと日陰づくりを兼ねさせると効率がよい","屋上・ベランダ緑化では荷重・風・排水・防水層・避難経路の5点を植栽計画より先に確認する","屋上では人工軽量土壌（パーライトなどを配合）と耐根シート・排水層を用いて荷重と防水層の損傷を抑える","ベランダの避難ハッチ・隔て板の前に鉢や棚を置いてはならない","緑のカーテンは日射をさえぎるだけでなく、葉の蒸散による気化熱で周囲の温度も下げる"],"table":{"caption":"庭のデザイン要素と、その役割","headers":["要素","役割","設計の勘どころ"],"rows":[["動線","人の通り道を確保する","実際に歩く線をなぞる。花壇で横切らない"],["目隠し","視線を切って囲まれ感をつくる","全部を囲まず、隠したい方向だけ。風は通す"],["フォーカルポイント","視線の着地点をつくる","一庭に一つ。動線の正面か突き当たりに置く"],["シンボルツリー","家の顔・季節感・日陰","成木の樹高と根張りで選ぶ。隣地境界から離す"],["園路","歩行面の保護と誘導","幅は片道60cm、二人並ぶなら90cm以上が目安"],["グラウンドカバー・下草","土の露出を隠し雑草を抑える","踏むか踏まないかで種類を分ける"],["水景","涼感と音、生き物を呼ぶ","蚊の発生と安全（幼児）に配慮。動かす水にする"],["照明","夜の見せ場をつくる","全体照明ではなく一点を照らす。上向きは近隣に配慮"]]},"mnemonic":"庭づくりの順は「ど・め・フォ・か（動線・目隠し・フォーカルポイント・花壇）」。"},{"heading":"花壇の型 ― どこから見るかで決まる","dialogue":[{"who":"客","text":"花壇と言っても、公園のあの模様のやつと、うちの塀ぎわとでは、ぜんぜん違いますよね。"},{"who":"緑川","text":"違うのは形ではなく見る位置です。塀ぎわは前からしか見えない。公園の模様花壇は上から見下ろす前提でつくられている。見る位置が決まれば、型はほぼ自動的に決まります。"},{"who":"ハナ","text":"じゃあ、お客さまの庭でまず聞くべきなのは『どこから眺めますか』ですね。"}],"body":"<p>花壇の分類は、見た目の名前を覚える作業ではなく、<strong>見る方向と土のつくり方</strong>の分類だと理解すると一気に楽になる。</p><p><strong>境栽花壇（ボーダー花壇）</strong>は建物や塀、生垣に沿って細長くつくる花壇で、見る方向は<strong>一方向</strong>。だから後方に高性種、前方に矮性種を階段状に並べる。<strong>平面花壇</strong>は草丈のそろった低い植物を密植し、上から模様として眺めるもので、じゅうたんに見立てて<strong>カーペット花壇（毛せん花壇）</strong>とも呼ぶ。刈り込みで模様を保つため手間はかかるが、公共空間では効果が大きい。</p><p><strong>沈床花壇（サンクンガーデン）</strong>は周囲より<em>一段低く</em>掘り下げた花壇で、上から見下ろすため模様がよく見え、風もよけられる。逆に<strong>高設花壇（レイズドベッド）</strong>は枠で囲って土を高く盛る。排水がよくなり、深く耕せない場所でも植えられ、かがまずに作業できるのでユニバーサルデザインの観点からも有効だ。</p><p>ほかに、石組みの間に高山植物や乾燥に強い植物を植える<strong>ロックガーデン</strong>、宿根草を主体に骨格をつくる<strong>宿根草花壇</strong>、宿根草に一年草や球根、低木を混ぜて長期間見せる<strong>ミックスボーダー</strong>、種子を播いて自然な草原風に仕立てる<strong>ワイルドフラワー花壇</strong>がある。</p>","why":"花壇の型は「見る方向」と「土の高さ」の組み合わせで決まり、そこから草丈配置と管理の手間が導かれる。","keypoints":["境栽花壇（ボーダー花壇）は建物や塀ぎわの細長い花壇で、見る方向は一方向。後方が高く前方が低い","四方向から見る独立花壇（島花壇）は中央を高く、周囲を低くする","平面花壇は低く草丈のそろった植物を密植して模様にする。カーペット花壇・毛せん花壇とも呼ぶ","沈床花壇は周囲より低く掘り下げる。高設花壇（レイズドベッド）は枠で囲って高く盛る（逆にしないこと）","高設花壇は排水がよく、かがまずに作業できるためバリアフリーの花壇として使われる","ロックガーデンは石組みで水はけと通気を確保し、高山植物や乾燥地性の植物に向く","ミックスボーダーは宿根草＋一年草＋球根＋低木の混植で、長期間見せることをねらう","ワイルドフラワー花壇は播種による自然風の草原。手間は少ないが雑草との区別が難しい"],"table":{"caption":"花壇の型と特徴","headers":["型","見る方向","つくり","向いている場所・植物","手間"],"rows":[["境栽花壇（ボーダー）","一方向","細長い帯状。奥が高く手前が低い","塀ぎわ・建物沿い・生垣の前","中"],["独立花壇（島花壇）","四方向","中央が高く周囲が低い","広場や芝生の中央","中"],["平面花壇（カーペット・毛せん）","上から見下ろす","低い植物を密植し刈り込んで模様に","公園・広場・傾斜面","大"],["沈床花壇（サンクンガーデン）","上から見下ろす","周囲より一段掘り下げる","見下ろせる敷地・風の強い場所","中"],["高設花壇（レイズドベッド）","横・やや上","枠で囲い土を高く盛る","排水の悪い土地・車いすでの作業","小〜中"],["ロックガーデン","横・上","石を組み隙間に植える","高山植物・多肉・乾燥に強い草花","小"],["宿根草花壇","一〜四方向","宿根草主体で骨格を固定","毎年同じ場所で楽しみたい庭","小"],["ミックスボーダー","一方向が多い","宿根草＋一年草＋球根＋低木","長期間途切れず見せたい場所","中〜大"],["ワイルドフラワー花壇","四方向","播種して自然風の草原に","広い法面・空地・粗放管理の場所","小"]]}},{"heading":"植栽の設計 ― 草丈・株間・まとめ植え・花期のリレー","dialogue":[{"who":"客","text":"去年つくった花壇、写真で見るとどうも間延びしていて。一株ずつ違う花を買ったのが楽しかったんですけど。"},{"who":"ハナ","text":"……全部が一株ずつだと、遠目には点々にしか見えないんですね。"},{"who":"緑川","text":"そう。人の目は3メートルも離れると一株の花を識別できない。色のかたまりしか見えないんです。だから同じものを3株、5株とまとめて植える。種類を減らして株数を増やすほうが、たいてい豪華に見えます。"}],"body":"<p>花壇の設計は、次の4つを順に決めれば形になる。<strong>(1)草丈の配置 (2)株間 (3)まとめ方 (4)花期のリレー</strong>。</p><p><strong>草丈</strong>は見る方向に従う。一方向なら奥から高性・中性・矮性の階段、四方向なら中央が高い山型にする。ただし全部をきれいな階段にすると単調なので、手前に少しだけ高いものを差し込んで奥行きを出すこともある。</p><p><strong>株間</strong>は「成長後の大きさ」で決める。植えた直後にちょうどよく見える間隔は、たいてい狭すぎる。矮性種でおよそ15〜20cm、中性種で20〜30cm、高性種で30〜40cmが目安。狭すぎると蒸れて下葉が枯れ、病気が出る。</p><p><strong>まとめ方</strong>はマッス植栽（群植）が基本だ。同じ品種を3株、5株と<em>奇数</em>でかためて植えると、遠目に一つの色面として認識される。さらに同じ塊を花壇の中で数か所くり返す（<strong>リズムと反復</strong>）と、視線が流れて全体がまとまる。</p><p><strong>花期のリレー</strong>は、開花期の異なる植物を組み合わせて途切れなく見せる考え方。宿根草で骨格をつくり、隙間を一年草と球根で埋めるのが定石で、日本の家庭では春（3〜5月）と秋（10〜11月）の年2回、一年草を入れ替える運用が中心になる。</p>","why":"遠くからは一株ではなく色の塊しか見えないため、まとめ植えと草丈の段差が花壇の印象を決める。","keypoints":["一方向から見る花壇は奥が高く手前が低い。四方向から見る花壇は中央が高い","株間は成長後の株張りで決める。矮性15〜20cm、中性20〜30cm、高性30〜40cmが目安","詰めすぎは蒸れ・徒長・病害の原因。植え付け直後にすいて見えるのが正常","マッス植栽（群植）は同一品種を3株・5株と奇数でまとめる。遠目に色面として効く","同じ塊を数か所でくり返す（リズムと反復）と、種類を増やさずにまとまりが出る","花期のリレーは宿根草で骨格、一年草と球根で隙間を埋めるのが基本","一年草の植え替えは春と秋の年2回が中心。夏花壇は5月ごろ、冬〜春花壇は10〜11月に植え付ける"],"table":{"caption":"花期のリレーを組む（一例）","headers":["時期","主役になる植物","植え付けの時期","役割"],"rows":[["3〜5月","パンジー・ビオラ、チューリップ、ネモフィラ","前年10〜11月（球根も同時期）","春の主役。秋植えの成果が出る"],["5〜6月","宿根草（ジギタリス、シャスタデージー）","前年秋または春","一年草の入れ替えの端境をつなぐ"],["6〜9月","ペチュニア、サルビア、マリーゴールド、ニチニチソウ","5月ごろ","暑さに強い夏の主力"],["9〜11月","コスモス、キク、シュウメイギク、宿根アスター","夏まで（宿根草は既存株）","秋の彩り。夏花壇の疲れを引き継ぐ"],["12〜2月","ハボタン、シクラメン（ガーデンタイプ）、ビオラ","10〜11月","冬の骨格。葉物で色を保つ"]]},"mnemonic":"「奥が高く、3株まとめて、くり返す」。株間は植えた直後にすいて見えるくらいが正解。"},{"heading":"色の設計 ― 色相環と、進む色・退く色","dialogue":[{"who":"客","text":"苗売り場でつい全色買ってしまうんです。赤も黄もピンクも紫も。"},{"who":"ハナ","text":"わかります……。でも花壇にすると、なぜかにぎやかすぎる感じに。"},{"who":"緑川","text":"色は増やすほど散ります。使う色は2〜3色に絞る。そのうえで白か銀葉を混ぜると、色同士がけんかしなくなる。白は色ではなく、色と色の間に置くすきまなんです。"}],"body":"<p>配色は感覚ではなく<strong>色相環</strong>という地図で説明できる。赤・橙・黄・緑・青・紫を輪にしたもので、位置関係から3つの型が導かれる。</p><ul><li><strong>同系色（類似色）配色</strong>…色相環で隣り合う色でまとめる。失敗が少なく穏やか。単調になりやすいので、明度（明るさ）や彩度（鮮やかさ）に差をつける。</li><li><strong>補色（反対色）配色</strong>…色相環の正反対どうし（黄と紫、赤と緑、青と橙）。互いを引き立て、強く目立つ。面積を同量にすると騒がしいので、片方を主役、片方を差し色にする。</li><li><strong>単色（モノトーン）配色</strong>…一色でまとめ、濃淡と葉の形で変化をつける。上品だが、まとめ役の白や葉色がないとのっぺりする。</li></ul><p>もう一つ効くのが<strong>進出色と後退色</strong>だ。赤・橙・黄などの<strong>暖色は手前に迫って見え（進出色）</strong>、青・紫などの<strong>寒色は遠くに引いて見える（後退色）</strong>。だから狭い庭の奥に寒色を置くと奥行きが出る。逆に、道路から眺めるような<strong>遠くから見る花壇では暖色と白が映え</strong>、青紫は距離とともに沈んで見えなくなる。</p><p><strong>白花と銀葉（シルバーリーフ）</strong>は、色と色の間に入って対立をやわらげる「つなぎ」であり、同時に全体を引き締める役でもある。夕暮れどきに最後まで見えるのも白である。</p>","why":"色の見え方は光の波長と距離に左右されるため、暖色は近く大きく、寒色は遠く小さく見え、配置の意味が変わる。","keypoints":["使う色は2〜3色に絞る。色数を増やすほど散漫になる","同系色（類似色）配色は色相環で隣り合う色。穏やかだが単調になりやすく、明度・彩度で変化をつける","補色（反対色）配色は色相環の正反対どうし。互いを強め合うので、面積比に差をつけて使う","暖色は進出色で手前に迫って見え、寒色は後退色で遠くに引いて見える","奥に寒色を置くと奥行きが出る。遠景から見る花壇では暖色と白がよく映える","白花と銀葉は色同士のつなぎ役かつ引き締め役。薄暗い時間帯にも見える","明度は明るさ、彩度は鮮やかさ。同系色でまとめるときはこの2つで差をつくる"],"table":{"caption":"配色の3つの型と使いどころ","headers":["型","色相環での位置","印象","組み合わせ例","注意"],"rows":[["同系色（類似色）配色","隣り合う色","穏やか・まとまる","赤〜桃〜橙／青〜青紫〜紫","単調になりやすい。濃淡で変化を"],["補色（反対色）配色","正反対","鮮烈・目を引く","黄とすみれ色／橙と青","同面積は騒がしい。主役と差し色に"],["単色（モノトーン）配色","一色のみ","上品・洗練","白一色の庭／青一色の花壇","葉色と濃淡でめりはりをつける"],["白・銀葉を加える","無彩色・灰緑","つなぎ・引き締め","どの型にも足せる","入れすぎると主役がぼやける"]]},"mnemonic":"「暖色は前へ出て、寒色は下がる」。だから奥に青、遠景に赤と白。"},{"heading":"器を選ぶ ― 素材で水やりの回数が変わる","dialogue":[{"who":"客","text":"同じ花を、素焼きの鉢とプラスチックの鉢に植えたんです。素焼きのほうだけ、すぐしおれてしまって。"},{"who":"ハナ","text":"水やりの回数は同じにしていましたか？"},{"who":"客","text":"ええ、まったく同じで。"},{"who":"緑川","text":"そこが原因です。素焼きは器そのものが水を通して、外側から蒸発する。プラスチックは通さない。鉢を替えたら水やりの間隔も替える。器選びは、水やりの設計そのものなんです。"}],"body":"<p>鉢は見た目で選ぶ前に、<strong>乾きやすさ</strong>で選ぶ。素材ごとに壁面から水が抜けるかどうかが違い、それがそのまま水やり間隔を決める。</p><p><strong>素焼き鉢（テラコッタを含む）</strong>は焼きしめが弱く多孔質で、鉢壁からも水が蒸発する。<strong>最も乾きやすく通気性が高い</strong>ので、過湿を嫌う植物や、水をやりすぎる人に向く。ただし乾燥地では水切れしやすく、冬季は凍結で割れることがある。<strong>プラスチック鉢</strong>は水を通さないので乾きにくく、軽く安く割れにくい。過湿にしやすいのが弱点で、鉢内の温度が上がりやすい。<strong>釉薬をかけた陶器鉢</strong>もほぼ水を通さず、重い分だけ倒れにくい。<strong>木製</strong>は断熱性があり鉢内の温度変化が小さいが、いずれ腐る。</p><p>大きさは<strong>号</strong>で表し、<strong>1号＝約3cm</strong>（直径）。5号鉢なら直径約15cmである。深さも重要で、根を深く張るものは深鉢、浅く広がるものや多肉には浅鉢が合う。</p><p>どの鉢でも共通する条件が<strong>鉢底穴</strong>だ。余分な水が抜けなければ根は酸素を得られず根腐れする。穴のない容器を使うときは、必ず内側に穴あきの鉢を入れる（鉢カバーとして使う）。<strong>スリット鉢</strong>は側面の細い切れ込みから空気が入り、根が鉢壁に沿ってぐるぐる回る<strong>根巻き（サークリング）を抑える</strong>のが特徴で、苗の生産に広く使われる。</p>","why":"鉢の壁が水と空気を通すかどうかで乾く速さと根への酸素供給が変わるため、素材を替えれば水やりの間隔も変わる。","keypoints":["乾きやすさの順は、おおむね素焼き（テラコッタ）＞木製＞プラスチック・釉薬をかけた陶器","素焼き鉢は通気性が高く過湿を嫌う植物向き。ただし水切れしやすく凍結で割れることがある","プラスチック鉢は軽く安いが乾きにくい。同じ水やり間隔では過湿になりやすい","鉢の大きさは号で表し、1号＝約3cm。5号鉢は直径約15cm","鉢底穴のない容器に直接植えない。根が酸素不足になり根腐れする。使うなら鉢カバーとして","スリット鉢は側面の切れ込みで通気を確保し、根が鉢壁を回る根巻き（サークリング）を抑える","浅く広がる根の植物や多肉には浅鉢、直根性や根が深いものには深鉢を合わせる"],"table":{"caption":"鉢の素材と性質","headers":["素材","通気・排水","乾き方","重さ","向いている使い方"],"rows":[["素焼き・テラコッタ","高い（壁から蒸発）","速い","中〜重","過湿を嫌う植物、水をやりすぎる人"],["駄温鉢（縁に釉薬）","中","やや速い","重い","山野草や東洋ラン、一般の鉢物"],["プラスチック","低い（壁は通さない）","遅い","軽い","大量管理、持ち運び、吊り鉢"],["釉薬をかけた陶器","低い","遅い","重い","室内観賞、風で倒れやすい場所"],["木製（プランター・樽）","中","中","重い","根の温度変化を抑えたい場合"],["スリット鉢（樹脂）","高い（側面の切れ込み）","やや速い","軽い","根巻きを避けたい苗の生産・育成"]]},"mnemonic":"「素焼きは呼吸する、プラは呼吸しない」。号数は3倍して直径のセンチ。"},{"heading":"寄せ植えとハンギング ― 主役・中間・垂れ","dialogue":[{"who":"客","text":"教わったとおり寄せ植えを作ったんですが、一か月で片方が枯れて、片方は暴れ放題で。"},{"who":"ハナ","text":"どんな組み合わせでしたか？"},{"who":"客","text":"多肉植物と、パンジーと、あとアイビーです。かわいかったんですよ。"},{"who":"緑川","text":"色は合っていました。合っていなかったのは水の好みです。乾かしたい多肉と、乾かしたくないパンジーは同居できない。寄せ植えでいちばん先にそろえるのは、色でも形でもなく環境の要求なんです。"}],"body":"<p>寄せ植えの構成には便利な型がある。<strong>スリラー（主役）・フィラー（中間を埋める）・スピラー（縁から垂れる）</strong>の三役だ。背が高く目を引くものを主役に、株が丸くこんもり茂るもので隙間を埋め、つる性や下垂性のもので鉢の縁を隠す。この三役がそろうと、鉢と植物の境目が消えて一つの塊に見える。</p><p>ただし型より優先される鉄則がある。<strong>水と光の要求が同じ植物を組む</strong>ことだ。一つの鉢は一つの水やり管理しかできない。乾かす植物と湿らせる植物を同居させれば、どちらかは必ず壊れる。次に<strong>生育速度</strong>。伸びの速いものを混ぜると、数週間で他をのみ込んでしまう。</p><p>そのうえで<strong>対比</strong>を仕込む。花の色だけでなく、葉の<strong>テクスチャ</strong>（細葉と大葉、つや葉とマット、斑入りと無地）を変えると、花が休んでいる時期も見られる鉢になる。株数は鉢の大きさに対して欲張らないこと。詰め込むと蒸れて下葉が落ちる。</p><p>植え付けでは、ポットから抜いた<strong>根鉢は基本的に崩さない</strong>。根を切れば活着が遅れ、寄せ植え全体の生育がそろわなくなる。根が回りすぎている場合だけ、底を軽くほぐす。<strong>ハンギングバスケット</strong>は乾きやすく、上部より下部が乾きやすいので水は十分に、風の通る場所では日に複数回必要になることもある。ウォールバスケットやスタンドで壁や柵を飾るときは、金具の強度と落下、水の垂れ先を必ず確認する。</p>","why":"一つの鉢では水やりも日照も一通りしか与えられないため、環境要求のそろわない植物は同居できない。","keypoints":["構成の型はスリラー（主役・高い）、フィラー（中間・こんもり）、スピラー（垂れる・縁を隠す）","型より優先されるのは水と光の要求をそろえること。多肉と草花の同居は失敗の典型","生育速度もそろえる。伸びの速いものは他を覆ってしまう","葉のテクスチャ（細葉・大葉、斑入り・無地、つや・マット）の対比で花のない時期も見せる","植え付け時は根鉢を崩さないのが原則。根が回りすぎた株だけ底を軽くほぐす","株を詰め込みすぎない。蒸れて下葉が落ち、姿が崩れる","ハンギングバスケットは風に当たり乾きやすいので、水やり回数は地面置きの鉢より多くなる","壁掛け・スタンドは金具の強度、落下、水の垂れる先（通行人・階下）を確認する"],"table":{"caption":"スリラー・フィラー・スピラーの役割と例","headers":["役","位置","求める姿","例"],"rows":[["スリラー（主役）","中央または後方","背が高く目を引く。1〜2種にしぼる","コルディリネ、グラス類、ジニア、ストック"],["フィラー（中間）","主役の周囲","こんもり茂って隙間を埋める","ビオラ、カルーナ、ヒューケラ、アリッサム"],["スピラー（垂れ）","鉢の縁","縁から下垂して鉢を隠す","ヘデラ（アイビー）、ワイヤープランツ、バコパ、ディコンドラ"]]},"mnemonic":"「主役・埋め・垂れ」の三役。ただし先にそろえるのは水と光。"},{"heading":"鉢物の維持 ― 回す・植え替える・受け皿を空ける","dialogue":[{"who":"客","text":"三年間ずっと同じ鉢なんです。最近、水をやってもすーっと流れて、土に染みない感じで。"},{"who":"ハナ","text":"鉢底の穴から、根が出ていませんか？"},{"who":"客","text":"あ、出ています。白いのがぐるぐる。"},{"who":"緑川","text":"典型的な根詰まりです。鉢の中が根でいっぱいになって、水と空気の入る隙間がなくなっている。植え替えの合図ですよ。"}],"body":"<p>鉢は土の量が限られた閉じた世界なので、放っておけば必ず<strong>根詰まり</strong>する。サインははっきりしている。<strong>鉢底穴から根が出る／水がしみ込まずあふれる、または一気に流れ落ちる／乾くのが異様に速い／新芽が出ない・下葉が黄変する</strong>。ここまで来たら植え替えの時期だ。</p><p>植え替えの適期は<strong>生育期に入る直前</strong>。多くの草花・観葉植物では春（おおむね4〜5月）で、真夏と厳寒期は根が傷を回復できないため避ける。方法は二通り。株を大きくしたいなら<strong>鉢増し</strong>で、一回り（1〜2号）大きい鉢に移す。いきなり何号も大きい鉢に植えると、根の届かない土がいつまでも湿ったままになり、かえって根腐れを招く。大きさを保ちたいなら<strong>同じ鉢に戻す</strong>。この場合は古い土を落として根を1/3程度整理し、地上部も同じくらい切り詰めて、吸う力と失う力のつり合いを取る。</p><p>日ごろの管理では、<strong>鉢を時々回す</strong>。植物は光の来る方向へ伸びるので、置きっぱなしだと片側だけが茂って形がゆがむ。<strong>受け皿にたまった水は捨てる</strong>。鉢底が水に浸かったままだと排水が止まり、根が酸素不足になって根腐れする。夏場は蚊の発生源にもなる。鉢は直接コンクリートに置かず、少し浮かせると地熱と過湿を避けられる。</p>","why":"鉢は土量が有限で外と切り離されているため、根の増加と排水の停滞が必ず酸素不足として現れる。","keypoints":["根詰まりのサイン＝鉢底から根が出る、水がしみ込まない、乾きが早すぎる、生育停滞と下葉の黄変","植え替えの適期は生育開始の直前。多くは春（4〜5月）。真夏と厳寒期は避ける","鉢増しは一回り（1〜2号）大きい鉢まで。急に大きくすると余った土が乾かず根腐れする","同じ鉢に戻すときは根を1/3ほど整理し、地上部も同程度切り詰めてつり合いを取る","鉢を定期的に回すのは、光の方向に片寄って伸びるのを防ぎ樹形を整えるため","受け皿の水は捨てる。溜め置くと排水が止まり酸素不足で根腐れ、夏は蚊の発生源にもなる","植え替え直後は直射日光と強風を避け、活着まで肥料は控える"],"table":{"caption":"植え替えの判断と方法","headers":["状況","判断","やること","理由"],"rows":[["鉢底穴から根が出ている","根詰まり","鉢増し、または根を整理して同じ鉢へ","根の量に対し土の容積が不足している"],["水がしみ込まない／すぐ流れる","根詰まり・土の劣化","古土を落として植え替える","根と劣化した土で隙間が失われた"],["株を大きくしたい","鉢増し","1〜2号大きい鉢に、根鉢は崩さず移す","根の伸びる余地を少しずつ与える"],["今の大きさを保ちたい","同鉢に戻す","根を1/3整理し、地上部も切り詰める","吸水量と蒸散量のつり合いを取る"],["真夏・厳寒期に不調","植え替えは待つ","日陰に移し水やりを見直す","根が傷を回復できない時期だから"]]},"mnemonic":"植え替えは「一回り」。二回り以上は根腐れの近道。"},{"heading":"室内の緑と切り花 ― 光を測り、水を上げる","dialogue":[{"who":"客","text":"リビングの奥に置いた観葉植物が、だんだん間のびして倒れそうで。水は毎日あげているんですけど。"},{"who":"ハナ","text":"毎日……。室内だと、それは多すぎるかもしれません。"},{"who":"緑川","text":"室内は風がなく光も弱い。植物が水を使う量そのものが少ないんです。光が弱いほど水は減らす。逆に、光を増やせないなら置き場所を変える。もらった花束の水あげも同じで、理屈がわかれば長持ちします。"}],"body":"<p>室内で最初に判断すべきは<strong>光量</strong>だ。目安は簡単で、<strong>その場所で新聞や本が楽に読めるか</strong>。読めない暗さでは、耐陰性のある植物でも長くはもたない。明るい窓辺、レースカーテン越し、室内奥の三段階で置ける植物が変わる。</p><p>室内の水やりが屋外と違うのは、<strong>光が弱く風がないため蒸散量が少ない</strong>からだ。同じ植物でも室内では土が乾きにくく、屋外の感覚で与えると過湿になる。土の表面ではなく、指を入れて中まで乾いたかで判断する。あわせて、<strong>エアコンの風を直接当てない</strong>（葉先が枯れる）、<strong>冬の夜は窓辺から部屋側に移す</strong>（夜間のガラス面は外気並みに冷え、カーテンの内側は冷気だまりになる）を守る。</p><p><strong>ハイドロカルチャー</strong>は土を使わず発泡煉石で支える方法で、清潔で虫がわきにくい。鉢底穴がなく水が滞留するため、<strong>ゼオライトなどの根腐れ防止剤</strong>を底に入れ、<strong>水位は容器の1/5〜1/4程度</strong>にとどめる。常に満水にすると根が酸素不足になる。</p><p>切り花では<strong>水あげ</strong>がすべてだ。切り口に空気が入ると水が上がらなくなるので、<strong>水切り</strong>（水中で切る）が基本。茎の弱い草花には<strong>湯あげ</strong>（切り口だけを熱湯に数十秒つけ、花や葉は紙で包んで蒸気から守り、すぐ深水へ）が効く。しおれた花は<strong>深水</strong>と<strong>切り戻し</strong>で回復する。花瓶には<strong>延命剤</strong>（糖分＋抗菌剤）を使い、水は毎日替える。カーネーションやスイートピー、ラン類は<strong>エチレン</strong>に敏感なので、果物（とくにリンゴ）のそばには置かない。</p>","why":"室内は光と風が乏しく蒸散が少ないため水の減りが遅く、切り花は切り口の空気づまりと細菌で水が上がらなくなる。","keypoints":["室内の光量の目安は「新聞が楽に読める明るさ」。それ以下では耐陰性植物でも徐々に衰える","耐陰性の高い観葉植物の例＝ポトス、サンセベリア、スパティフィラム、シェフレラ、アグラオネマ","室内で水やり間隔が長くなるのは、光が弱く風がないため蒸散量が少ないから","エアコンの風を直接当てない。葉先枯れと極端な乾燥を招く","冬の夜、窓とカーテンの間は外気並みに冷える。夜は部屋側へ移す","ハイドロカルチャーは根腐れ防止剤（ゼオライトなど）を底に入れ、水位は容器の1/5〜1/4。常時満水にしない","水切りは水中で茎を切る方法。切り口に空気が入るのを防いで吸水を回復させる","湯あげは切り口を熱湯に数十秒。花と葉は蒸気から守り、直後に深水へ移す","エチレンに弱い花＝カーネーション、スイートピー、ラン類。果物のそばを避ける","フラワーアレンジメントは面と量で構成する西洋の様式、生け花は線と余白・不等辺の構成を重んじる日本の様式"],"table":{"caption":"室内の光量区分と行事の植物","headers":["場所・区分","明るさの目安","適する植物・使い方"],"rows":[["明るい窓辺（直射が入る）","屋外に近い明るさ","多肉、ハーブ、花もの。夏は葉焼けに注意し遮光する"],["レースカーテン越し","明るいが直射なし","多くの観葉植物の最適域。フィカス、モンステラなど"],["室内の奥","新聞が読める程度","耐陰性の高いもの。ポトス、サンセベリア、アグラオネマ"],["新聞が読めない暗さ","生育には不足","植物は置かない。定期的に明るい場所へ移して交替させる"],["正月","行事の植物","マツ、タケ、ウメ、ハボタン、センリョウ・マンリョウ、フクジュソウ"],["ひな祭り（3月）","行事の植物","モモ、ナノハナ"],["母の日（5月）","行事の植物","カーネーション、鉢物のアジサイ"],["お盆（7〜8月）","行事の植物","キク、ホオズキ、ミソハギ"],["クリスマス（12月）","行事の植物","ポインセチア、シクラメン、モミ、ヒイラギ、シャコバサボテン"]]},"mnemonic":"室内は「光が弱い＝水も少ない」。切り花は「水切り・深水・毎日の水替え」。"}],"quiz":[{"type":"ox","q":"境栽花壇（ボーダー花壇）は建物や塀に沿ってつくり、原則として一方向から見るため、後方に草丈の高い植物を配置する。","a":true,"why":"見る方向が一方向なので、奥を高く手前を低くしないと後ろの株が隠れてしまう。四方向から見る独立花壇では中央を高くする。"},{"type":"ox","q":"沈床花壇（サンクンガーデン）は、周囲の地面より一段高く土を盛り上げてつくる花壇である。","a":false,"why":"逆である。沈床花壇は周囲より一段低く掘り下げ、上から見下ろして模様を楽しむ。高く盛るのは高設花壇（レイズドベッド）。"},{"type":"ox","q":"カーペット花壇（毛せん花壇）は、草丈の高い植物を主役にして立体感を出す花壇である。","a":false,"why":"毛せん花壇は草丈の低い植物を密植し、刈り込んでじゅうたんのような平面模様に仕立てる。高さではなく模様で見せる。"},{"type":"ox","q":"赤や橙などの暖色は遠くに引いて見え、青や紫などの寒色は手前に迫って見える。","a":false,"why":"逆である。暖色が進出色（手前に迫る）、寒色が後退色（遠のく）。だから奥に寒色を置くと奥行きが強調される。"},{"type":"ox","q":"白い花や銀葉は、色と色の対立をやわらげるつなぎ役であると同時に、全体を引き締める役割も果たす。","a":true,"why":"無彩色に近い白や灰緑は他の色相と競合しないため、間に入って調停する。薄暗い時間帯にも最後まで見える利点もある。"},{"type":"ox","q":"スリット鉢の側面の切れ込みは、通気を確保するとともに、根が鉢壁に沿ってぐるぐる回る根巻きを抑える働きがある。","a":true,"why":"切れ込み部分で根の先端が空気に触れて伸長が止まり、代わりに枝根が増える。サークリングの少ない根鉢ができる。"},{"type":"ox","q":"寄せ植えでは色や姿の調和が最優先で、水や光の好みが違う植物どうしでも見た目が合えば問題ない。","a":false,"why":"一つの鉢には一通りの水やりと日照しか与えられない。要求の違う植物を混ぜれば必ずどちらかが壊れる。環境要求をそろえるのが第一。"},{"type":"ox","q":"寄せ植えの植え付けでは、ポットから抜いた苗の根鉢は原則として崩さずに植える。","a":true,"why":"根を切ると活着が遅れ、株ごとの生育がそろわなくなる。根が強く回っている株のみ、底を軽くほぐす程度にとどめる。"},{"type":"ox","q":"鉢を定期的に回すのは、光の来る方向に片寄って伸びるのを防ぎ、姿を整えるためである。","a":true,"why":"植物は光屈性で光源側へ伸びる。置きっぱなしだと片側だけが茂り、幹や茎も傾く。"},{"type":"ox","q":"受け皿にたまった水は、湿度を保って乾燥を防ぐため、そのままにしておくのがよい。","a":false,"why":"鉢底が水に浸かると排水が止まり、根が酸素不足になって根腐れする。夏は蚊の発生源にもなるので必ず捨てる。"},{"type":"ox","q":"根詰まりした鉢を植え替えるとき、手間を省くため一気に3〜4号大きい鉢へ移すのが望ましい。","a":false,"why":"根の届かない部分の土がいつまでも湿ったままになり、過湿から根腐れを起こす。鉢増しは一回り（1〜2号）が原則。"},{"type":"ox","q":"室内の観葉植物の水やり間隔が屋外より長くなるのは、光が弱く風もないため蒸散量が少ないからである。","a":true,"why":"水を使う量そのものが少なく、土も乾きにくい。屋外と同じ頻度で与えると過湿になり根腐れする。"},{"type":"ox","q":"ハイドロカルチャーでは、根が乾かないよう容器の水位を常に満水に保つ。","a":false,"why":"常時満水では根が酸素不足になる。水位は容器の1/5〜1/4程度にとどめ、水がなくなってしばらくしてから足す。"},{"type":"ox","q":"湯あげでは、切り口を熱湯につける間、花や葉を紙で包んで蒸気から守り、直後に深水につける。","a":true,"why":"熱で切り口の空気と細菌を除き導管を通すのが目的で、花や葉は熱に弱い。処理後すぐ深水に移して吸わせる。"},{"type":"ox","q":"カーネーションやスイートピーはエチレンに敏感で、果物のそばに置くと日持ちが悪くなる。","a":true,"why":"リンゴなどの果実はエチレンを放出し、これらの花では花弁のしおれや落花が早まる。ラン類も同様に敏感である。"},{"type":"ox","q":"緑のカーテンが涼しさをもたらすのは、日射をさえぎる効果だけによるものである。","a":false,"why":"遮蔽に加えて、葉からの蒸散にともなう気化熱で葉面と周囲の空気の温度が下がる。この二つが合わさって効果が生まれる。"},{"type":"mc","q":"高設花壇（レイズドベッド）の利点として、もっとも適切なものはどれか。","choices":["土が保水しやすく水やりの回数が減る","上から見下ろすことで模様が強調される","排水がよくなり、かがまずに作業できる"],"a":2,"why":"土を枠内に高く盛るため余分な水が抜けやすく、作業面が高くなる。見下ろして模様を見るのは沈床花壇や平面花壇の利点。"},{"type":"mc","q":"中性種の草花を花壇に植えるときの株間の目安として、もっとも適切なものはどれか。","choices":["20〜30cm","5〜10cm","60〜80cm"],"a":0,"why":"株間は成長後の株張りで決める。矮性で15〜20cm、中性で20〜30cm、高性で30〜40cmが目安。詰めすぎは蒸れと病害を招く。"},{"type":"mc","q":"マッス植栽（群植）を行う主な目的はどれか。","choices":["株数を減らして経費を抑えるため","離れた位置から色の塊として認識させるため","同じ品種を並べて病害虫を防ぐため"],"a":1,"why":"数メートル離れると個々の花は識別できず色面として見える。3株・5株とまとめると遠目に効き、反復すればまとまりも出る。"},{"type":"mc","q":"色相環で隣り合う色どうしを組み合わせ、穏やかにまとめる配色を何というか。","choices":["補色配色","単色（モノトーン）配色","同系色（類似色）配色"],"a":2,"why":"隣接する色相の組み合わせが同系色配色。失敗が少ない反面、単調になりやすいので明度・彩度で差をつけるとよい。"},{"type":"mc","q":"8号鉢のおよその口径はどれか。","choices":["約16cm","約24cm","約32cm"],"a":1,"why":"1号＝約3cmなので、8号は3×8＝約24cm。5号なら約15cmとなる。"},{"type":"mc","q":"過湿を嫌う植物に向き、鉢壁からも水が蒸発するため最も乾きやすい鉢の素材はどれか。","choices":["素焼き（テラコッタ）","釉薬をかけた陶器","プラスチック"],"a":0,"why":"素焼きは多孔質で通気性が高く、鉢壁から水が抜ける。釉薬をかけた陶器やプラスチックは壁が水を通さず乾きにくい。"},{"type":"mc","q":"寄せ植えの構成でいう「スピラー」の役割はどれか。","choices":["背が高く目を引く主役になる","こんもり茂って株間の隙間を埋める","鉢の縁から垂れて鉢を隠す"],"a":2,"why":"スリラー（主役）、フィラー（隙間を埋める）、スピラー（垂れる）の三役。スピラーが縁を隠すと鉢と植物が一体に見える。"},{"type":"mc","q":"寄せ植えの植物を選ぶとき、最初にそろえるべき条件はどれか。","choices":["水と光の要求","花の色の系統","花の大きさ"],"a":0,"why":"一つの鉢では一通りの水やりと置き場所しか与えられない。要求の違う植物を混ぜると必ずどちらかが枯れるか徒長する。"},{"type":"mc","q":"鉢物の植え替えの適期として、一般にもっとも適切なのはどれか。","choices":["生育が始まる直前の春（おおむね4〜5月）","真夏の生育がさかんな時期","厳寒期の休眠の最中"],"a":0,"why":"根が傷ついてもすぐ再生できる時期を選ぶ。真夏は蒸散が多く回復が追いつかず、厳寒期は根が動かないため回復しない。"},{"type":"mc","q":"根詰まりのサインとして適切でないものはどれか。","choices":["鉢底の穴から根が出ている","水を与えてもしみ込まず、表面にあふれる","植え替え直後に新芽が伸び始める"],"a":2,"why":"新芽が伸びるのは順調な生育のしるし。根詰まりは、鉢底からの根の露出、水の浸透不良、乾きの早さ、下葉の黄変で判断する。"},{"type":"mc","q":"同じ大きさを保ちたい鉢物を、同じ鉢に植え戻すときの正しい手順はどれか。","choices":["根鉢をまったく崩さず、新しい土を上に足す","古土を落として根を1/3ほど整理し、地上部も同程度切り詰める","根を半分以上切り、地上部はそのまま残す"],"a":1,"why":"根を減らせば吸水力が落ちるので、地上部も同程度減らして蒸散量とつり合わせる。根だけ大きく切ると水を上げきれずしおれる。"},{"type":"mc","q":"ハイドロカルチャーで根腐れ防止剤として底に入れる資材として、一般的なものはどれか。","choices":["ゼオライト","パーライト","ピートモス"],"a":0,"why":"ゼオライトは陽イオン交換能により水の腐敗や老廃物の蓄積を抑える。パーライトは軽量化、ピートモスは保水と酸性化の資材。"},{"type":"mc","q":"室内の奥に植物を置けるかどうかを判断する、実用的な目安はどれか。","choices":["エアコンの風が届くかどうか","新聞や本が楽に読める明るさがあるかどうか","室温が20℃以上あるかどうか"],"a":1,"why":"光量が生育の制限要因になる。読書ができない暗さでは耐陰性植物でも徐々に衰える。エアコンの風はむしろ当てない方がよい。"},{"type":"mc","q":"切り花の「水切り」の説明として正しいものはどれか。","choices":["水につける前に葉をすべて取り除くこと","水の中で茎を切り、切り口に空気が入るのを防ぐこと","花瓶の水を切らして一度乾かすこと"],"a":1,"why":"切り口に空気が入ると導管がふさがれ吸水できなくなる。水中で切ることでこれを防ぎ、吸い上げを回復させる。"},{"type":"mc","q":"屋上緑化を計画するとき、植栽の内容より先に確認すべき事項として最も重要なものはどれか。","choices":["建物の許容積載荷重","花の色の組み合わせ","夜間照明の位置"],"a":0,"why":"土壌は水を含むと大幅に重くなる。荷重の確認を怠れば構造上の危険につながる。あわせて防水層・排水・風・避難経路も先に確認する。"},{"type":"mc","q":"クリスマスの装飾に用いられる植物の組み合わせとして、適切なものはどれか。","choices":["モモ、ナノハナ","ポインセチア、ヒイラギ、シクラメン","キク、ホオズキ、ミソハギ"],"a":1,"why":"モモとナノハナはひな祭り、キク・ホオズキ・ミソハギはお盆の植物。クリスマスにはポインセチア、ヒイラギ、モミなどを使う。"}]}];

function chRead(c){ const ch=DATA.find(x=>x.id===c); let n=0; ch.sections.forEach((_,i)=>{if(S.read[c+'-'+i])n++}); return n; }
function chProg(c){ const ch=DATA.find(x=>x.id===c); return chRead(c)/ch.sections.length; }
function chQuiz(c){ return S.quiz[c]||null; }
function chStars(c){ const q=chQuiz(c); if(!q)return 0; const r=q.right/q.total; return r>=0.95?3:r>=0.8?2:r>=0.6?1:0; }
function overall(){
  let done=0,tot=0;
  DATA.forEach(ch=>{ tot+=ch.sections.length+1; done+=chRead(ch.id); if(chQuiz(ch.id))done+=1; });
  return done/tot;
}
function refreshHeader(){
  $('#hScore').textContent=S.score.toLocaleString();
  const p=overall(), C=2*Math.PI*18;
  $('#hRing').setAttribute('stroke-dasharray',(p*C).toFixed(1)+' '+C);
  $('#hPct').textContent=Math.round(p*100)+'%';
  buildNav();
  LSOK=persist();
}

/* ============ QUIZ ENGINE ============ */
function startQuiz(list,opt){
  QZ={list,opt,i:0,ans:new Array(list.length).fill(null),combo:0,checked:false,left:opt.timeLimit||0};
  curView='quiz';
  showOnly('quiz'); buildNav();
  if(opt.timeLimit){ if(timerId)clearInterval(timerId); timerId=setInterval(tick,1000); }
  drawQ();
}
function tick(){
  QZ.left--; const el=$('#qTime');
  if(el){ el.textContent=fmt(QZ.left); el.classList.toggle('warn',QZ.left<300); }
  if(QZ.left<=0){ clearInterval(timerId); timerId=null; finishQuiz(); }
}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function drawQ(){
  const {list,opt,i}=QZ, q=list[i], mock=opt.mode==='mock';
  const choices = q.type==='ox' ? ['○（正しい）','×（誤り）'] : q.choices;
  const sel=QZ.ans[i];
  const ansIdx = q.type==='ox' ? (q.a?0:1) : q.a;
  const show = QZ.checked && !mock;
  $('#v-quiz').innerHTML=`
    <div class="qbar">
      <button class="back" id="bExit" style="padding:6px 11px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700">中断</button>
      <span class="pill">${i+1} / ${list.length}</span>
      <span class="pill ${q.type==='ox'?'':'hot'}">${q.type==='ox'?'○×式':'三肢択一'}</span>
      ${QZ.combo>=3?`<span class="pill hot">${QZ.combo}連続正解中</span>`:''}
      ${opt.timeLimit?`<span class="pill time" id="qTime">${fmt(QZ.left)}</span>`:''}
      ${mock?`<span class="pill" style="margin-left:auto">解答済 ${QZ.ans.filter(x=>x!==null).length}</span>`:''}
    </div>
    <div class="steps">${list.map((_,k)=>`<i class="${QZ.ans[k]!==null?'on':k===i?'cur':''}"></i>`).join('')}</div>
    <div class="card pad">
      ${opt.chapter||q.ch?`<div class="tiny" style="margin-bottom:4px">第${q.ch}章 ${esc(DATA.find(c=>c.id===q.ch).title)}</div>`:''}
      <div class="q">${esc(q.q)}</div>
      <div class="opts">${choices.map((c,k)=>{
        let cls='';
        if(show){ if(k===ansIdx)cls='ok'; else if(k===sel)cls='ng'; }
        else if(sel===k)cls='sel';
        return `<button class="opt ${cls}" data-k="${k}" ${show?'disabled':''}><span class="k">${q.type==='ox'?(k===0?'○':'×'):'ABC'[k]}</span><span>${esc(c)}</span></button>`;
      }).join('')}</div>
      ${show?`<div class="fb ${sel===ansIdx?'ok':'ng'}"><b>${sel===ansIdx?'正解':'不正解 — 正解は '+(q.type==='ox'?(q.a?'○':'×'):'ABC'[ansIdx])}</b>${esc(q.why)}</div>`:''}
    </div>
    <div class="row" style="margin-top:15px">
      ${mock&&i>0?`<button class="btn ghost" id="bPv">← 前</button>`:''}
      ${show||mock?`<button class="btn" id="bNx" style="flex:1">${i===list.length-1?(mock?'採点する':'結果を見る'):'次の問題 →'}</button>`:`<button class="btn mut wide" disabled>選択してください</button>`}
    </div>
    ${mock?`<p class="tiny" style="text-align:center;margin-top:10px">模試モードでは採点まで正解は表示されません。<button id="bEnd" style="color:var(--copper);font-weight:800;text-decoration:underline">ここで採点する</button></p>`:''}
  `;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $('#bExit').onclick=()=>{ if(timerId){clearInterval(timerId);timerId=null;} go(opt.back||'home'); };
  const nx=$('#bNx'); if(nx)nx.onclick=next;
  const pv=$('#bPv'); if(pv)pv.onclick=()=>{QZ.i--;QZ.checked=false;drawQ()};
  const en=$('#bEnd'); if(en)en.onclick=finishQuiz;
  window.scrollTo(0,0);
}
function pick(k){
  const {list,opt,i}=QZ, q=list[i];
  QZ.ans[i]=k;
  if(opt.mode==='mock'){ drawQ(); return; }
  QZ.checked=true;
  const ansIdx=q.type==='ox'?(q.a?0:1):q.a;
  const ok=k===ansIdx;
  S.seen++; if(ok)S.right++;
  const key=qkey(q.ch,q.qi);
  if(ok){
    QZ.combo++; S.bestCombo=Math.max(S.bestCombo,QZ.combo);
    S.score += 10 + Math.min(QZ.combo,10)*2;
    S.streakRight[key]=(S.streakRight[key]||0)+1;
    if(S.wrong[key]&&S.streakRight[key]>=2) delete S.wrong[key];
    if(QZ.combo>0&&QZ.combo%5===0){ const d=document.createElement('div'); d.className='combo'; d.textContent=QZ.combo+' COMBO'; document.body.appendChild(d); setTimeout(()=>d.remove(),950); }
  }else{
    QZ.combo=0; S.streakRight[key]=0;
    S.wrong[key]={ch:q.ch,qi:q.qi,n:((S.wrong[key]||{}).n||0)+1};
  }
  refreshHeader(); drawQ();
}
function next(){
  if(QZ.i===QZ.list.length-1){ finishQuiz(); return; }
  QZ.i++; QZ.checked=false; drawQ();
}
function finishQuiz(){
  if(timerId){clearInterval(timerId);timerId=null;}
  const {list,opt}=QZ;
  let right=0; const byCh={};
  list.forEach((q,i)=>{
    const ansIdx=q.type==='ox'?(q.a?0:1):q.a;
    const ok=QZ.ans[i]===ansIdx;
    if(ok)right++;
    byCh[q.ch]=byCh[q.ch]||{r:0,t:0}; byCh[q.ch].t++; if(ok)byCh[q.ch].r++;
    if(opt.mode==='mock'){
      S.seen++; if(ok)S.right++;
      const key=qkey(q.ch,q.qi);
      if(ok){ S.score+=10; S.streakRight[key]=(S.streakRight[key]||0)+1; if(S.wrong[key]&&S.streakRight[key]>=2)delete S.wrong[key]; }
      else { S.streakRight[key]=0; S.wrong[key]={ch:q.ch,qi:q.qi,n:((S.wrong[key]||{}).n||0)+1}; }
    }
  });
  if(opt.chapter){ const p=S.quiz[opt.chapter]; if(!p||p.right<right) S.quiz[opt.chapter]={right,total:list.length}; }
  if(opt.mode==='mock') S.mocks.push({right,total:list.length,at:Date.now()});
  const pass = opt.pass ? right>=opt.pass : null;
  const pct=Math.round(right/list.length*100);
  const missed=list.map((q,i)=>({q,i})).filter(({q,i})=>QZ.ans[i]!==(q.type==='ox'?(q.a?0:1):q.a));
  $('#v-quiz').innerHTML=`
    <div class="card res">
      <div class="lbl">${esc(opt.title)}</div>
      <div class="big ${pass===false?'ng':''}">${right}<span style="font-size:24px;color:var(--ink3)"> / ${list.length}</span></div>
      <div class="lbl">正答率 ${pct}%${opt.pass?`・合格ライン ${opt.pass}問`:''}</div>
      <h3>${pass===null?(pct>=95?'ほぼ完璧':pct>=80?'よく仕上がっています':pct>=60?'もう一歩':'ここが伸びしろ'):(pass?'合格ラインを突破':'あと'+(opt.pass-right)+'問')}</h3>
      <p class="mut" style="font-size:13.5px;padding:0 14px">${pass===null?(pct>=80?'この章は一旦置いて次へ進んでよい水準です。':'まちがえた問題は弱点ノートに入りました。2回連続で正解すると消えます。'):(pass?'本番でもこの調子で。取りこぼした分野を弱点ノートで潰しておきましょう。':'章別の正答率を見て、低い章に戻るのが最短です。')}</p>
    </div>
    ${Object.keys(byCh).length>1?`<div class="sec-t">章別の正答率</div><div class="card pad"><div class="bkchart">${
      Object.entries(byCh).sort((a,b)=>a[0]-b[0]).map(([c,v])=>{
        const p=Math.round(v.r/v.t*100);
        return `<div class="bk"><div class="nm">${c}. ${esc(DATA.find(x=>x.id==c).title)}</div><div class="bar"><i class="${p<50?'low':p<75?'mid':''}" style="width:${p}%"></i></div><div class="pc">${p}%</div></div>`;
      }).join('')}</div></div>`:''}
    ${missed.length?`<div class="sec-t">まちがえた ${missed.length}問</div>${missed.map(({q,i})=>wqHTML(q,QZ.ans[i])).join('')}`:''}
    <div class="row" style="margin-top:16px">
      <button class="btn ghost" data-go="home">ホームへ</button>
      ${missed.length?`<button class="btn" id="bRetry" style="flex:1">まちがえた${missed.length}問だけ解き直す</button>`:`<button class="btn" data-go="drill" style="flex:1">次の演習へ</button>`}
    </div>`;
  const rt=$('#bRetry');
  if(rt)rt.onclick=()=>startQuiz(missed.map(m=>m.q),{title:opt.title+'（解き直し）',mode:'immediate',back:opt.back});
  refreshHeader(); window.scrollTo(0,0);
}
function wqHTML(q,given){
  const ansIdx=q.type==='ox'?(q.a?0:1):q.a;
  const ansTxt=q.type==='ox'?(q.a?'○':'×'):q.choices[q.a];
  const gv = given==null?null:(q.type==='ox'?(given===0?'○':'×'):q.choices[given]);
  return `<div class="wq"><div class="tag">第${q.ch}章・${q.type==='ox'?'○×':'三択'}</div>
    <div class="qt">${esc(q.q)}</div>
    <div class="an">正解：${esc(ansTxt)}${gv!==null?` <span style="color:var(--red);font-weight:700">（あなた：${esc(gv)}）</span>`:''}</div>
    <div class="ex">${esc(q.why)}</div></div>`;
}

/* ============ DRILL ============ */
function renderDrill(){
  if(!drillSel.size) DATA.forEach(c=>drillSel.add(c.id));
  const n=[...drillSel].reduce((a,c)=>a+DATA.find(x=>x.id===c).quiz.length,0);
  $('#v-drill').innerHTML=`
    <div class="sec-t">演習モード</div>
    <div class="card pad">
      <p class="mut" style="margin:0 0 12px;font-size:14px">章を選んでシャッフル出題します。1問ごとに解説が出るので、覚え直しながら回せます。</p>
      <div class="row" style="margin-bottom:10px">
        <button class="chip" id="cAll">全章</button><button class="chip" id="cNone">解除</button>
        <button class="chip" id="cWeak">弱点の多い章</button>
      </div>
      <div class="row">${DATA.map(c=>`<button class="chip ch-chip ${drillSel.has(c.id)?'on':''}" data-c="${c.id}">${c.id}. ${esc(c.title)}</button>`).join('')}</div>
      <div class="sec-t">出題数</div>
      <div class="row" id="cnt">${[10,20,40,80,n].filter((v,i,a)=>a.indexOf(v)===i).map((v,i)=>`<button class="chip ${i===1?'on':''}" data-n="${v}">${v===n?'全'+n+'問':v+'問'}</button>`).join('')}</div>
      <div class="sec-t">形式</div>
      <div class="row" id="typ">
        <button class="chip on" data-t="all">両方</button><button class="chip" data-t="ox">○×のみ</button><button class="chip" data-t="mc">三択のみ</button>
      </div>
      <button class="btn wide" id="bStart" style="margin-top:18px">${n}問から出題して開始</button>
      <p class="tiny" style="margin-top:10px">選択中：${drillSel.size}章 / ${n}問</p>
    </div>`;
  document.querySelectorAll('.ch-chip').forEach(b=>b.onclick=()=>{const c=+b.dataset.c; drillSel.has(c)?drillSel.delete(c):drillSel.add(c); renderDrill();});
  $('#cAll').onclick=()=>{DATA.forEach(c=>drillSel.add(c.id));renderDrill()};
  $('#cNone').onclick=()=>{drillSel.clear();renderDrill()};
  $('#cWeak').onclick=()=>{const m={};Object.values(S.wrong).forEach(w=>m[w.ch]=(m[w.ch]||0)+1);drillSel.clear();Object.keys(m).forEach(c=>drillSel.add(+c));if(!drillSel.size){toast('弱点ノートは空です');DATA.forEach(c=>drillSel.add(c.id));}renderDrill()};
  ['cnt','typ'].forEach(id=>document.querySelectorAll('#'+id+' .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')}));
  $('#bStart').onclick=()=>{
    const num=+$('#cnt .chip.on').dataset.n, ty=$('#typ .chip.on').dataset.t;
    let pool=[]; [...drillSel].sort((a,b)=>a-b).forEach(c=>DATA.find(x=>x.id===c).quiz.forEach((q,i)=>{ if(ty==='all'||q.type===ty) pool.push({...q,ch:c,qi:i}); }));
    if(!pool.length){toast('該当する問題がありません');return;}
    shuffle(pool);
    startQuiz(pool.slice(0,Math.min(num,pool.length)),{title:'演習',mode:'immediate',back:'drill'});
  };
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

        <tr><th>構成</th><td>○×式 40問 ＋ 三肢択一式 40問（全13章から均等に抽出）</td></tr>
        <tr><th>制限時間</th><td>60分（残り5分で表示が赤くなります）</td></tr>
        <tr><th>合格ライン</th><td>51問正解</td></tr>

      </tbody></table></div>

      return `<div class="bk"><div class="nm">${hist.length-i}回目</div><div class="bar"><i class="${m.right>=51?'':'low'}" style="width:${p}%"></i></div><div class="pc" style="color:${m.right>=51?'var(--green)':'var(--red)'}">${m.right}</div></div>`;
    }).join('')}</div><p class="tiny">合格ライン51問。赤は不合格ラインです。</p></div>`:''}`;
  $('#bMock').onclick=()=>launchMock(3600);
  $('#bMock2').onclick=()=>launchMock(0);
}
function launchMock(sec){
  const ox=[],mc=[];
  DATA.forEach(c=>c.quiz.forEach((q,i)=>{ (q.type==='ox'?ox:mc).push({...q,ch:c.id,qi:i}); }));
  // 各章から均等に拾う
  const pickBal=(pool,n)=>{
    const byCh={}; pool.forEach(q=>{(byCh[q.ch]=byCh[q.ch]||[]).push(q)});
    Object.values(byCh).forEach(shuffle);
    const out=[],chs=Object.keys(byCh); let k=0;
    while(out.length<n){ const c=chs[k%chs.length]; if(byCh[c].length)out.push(byCh[c].pop()); k++; if(k>2000)break; }
    return out;
  };
  const list=shuffle([...pickBal(ox,40),...pickBal(mc,40)]);
  startQuiz(list,{title:'模擬試験 80問',mode:'mock',timeLimit:sec,pass:51,back:'mock'});
}

/* ============ WEAK ============ */
function renderWeak(){
  const ws=Object.values(S.wrong).sort((a,b)=>b.n-a.n||a.ch-b.ch);
  if(!ws.length){
    $('#v-weak').innerHTML=`<div class="sec-t">弱点ノート</div><div class="card empty">
      <p style="font-size:15px;font-weight:700;color:var(--ink2)">いまのところ空です</p>
      <p>まちがえた問題がここに自動で溜まります。<br>2回連続で正解すると、リストから消えます。</p>
      <button class="btn ghost" data-go="drill" style="margin-top:10px">演習を始める</button></div>`;
    return;
  }
  const list=ws.map(w=>({...DATA.find(c=>c.id===w.ch).quiz[w.qi],ch:w.ch,qi:w.qi,n:w.n}));
  $('#v-weak').innerHTML=`
    <div class="sec-t">弱点ノート ${ws.length}問</div>
    <div class="card pad">
      <p class="mut" style="margin:0;font-size:14px">まちがえた問題です。<b>2回連続で正解すると消えます。</b>まずは解き直しから。</p>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="bRe" style="flex:1">${ws.length}問を解き直す</button>
        <button class="btn ghost" id="bClr">全消去</button>
      </div>
    </div>
    <div class="sec-t">一覧（まちがえた回数順）</div>
    ${list.map(q=>`<div class="wq"><div class="tag">第${q.ch}章・${q.type==='ox'?'○×':'三択'}・${q.n}回まちがえた</div>
      <div class="qt">${esc(q.q)}</div>
      <div class="an">正解：${esc(q.type==='ox'?(q.a?'○':'×'):q.choices[q.a])}</div>
      <div class="ex">${esc(q.why)}</div></div>`).join('')}`;
  $('#bRe').onclick=()=>startQuiz(shuffle(list.slice()),{title:'弱点ノート',mode:'immediate',back:'weak'});
  $('#bClr').onclick=()=>{S.wrong={};toast('弱点ノートを空にしました');renderWeak();refreshHeader()};
}

/* ============ RECORD ============ */
function renderRecord(){
  const acc=S.seen?Math.round(S.right/S.seen*100):0;
  const mins=Math.round((Date.now()-S.startedAt)/60000);
  $('#v-record').innerHTML=`
    <div class="sec-t">学習記録</div>
    <div class="card pad">
      <div class="bkchart">
        <div class="bk"><div class="nm">全体の進捗</div><div class="bar"><i style="width:${overall()*100}%"></i></div><div class="pc">${Math.round(overall()*100)}%</div></div>
        <div class="bk"><div class="nm">累計正答率</div><div class="bar"><i class="${acc<50?'low':acc<75?'mid':''}" style="width:${acc}%"></i></div><div class="pc">${acc}%</div></div>
      </div>
      <div class="tw"><table><tbody>
        <tr><th>解答数</th><td>${S.seen} 問（正解 ${S.right}）</td></tr>
        <tr><th>スコア</th><td>${S.score.toLocaleString()} 点</td></tr>
        <tr><th>最高コンボ</th><td>${S.bestCombo} 連続</td></tr>
        <tr><th>読了レッスン</th><td>${Object.keys(S.read).length} / 104</td></tr>
        <tr><th>弱点</th><td>${Object.keys(S.wrong).length} 問</td></tr>
        <tr><th>模試</th><td>${S.mocks.length} 回${S.mocks.length?`（最高 ${Math.max(...S.mocks.map(m=>m.right))}点）`:''}</td></tr>
        <tr><th>学習開始から</th><td>約 ${mins>=60?Math.floor(mins/60)+'時間'+(mins%60)+'分':mins+'分'}</td></tr>
      </tbody></table></div>
    </div>

    <div class="sec-t">章別の到達度</div>
    <div class="card pad"><div class="bkchart">${DATA.map(c=>{
      const q=chQuiz(c.id), p=q?Math.round(q.right/q.total*100):0;
      return `<div class="bk"><div class="nm">${c.id}. ${esc(c.title)}</div><div class="bar"><i class="${!q?'':p<50?'low':p<75?'mid':''}" style="width:${p}%"></i></div><div class="pc">${q?p+'%':'—'}</div></div>`;
    }).join('')}</div><p class="tiny">章末クイズの最高得点です。「—」は未挑戦。</p></div>

    <div class="sec-t">進捗の持ち出し</div>
    <div class="card pad">
      <p class="tiny" style="margin-top:0" id="lsNote"></p>
      <textarea id="taSave" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
      <div class="row" style="margin-top:9px">
        <button class="btn sm" id="bCopy">保存コードをコピー</button>
        <button class="btn sm ghost" id="bLoadT">復元する</button>
        <button class="btn sm ghost" id="bReset">記録をリセット</button>
      </div>
      <textarea id="taLoad" placeholder="ここに保存コードを貼り付けてから「復元する」" style="margin-top:9px;display:none"></textarea>
    </div>`;
  $('#lsNote').innerHTML = LSOK
    ? 'このブラウザに<b>自動保存</b>されています。同じブラウザで開けば続きから再開できます。別の端末に移すときや、念のためのバックアップには下の<b>保存コード</b>をコピーして保管してください。'
    : 'このブラウザでは自動保存が使えません（ファイルを直接開いた場合など）。下の<b>保存コード</b>をコピーしてメモに貼っておき、次回この欄に貼り付けて「復元する」を押してください。';
  $('#bCopy').onclick=()=>{const t=$('#taSave');t.select();document.execCommand('copy');toast('コピーしました')};
  $('#bLoadT').onclick=()=>{
    const ta=$('#taLoad');
    if(ta.style.display==='none'){ta.style.display='block';ta.focus();return;}
    try{ Object.assign(S,JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))))); toast('復元しました'); refreshHeader(); renderRecord(); }
    catch(e){ toast('コードが読み取れません'); }
  };
  $('#bReset').onclick=()=>{Object.assign(S,{read:{},quiz:{},wrong:{},streakRight:{},score:0,bestCombo:0,mocks:[],seen:0,right:0,startedAt:Date.now()});try{localStorage.removeItem(LS)}catch(e){};toast('リセットしました');refreshHeader();renderRecord()};
}

/* ============ init ============ */
const RESTORED=restore(); LSOK=persist();
buildNav(); renderHome(); refreshHeader();
if(RESTORED) setTimeout(()=>toast('前回の続きから再開しました'),400);
</script>
</body>
</html>
