<style>
:root{
  --bg:#f6f4ee; --card:#fffdf8; --ink:#22301f; --ink2:#5c6b57; --ink3:#8a9683;
  --green:#2f6b45; --green-d:#1f4a2f; --green-l:#e6f0e5; --leaf:#6aa84f;
  --copper:#b5713a; --copper-l:#f6ece2; --gold:#c9a227;
  --red:#b23b3b; --red-l:#fbeceb; --blue:#3a6b8f;
  --line:#e2ddd0; --shadow:0 2px 10px rgba(34,48,31,.07);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
  line-height:1.85; font-size:16px; letter-spacing:.01em;
  padding-bottom:90px;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3,h4{line-height:1.45;margin:0}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;background:rgba(246,244,238,.93);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.hd{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;flex:0 0 auto}
.mark svg{width:20px;height:20px}
.brand b{font-size:15px;font-weight:800;letter-spacing:.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11px;color:var(--ink3);display:block;margin-top:-3px}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:14px;flex:0 0 auto}
.stat{text-align:right;line-height:1.2}
.stat b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--green-d)}
.stat i{font-style:normal;font-size:10px;color:var(--ink3);display:block}
.ring{width:40px;height:40px;flex:0 0 auto}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:#e2ddd0}
.ring .fgc{stroke:var(--leaf);stroke-linecap:round;transition:stroke-dasharray .5s}
.ring text{font-size:11px;font-weight:800;fill:var(--green-d)}

/* ---------- nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(255,253,248,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nv{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nv button{padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10.5px;font-weight:700;border-top:2.5px solid transparent}
.nv button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nv button.on{color:var(--green);border-top-color:var(--green)}
.nv .bdg{position:absolute;transform:translate(15px,-4px);background:var(--red);color:#fff;font-size:9px;padding:0 5px;border-radius:9px;line-height:15px;font-weight:800}

main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.sec-t{font-size:12px;font-weight:800;color:var(--copper);letter-spacing:.14em;margin:26px 0 10px}
.sec-t:first-child{margin-top:0}
.btn{background:var(--green);color:#fff;padding:12px 20px;border-radius:11px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.ghost:hover{background:var(--green-l)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn.mut{background:var(--ink3)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.mut{color:var(--ink2)}
.tiny{font-size:12.5px;color:var(--ink3);line-height:1.7}

/* ---------- hero ---------- */
.hero{background:linear-gradient(150deg,var(--green-d),var(--green) 55%,#3f8452);color:#fff;border-radius:18px;padding:24px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero:before{content:"";position:absolute;right:30px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero h1{font-size:23px;font-weight:800;letter-spacing:.01em;position:relative}
.hero p{margin:9px 0 0;font-size:13.5px;opacity:.9;position:relative;line-height:1.8}
.hero .kpi{display:flex;gap:20px;margin-top:16px;position:relative;flex-wrap:wrap}
.hero .kpi div b{font-size:22px;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.hero .kpi div i{font-style:normal;font-size:10.5px;opacity:.8}

/* ---------- chapter cards ---------- */
.chgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ch{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:13px;align-items:flex-start;text-align:left;box-shadow:var(--shadow);transition:.15s;width:100%}
.ch:hover{transform:translateY(-2px);border-color:var(--leaf)}
.ch .num{width:38px;height:38px;flex:0 0 auto;border-radius:11px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.ch.done .num{background:var(--green);color:#fff}
.ch .bd{min-width:0;flex:1}
.ch .bd b{font-size:15.5px;font-weight:800;display:block}
.ch .bd p{margin:2px 0 8px;font-size:12px;color:var(--ink3);line-height:1.6}
.bar{height:5px;background:#eae5d8;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:4px;transition:width .5s}
.bar.q i{background:var(--copper)}
.ch .meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:5px;font-variant-numeric:tabular-nums}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}

/* ---------- plan table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--green-l);color:var(--green-d);font-weight:800;font-size:12px;white-space:nowrap}
tbody tr:nth-child(even){background:rgba(0,0,0,.012)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px -4px;padding:0 4px}

/* ---------- lesson ---------- */
.lsn-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lsn-hd .back{padding:7px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.steps{display:flex;gap:4px;margin:14px 0 18px}
.steps i{flex:1;height:4px;border-radius:3px;background:#e2ddd0}
.steps i.on{background:var(--leaf)}
.steps i.cur{background:var(--green-d)}
.dlg{margin:0 0 16px}
.turn{display:flex;gap:9px;margin-bottom:9px;align-items:flex-start}
.av{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff}
.av.midorikawa{background:var(--green)} .av.hana{background:var(--copper)} .av.kyaku{background:var(--blue)}
.bub{background:#fff;border:1px solid var(--line);border-radius:3px 13px 13px 13px;padding:9px 13px;font-size:13.5px;line-height:1.8;flex:1}
.turn.midorikawa .bub{background:var(--green-l);border-color:#d3e3d1}
.body{font-size:15px}
.body p{margin:0 0 13px}
.body h4{font-size:14px;color:var(--green-d);margin:18px 0 7px;padding-left:10px;border-left:3px solid var(--leaf)}
.body strong{color:var(--green-d);font-weight:800;background:linear-gradient(transparent 62%,rgba(106,168,79,.28) 62%)}
.body ul,.body ol{margin:0 0 13px;padding-left:22px}
.body li{margin-bottom:5px}
.body code{background:#eee9dc;padding:1px 5px;border-radius:4px;font-size:13px}
.why{background:var(--copper-l);border-left:4px solid var(--copper);border-radius:0 10px 10px 0;padding:12px 15px;margin:16px 0;font-size:13.5px;line-height:1.8}
.why b{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--copper);margin-bottom:3px}
.kp{background:#fff;border:1px dashed var(--leaf);border-radius:11px;padding:13px 16px;margin:16px 0}
.kp b{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--green);margin-bottom:7px}
.kp ul{margin:0;padding-left:19px}
.kp li{font-size:13.5px;margin-bottom:5px;line-height:1.75}
.mn{background:#fdf8e6;border:1px solid #eadfae;border-radius:11px;padding:12px 15px;margin:16px 0;font-size:13.5px;line-height:1.8}
.mn b{display:block;font-size:10.5px;letter-spacing:.14em;color:#9a7d18;margin-bottom:3px}
.tcap{font-size:11.5px;font-weight:800;color:var(--ink2);margin-top:16px}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pill{background:var(--green-l);color:var(--green-d);padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.pill.hot{background:#fdeede;color:var(--copper)}
.pill.time{background:#eef2f6;color:var(--blue)}
.pill.time.warn{background:var(--red-l);color:var(--red)}
.q{font-size:16.5px;font-weight:700;line-height:1.85;margin:6px 0 18px}
.opts{display:grid;gap:9px}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;text-align:left;font-size:14.5px;line-height:1.7;display:flex;gap:11px;align-items:flex-start;transition:.12s;width:100%}
.opt:hover:not(:disabled){border-color:var(--leaf);background:var(--green-l)}
.opt .k{width:23px;height:23px;flex:0 0 auto;border-radius:7px;background:#eee9dc;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.opt.sel{border-color:var(--green);background:var(--green-l)}
.opt.ok{border-color:var(--leaf);background:#e9f5e4}
.opt.ok .k{background:var(--leaf);color:#fff}
.opt.ng{border-color:var(--red);background:var(--red-l)}
.opt.ng .k{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:14px 16px;margin-top:16px;font-size:14px;line-height:1.85;animation:fade .25s}
.fb.ok{background:#e9f5e4;border:1px solid #b9d8a8}
.fb.ng{background:var(--red-l);border:1px solid #e7c0bd}
.fb b{display:block;margin-bottom:4px;font-size:14.5px}
.fb.ok b{color:var(--green-d)} .fb.ng b{color:var(--red)}
.combo{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--gold);color:#fff;padding:9px 22px;border-radius:30px;font-weight:800;font-size:16px;box-shadow:0 6px 20px rgba(201,162,39,.4);z-index:200;pointer-events:none;animation:pop .9s ease forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.7)}20%{opacity:1;transform:translateX(-50%) scale(1.08)}75%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-24px) scale(.95)}}

/* ---------- result ---------- */
.res{text-align:center;padding:26px 18px}
.res .big{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--green-d)}
.res .big.ng{color:var(--red)}
.res .lbl{font-size:13px;color:var(--ink3);margin-top:6px}
.res h3{font-size:20px;margin:14px 0 4px}
.bkchart{display:grid;gap:7px;margin-top:8px}
.bk{display:grid;grid-template-columns:120px 1fr 46px;gap:9px;align-items:center;font-size:12px}
.bk .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.bk .bar{height:14px;border-radius:4px}
.bk .bar i{background:var(--leaf)}
.bk .bar i.low{background:var(--red)}
.bk .bar i.mid{background:var(--copper)}
.bk .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}

/* ---------- badges ---------- */
.bgs{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.bg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;opacity:.4}
.bg.got{opacity:1;border-color:var(--gold);background:#fdfaef}
.bg .ic{width:34px;height:34px;margin:0 auto 6px;border-radius:50%;background:#eee9dc;display:grid;place-items:center;font-weight:800;color:var(--ink3);font-size:15px}
.bg.got .ic{background:var(--gold);color:#fff}
.bg b{font-size:12.5px;display:block}
.bg span{font-size:10.5px;color:var(--ink3);line-height:1.5;display:block;margin-top:2px}

/* ---------- misc ---------- */
.chip{padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:11px;font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#fff;color:var(--ink);resize:vertical}
.wq{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:9px}
.wq .qt{font-size:14px;font-weight:700;line-height:1.75}
.wq .an{font-size:13px;color:var(--green-d);margin-top:6px;font-weight:700}
.wq .ex{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.75}
.wq .tag{font-size:10.5px;color:var(--copper);font-weight:800;letter-spacing:.06em}
.empty{text-align:center;padding:44px 20px;color:var(--ink3);font-size:14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:300;animation:fade .2s}
@media(max-width:520px){
  body{font-size:15px}
  .hero h1{font-size:19px}
  .hd{padding:9px 12px} .brand span{display:none}
  main{padding:14px 12px 30px}
  .bk{grid-template-columns:88px 1fr 40px}
  .q{font-size:15.5px}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 22c0-6 3-10 8-12-1 7-4 10-8 12zM12 22C12 15 9 11 4 9c1 7 4 10 8 13z"/></svg></div>
      <div><b>みどりや学習室</b><span>グリーンアドバイザー 10時間集中コース</span></div>
    </div>
    <div class="hd-r">
      <div class="stat"><b id="hScore">0</b><i>スコア</i></div>
      <svg class="ring" viewBox="0 0 44 44"><circle class="bgc" cx="22" cy="22" r="18"/><circle class="fgc" id="hRing" cx="22" cy="22" r="18" stroke-dasharray="0 113" transform="rotate(-90 22 22)"/><text id="hPct" x="22" y="26" text-anchor="middle">0%</text></svg>
    </div>
  </div>
</header>

<main>
  <!-- HOME -->
  <section class="view on" id="v-home"></section>
  <!-- LESSON -->
  <section class="view" id="v-lesson"></section>
  <!-- QUIZ ENGINE -->
  <section class="view" id="v-quiz"></section>
  <!-- DRILL -->
  <section class="view" id="v-drill"></section>
  <!-- MOCK -->
  <section class="view" id="v-mock"></section>
  <!-- WEAK -->
  <section class="view" id="v-weak"></section>
  <!-- RECORD -->
  <section class="view" id="v-record"></section>
</main>

<nav><div class="nv" id="nav"></div></nav>

<script>
const DATA = __DATA__;

/* ============ state ============ */
const S = {
  read:{}, quiz:{}, wrong:{}, streakRight:{},
  score:0, bestCombo:0, mocks:[], seen:0, right:0, startedAt:Date.now()
};
let curView='home', curCh=null, curSec=0, QZ=null, drillSel=new Set(), timerId=null;

const LS='ga10h_v1';
function persist(){ try{ localStorage.setItem(LS, JSON.stringify(S)); return true; }catch(e){ return false; } }
function restore(){ try{ const r=localStorage.getItem(LS); if(r){ Object.assign(S, JSON.parse(r)); return true; } }catch(e){} return false; }
let LSOK=true;

const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qkey=(c,i)=>c+'-'+i;
const AVN={'緑川':'midorikawa','ハナ':'hana','客':'kyaku'};
const AVL={'緑川':'緑','ハナ':'ハ','客':'客'};

/* ============ nav ============ */
const NAV=[
  ['home','ホーム','M3 11l9-8 9 8M5 10v10h14V10'],
  ['lesson','学ぶ','M4 5h7a2 2 0 012 2v12a2 2 0 00-2-2H4zM20 5h-7a2 2 0 00-2 2v12a2 2 0 012-2h7z'],
  ['drill','演習','M9 11l2.5 2.5L16 9M21 12a9 9 0 11-18 0 9 9 0 0118 0z'],
  ['mock','模試','M9 3h6v3H9zM5 6h14v15H5zM9 12h6M9 16h4'],
  ['weak','弱点','M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z'],
  ['record','記録','M3 3v18h18M7 15l4-5 3 3 5-7']
];
function buildNav(){
  $('#nav').innerHTML=NAV.map(([id,lb,d])=>
    `<button data-go="${id}" class="${curView===id?'on':''}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg><span>${lb}</span>${id==='weak'?`<span class="bdg" id="wbadge" style="display:none"></span>`:''}</button>`).join('');
  const n=Object.keys(S.wrong).length, b=$('#wbadge');
  if(b){ b.style.display=n?'block':'none'; b.textContent=n; }
}
function showOnly(v){
  document.querySelectorAll('.view').forEach(e=>{
    if(e.id==='v-'+v){ e.classList.add('on'); }
    else { e.classList.remove('on'); e.innerHTML=''; }
  });
}
function go(v){
  if(v==='lesson'&&!curCh) v='lesson';
  curView=v;
  showOnly(v);
  buildNav(); window.scrollTo(0,0);
  ({home:renderHome,lesson:renderLessonHub,drill:renderDrill,mock:renderMock,weak:renderWeak,record:renderRecord}[v]||(()=>{}))();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go]'); if(t){ if(timerId){clearInterval(timerId);timerId=null;} go(t.dataset.go); }
});

/* ============ progress ============ */
function chRead(c){ const ch=DATA.find(x=>x.id===c); let n=0; ch.sections.forEach((_,i)=>{if(S.read[c+'-'+i])n++}); return n; }
function chProg(c){ const ch=DATA.find(x=>x.id===c); return chRead(c)/ch.sections.length; }
function chQuiz(c){ return S.quiz[c]||null; }
function chStars(c){ const q=chQuiz(c); if(!q)return 0; const r=q.right/q.total; return r>=0.95?3:r>=0.8?2:r>=0.6?1:0; }
function overall(){
  let done=0,tot=0;
  DATA.forEach(ch=>{ tot+=ch.sections.length+1; done+=chRead(ch.id); if(chQuiz(ch.id))done+=1; });
  return done/tot;
}
function refreshHeader(){
  $('#hScore').textContent=S.score.toLocaleString();
  const p=overall(), C=2*Math.PI*18;
  $('#hRing').setAttribute('stroke-dasharray',(p*C).toFixed(1)+' '+C);
  $('#hPct').textContent=Math.round(p*100)+'%';
  buildNav();
  LSOK=persist();
}
function toast(m){ const d=document.createElement('div'); d.className='toast'; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),1900); }

/* ============ HOME ============ */
const PLAN=[
  ['1日目 (2.0h)','1・2・3章','植物の生理を先に固める。ここが全章の土台で、以降の暗記量が激減する。'],
  ['2日目 (1.5h)','4・5章','分類と特性。原産地から育て方を逆算する視点を身につける。'],
  ['3日目 (2.0h)','6・7・8章','種・苗・ふやし方。作業の手順ものは手を動かす想像をしながら。'],
  ['4日目 (1.8h)','9・10章','用土と肥料。数値と表示の読み方が出るので表を丸ごと覚える。'],
  ['5日目 (1.7h)','11章＋演習','病害虫と農薬。分量が多く配点も厚い。ここだけは2周する。'],
  ['6日目 (1.5h)','12・13章','用具・作業・デザイン。常識で解ける問題も多い。速く回す。'],
  ['仕上げ (1.0h)','模試＋弱点','80問模試を2回。弱点ノートが空になるまで潰す。']
];
function renderHome(){
  const totalQ=DATA.reduce((a,c)=>a+c.quiz.length,0);
  const acc=S.seen?Math.round(S.right/S.seen*100):0;
  $('#v-home').innerHTML=`
  <div class="hero">
    <h1>膨大な教科書を、10時間の物語に</h1>
    <p>郊外の園芸店「みどりや」を舞台に、店長の緑川さんと新人のハナちゃんと一緒に、<br>グリーンアドバイザー認定試験の全範囲を歩き直します。暗記ではなく、理屈で。</p>
    <div class="kpi">
      <div><b>13</b><i>章</i></div>
      <div><b>104</b><i>レッスン</i></div>
      <div><b>${totalQ}</b><i>問</i></div>
      <div><b>10.3</b><i>時間</i></div>
      <div><b>${acc}<span style="font-size:13px">%</span></b><i>あなたの正答率</i></div>
    </div>
  </div>

  <div class="sec-t">本番の形式</div>
  <div class="card pad">
    <div class="tw"><table><tbody>
      <tr><th>形式</th><td>CBT方式（全国のテストセンターで受験日時を予約）</td></tr>
      <tr><th>出題数</th><td>○×式 40問 ＋ 三肢択一式 40問 ＝ <b>80問</b></td></tr>
      <tr><th>時間</th><td>60分（1問あたり45秒。迷ったら飛ばして戻る）</td></tr>
      <tr><th>合格基準</th><td>80問中 <b>51問以上</b>正解（2025年度実績。年により変動）</td></tr>
      <tr><th>合格率</th><td>おおむね 83〜86%。落ちる試験ではないが、範囲は広い</td></tr>
    </tbody></table></div>
    <p class="tiny">この講座は 1問あたりの解説を必ず付けています。<b>まちがえた問題は自動で「弱点ノート」に入り</b>、2回連続で正解するまで消えません。</p>
  </div>

  <div class="sec-t">10時間の進め方</div>
  <div class="card pad"><div class="tw"><table>
    <thead><tr><th>日程</th><th>章</th><th>ねらい</th></tr></thead>
    <tbody>${PLAN.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody>
  </table></div></div>

  <div class="sec-t">全13章</div>
  <div class="chgrid">${DATA.map(ch=>chCard(ch)).join('')}</div>

  <div class="sec-t">バッジ</div>
  <div class="bgs">${badges().map(b=>`<div class="bg ${b.got?'got':''}"><div class="ic">${b.got?'✓':'?'}</div><b>${b.name}</b><span>${b.desc}</span></div>`).join('')}</div>
  `;
  bindCh(); refreshHeader();
}
function chCard(ch){
  const p=chProg(ch.id), q=chQuiz(ch.id), st=chStars(ch.id);
  return `<button class="ch ${p>=1?'done':''}" data-ch="${ch.id}">
    <div class="num">${ch.id}</div>
    <div class="bd">
      <b>${esc(ch.title)}</b>
      <p>${esc(ch.subtitle)}</p>
      <div class="bar"><i style="width:${(p*100).toFixed(0)}%"></i></div>
      <div class="meta"><span>読了 ${chRead(ch.id)}/${ch.sections.length}・${ch.minutes}分</span>
      <span>${q?`クイズ ${q.right}/${q.total}`:'クイズ未挑戦'} <span class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span></span></div>
    </div></button>`;
}
function bindCh(){ document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>openCh(+b.dataset.ch,0)); }
function badges(){
  const allRead=DATA.every(c=>chProg(c.id)>=1);
  const allQuiz=DATA.every(c=>chQuiz(c.id));
  const three=DATA.filter(c=>chStars(c.id)===3).length;
  return [
    {name:'はじめの一歩',desc:'最初のレッスンを読む',got:Object.keys(S.read).length>0},
    {name:'100問突破',desc:'累計100問に解答',got:S.seen>=100},
    {name:'コンボ10',desc:'10問連続正解',got:S.bestCombo>=10},
    {name:'コンボ25',desc:'25問連続正解',got:S.bestCombo>=25},
    {name:'三ツ星 ×5',desc:'5章で95%以上',got:three>=5},
    {name:'全章読破',desc:'104レッスン読了',got:allRead},
    {name:'全章クイズ',desc:'13章すべて挑戦',got:allQuiz},

/* ============ QUIZ ENGINE ============ */
function startQuiz(list,opt){
  QZ={list,opt,i:0,ans:new Array(list.length).fill(null),combo:0,checked:false,left:opt.timeLimit||0};
  curView='quiz';
  showOnly('quiz'); buildNav();
  if(opt.timeLimit){ if(timerId)clearInterval(timerId); timerId=setInterval(tick,1000); }
  drawQ();
}
function tick(){
  QZ.left--; const el=$('#qTime');
  if(el){ el.textContent=fmt(QZ.left); el.classList.toggle('warn',QZ.left<300); }
  if(QZ.left<=0){ clearInterval(timerId); timerId=null; finishQuiz(); }
}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function drawQ(){
  const {list,opt,i}=QZ, q=list[i], mock=opt.mode==='mock';
  const choices = q.type==='ox' ? ['○（正しい）','×（誤り）'] : q.choices;
  const sel=QZ.ans[i];
  const ansIdx = q.type==='ox' ? (q.a?0:1) : q.a;
  const show = QZ.checked && !mock;
  $('#v-quiz').innerHTML=`
    <div class="qbar">
      <button class="back" id="bExit" style="padding:6px 11px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700">中断</button>
      <span class="pill">${i+1} / ${list.length}</span>
      <span class="pill ${q.type==='ox'?'':'hot'}">${q.type==='ox'?'○×式':'三肢択一'}</span>
      ${QZ.combo>=3?`<span class="pill hot">${QZ.combo}連続正解中</span>`:''}
      ${opt.timeLimit?`<span class="pill time" id="qTime">${fmt(QZ.left)}</span>`:''}
      ${mock?`<span class="pill" style="margin-left:auto">解答済 ${QZ.ans.filter(x=>x!==null).length}</span>`:''}
    </div>
    <div class="steps">${list.map((_,k)=>`<i class="${QZ.ans[k]!==null?'on':k===i?'cur':''}"></i>`).join('')}</div>
    <div class="card pad">
      ${opt.chapter||q.ch?`<div class="tiny" style="margin-bottom:4px">第${q.ch}章 ${esc(DATA.find(c=>c.id===q.ch).title)}</div>`:''}
      <div class="q">${esc(q.q)}</div>
      <div class="opts">${choices.map((c,k)=>{
        let cls='';
        if(show){ if(k===ansIdx)cls='ok'; else if(k===sel)cls='ng'; }
        else if(sel===k)cls='sel';
        return `<button class="opt ${cls}" data-k="${k}" ${show?'disabled':''}><span class="k">${q.type==='ox'?(k===0?'○':'×'):'ABC'[k]}</span><span>${esc(c)}</span></button>`;
      }).join('')}</div>
      ${show?`<div class="fb ${sel===ansIdx?'ok':'ng'}"><b>${sel===ansIdx?'正解':'不正解 — 正解は '+(q.type==='ox'?(q.a?'○':'×'):'ABC'[ansIdx])}</b>${esc(q.why)}</div>`:''}
    </div>
    <div class="row" style="margin-top:15px">
      ${mock&&i>0?`<button class="btn ghost" id="bPv">← 前</button>`:''}
      ${show||mock?`<button class="btn" id="bNx" style="flex:1">${i===list.length-1?(mock?'採点する':'結果を見る'):'次の問題 →'}</button>`:`<button class="btn mut wide" disabled>選択してください</button>`}
    </div>
    ${mock?`<p class="tiny" style="text-align:center;margin-top:10px">模試モードでは採点まで正解は表示されません。<button id="bEnd" style="color:var(--copper);font-weight:800;text-decoration:underline">ここで採点する</button></p>`:''}
  `;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $('#bExit').onclick=()=>{ if(timerId){clearInterval(timerId);timerId=null;} go(opt.back||'home'); };
  const nx=$('#bNx'); if(nx)nx.onclick=next;
  const pv=$('#bPv'); if(pv)pv.onclick=()=>{QZ.i--;QZ.checked=false;drawQ()};
  const en=$('#bEnd'); if(en)en.onclick=finishQuiz;
  window.scrollTo(0,0);
}
function pick(k){
  const {list,opt,i}=QZ, q=list[i];
  QZ.ans[i]=k;
  if(opt.mode==='mock'){ drawQ(); return; }
  QZ.checked=true;
  const ansIdx=q.type==='ox'?(q.a?0:1):q.a;
  const ok=k===ansIdx;
  S.seen++; if(ok)S.right++;
  const key=qkey(q.ch,q.qi);
  if(ok){
    QZ.combo++; S.bestCombo=Math.max(S.bestCombo,QZ.combo);
    S.score += 10 + Math.min(QZ.combo,10)*2;
    S.streakRight[key]=(S.streakRight[key]||0)+1;
    if(S.wrong[key]&&S.streakRight[key]>=2) delete S.wrong[key];
    if(QZ.combo>0&&QZ.combo%5===0){ const d=document.createElement('div'); d.className='combo'; d.textContent=QZ.combo+' COMBO'; document.body.appendChild(d); setTimeout(()=>d.remove(),950); }
  }else{
    QZ.combo=0; S.streakRight[key]=0;
    S.wrong[key]={ch:q.ch,qi:q.qi,n:((S.wrong[key]||{}).n||0)+1};
  }
  refreshHeader(); drawQ();
}
function next(){
  if(QZ.i===QZ.list.length-1){ finishQuiz(); return; }
  QZ.i++; QZ.checked=false; drawQ();
}
function finishQuiz(){
  if(timerId){clearInterval(timerId);timerId=null;}
  const {list,opt}=QZ;
  let right=0; const byCh={};
  list.forEach((q,i)=>{
    const ansIdx=q.type==='ox'?(q.a?0:1):q.a;
    const ok=QZ.ans[i]===ansIdx;
    if(ok)right++;
    byCh[q.ch]=byCh[q.ch]||{r:0,t:0}; byCh[q.ch].t++; if(ok)byCh[q.ch].r++;
    if(opt.mode==='mock'){
      S.seen++; if(ok)S.right++;
      const key=qkey(q.ch,q.qi);
      if(ok){ S.score+=10; S.streakRight[key]=(S.streakRight[key]||0)+1; if(S.wrong[key]&&S.streakRight[key]>=2)delete S.wrong[key]; }
      else { S.streakRight[key]=0; S.wrong[key]={ch:q.ch,qi:q.qi,n:((S.wrong[key]||{}).n||0)+1}; }
    }
  });
  if(opt.chapter){ const p=S.quiz[opt.chapter]; if(!p||p.right<right) S.quiz[opt.chapter]={right,total:list.length}; }
  if(opt.mode==='mock') S.mocks.push({right,total:list.length,at:Date.now()});
  const pass = opt.pass ? right>=opt.pass : null;
  const pct=Math.round(right/list.length*100);
  const missed=list.map((q,i)=>({q,i})).filter(({q,i})=>QZ.ans[i]!==(q.type==='ox'?(q.a?0:1):q.a));
  $('#v-quiz').innerHTML=`
    <div class="card res">
      <div class="lbl">${esc(opt.title)}</div>
      <div class="big ${pass===false?'ng':''}">${right}<span style="font-size:24px;color:var(--ink3)"> / ${list.length}</span></div>
      <div class="lbl">正答率 ${pct}%${opt.pass?`・合格ライン ${opt.pass}問`:''}</div>
      <h3>${pass===null?(pct>=95?'ほぼ完璧':pct>=80?'よく仕上がっています':pct>=60?'もう一歩':'ここが伸びしろ'):(pass?'合格ラインを突破':'あと'+(opt.pass-right)+'問')}</h3>
      <p class="mut" style="font-size:13.5px;padding:0 14px">${pass===null?(pct>=80?'この章は一旦置いて次へ進んでよい水準です。':'まちがえた問題は弱点ノートに入りました。2回連続で正解すると消えます。'):(pass?'本番でもこの調子で。取りこぼした分野を弱点ノートで潰しておきましょう。':'章別の正答率を見て、低い章に戻るのが最短です。')}</p>
    </div>
    ${Object.keys(byCh).length>1?`<div class="sec-t">章別の正答率</div><div class="card pad"><div class="bkchart">${
      Object.entries(byCh).sort((a,b)=>a[0]-b[0]).map(([c,v])=>{
        const p=Math.round(v.r/v.t*100);
        return `<div class="bk"><div class="nm">${c}. ${esc(DATA.find(x=>x.id==c).title)}</div><div class="bar"><i class="${p<50?'low':p<75?'mid':''}" style="width:${p}%"></i></div><div class="pc">${p}%</div></div>`;
      }).join('')}</div></div>`:''}
    ${missed.length?`<div class="sec-t">まちがえた ${missed.length}問</div>${missed.map(({q,i})=>wqHTML(q,QZ.ans[i])).join('')}`:''}
    <div class="row" style="margin-top:16px">
      <button class="btn ghost" data-go="home">ホームへ</button>
      ${missed.length?`<button class="btn" id="bRetry" style="flex:1">まちがえた${missed.length}問だけ解き直す</button>`:`<button class="btn" data-go="drill" style="flex:1">次の演習へ</button>`}
    </div>`;
  const rt=$('#bRetry');
  if(rt)rt.onclick=()=>startQuiz(missed.map(m=>m.q),{title:opt.title+'（解き直し）',mode:'immediate',back:opt.back});
  refreshHeader(); window.scrollTo(0,0);
}
function wqHTML(q,given){
  const ansIdx=q.type==='ox'?(q.a?0:1):q.a;
  const ansTxt=q.type==='ox'?(q.a?'○':'×'):q.choices[q.a];
  const gv = given==null?null:(q.type==='ox'?(given===0?'○':'×'):q.choices[given]);
  return `<div class="wq"><div class="tag">第${q.ch}章・${q.type==='ox'?'○×':'三択'}</div>
    <div class="qt">${esc(q.q)}</div>
    <div class="an">正解：${esc(ansTxt)}${gv!==null?` <span style="color:var(--red);font-weight:700">（あなた：${esc(gv)}）</span>`:''}</div>
    <div class="ex">${esc(q.why)}</div></div>`;
}

/* ============ DRILL ============ */
function renderDrill(){
  if(!drillSel.size) DATA.forEach(c=>drillSel.add(c.id));
  const n=[...drillSel].reduce((a,c)=>a+DATA.find(x=>x.id===c).quiz.length,0);
  $('#v-drill').innerHTML=`
    <div class="sec-t">演習モード</div>
    <div class="card pad">
      <p class="mut" style="margin:0 0 12px;font-size:14px">章を選んでシャッフル出題します。1問ごとに解説が出るので、覚え直しながら回せます。</p>
      <div class="row" style="margin-bottom:10px">
        <button class="chip" id="cAll">全章</button><button class="chip" id="cNone">解除</button>
        <button class="chip" id="cWeak">弱点の多い章</button>
      </div>
      <div class="row">${DATA.map(c=>`<button class="chip ch-chip ${drillSel.has(c.id)?'on':''}" data-c="${c.id}">${c.id}. ${esc(c.title)}</button>`).join('')}</div>
      <div class="sec-t">出題数</div>
      <div class="row" id="cnt">${[10,20,40,80,n].filter((v,i,a)=>a.indexOf(v)===i).map((v,i)=>`<button class="chip ${i===1?'on':''}" data-n="${v}">${v===n?'全'+n+'問':v+'問'}</button>`).join('')}</div>
      <div class="sec-t">形式</div>
      <div class="row" id="typ">
        <button class="chip on" data-t="all">両方</button><button class="chip" data-t="ox">○×のみ</button><button class="chip" data-t="mc">三択のみ</button>
      </div>
      <button class="btn wide" id="bStart" style="margin-top:18px">${n}問から出題して開始</button>
      <p class="tiny" style="margin-top:10px">選択中：${drillSel.size}章 / ${n}問</p>
    </div>`;
  document.querySelectorAll('.ch-chip').forEach(b=>b.onclick=()=>{const c=+b.dataset.c; drillSel.has(c)?drillSel.delete(c):drillSel.add(c); renderDrill();});
  $('#cAll').onclick=()=>{DATA.forEach(c=>drillSel.add(c.id));renderDrill()};
  $('#cNone').onclick=()=>{drillSel.clear();renderDrill()};
  $('#cWeak').onclick=()=>{const m={};Object.values(S.wrong).forEach(w=>m[w.ch]=(m[w.ch]||0)+1);drillSel.clear();Object.keys(m).forEach(c=>drillSel.add(+c));if(!drillSel.size){toast('弱点ノートは空です');DATA.forEach(c=>drillSel.add(c.id));}renderDrill()};
  ['cnt','typ'].forEach(id=>document.querySelectorAll('#'+id+' .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+id+' .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')}));
  $('#bStart').onclick=()=>{
    const num=+$('#cnt .chip.on').dataset.n, ty=$('#typ .chip.on').dataset.t;
    let pool=[]; [...drillSel].sort((a,b)=>a-b).forEach(c=>DATA.find(x=>x.id===c).quiz.forEach((q,i)=>{ if(ty==='all'||q.type===ty) pool.push({...q,ch:c,qi:i}); }));
    if(!pool.length){toast('該当する問題がありません');return;}
    shuffle(pool);
    startQuiz(pool.slice(0,Math.min(num,pool.length)),{title:'演習',mode:'immediate',back:'drill'});
  };
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

    }).join('')}</div><p class="tiny">合格ライン51問。赤は不合格ラインです。</p></div>`:''}`;
  $('#bMock').onclick=()=>launchMock(3600);
  $('#bMock2').onclick=()=>launchMock(0);

function launchMock(sec){
  const ox=[],mc=[];
  DATA.forEach(c=>c.quiz.forEach((q,i)=>{ (q.type==='ox'?ox:mc).push({...q,ch:c.id,qi:i}); }));
  // 各章から均等に拾う
  const pickBal=(pool,n)=>{
    const byCh={}; pool.forEach(q=>{(byCh[q.ch]=byCh[q.ch]||[]).push(q)});
    Object.values(byCh).forEach(shuffle);
    const out=[],chs=Object.keys(byCh); let k=0;
    while(out.length<n){ const c=chs[k%chs.length]; if(byCh[c].length)out.push(byCh[c].pop()); k++; if(k>2000)break; }
    return out;
  };
  const list=shuffle([...pickBal(ox,40),...pickBal(mc,40)]);
  startQuiz(list,{title:'模擬試験 80問',mode:'mock',timeLimit:sec,pass:51,back:'mock'});
}

      <div class="an">正解：${esc(q.type==='ox'?(q.a?'○':'×'):q.choices[q.a])}</div>
      <div class="ex">${esc(q.why)}</div></div>`).join('')}`;
  $('#bRe').onclick=()=>startQuiz(shuffle(list.slice()),{title:'弱点ノート',mode:'immediate',back:'weak'});
  $('#bClr').onclick=()=>{S.wrong={};toast('弱点ノートを空にしました');renderWeak();refreshHeader()};
}

/* ============ RECORD ============ */
function renderRecord(){
  const acc=S.seen?Math.round(S.right/S.seen*100):0;
  const mins=Math.round((Date.now()-S.startedAt)/60000);
  $('#v-record').innerHTML=`
    <div class="sec-t">学習記録</div>
    <div class="card pad">
      <div class="bkchart">
        <div class="bk"><div class="nm">全体の進捗</div><div class="bar"><i style="width:${overall()*100}%"></i></div><div class="pc">${Math.round(overall()*100)}%</div></div>
        <div class="bk"><div class="nm">累計正答率</div><div class="bar"><i class="${acc<50?'low':acc<75?'mid':''}" style="width:${acc}%"></i></div><div class="pc">${acc}%</div></div>
      </div>
      <div class="tw"><table><tbody>
        <tr><th>解答数</th><td>${S.seen} 問（正解 ${S.right}）</td></tr>
        <tr><th>スコア</th><td>${S.score.toLocaleString()} 点</td></tr>
        <tr><th>最高コンボ</th><td>${S.bestCombo} 連続</td></tr>
        <tr><th>読了レッスン</th><td>${Object.keys(S.read).length} / 104</td></tr>
        <tr><th>弱点</th><td>${Object.keys(S.wrong).length} 問</td></tr>
        <tr><th>模試</th><td>${S.mocks.length} 回${S.mocks.length?`（最高 ${Math.max(...S.mocks.map(m=>m.right))}点）`:''}</td></tr>
        <tr><th>学習開始から</th><td>約 ${mins>=60?Math.floor(mins/60)+'時間'+(mins%60)+'分':mins+'分'}</td></tr>
      </tbody></table></div>
    </div>

    <div class="sec-t">章別の到達度</div>
    <div class="card pad"><div class="bkchart">${DATA.map(c=>{
      const q=chQuiz(c.id), p=q?Math.round(q.right/q.total*100):0;
      return `<div class="bk"><div class="nm">${c.id}. ${esc(c.title)}</div><div class="bar"><i class="${!q?'':p<50?'low':p<75?'mid':''}" style="width:${p}%"></i></div><div class="pc">${q?p+'%':'—'}</div></div>`;
    }).join('')}</div><p class="tiny">章末クイズの最高得点です。「—」は未挑戦。</p></div>

    <div class="sec-t">進捗の持ち出し</div>
    <div class="card pad">
      <p class="tiny" style="margin-top:0" id="lsNote"></p>
      <textarea id="taSave" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
      <div class="row" style="margin-top:9px">
        <button class="btn sm" id="bCopy">保存コードをコピー</button>
        <button class="btn sm ghost" id="bLoadT">復元する</button>
        <button class="btn sm ghost" id="bReset">記録をリセット</button>
      </div>
      <textarea id="taLoad" placeholder="ここに保存コードを貼り付けてから「復元する」" style="margin-top:9px;display:none"></textarea>
    </div>`;
  $('#lsNote').innerHTML = LSOK
    ? 'このブラウザに<b>自動保存</b>されています。同じブラウザで開けば続きから再開できます。別の端末に移すときや、念のためのバックアップには下の<b>保存コード</b>をコピーして保管してください。'
    : 'このブラウザでは自動保存が使えません（ファイルを直接開いた場合など）。下の<b>保存コード</b>をコピーしてメモに貼っておき、次回この欄に貼り付けて「復元する」を押してください。';
  $('#bCopy').onclick=()=>{const t=$('#taSave');t.select();document.execCommand('copy');toast('コピーしました')};
  $('#bLoadT').onclick=()=>{
    const ta=$('#taLoad');
    if(ta.style.display==='none'){ta.style.display='block';ta.focus();return;}
    try{ Object.assign(S,JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))))); toast('復元しました'); refreshHeader(); renderRecord(); }
    catch(e){ toast('コードが読み取れません'); }
  };
  $('#bReset').onclick=()=>{Object.assign(S,{read:{},quiz:{},wrong:{},streakRight:{},score:0,bestCombo:0,mocks:[],seen:0,right:0,startedAt:Date.now()});try{localStorage.removeItem(LS)}catch(e){};toast('リセットしました');refreshHeader();renderRecord()};
}

/* ============ init ============ */
const RESTORED=restore(); LSOK=persist();
buildNav(); renderHome(); refreshHeader();
if(RESTORED) setTimeout(()=>toast('前回の続きから再開しました'),400);
</script>
</body>
</html>
